riction, free expansion, heat flow across a finite temperature difference.", "vol": 2, "section": "4.1", "chapter": 4, "order": 226}}, {"uid": "UP:clausius", "branch": "UP", "native_id": "clausius", "label": "Clausius statement", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 289, "concept": null, "extra": {"symbol": "no spontaneous heat flow cold → hot", "primitive": false, "postulate": true, "description": "Heat never flows spontaneously from a colder to a hotter body; doing so requires work.", "vol": 2, "section": "4.1", "chapter": 4, "order": 227}}, {"uid": "UP:engine", "branch": "UP", "native_id": "engine", "label": "Heat engine", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 290, "concept": null, "extra": {"symbol": "W = Q_h − Q_c", "primitive": false, "postulate": false, "description": "A device run in a cycle that takes heat Q_h from a hot reservoir, rejects Q_c to a cold reservoir and delivers the difference as work.", "vol": 2, "section": "4.2", "chapter": 4, "order": 228}}, {"uid": "UP:eff", "branch": "UP", "native_id": "eff", "label": "Efficiency", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 291, "concept": null, "extra": {"symbol": "e = W/Q_h = 1 − Q_c/Q_h", "primitive": false, "postulate": false, "description": "Fraction of the heat taken in that is turned into work.", "vol": 2, "section": "4.2", "chapter": 4, "order": 229}}, {"uid": "UP:fridge", "branch": "UP", "native_id": "fridge", "label": "Refrigerator and heat pump", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 292, "concept": null, "extra": {"symbol": "Q_c + W = Q_h", "primitive": false, "postulate": false, "description": "An engine run backward: work moves heat from a cold reservoir to a hot one, to cool the cold side (refrigerator) or heat the hot side (heat pump).", "vol": 2, "section": "4.3", "chapter": 4, "order": 230}}, {"uid": "UP:cop", "branch": "UP", "native_id": "cop", "label": "Coefficient of performance", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 293, "concept": null, "extra": {"symbol": "K_R = Q_c/W,  K_P = Q_h/W", "primitive": false, "postulate": false, "description": "Heat moved per work supplied; can exceed 1.", "vol": 2, "section": "4.3", "chapter": 4, "order": 231}}, {"uid": "UP:kelvin", "branch": "UP", "native_id": "kelvin", "label": "Kelvin statement", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 294, "concept": null, "extra": {"symbol": "no perfect engine", "primitive": false, "postulate": true, "description": "No cyclic process can convert heat from one reservoir entirely into work; equivalently there is no perfect engine (and, by the Clausius form, no perfect refrigerator).", "vol": 2, "section": "4.4", "chapter": 4, "order": 232}}, {"uid": "UP:carnot", "branch": "UP", "native_id": "carnot", "label": "Carnot cycle", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 296, "concept": null, "extra": {"symbol": "2 isotherms + 2 adiabats", "primitive": false, "postulate": false, "description": "A reversible cycle of two isothermal and two adiabatic steps between two reservoirs; an engine run on it is a Carnot engine.", "vol": 2, "section": "4.5", "chapter": 4, "order": 233}}, {"uid": "UP:carnotp", "branch": "UP", "native_id": "carnotp", "label": "Carnot principle", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 297, "concept": null, "extra": {"symbol": "e ≤ 1 − T_c/T_h", "primitive": false, "postulate": false, "description": "No engine between two reservoirs beats a reversible one, and all reversible engines between them have e = 1 − T_c/T_h.", "vol": 2, "section": "4.5", "chapter": 4, "order": 234}}, {"uid": "UP:S", "branch": "UP", "native_id": "S", "label": "Entropy", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 299, "concept": null, "extra": {"symbol": "dS = dQ_rev/T", "primitive": false, "postulate": false, "description": "A state function whose change is the heat added reversibly divided by the absolute temperature.", "vol": 2, "section": "4.6", "chapter": 4, "order": 235}}, {"uid": "UP:slaw", "branch": "UP", "native_id": "slaw", "label": "Second law (entropy statement)", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 300, "concept": "second_law", "extra": {"symbol": "ΔS_universe ≥ 0", "primitive": false, "postulate": false, "description": "The entropy of an isolated system never decreases; it stays constant only for reversible processes.", "vol": 2, "section": "4.6", "chapter": 4, "order": 236}}, {"uid": "UP:third", "branch": "UP", "native_id": "third", "label": "Third law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 304, "concept": null, "extra": {"symbol": "ΔS → 0 as T → 0", "primitive": false, "postulate": true, "description": "Entropy changes along an isotherm vanish as the temperature approaches absolute zero; absolute zero cannot be reached in a finite number of steps.", "vol": 2, "section": "4.7", "chapter": 4, "order": 237}}, {"uid": "UP:q", "branch": "UP", "native_id": "q", "label": "Electric charge", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 307, "concept": "electric_charge", "extra": {"symbol": "q", "primitive": true, "postulate": false, "description": "A property of matter that comes in two signs: like charges repel, unlike attract. Additive; SI unit the coulomb.", "vol": 2, "section": "5.1", "chapter": 5, "order": 238}}, {"uid": "UP:qcons", "branch": "UP", "native_id": "qcons", "label": "Conservation of charge", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 308, "concept": "charge_conservation", "extra": {"symbol": "Σ q = const", "primitive": false, "postulate": true, "description": "The total charge of an isolated system never changes; charging a body only moves charge from one body to another.", "vol": 2, "section": "5.1", "chapter": 5, "order": 239}}, {"uid": "UP:atom", "branch": "UP", "native_id": "atom", "label": "Charge carriers", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 309, "concept": null, "extra": {"symbol": "e⁻, p⁺, n", "primitive": false, "postulate": false, "description": "Ordinary charge is carried by electrons (−e) and protons (+e); neutrons are neutral. An ion has more or fewer electrons than protons.", "vol": 2, "section": "5.1", "chapter": 5, "order": 240}}, {"uid": "UP:cond", "branch": "UP", "native_id": "cond", "label": "Conductor", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 310, "concept": null, "extra": {"symbol": "free charges", "primitive": false, "postulate": false, "description": "A material in which some electrons (conduction electrons) move freely; charge placed on it spreads out, and nearby charges can induce a separation (charging by induction).", "vol": 2, "section": "5.2", "chapter": 5, "order": 241}}, {"uid": "UP:insul", "branch": "UP", "native_id": "insul", "label": "Insulator", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 311, "concept": null, "extra": {"symbol": "bound charges", "primitive": false, "postulate": false, "description": "A material whose charges are bound to atoms; a field can only shift them slightly, polarizing the material into small dipoles.", "vol": 2, "section": "5.2", "chapter": 5, "order": 242}}, {"uid": "UP:coul", "branch": "UP", "native_id": "coul", "label": "Coulomb's law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 313, "concept": "coulomb_law", "extra": {"symbol": "F = q₁q₂/(4πε₀ r²)", "primitive": false, "postulate": true, "description": "Two point charges exert forces on each other along the line joining them, proportional to the product of the charges and inversely to the square of the distance.", "vol": 2, "section": "5.3", "chapter": 5, "order": 243}}, {"uid": "UP:eps0", "branch": "UP", "native_id": "eps0", "label": "Permittivity of vacuum", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 313, "concept": null, "extra": {"symbol": "ε₀", "primitive": true, "postulate": false, "description": "Constant in Coulomb's law, 8.85 × 10⁻¹² C²/(N·m²); k = 1/(4πε₀) ≈ 8.99 × 10⁹ N·m²/C².", "vol": 2, "section": "5.3", "chapter": 5, "order": 244}}, {"uid": "UP:esup", "branch": "UP", "native_id": "esup", "label": "Superposition of electric forces", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 315, "concept": "superposition", "extra": {"symbol": "F⃗ = Σ F⃗_i", "primitive": false, "postulate": false, "description": "The force from several charges is the vector sum of the forces each would exert alone.", "vol": 2, "section": "5.3", "chapter": 5, "order": 245}}, {"uid": "UP:pts", "branch": "UP", "native_id": "pts", "label": "Point-charge configuration", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 316, "concept": "point_charges", "extra": {"symbol": "{q_i, r⃗_i}", "primitive": false, "postulate": false, "description": "The simplest electrostatic state: which charges there are and where they sit.", "vol": 2, "section": "5.3", "chapter": 5, "order": 246}}, {"uid": "UP:Efield", "branch": "UP", "native_id": "Efield", "label": "Electric field", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 317, "concept": "electric_field", "extra": {"symbol": "E⃗(r⃗)", "primitive": false, "postulate": false, "description": "The field produced by source charges, defined at every point of space; a test charge there feels qE⃗.", "vol": 2, "section": "5.4", "chapter": 5, "order": 247}}, {"uid": "UP:Eval", "branch": "UP", "native_id": "Eval", "label": "Field value", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 318, "concept": null, "extra": {"symbol": "E⃗ = F⃗/q", "primitive": false, "postulate": false, "description": "Force per unit test charge at a point; measured with a small test charge.", "vol": 2, "section": "5.4", "chapter": 5, "order": 248}}, {"uid": "UP:chdist", "branch": "UP", "native_id": "chdist", "label": "Continuous charge distribution", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 319, "concept": "charge_density", "extra": {"symbol": "λ, σ, ρ", "primitive": false, "postulate": false, "description": "Charge spread along a line, over a surface or through a volume, described by a charge density; an infinite straight wire and an infinite plane are idealised cases.", "vol": 2, "section": "5.5", "chapter": 5, "order": 249}}, {"uid": "UP:flines", "branch": "UP", "native_id": "flines", "label": "Field lines", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 321, "concept": null, "extra": {"symbol": "tangent to E⃗", "primitive": false, "postulate": false, "description": "Curves drawn tangent to the field, starting on positive and ending on negative charges, more crowded where the field is stronger.", "vol": 2, "section": "5.6", "chapter": 5, "order": 250}}, {"uid": "UP:pdip", "branch": "UP", "native_id": "pdip", "label": "Electric dipole moment", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 323, "concept": null, "extra": {"symbol": "p⃗ = q d⃗", "primitive": false, "postulate": false, "description": "Charge times separation of a ± charge pair; molecules can have a permanent dipole or one induced by a field.", "vol": 2, "section": "5.7", "chapter": 5, "order": 251}}, {"uid": "UP:PhiE", "branch": "UP", "native_id": "PhiE", "label": "Electric flux", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 326, "concept": "electric_flux", "extra": {"symbol": "Φ = ∫ E⃗·dA⃗", "primitive": false, "postulate": false, "description": "The amount of field passing through a surface: field component along the area vector (normal to the surface) times area, summed over the surface.", "vol": 2, "section": "6.1", "chapter": 6, "order": 252}}, {"uid": "UP:gauss", "branch": "UP", "native_id": "gauss", "label": "Gauss's law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 328, "concept": null, "extra": {"symbol": "∮E⃗·dA⃗ = q_enc/ε₀", "primitive": false, "postulate": false, "description": "The electric flux through any closed (Gaussian) surface equals the enclosed charge divided by ε₀.", "vol": 2, "section": "6.2", "chapter": 6, "order": 253}}, {"uid": "UP:symm", "branch": "UP", "native_id": "symm", "label": "Symmetry method", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 330, "concept": null, "extra": {"symbol": "E constant on the surface", "primitive": false, "postulate": false, "description": "With spherical, cylindrical or planar symmetry the field is constant on a well-chosen Gaussian surface, and Gauss's law gives it directly.", "vol": 2, "section": "6.3", "chapter": 6, "order": 254}}, {"uid": "UP:condeq", "branch": "UP", "native_id": "condeq", "label": "Conductor in electrostatic equilibrium", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 332, "concept": null, "extra": {"symbol": "E = 0 inside", "primitive": false, "postulate": false, "description": "With charges at rest, the field inside a conductor is zero, excess charge sits on the surface, and just outside E = σ/ε₀ perpendicular to the surface.", "vol": 2, "section": "6.4", "chapter": 6, "order": 255}}, {"uid": "UP:Ue", "branch": "UP", "native_id": "Ue", "label": "Electric potential energy", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 335, "concept": "electrostatic_energy", "extra": {"symbol": "U = kqQ/r", "primitive": false, "postulate": false, "description": "Potential energy of a system of charges; the Coulomb force is conservative, so it exists.", "vol": 2, "section": "7.1", "chapter": 7, "order": 256}}, {"uid": "UP:Vfield", "branch": "UP", "native_id": "Vfield", "label": "Electric potential", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 337, "concept": "electric_potential", "extra": {"symbol": "V(r⃗)", "primitive": false, "postulate": false, "description": "Potential energy per unit charge at each point; a scalar field defined up to an additive constant.", "vol": 2, "section": "7.2", "chapter": 7, "order": 257}}, {"uid": "UP:dV", "branch": "UP", "native_id": "dV", "label": "Voltage", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 339, "concept": null, "extra": {"symbol": "ΔV", "primitive": false, "postulate": false, "description": "Potential difference between two points, measured with a voltmeter; SI unit the volt. qΔV is an energy (electron-volt for q = e).", "vol": 2, "section": "7.2", "chapter": 7, "order": 258}}, {"uid": "UP:grad", "branch": "UP", "native_id": "grad", "label": "Gradient", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 342, "concept": null, "extra": {"symbol": "∇V", "primitive": false, "postulate": false, "description": "The vector of partial derivatives of a scalar field; points toward steepest increase.", "vol": 2, "section": "7.4", "chapter": 7, "order": 259}}, {"uid": "UP:equipot", "branch": "UP", "native_id": "equipot", "label": "Equipotential surfaces", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 344, "concept": null, "extra": {"symbol": "V = const", "primitive": false, "postulate": false, "description": "Surfaces of constant potential; the field is perpendicular to them and no work is done moving a charge along one. A conductor's surface is one; grounding sets it to zero.", "vol": 2, "section": "7.5", "chapter": 7, "order": 260}}, {"uid": "UP:capst", "branch": "UP", "native_id": "capst", "label": "Capacitor", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 348, "concept": null, "extra": {"symbol": "±Q on two conductors", "primitive": false, "postulate": false, "description": "Two conductors carrying equal and opposite charges, often separated by a dielectric; the parallel-plate capacitor is the standard example.", "vol": 2, "section": "8.1", "chapter": 8, "order": 261}}, {"uid": "UP:Cap", "branch": "UP", "native_id": "Cap", "label": "Capacitance", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 349, "concept": "capacitance", "extra": {"symbol": "C = Q/V", "primitive": false, "postulate": false, "description": "Charge stored per volt of potential difference; depends only on geometry and the material between the conductors. SI unit the farad.", "vol": 2, "section": "8.1", "chapter": 8, "order": 262}}, {"uid": "UP:capnet", "branch": "UP", "native_id": "capnet", "label": "Capacitors in series and parallel", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 352, "concept": null, "extra": {"symbol": "1/C_S = Σ 1/C_i,  C_P = Σ C_i", "primitive": false, "postulate": false, "description": "Capacitors in parallel share a voltage and their capacitances add; in series they share a charge and the inverses add.", "vol": 2, "section": "8.2", "chapter": 8, "order": 263}}, {"uid": "UP:UC", "branch": "UP", "native_id": "UC", "label": "Energy stored in a capacitor", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 354, "concept": null, "extra": {"symbol": "U = ½CV²", "primitive": false, "postulate": false, "description": "Work needed to charge a capacitor, stored in its electric field.", "vol": 2, "section": "8.3", "chapter": 8, "order": 264}}, {"uid": "UP:uE", "branch": "UP", "native_id": "uE", "label": "Electric energy density", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 355, "concept": "electric_energy_density", "extra": {"symbol": "u_E = ½ε₀E²", "primitive": false, "postulate": false, "description": "Energy per unit volume stored in an electric field.", "vol": 2, "section": "8.3", "chapter": 8, "order": 265}}, {"uid": "UP:kappa", "branch": "UP", "native_id": "kappa", "label": "Dielectric constant", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 356, "concept": null, "extra": {"symbol": "κ = C/C₀ = E₀/E", "primitive": false, "postulate": false, "description": "Factor by which an insulating material between the plates raises the capacitance and lowers the field.", "vol": 2, "section": "8.4", "chapter": 8, "order": 266}}, {"uid": "UP:dielmod", "branch": "UP", "native_id": "dielmod", "label": "Molecular model of a dielectric", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 358, "concept": null, "extra": {"symbol": "E⃗_i = (1/κ − 1)E⃗₀", "primitive": false, "postulate": false, "description": "The applied field induces or aligns molecular dipoles; the induced surface charges create an induced field that partly cancels the applied one.", "vol": 2, "section": "8.5", "chapter": 8, "order": 267}}, {"uid": "UP:Ebreak", "branch": "UP", "native_id": "Ebreak", "label": "Dielectric strength", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 360, "concept": null, "extra": {"symbol": "E_max", "primitive": false, "postulate": false, "description": "Largest field an insulator withstands before it breaks down and conducts.", "vol": 2, "section": "8.5", "chapter": 8, "order": 268}}, {"uid": "UP:curr", "branch": "UP", "native_id": "curr", "label": "Electric current", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 362, "concept": "current", "extra": {"symbol": "I = dQ/dt", "primitive": false, "postulate": false, "description": "Rate at which charge passes a cross section; SI unit the ampere (1 A = 1 C/s). Conventional current points the way positive charge would move.", "vol": 2, "section": "9.1", "chapter": 9, "order": 269}}, {"uid": "UP:circuit", "branch": "UP", "native_id": "circuit", "label": "Electric circuit", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 363, "concept": null, "extra": {"symbol": "closed path", "primitive": false, "postulate": false, "description": "A closed conducting path through sources and elements, drawn as a schematic; charge flows steadily only around closed paths.", "vol": 2, "section": "9.1", "chapter": 9, "order": 270}}, {"uid": "UP:vd", "branch": "UP", "native_id": "vd", "label": "Drift velocity", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 364, "concept": null, "extra": {"symbol": "v_d = I/(nqA)", "primitive": false, "postulate": false, "description": "Small average velocity of the charge carriers along a wire, superposed on their fast random motion.", "vol": 2, "section": "9.2", "chapter": 9, "order": 271}}, {"uid": "UP:Jcur", "branch": "UP", "native_id": "Jcur", "label": "Current density", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 365, "concept": "current_density", "extra": {"symbol": "J⃗ = nqv⃗_d", "primitive": false, "postulate": false, "description": "Current per unit area at each point of a conductor; integrated over a cross section it gives the current.", "vol": 2, "section": "9.2", "chapter": 9, "order": 272}}, {"uid": "UP:resist", "branch": "UP", "native_id": "resist", "label": "Resistivity", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 366, "concept": null, "extra": {"symbol": "ρ = E/J", "primitive": false, "postulate": false, "description": "Material property: field needed per unit current density; its inverse is the electrical conductivity. It grows roughly linearly with temperature in metals.", "vol": 2, "section": "9.3", "chapter": 9, "order": 273}}, {"uid": "UP:Rres", "branch": "UP", "native_id": "Rres", "label": "Resistance", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 367, "concept": "resistance", "extra": {"symbol": "R = V/I", "primitive": false, "postulate": false, "description": "Voltage per current of a component; for a uniform wire R = ρL/A. SI unit the ohm.", "vol": 2, "section": "9.3", "chapter": 9, "order": 274}}, {"uid": "UP:ohm", "branch": "UP", "native_id": "ohm", "label": "Ohm's law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 368, "concept": "ohm_law", "extra": {"symbol": "V = IR", "primitive": false, "postulate": false, "description": "For many materials current is proportional to voltage with R independent of V (ohmic); devices such as diodes are nonohmic.", "vol": 2, "section": "9.4", "chapter": 9, "order": 275}}, {"uid": "UP:Pel", "branch": "UP", "native_id": "Pel", "label": "Electric power", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 370, "concept": null, "extra": {"symbol": "P = IV", "primitive": false, "postulate": false, "description": "Rate at which electrical energy is delivered to an element; in a resistor it becomes heat at I²R = V²/R.", "vol": 2, "section": "9.5", "chapter": 9, "order": 276}}, {"uid": "UP:supercond", "branch": "UP", "native_id": "supercond", "label": "Superconducting state", "layer": "S", "sublayer": "S.hilbert", "native_layer": "state", "era": "quantum", "t": 372, "concept": null, "extra": {"symbol": "R = 0 below T_c", "primitive": false, "postulate": false, "description": "Below a critical temperature some materials lose all resistance and expel magnetic fields (Meissner effect); a quantum effect of electron pairs.", "vol": 2, "section": "9.6", "chapter": 9, "order": 277}}, {"uid": "UP:emf", "branch": "UP", "native_id": "emf", "label": "Electromotive force", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 375, "concept": "emf", "extra": {"symbol": "ε", "primitive": false, "postulate": false, "description": "Work per unit charge done by a source (battery, generator) in moving charge around a circuit; the voltage of the source with no current.", "vol": 2, "section": "10.1", "chapter": 10, "order": 278}}, {"uid": "UP:Vterm", "branch": "UP", "native_id": "Vterm", "label": "Terminal voltage", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 376, "concept": null, "extra": {"symbol": "V = ε − Ir", "primitive": false, "postulate": false, "description": "Voltage across a source's terminals; below its emf by the potential drop on its internal resistance.", "vol": 2, "section": "10.1", "chapter": 10, "order": 279}}, {"uid": "UP:Req", "branch": "UP", "native_id": "Req", "label": "Resistors in series and parallel", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 377, "concept": null, "extra": {"symbol": "R_s = Σ R_i,  1/R_p = Σ 1/R_i", "primitive": false, "postulate": false, "description": "Resistors in series carry the same current and their resistances add; in parallel they share the voltage and the inverses add.", "vol": 2, "section": "10.2", "chapter": 10, "order": 280}}, {"uid": "UP:kirch", "branch": "UP", "native_id": "kirch", "label": "Kirchhoff's rules", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 379, "concept": null, "extra": {"symbol": "ΣI_in = ΣI_out;  ΣV = 0", "primitive": false, "postulate": false, "description": "Junction rule: current into a junction equals current out. Loop rule: the potential differences around any closed loop sum to zero.", "vol": 2, "section": "10.3", "chapter": 10, "order": 281}}, {"uid": "UP:meters", "branch": "UP", "native_id": "meters", "label": "Ammeter and voltmeter", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 382, "concept": null, "extra": {"symbol": "series, small R / parallel, large R", "primitive": false, "postulate": false, "description": "An ammeter is placed in series and has very small resistance; a voltmeter is placed in parallel and has very large resistance, so neither disturbs the circuit much.", "vol": 2, "section": "10.4", "chapter": 10, "order": 282}}, {"uid": "UP:rc", "branch": "UP", "native_id": "rc", "label": "RC circuit", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 384, "concept": null, "extra": {"symbol": "q = Cε(1 − e^{−t/RC})", "primitive": false, "postulate": false, "description": "A capacitor charging or discharging through a resistor: charge and current change exponentially with time constant τ = RC.", "vol": 2, "section": "10.5", "chapter": 10, "order": 283}}, {"uid": "UP:magnet", "branch": "UP", "native_id": "magnet", "label": "Magnetic poles", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 388, "concept": null, "extra": {"symbol": "N, S", "primitive": false, "postulate": false, "description": "Every magnet has a north and a south pole; like poles repel, unlike attract, and cutting a magnet never isolates a single pole.", "vol": 2, "section": "11.1", "chapter": 11, "order": 284}}, {"uid": "UP:lorentzF", "branch": "UP", "native_id": "lorentzF", "label": "Magnetic force on a moving charge", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 390, "concept": null, "extra": {"symbol": "F⃗ = q v⃗ × B⃗", "primitive": false, "postulate": true, "description": "A charge moving through a magnetic field feels a force perpendicular to both its velocity and the field (right-hand rule); the force does no work.", "vol": 2, "section": "11.2", "chapter": 11, "order": 285}}, {"uid": "UP:Bfield", "branch": "UP", "native_id": "Bfield", "label": "Magnetic field", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 391, "concept": "magnetic_field", "extra": {"symbol": "B⃗(r⃗)", "primitive": false, "postulate": false, "description": "The field around magnets and currents, mapped by a compass; its field lines form closed loops. SI unit the tesla (1 G = 10⁻⁴ T).", "vol": 2, "section": "11.2", "chapter": 11, "order": 286}}, {"uid": "UP:Bval", "branch": "UP", "native_id": "Bval", "label": "Magnetic field value", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 392, "concept": "magnetic_field_value", "extra": {"symbol": "B⃗", "primitive": false, "postulate": false, "description": "Field at one point, defined through the force on a moving test charge: B = F/(qv sin θ).", "vol": 2, "section": "11.2", "chapter": 11, "order": 287}}, {"uid": "UP:helix", "branch": "UP", "native_id": "helix", "label": "Circular and helical orbits", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 393, "concept": null, "extra": {"symbol": "r = mv/(qB)", "primitive": false, "postulate": false, "description": "A charge in a uniform field moves on a circle of radius mv/(qB) with period 2πm/(qB); a velocity component along B⃗ turns the circle into a helix.", "vol": 2, "section": "11.3", "chapter": 11, "order": 288}}, {"uid": "UP:mu", "branch": "UP", "native_id": "mu", "label": "Magnetic dipole moment", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 396, "concept": null, "extra": {"symbol": "μ⃗ = NIA n̂", "primitive": false, "postulate": false, "description": "Current times area of a loop (times the number of turns), along the loop's normal; a current loop is a magnetic dipole.", "vol": 2, "section": "11.5", "chapter": 11, "order": 289}}, {"uid": "UP:VH", "branch": "UP", "native_id": "VH", "label": "Hall voltage", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 399, "concept": null, "extra": {"symbol": "V = Blv_d", "primitive": false, "postulate": false, "description": "Voltage across a current-carrying strip in a magnetic field, from carriers pushed to one side; its sign reveals the sign of the carriers.", "vol": 2, "section": "11.6", "chapter": 11, "order": 290}}, {"uid": "UP:vsel", "branch": "UP", "native_id": "vsel", "label": "Velocity selector", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 400, "concept": null, "extra": {"symbol": "v = E/B", "primitive": false, "postulate": false, "description": "Crossed electric and magnetic fields pass undeflected only particles with speed E/B.", "vol": 2, "section": "11.6", "chapter": 11, "order": 291}}, {"uid": "UP:bs", "branch": "UP", "native_id": "bs", "label": "Biot–Savart law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 403, "concept": "biot_savart", "extra": {"symbol": "dB⃗ = (μ₀/4π) I dl⃗ × r̂/r²", "primitive": false, "postulate": true, "description": "Each element of a current contributes to the magnetic field in proportion to the current and inversely to the square of the distance, perpendicular to both element and line of sight.", "vol": 2, "section": "12.1", "chapter": 12, "order": 292}}, {"uid": "UP:mu0", "branch": "UP", "native_id": "mu0", "label": "Permeability of free space", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 403, "concept": null, "extra": {"symbol": "μ₀", "primitive": true, "postulate": false, "description": "Constant in the magnetic field laws, 4π × 10⁻⁷ T·m/A.", "vol": 2, "section": "12.1", "chapter": 12, "order": 293}}, {"uid": "UP:Bwire", "branch": "UP", "native_id": "Bwire", "label": "Field of a long straight wire", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 404, "concept": null, "extra": {"symbol": "B = μ₀I/(2πR)", "primitive": false, "postulate": false, "description": "Circles around the wire, falling inversely with distance (right-hand rule for its direction).", "vol": 2, "section": "12.2", "chapter": 12, "order": 294}}, {"uid": "UP:Fpar", "branch": "UP", "native_id": "Fpar", "label": "Force between parallel currents", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 405, "concept": null, "extra": {"symbol": "F/l = μ₀I₁I₂/(2πr)", "primitive": false, "postulate": false, "description": "Parallel currents attract and antiparallel currents repel; this force once defined the ampere.", "vol": 2, "section": "12.3", "chapter": 12, "order": 295}}, {"uid": "UP:ampere", "branch": "UP", "native_id": "ampere", "label": "Ampère's law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 408, "concept": null, "extra": {"symbol": "∮B⃗·dl⃗ = μ₀ I_enc", "primitive": false, "postulate": false, "description": "The line integral of the magnetic field around any closed loop equals μ₀ times the current through it.", "vol": 2, "section": "12.5", "chapter": 12, "order": 296}}, {"uid": "UP:solen", "branch": "UP", "native_id": "solen", "label": "Solenoid and toroid", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 410, "concept": null, "extra": {"symbol": "B = μ₀nI", "primitive": false, "postulate": false, "description": "A long coil has a nearly uniform field inside, B = μ₀nI, and almost none outside; a toroid confines its field, B = μ₀NI/(2πr).", "vol": 2, "section": "12.6", "chapter": 12, "order": 297}}, {"uid": "UP:magmat", "branch": "UP", "native_id": "magmat", "label": "Magnetism in matter", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 411, "concept": null, "extra": {"symbol": "μ = (1 + χ) μ₀", "primitive": false, "postulate": false, "description": "Atomic magnetic dipoles respond to a field: weakly along it (paramagnetic, χ > 0), weakly against it (diamagnetic, χ < 0), or strongly with domains and hysteresis (ferromagnetic).", "vol": 2, "section": "12.7", "chapter": 12, "order": 298}}, {"uid": "UP:PhiB", "branch": "UP", "native_id": "PhiB", "label": "Magnetic flux", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 414, "concept": "magnetic_flux", "extra": {"symbol": "Φ_m = ∫B⃗·n̂ dA", "primitive": false, "postulate": false, "description": "Amount of magnetic field through a surface; SI unit the weber.", "vol": 2, "section": "13.1", "chapter": 13, "order": 299}}, {"uid": "UP:faraday", "branch": "UP", "native_id": "faraday", "label": "Faraday's law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 415, "concept": "faraday_law", "extra": {"symbol": "ε = −N dΦ_m/dt", "primitive": false, "postulate": true, "description": "A changing magnetic flux through a circuit induces an emf in it, whether the field, the area or the orientation changes.", "vol": 2, "section": "13.1", "chapter": 13, "order": 300}}, {"uid": "UP:lenz", "branch": "UP", "native_id": "lenz", "label": "Lenz's law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 416, "concept": null, "extra": {"symbol": "induced current opposes the change", "primitive": false, "postulate": false, "description": "The induced emf drives a current whose magnetic field opposes the change of flux that produced it.", "vol": 2, "section": "13.2", "chapter": 13, "order": 301}}, {"uid": "UP:emfmot", "branch": "UP", "native_id": "emfmot", "label": "Motional emf", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 417, "concept": null, "extra": {"symbol": "ε = Blv", "primitive": false, "postulate": false, "description": "Emf in a conductor moving through a magnetic field.", "vol": 2, "section": "13.3", "chapter": 13, "order": 302}}, {"uid": "UP:Eind", "branch": "UP", "native_id": "Eind", "label": "Induced electric field", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 419, "concept": null, "extra": {"symbol": "∮E⃗·dl⃗ = −dΦ_m/dt", "primitive": false, "postulate": false, "description": "A changing magnetic field creates an electric field whose lines close on themselves; it is not conservative.", "vol": 2, "section": "13.4", "chapter": 13, "order": 303}}, {"uid": "UP:eddy", "branch": "UP", "native_id": "eddy", "label": "Eddy currents", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 420, "concept": null, "extra": {"symbol": "loops induced in bulk conductors", "primitive": false, "postulate": false, "description": "Currents induced in a conductor moving in, or exposed to, a changing magnetic field; by Lenz's law they oppose the motion (magnetic damping).", "vol": 2, "section": "13.5", "chapter": 13, "order": 304}}, {"uid": "UP:gen", "branch": "UP", "native_id": "gen", "label": "Electric generator", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 422, "concept": null, "extra": {"symbol": "ε = NBAω sin ωt", "primitive": false, "postulate": false, "description": "A coil turning in a magnetic field produces a sinusoidal emf with peak NBAω; a motor's coil produces the same, called back emf.", "vol": 2, "section": "13.6", "chapter": 13, "order": 305}}, {"uid": "UP:Mind", "branch": "UP", "native_id": "Mind", "label": "Mutual inductance", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 426, "concept": null, "extra": {"symbol": "M = N₂Φ₂₁/I₁", "primitive": false, "postulate": false, "description": "Flux through one circuit per current in another; a changing current in one induces emf ε₂ = −M dI₁/dt in the other. SI unit the henry.", "vol": 2, "section": "14.1", "chapter": 14, "order": 306}}, {"uid": "UP:Lind", "branch": "UP", "native_id": "Lind", "label": "Self-inductance", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 427, "concept": null, "extra": {"symbol": "L = NΦ_m/I", "primitive": false, "postulate": false, "description": "A coil's own flux per unit of its current; a changing current induces ε = −L dI/dt that opposes the change. An inductor is a coil built for this.", "vol": 2, "section": "14.2", "chapter": 14, "order": 307}}, {"uid": "UP:UL", "branch": "UP", "native_id": "UL", "label": "Energy in an inductor", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 429, "concept": null, "extra": {"symbol": "U = ½LI²", "primitive": false, "postulate": false, "description": "Work done against the back emf while the current builds up, stored in the magnetic field.", "vol": 2, "section": "14.3", "chapter": 14, "order": 308}}, {"uid": "UP:uB", "branch": "UP", "native_id": "uB", "label": "Magnetic energy density", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 430, "concept": "magnetic_energy_density", "extra": {"symbol": "u_B = B²/(2μ₀)", "primitive": false, "postulate": false, "description": "Energy per unit volume stored in a magnetic field.", "vol": 2, "section": "14.3", "chapter": 14, "order": 309}}, {"uid": "UP:rl", "branch": "UP", "native_id": "rl", "label": "RL circuit", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 431, "concept": null, "extra": {"symbol": "I = (ε/R)(1 − e^{−t/τ_L})", "primitive": false, "postulate": false, "description": "Current in a resistor–inductor circuit rises or decays exponentially with time constant τ_L = L/R.", "vol": 2, "section": "14.4", "chapter": 14, "order": 310}}, {"uid": "UP:lc", "branch": "UP", "native_id": "lc", "label": "LC circuit", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 432, "concept": null, "extra": {"symbol": "q = q₀ cos(ωt + φ),  ω = 1/√(LC)", "primitive": false, "postulate": false, "description": "Charge sloshes between a capacitor and an inductor; energy passes between electric and magnetic fields.", "vol": 2, "section": "14.5", "chapter": 14, "order": 311}}, {"uid": "UP:rlc", "branch": "UP", "native_id": "rlc", "label": "RLC circuit", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 434, "concept": null, "extra": {"symbol": "q = q₀ e^{−Rt/2L} cos(ω′t + φ)", "primitive": false, "postulate": false, "description": "Adding resistance damps the LC oscillation: underdamped, critically damped or overdamped as for a mechanical oscillator.", "vol": 2, "section": "14.6", "chapter": 14, "order": 312}}, {"uid": "UP:acsrc", "branch": "UP", "native_id": "acsrc", "label": "Alternating source", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 437, "concept": null, "extra": {"symbol": "v = V₀ sin ωt", "primitive": false, "postulate": false, "description": "A source whose voltage (and current) reverses periodically; direct current (dc) flows one way only.", "vol": 2, "section": "15.1", "chapter": 15, "order": 313}}, {"uid": "UP:phasor", "branch": "UP", "native_id": "phasor", "label": "Phasors", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 438, "concept": null, "extra": {"symbol": "rotating vectors", "primitive": false, "postulate": false, "description": "Represents a sinusoid A sin(ωt + φ) as a vector of length A rotating at ω; sinusoids of one frequency add as vectors.", "vol": 2, "section": "15.2", "chapter": 15, "order": 314}}, {"uid": "UP:XC", "branch": "UP", "native_id": "XC", "label": "Capacitive reactance", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 439, "concept": null, "extra": {"symbol": "X_C = 1/(ωC)", "primitive": false, "postulate": false, "description": "Opposition of a capacitor to alternating current; current leads voltage by 90°.", "vol": 2, "section": "15.2", "chapter": 15, "order": 315}}, {"uid": "UP:rms", "branch": "UP", "native_id": "rms", "label": "rms current and voltage", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 440, "concept": null, "extra": {"symbol": "V_rms = V₀/√2", "primitive": false, "postulate": false, "description": "Effective values of a sinusoid: the dc values that deliver the same average power.", "vol": 2, "section": "15.2", "chapter": 15, "order": 316}}, {"uid": "UP:XL", "branch": "UP", "native_id": "XL", "label": "Inductive reactance", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 441, "concept": null, "extra": {"symbol": "X_L = ωL", "primitive": false, "postulate": false, "description": "Opposition of an inductor to alternating current; current lags voltage by 90°.", "vol": 2, "section": "15.2", "chapter": 15, "order": 317}}, {"uid": "UP:Zimp", "branch": "UP", "native_id": "Zimp", "label": "Impedance and phase angle", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 442, "concept": null, "extra": {"symbol": "Z = √(R² + (X_L − X_C)²)", "primitive": false, "postulate": false, "description": "Total opposition of a series RLC circuit to ac, I₀ = V₀/Z; the phase angle φ = tan⁻¹((X_L − X_C)/R) is how far current lags voltage.", "vol": 2, "section": "15.3", "chapter": 15, "order": 318}}, {"uid": "UP:Pac", "branch": "UP", "native_id": "Pac", "label": "Average ac power", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 444, "concept": null, "extra": {"symbol": "P_ave = I_rms V_rms cos φ", "primitive": false, "postulate": false, "description": "Power averaged over a cycle; only the resistor dissipates, and cos φ is the power factor.", "vol": 2, "section": "15.4", "chapter": 15, "order": 319}}, {"uid": "UP:acres", "branch": "UP", "native_id": "acres", "label": "AC resonance", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 445, "concept": null, "extra": {"symbol": "ω₀ = 1/√(LC),  Q = ω₀L/R", "primitive": false, "postulate": false, "description": "Current in a series RLC circuit peaks when X_L = X_C; the quality factor measures how sharp the peak is (bandwidth Δω = ω₀/Q).", "vol": 2, "section": "15.5", "chapter": 15, "order": 320}}, {"uid": "UP:transf", "branch": "UP", "native_id": "transf", "label": "Transformer", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 447, "concept": null, "extra": {"symbol": "V_S/V_P = N_S/N_P", "primitive": false, "postulate": false, "description": "Two coils on one iron core: the voltage ratio equals the turns ratio, and the current ratio its inverse, so power is transmitted at high voltage and low current.", "vol": 2, "section": "15.6", "chapter": 15, "order": 321}}, {"uid": "UP:maxwell", "branch": "UP", "native_id": "maxwell", "label": "Maxwell's equations", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 450, "concept": "maxwell_equations", "extra": {"symbol": "four field laws", "primitive": false, "postulate": false, "description": "Gauss's law for E⃗, Gauss's law for B⃗ (no monopoles), Faraday's law, and Ampère's law with Maxwell's displacement current; with the Lorentz force they complete classical electromagnetism.", "vol": 2, "section": "16.1", "chapter": 16, "order": 322}}, {"uid": "UP:Id", "branch": "UP", "native_id": "Id", "label": "Displacement current", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 450, "concept": null, "extra": {"symbol": "I_d = ε₀ dΦ_E/dt", "primitive": false, "postulate": false, "description": "Maxwell's term: a changing electric flux acts like a current in Ampère's law, needed where a capacitor interrupts the conduction current.", "vol": 2, "section": "16.1", "chapter": 16, "order": 323}}, {"uid": "UP:EB", "branch": "UP", "native_id": "EB", "label": "Electromagnetic field", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 452, "concept": "em_field_state", "extra": {"symbol": "(E⃗, B⃗)(r⃗, t)", "primitive": false, "postulate": false, "description": "The dynamical state of classical electromagnetism: electric and magnetic fields at every point and time, evolving by Maxwell's equations.", "vol": 2, "section": "16.1", "chapter": 16, "order": 324}}, {"uid": "UP:emwave", "branch": "UP", "native_id": "emwave", "label": "Plane electromagnetic wave", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 453, "concept": null, "extra": {"symbol": "E = cB,  E⃗ ⟂ B⃗ ⟂ k⃗", "primitive": false, "postulate": false, "description": "A solution of Maxwell's equations in empty space: transverse electric and magnetic fields in phase, travelling at c = 1/√(ε₀μ₀).", "vol": 2, "section": "16.2", "chapter": 16, "order": 325}}, {"uid": "UP:Spoynt", "branch": "UP", "native_id": "Spoynt", "label": "Poynting vector", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 455, "concept": "poynting_vector", "extra": {"symbol": "S⃗ = E⃗ × B⃗/μ₀", "primitive": false, "postulate": false, "description": "Energy flux of the electromagnetic field: energy per unit area per unit time, along the direction of propagation.", "vol": 2, "section": "16.3", "chapter": 16, "order": 326}}, {"uid": "UP:prad", "branch": "UP", "native_id": "prad", "label": "Radiation pressure", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 457, "concept": null, "extra": {"symbol": "p = I/c (absorbed), 2I/c (reflected)", "primitive": false, "postulate": false, "description": "Pressure exerted by light because electromagnetic waves carry momentum U/c.", "vol": 2, "section": "16.4", "chapter": 16, "order": 327}}, {"uid": "UP:spectrum", "branch": "UP", "native_id": "spectrum", "label": "Electromagnetic spectrum", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 458, "concept": null, "extra": {"symbol": "c = fλ", "primitive": false, "postulate": false, "description": "Electromagnetic waves of all wavelengths: radio, microwaves, infrared, visible light, ultraviolet, X-rays and gamma rays, distinguished only by frequency.", "vol": 2, "section": "16.5", "chapter": 16, "order": 328}}, {"uid": "UP:nidx", "branch": "UP", "native_id": "nidx", "label": "Index of refraction", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 461, "concept": null, "extra": {"symbol": "n = c/v", "primitive": false, "postulate": false, "description": "Ratio of the speed of light in vacuum to its speed in a medium; at least 1.", "vol": 3, "section": "1.1", "chapter": 1, "order": 329}}, {"uid": "UP:raymod", "branch": "UP", "native_id": "raymod", "label": "Ray model of light", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 462, "concept": null, "extra": {"symbol": "straight rays", "primitive": false, "postulate": false, "description": "Geometric optics: light travels along straight rays in a uniform medium, bending only at boundaries. Valid when objects and apertures are much larger than the wavelength.", "vol": 3, "section": "1.1", "chapter": 1, "order": 330}}, {"uid": "UP:reflect", "branch": "UP", "native_id": "reflect", "label": "Law of reflection", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 463, "concept": null, "extra": {"symbol": "θ_r = θ_i", "primitive": false, "postulate": false, "description": "A ray reflects from a smooth surface at the same angle to the normal as it arrived, in the same plane.", "vol": 3, "section": "1.2", "chapter": 1, "order": 331}}, {"uid": "UP:snell", "branch": "UP", "native_id": "snell", "label": "Law of refraction", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 464, "concept": null, "extra": {"symbol": "n₁ sin θ₁ = n₂ sin θ₂", "primitive": false, "postulate": false, "description": "A ray entering a medium of different index bends toward the normal if the new index is larger (Snell's law).", "vol": 3, "section": "1.3", "chapter": 1, "order": 332}}, {"uid": "UP:thetac", "branch": "UP", "native_id": "thetac", "label": "Critical angle", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 465, "concept": null, "extra": {"symbol": "sin θ_c = n₂/n₁", "primitive": false, "postulate": false, "description": "Angle of incidence beyond which light going into a medium of lower index is totally reflected (total internal reflection).", "vol": 3, "section": "1.4", "chapter": 1, "order": 333}}, {"uid": "UP:dispn", "branch": "UP", "native_id": "dispn", "label": "Dispersion", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 466, "concept": null, "extra": {"symbol": "n(λ)", "primitive": false, "postulate": false, "description": "The index of refraction depends on wavelength, so a prism spreads white light into colours.", "vol": 3, "section": "1.5", "chapter": 1, "order": 334}}, {"uid": "UP:huygens", "branch": "UP", "native_id": "huygens", "label": "Huygens's principle", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 467, "concept": null, "extra": {"symbol": "wavefront = envelope of wavelets", "primitive": false, "postulate": false, "description": "Every point on a wavefront is a source of secondary wavelets; the new wavefront is their envelope. It explains reflection, refraction and diffraction (wave optics).", "vol": 3, "section": "1.6", "chapter": 1, "order": 335}}, {"uid": "UP:pol", "branch": "UP", "native_id": "pol", "label": "Polarization", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 469, "concept": null, "extra": {"symbol": "direction of E⃗", "primitive": false, "postulate": false, "description": "The direction of the electric field of light in the plane perpendicular to its travel: fixed for polarized light (vertically, horizontally…), random for unpolarized light.", "vol": 3, "section": "1.7", "chapter": 1, "order": 336}}, {"uid": "UP:malus", "branch": "UP", "native_id": "malus", "label": "Malus's law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 470, "concept": null, "extra": {"symbol": "I = I₀ cos²θ", "primitive": false, "postulate": false, "description": "A polarizing filter transmits the field component along its axis, so intensity falls as cos²θ.", "vol": 3, "section": "1.7", "chapter": 1, "order": 337}}, {"uid": "UP:brewster", "branch": "UP", "native_id": "brewster", "label": "Brewster's angle", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 471, "concept": null, "extra": {"symbol": "tan θ_b = n₂/n₁", "primitive": false, "postulate": false, "description": "Angle of incidence at which reflected light is completely polarized parallel to the surface.", "vol": 3, "section": "1.7", "chapter": 1, "order": 338}}, {"uid": "UP:image", "branch": "UP", "native_id": "image", "label": "Optical image", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 473, "concept": null, "extra": {"symbol": "real or virtual", "primitive": false, "postulate": false, "description": "Where rays from a point of an object meet (real image, can be caught on a screen) or appear to come from (virtual image). A plane mirror forms a virtual image as far behind as the object is in front.", "vol": 3, "section": "2.1", "chapter": 2, "order": 339}}, {"uid": "UP:mirroreq", "branch": "UP", "native_id": "mirroreq", "label": "Mirror equation", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 474, "concept": null, "extra": {"symbol": "1/d_o + 1/d_i = 1/f", "primitive": false, "postulate": false, "description": "For a curved (spherical) mirror and rays near the optical axis, object and image distances are related through the focal length f = R/2.", "vol": 3, "section": "2.2", "chapter": 2, "order": 340}}, {"uid": "UP:mag", "branch": "UP", "native_id": "mag", "label": "Magnification", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 475, "concept": null, "extra": {"symbol": "m = h_i/h_o = −d_i/d_o", "primitive": false, "postulate": false, "description": "Image height over object height; negative for an inverted image.", "vol": 3, "section": "2.2", "chapter": 2, "order": 341}}, {"uid": "UP:aberr", "branch": "UP", "native_id": "aberr", "label": "Aberrations", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 476, "concept": null, "extra": {"symbol": "departures from ideal imaging", "primitive": false, "postulate": false, "description": "Real mirrors and lenses do not bring all rays to one point: spherical aberration (rays far from the axis), coma (off-axis points), and others.", "vol": 3, "section": "2.2", "chapter": 2, "order": 342}}, {"uid": "UP:refrsurf", "branch": "UP", "native_id": "refrsurf", "label": "Refraction at a curved surface", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 477, "concept": null, "extra": {"symbol": "n₁/d_o + n₂/d_i = (n₂ − n₁)/R", "primitive": false, "postulate": false, "description": "A single spherical boundary between media forms images; for a flat boundary it gives the apparent depth h_i = (n₂/n₁)h_o.", "vol": 3, "section": "2.3", "chapter": 2, "order": 343}}, {"uid": "UP:thinlens", "branch": "UP", "native_id": "thinlens", "label": "Thin lens", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 478, "concept": null, "extra": {"symbol": "1/d_o + 1/d_i = 1/f", "primitive": false, "postulate": false, "description": "Two refracting surfaces close together: converging lenses (f > 0) and diverging lenses (f < 0), with 1/f = (n₂/n₁ − 1)(1/R₁ − 1/R₂) (lens maker's equation). Images are found by ray tracing.", "vol": 3, "section": "2.4", "chapter": 2, "order": 344}}, {"uid": "UP:eye", "branch": "UP", "native_id": "eye", "label": "The eye as an optical system", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 480, "concept": null, "extra": {"symbol": "variable-power lens, fixed retina", "primitive": false, "postulate": false, "description": "The eye images onto the retina at fixed distance by changing its power (accommodation) between the near and far points; myopia and hyperopia are corrected with lenses.", "vol": 3, "section": "2.5", "chapter": 2, "order": 345}}, {"uid": "UP:Popt", "branch": "UP", "native_id": "Popt", "label": "Optical power", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 481, "concept": null, "extra": {"symbol": "P = 1/f", "primitive": false, "postulate": false, "description": "Inverse focal length in diopters (m⁻¹); powers of thin lenses in contact add.", "vol": 3, "section": "2.5", "chapter": 2, "order": 346}}, {"uid": "UP:Mang", "branch": "UP", "native_id": "Mang", "label": "Angular magnification", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 483, "concept": null, "extra": {"symbol": "M = θ_image/θ_object", "primitive": false, "postulate": false, "description": "How much larger an object appears through an instrument than to the unaided eye at the near point; a simple magnifier gives at most 1 + 25 cm/f.", "vol": 3, "section": "2.7", "chapter": 2, "order": 347}}, {"uid": "UP:instr", "branch": "UP", "native_id": "instr", "label": "Microscope and telescope", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 484, "concept": null, "extra": {"symbol": "M_net = m_obj M_eye", "primitive": false, "postulate": false, "description": "Two-lens instruments: the objective forms a real image that the eyepiece magnifies; magnifications multiply.", "vol": 3, "section": "2.8", "chapter": 2, "order": 348}}, {"uid": "UP:coh", "branch": "UP", "native_id": "coh", "label": "Coherent light", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 487, "concept": null, "extra": {"symbol": "fixed phase relation", "primitive": false, "postulate": false, "description": "Light waves whose phase difference stays constant (coherent), usually of one wavelength (monochromatic); incoherent light washes out interference.", "vol": 3, "section": "3.1", "chapter": 3, "order": 349}}, {"uid": "UP:dslit", "branch": "UP", "native_id": "dslit", "label": "Double-slit interference", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 488, "concept": "interference", "extra": {"symbol": "d sin θ = mλ", "primitive": false, "postulate": false, "description": "Young's experiment: light from two slits forms bright fringes where the path difference is a whole number of wavelengths (order m) and dark fringes halfway between.", "vol": 3, "section": "3.1", "chapter": 3, "order": 350}}, {"uid": "UP:multislit", "branch": "UP", "native_id": "multislit", "label": "Multiple-slit interference", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 490, "concept": null, "extra": {"symbol": "principal and secondary maxima", "primitive": false, "postulate": false, "description": "With N slits the principal maxima stay at d sin θ = mλ but become sharper, with N − 2 weak secondary maxima between them.", "vol": 3, "section": "3.3", "chapter": 3, "order": 351}}, {"uid": "UP:thinfilm", "branch": "UP", "native_id": "thinfilm", "label": "Thin-film interference", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 491, "concept": null, "extra": {"symbol": "2nt = mλ or (m + ½)λ", "primitive": false, "postulate": false, "description": "Light reflected from the top and bottom of a thin film interferes; a half-wavelength phase change on reflection from a higher-index medium decides which colours are reinforced (soap bubbles, Newton's rings).", "vol": 3, "section": "3.4", "chapter": 3, "order": 352}}, {"uid": "UP:michint", "branch": "UP", "native_id": "michint", "label": "Michelson interferometer", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 492, "concept": null, "extra": {"symbol": "Δd = mλ₀/2", "primitive": false, "postulate": false, "description": "Splits a beam, sends the halves along two arms and recombines them; moving one mirror by λ/2 shifts the pattern by one fringe.", "vol": 3, "section": "3.5", "chapter": 3, "order": 353}}, {"uid": "UP:sslit", "branch": "UP", "native_id": "sslit", "label": "Single-slit diffraction", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 494, "concept": null, "extra": {"symbol": "a sin θ = mλ (dark)", "primitive": false, "postulate": false, "description": "Light spreads after passing a narrow slit; wavelets from different parts of the slit cancel at angles where a sin θ = mλ.", "vol": 3, "section": "4.1", "chapter": 4, "order": 354}}, {"uid": "UP:Isslit", "branch": "UP", "native_id": "Isslit", "label": "Single-slit intensity", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 495, "concept": null, "extra": {"symbol": "I = I₀ (sin β/β)²", "primitive": false, "postulate": false, "description": "Intensity across the single-slit pattern, β = πa sin θ/λ; the central peak's width is set by λ/a.", "vol": 3, "section": "4.2", "chapter": 4, "order": 355}}, {"uid": "UP:dsdiff", "branch": "UP", "native_id": "dsdiff", "label": "Two-slit diffraction pattern", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 496, "concept": null, "extra": {"symbol": "interference × envelope", "primitive": false, "postulate": false, "description": "With slits of finite width, the double-slit fringes are modulated by the single-slit envelope; fringes falling on envelope minima are missing orders.", "vol": 3, "section": "4.3", "chapter": 4, "order": 356}}, {"uid": "UP:grating", "branch": "UP", "native_id": "grating", "label": "Diffraction grating", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 497, "concept": null, "extra": {"symbol": "d sin θ = mλ", "primitive": false, "postulate": false, "description": "Thousands of equally spaced slits give very sharp principal maxima, so a grating separates wavelengths precisely.", "vol": 3, "section": "4.4", "chapter": 4, "order": 357}}, {"uid": "UP:rayl", "branch": "UP", "native_id": "rayl", "label": "Rayleigh criterion", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 498, "concept": null, "extra": {"symbol": "θ_min = 1.22 λ/D", "primitive": false, "postulate": false, "description": "Two point sources are just resolved when the central maximum of one falls on the first minimum of the other; diffraction limits every optical instrument's resolution.", "vol": 3, "section": "4.5", "chapter": 4, "order": 358}}, {"uid": "UP:bragg", "branch": "UP", "native_id": "bragg", "label": "Bragg's law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 499, "concept": null, "extra": {"symbol": "mλ = 2d sin θ", "primitive": false, "postulate": false, "description": "X-rays reflected from successive planes of atoms in a crystal (Bragg planes) interfere constructively when the extra path 2d sin θ is a whole number of wavelengths.", "vol": 3, "section": "4.6", "chapter": 4, "order": 359}}, {"uid": "UP:holo", "branch": "UP", "native_id": "holo", "label": "Holography", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 500, "concept": null, "extra": {"symbol": "interference with a reference beam", "primitive": false, "postulate": false, "description": "A hologram records the interference of object light with a reference beam, storing amplitude and phase; illuminated again, it reconstructs a three-dimensional image.", "vol": 3, "section": "4.7", "chapter": 4, "order": 360}}, {"uid": "UP:SR", "branch": "UP", "native_id": "SR", "label": "Special relativity", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "relativistic", "t": 502, "concept": null, "extra": {"symbol": "postulates 1 + 2", "primitive": false, "postulate": false, "description": "Einstein's theory of space and time for inertial frames, built on two postulates; it reconciles mechanics with electromagnetism.", "vol": 3, "section": "5.1", "chapter": 5, "order": 361}}, {"uid": "UP:sr1", "branch": "UP", "native_id": "sr1", "label": "First postulate", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "relativistic", "t": 503, "concept": null, "extra": {"symbol": "same laws in all inertial frames", "primitive": false, "postulate": true, "description": "The laws of physics, including electromagnetism, have the same form in every inertial frame.", "vol": 3, "section": "5.1", "chapter": 5, "order": 362}}, {"uid": "UP:mmnull", "branch": "UP", "native_id": "mmnull", "label": "Michelson–Morley result", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 504, "concept": null, "extra": {"symbol": "no fringe shift", "primitive": false, "postulate": false, "description": "An interferometer turned relative to Earth's motion showed no change in the speed of light: there is no detectable motion through an ether.", "vol": 3, "section": "5.1", "chapter": 5, "order": 363}}, {"uid": "UP:sr2", "branch": "UP", "native_id": "sr2", "label": "Second postulate", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "relativistic", "t": 506, "concept": null, "extra": {"symbol": "c the same in all inertial frames", "primitive": false, "postulate": true, "description": "Light in vacuum travels at c in every inertial frame, whatever the motion of source or observer.", "vol": 3, "section": "5.1", "chapter": 5, "order": 364}}, {"uid": "UP:simul", "branch": "UP", "native_id": "simul", "label": "Relativity of simultaneity", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "relativistic", "t": 507, "concept": null, "extra": {"symbol": "t_A = t_B in S ⇏ in S′", "primitive": false, "postulate": false, "description": "Two events simultaneous in one inertial frame are generally not simultaneous in another moving relative to it.", "vol": 3, "section": "5.2", "chapter": 5, "order": 365}}, {"uid": "UP:dtdil", "branch": "UP", "native_id": "dtdil", "label": "Time dilation", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "relativistic", "t": 508, "concept": null, "extra": {"symbol": "Δt = γΔτ", "primitive": false, "postulate": false, "description": "A clock moving relative to an observer runs slow: the time between two events at one place in the clock's frame (proper time Δτ) is the shortest.", "vol": 3, "section": "5.3", "chapter": 5, "order": 366}}, {"uid": "UP:gamma", "branch": "UP", "native_id": "gamma", "label": "Lorentz factor", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "relativistic", "t": 509, "concept": null, "extra": {"symbol": "γ = 1/√(1 − v²/c²)", "primitive": false, "postulate": false, "description": "Factor that measures how far relativistic effects depart from Newtonian ones; 1 at rest, infinite at c.", "vol": 3, "section": "5.3", "chapter": 5, "order": 367}}, {"uid": "UP:Lcon", "branch": "UP", "native_id": "Lcon", "label": "Length contraction", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "relativistic", "t": 511, "concept": null, "extra": {"symbol": "L = L₀/γ", "primitive": false, "postulate": false, "description": "A body is longest in its own rest frame (proper length L₀); measured while it moves, it is shorter along the motion, L = L₀/γ.", "vol": 3, "section": "5.4", "chapter": 5, "order": 368}}, {"uid": "UP:lorentzT", "branch": "UP", "native_id": "lorentzT", "label": "Lorentz transformation", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "relativistic", "t": 512, "concept": "lorentz_transformation", "extra": {"symbol": "x′ = γ(x − vt),  t′ = γ(t − vx/c²)", "primitive": false, "postulate": false, "description": "Converts the coordinates of an event between two inertial frames so that the speed of light is the same in both.", "vol": 3, "section": "5.5", "chapter": 5, "order": 369}}, {"uid": "UP:spacetime", "branch": "UP", "native_id": "spacetime", "label": "Space-time", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "relativistic", "t": 513, "concept": null, "extra": {"symbol": "events (ct, x, y, z)", "primitive": false, "postulate": false, "description": "The four-dimensional arena of special relativity; a particle's history is a world line, and the interval between events is the same in all frames.", "vol": 3, "section": "5.5", "chapter": 5, "order": 370}}, {"uid": "UP:reladd", "branch": "UP", "native_id": "reladd", "label": "Relativistic velocity addition", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "relativistic", "t": 514, "concept": null, "extra": {"symbol": "u = (u′ + v)/(1 + vu′/c²)", "primitive": false, "postulate": false, "description": "Velocities combine so that no sum of speeds below c ever exceeds c; for slow speeds this reduces to classical (Galilean) velocity addition.", "vol": 3, "section": "5.6", "chapter": 5, "order": 371}}, {"uid": "UP:relDop", "branch": "UP", "native_id": "relDop", "label": "Relativistic Doppler effect", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "relativistic", "t": 515, "concept": null, "extra": {"symbol": "f_obs = f_s √((1 − v/c)/(1 + v/c))", "primitive": false, "postulate": false, "description": "The frequency of light from a receding source is lower (red shift), from an approaching one higher; it depends only on the relative velocity.", "vol": 3, "section": "5.7", "chapter": 5, "order": 372}}, {"uid": "UP:prel", "branch": "UP", "native_id": "prel", "label": "Relativistic momentum", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "relativistic", "t": 516, "concept": null, "extra": {"symbol": "p⃗ = γmu⃗", "primitive": false, "postulate": false, "description": "The momentum conserved in all inertial frames; m is the rest mass, the same in every frame.", "vol": 3, "section": "5.8", "chapter": 5, "order": 373}}, {"uid": "UP:Krel", "branch": "UP", "native_id": "Krel", "label": "Relativistic kinetic energy", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "relativistic", "t": 517, "concept": null, "extra": {"symbol": "K = (γ − 1)mc²", "primitive": false, "postulate": false, "description": "Work needed to bring a body from rest to speed u; it grows without bound as u → c, so no massive body reaches c.", "vol": 3, "section": "5.9", "chapter": 5, "order": 374}}, {"uid": "UP:Erel", "branch": "UP", "native_id": "Erel", "label": "Total energy and rest energy", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "relativistic", "t": 518, "concept": null, "extra": {"symbol": "E = γmc²,  E₀ = mc²", "primitive": false, "postulate": false, "description": "Total energy of a body: kinetic energy plus its rest energy mc²; mass is a form of energy. E² = (pc)² + (mc²)².", "vol": 3, "section": "5.9", "chapter": 5, "order": 375}}, {"uid": "UP:bbrad", "branch": "UP", "native_id": "bbrad", "label": "Blackbody radiation", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 520, "concept": "blackbody", "extra": {"symbol": "I(λ, T)", "primitive": false, "postulate": false, "description": "Radiation in equilibrium with a perfect absorber and emitter at temperature T; its spectrum depends only on T, peaking at λ_max with λ_max T = 2.898 × 10⁻³ m·K (Wien).", "vol": 3, "section": "6.1", "chapter": 6, "order": 376}}, {"uid": "UP:hbar", "branch": "UP", "native_id": "hbar", "label": "Planck's constant", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 522, "concept": "planck_constant", "extra": {"symbol": "h,  ħ = h/2π", "primitive": true, "postulate": false, "description": "The quantum of action, 6.626 × 10⁻³⁴ J·s; it sets the scale at which energy comes in discrete amounts.", "vol": 3, "section": "6.1", "chapter": 6, "order": 377}}, {"uid": "UP:planck", "branch": "UP", "native_id": "planck", "label": "Planck's hypothesis", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 522, "concept": "planck_relation", "extra": {"symbol": "E_n = nhf", "primitive": false, "postulate": false, "description": "The oscillators exchanging energy with cavity radiation can only have energies that are whole multiples of hf.", "vol": 3, "section": "6.1", "chapter": 6, "order": 378}}, {"uid": "UP:Kmax", "branch": "UP", "native_id": "Kmax", "label": "Photoelectron energy", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 524, "concept": null, "extra": {"symbol": "K_max = eΔV_s", "primitive": false, "postulate": false, "description": "Light on a metal ejects photoelectrons (photocurrent from the photoelectrode); their maximum kinetic energy is measured by the stopping potential.", "vol": 3, "section": "6.2", "chapter": 6, "order": 379}}, {"uid": "UP:fc", "branch": "UP", "native_id": "fc", "label": "Cut-off frequency", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 524, "concept": null, "extra": {"symbol": "f_c", "primitive": false, "postulate": false, "description": "Below a cut-off frequency (above a cut-off wavelength) no electrons are emitted, however intense the light.", "vol": 3, "section": "6.2", "chapter": 6, "order": 380}}, {"uid": "UP:photon", "branch": "UP", "native_id": "photon", "label": "Photon", "layer": "S", "sublayer": "S.hilbert", "native_layer": "state", "era": "quantum", "t": 526, "concept": "photon", "extra": {"symbol": "E = hf,  p⃗ = ħk⃗", "primitive": false, "postulate": false, "description": "A quantum of the electromagnetic field: energy hf, momentum h/λ along the propagation vector, zero rest mass. The photoelectric effect is a quantum phenomenon.", "vol": 3, "section": "6.2", "chapter": 6, "order": 381}}, {"uid": "UP:phiw", "branch": "UP", "native_id": "phiw", "label": "Work function", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 527, "concept": null, "extra": {"symbol": "ϕ", "primitive": false, "postulate": false, "description": "Minimum energy needed to free an electron from a metal's surface.", "vol": 3, "section": "6.2", "chapter": 6, "order": 382}}, {"uid": "UP:compton", "branch": "UP", "native_id": "compton", "label": "Compton shift", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 528, "concept": "compton", "extra": {"symbol": "Δλ = λ_c(1 − cos θ)", "primitive": false, "postulate": false, "description": "X-rays scattered by electrons come out with longer wavelength, by an amount fixed by the scattering angle; λ_c = h/(m₀c) = 0.00243 nm is the Compton wavelength.", "vol": 3, "section": "6.3", "chapter": 6, "order": 383}}, {"uid": "UP:Hspec", "branch": "UP", "native_id": "Hspec", "label": "Hydrogen line spectrum", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 529, "concept": "spectral_lines", "extra": {"symbol": "1/λ = R_H(1/n_f² − 1/n_i²)", "primitive": false, "postulate": false, "description": "Hydrogen emits and absorbs only at discrete wavelengths (Fraunhofer lines in sunlight), in series named Lyman, Balmer, Paschen, Brackett, Pfund and Humphreys.", "vol": 3, "section": "6.4", "chapter": 6, "order": 384}}, {"uid": "UP:nucatom", "branch": "UP", "native_id": "nucatom", "label": "Nuclear model of the atom", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 530, "concept": null, "extra": {"symbol": "nucleus + electrons", "primitive": false, "postulate": false, "description": "Rutherford's gold-foil experiment showed that nearly all of an atom's mass and its positive charge sit in a tiny nucleus, with electrons far outside.", "vol": 3, "section": "6.4", "chapter": 6, "order": 385}}, {"uid": "UP:bohr", "branch": "UP", "native_id": "bohr", "label": "Bohr's model", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 532, "concept": "bohr_model", "extra": {"symbol": "L = nħ,  hf = |E_n − E_m|", "primitive": false, "postulate": false, "description": "Postulates for hydrogen: the electron moves only on orbits with angular momentum nħ, does not radiate on them, and emits or absorbs a photon when it jumps between them.", "vol": 3, "section": "6.4", "chapter": 6, "order": 386}}, {"uid": "UP:bohrlev", "branch": "UP", "native_id": "bohrlev", "label": "Hydrogen energy levels", "layer": "S", "sublayer": "S.hilbert", "native_layer": "state", "era": "quantum", "t": 533, "concept": "hydrogen_levels", "extra": {"symbol": "E_n = −13.6 eV/n²", "primitive": false, "postulate": false, "description": "The allowed states of Bohr's atom: radii r_n = a₀n² (Bohr radius a₀ = 0.529 Å) and energies −E₀/n²; ground state −13.6 eV, ionization energy 13.6 eV. Hydrogen-like ions scale with Z.", "vol": 3, "section": "6.4", "chapter": 6, "order": 387}}, {"uid": "UP:debrog", "branch": "UP", "native_id": "debrog", "label": "de Broglie's hypothesis", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 535, "concept": null, "extra": {"symbol": "λ = h/p,  f = E/h", "primitive": false, "postulate": false, "description": "Every particle has an associated matter wave (de Broglie wave) with wavelength h/p; the wave packet moves at the group velocity, which equals the particle's velocity.", "vol": 3, "section": "6.5", "chapter": 6, "order": 388}}, {"uid": "UP:DG", "branch": "UP", "native_id": "DG", "label": "Electron diffraction", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 537, "concept": null, "extra": {"symbol": "λ = h/p measured", "primitive": false, "postulate": false, "description": "Davisson and Germer saw electrons diffracted by a nickel crystal with the angles of Bragg's law, confirming λ = h/p.", "vol": 3, "section": "6.5", "chapter": 6, "order": 389}}, {"uid": "UP:duality", "branch": "UP", "native_id": "duality", "label": "Wave–particle duality", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 538, "concept": null, "extra": {"symbol": "both pictures required", "primitive": false, "postulate": false, "description": "Light and matter both show wave behaviour (interference in the double-slit interference experiment) and particle behaviour (single detections); neither picture alone suffices.", "vol": 3, "section": "6.6", "chapter": 6, "order": 390}}, {"uid": "UP:uncert", "branch": "UP", "native_id": "uncert", "label": "Uncertainty principle", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 539, "concept": null, "extra": {"symbol": "Δx Δp ≥ ħ/2", "primitive": false, "postulate": false, "description": "Position and momentum cannot both be sharp: the product of their uncertainties is at least ħ/2.", "vol": 3, "section": "6.6", "chapter": 6, "order": 391}}, {"uid": "UP:psi", "branch": "UP", "native_id": "psi", "label": "Wave function", "layer": "S", "sublayer": "S.hilbert", "native_layer": "state", "era": "quantum", "t": 542, "concept": "hilbert_state", "extra": {"symbol": "Ψ(x, t)", "primitive": false, "postulate": false, "description": "The quantum state of a particle: a complex function of position and time; its symmetry under x → −x may be even or odd.", "vol": 3, "section": "7.1", "chapter": 7, "order": 392}}, {"uid": "UP:born", "branch": "UP", "native_id": "born", "label": "Born rule", "layer
