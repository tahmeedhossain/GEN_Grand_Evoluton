ic, Paterek, Brukner, NJP 16, 023028 (2014)"]}}, {"uid": "GPT:E10", "branch": "GPT", "native_id": "E10", "inputs": ["GPT:ax-decoh"], "target": "GPT:s-ent", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Any nonclassical GPT containing a decoherence mechanism onto classical theory must contain entangled states: entanglement is necessary for emergent classicality.", "refs": ["Richens, Selby, Al-Safi, PRL 119, 080503 (2017)"]}}, {"uid": "GPT:E11", "branch": "GPT", "native_id": "E11", "inputs": ["GPT:m-psiepi"], "target": "GPT:m-quantum", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 1.0, "extra": {"statement": "PBR: preparation-independent psi-epistemic models contradict quantum statistics; maximally psi-epistemic models fail for d>=3 independently of preparation independence; psi-epistemic models without these assumptions do exist.", "refs": ["Pusey, Barrett, Rudolph, Nat. Phys. 8, 475 (2012)", "Barrett, Cavalcanti, Lal, Maroney, PRL 112, 250403 (2014)", "Leifer, Maroney, PRL 110, 120401 (2013)", "Lewis, Jennings, Barrett, Rudolph, PRL 109, 150404 (2012)"]}}, {"uid": "GPT:F1", "branch": "GPT", "native_id": "F1", "inputs": ["GPT:m-spekkens"], "target": "GPT:e-bell", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 1.0, "extra": {"statement": "Spekkens' toy theory reproduces incompatibility, no-cloning, interference, teleportation and dense-coding analogues AND ensemble steering - yet is local, noncontextual and nonnegative: steering phenomenology alone does not certify contextuality or nonlocality.", "refs": ["Spekkens, PRA 75, 032110 (2007)", "Kar, Ghosh, Choudhary, Banik, Mathematics 4, 52 (2016)"]}}, {"uid": "GPT:F2", "branch": "GPT", "native_id": "F2", "inputs": ["GPT:m-gaussian"], "target": "GPT:e-steer", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Gaussian QM: two-mode squeezed states are EPR-steerable with quadrature measurements, yet the positive Wigner function provides an LHV model for all Gaussian measurements (no Bell violation without non-Gaussian measurements), and the whole subtheory embeds in an epistricted classical theory (noncontextual).", "refs": ["Wiseman, Jones, Doherty, PRL 98, 140402 (2007)", "Banaszek, Wodkiewicz, PRA 58, 4345 (1998)", "Bartlett, Rudolph, Spekkens, PRA 86, 012103 (2012)"]}}, {"uid": "GPT:F3", "branch": "GPT", "native_id": "F3", "inputs": ["GPT:m-sepqt"], "target": "GPT:s-wneg", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "derived", "polarity": "possibility", "t": 1.0, "extra": {"statement": "OBSERVATION P3: separable quantum theory (quantum marginals, minimal tensor product) retains Wigner negativity, magic and generalized contextuality of single systems while possessing NO entangled states, NO steering and NO Bell violation; purification fails. The unique escape from P1, pinning the burden of forcing entanglement on the composition axiom.", "refs": ["Janotta, Hinrichsen, J. Phys. A 47, 323001 (2014)", "cf. Aubrun et al., PRL 128, 160402 (2022)"]}}, {"uid": "GPT:F4", "branch": "GPT", "native_id": "F4", "inputs": ["GPT:m-boxworld"], "target": "GPT:ax-ic", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 1.0, "extra": {"statement": "Boxworld violates information causality, macroscopic locality and local orthogonality (PR boxes trivialize communication complexity).", "refs": ["Pawlowski et al., Nature 461, 1101 (2009)", "van Dam, arXiv:quant-ph/0501159"]}}, {"uid": "GPT:F5", "branch": "GPT", "native_id": "F5", "inputs": ["GPT:m-realqm"], "target": "GPT:ax-loctom", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 1.0, "extra": {"statement": "Real-amplitude QM violates local tomography (composite real systems are not determined by local statistics).", "refs": ["Araki, Commun. Math. Phys. 75, 1 (1980)", "Wootters, in 'Complexity, Entropy and the Physics of Information' (1990)", "Renou et al., Nature 600, 625 (2021)"]}}, {"uid": "GPT:G1", "branch": "GPT", "native_id": "G1", "inputs": ["GPT:s-athermal"], "target": "GPT:t-secondlaws", "logic": "single", "kind": "necessary", "kind_native": "necessary", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Second laws: under thermal operations, state conversion of (block-)diagonal states is governed by the full family of alpha-Renyi free energies, not the single free energy.", "refs": ["Brandao, Horodecki, Oppenheim, Renes, Spekkens, PNAS 112, 3275 (2015)"]}}, {"uid": "GPT:G2", "branch": "GPT", "native_id": "G2", "inputs": ["GPT:s-cohE"], "target": "GPT:t-secondlaws", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Energy coherence is an independent thermodynamic resource: time-translation covariance of thermal operations forbids coherence creation and forces asymmetry monotones to decay - constraints beyond all free-energy second laws.", "refs": ["Lostaglio, Jennings, Rudolph, Nat. Commun. 6, 6383 (2015)", "Lostaglio, Korzekwa, Jennings, Rudolph, PRX 5, 021001 (2015)", "Cwiklinski, Studzinski, Horodecki, Oppenheim, PRL 115, 210403 (2015)"]}}, {"uid": "GPT:G3", "branch": "GPT", "native_id": "G3", "inputs": ["GPT:s-cohE"], "target": "GPT:t-secondlaws", "logic": "single", "kind": "not_implies", "kind_native": "not_implies", "status": "theorem", "polarity": "no_go", "t": 1.0, "extra": {"statement": "Work-locking: the coherent part of the free energy of an individual system is not extractable as work without a phase reference (it unlocks collectively or with an ancillary reference).", "refs": ["Korzekwa, Lostaglio, Oppenheim, Jennings, NJP 18, 023045 (2016)"]}}, {"uid": "GPT:G4", "branch": "GPT", "native_id": "G4", "inputs": ["GPT:e-heat"], "target": "GPT:e-ctx", "logic": "single", "kind": "witness", "kind_native": "witness", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Any fluctuation theorem reproducing the two-point-measurement statistics on classical states either admits a work quasiprobability or fails on contextual protocols; negativity of the work quasiprobability is a direct signature of contextuality. Noncontextual bounds exist on average work and heat; anomalous heat flow witnesses contextuality.", "refs": ["Lostaglio, PRL 120, 040602 (2018)", "Perarnau-Llobet et al., PRL 118, 070601 (2017)", "Arvidsson-Shukur et al., NJP 2024; arXiv:2403.18899", "Contextuality in anomalous heat flow, arXiv:2406.09715 (2024)"]}}, {"uid": "GPT:G5", "branch": "GPT", "native_id": "G5", "inputs": ["GPT:s-discord"], "target": "GPT:e-heat", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Initial quantum correlations can reverse the thermodynamic arrow (heat flows from cold to hot), observed experimentally with NMR spins; KD work distributions reconstructed interferometrically.", "refs": ["Micadei et al., Nat. Commun. 10, 2456 (2019)", "Hernandez-Gomez et al., npj Quantum Inf. 10 (2024)"]}}, {"uid": "GPT:G6", "branch": "GPT", "native_id": "G6", "inputs": ["GPT:ax-purif"], "target": "GPT:t-secondlaws", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "GPT thermodynamics: in sharp theories with purification, the three microcanonical resource theories (RaRe / noisy / unital) are well-posed, state conversion is majorization-governed, and purity resources are DUAL to pure-state entanglement resources - the entanglement-thermodynamics duality generalizes beyond quantum theory.", "refs": ["Chiribella, Scandolo, NJP 17, 103027 (2015)", "Chiribella, Scandolo, NJP 19, 123043 (2017)", "Chiribella, Scandolo, arXiv:1608.04459"]}}, {"uid": "GPT:G7", "branch": "GPT", "native_id": "G7", "inputs": ["GPT:s-discord"], "target": "GPT:e-nobc", "logic": "single", "kind": "equiv", "kind_native": "equiv", "status": "theorem", "polarity": "structural", "t": 1.0, "extra": {"statement": "A bipartite state is locally broadcastable iff it has zero discord (classically correlated): no-local-broadcasting characterizes quantum correlations beyond entanglement.", "refs": ["Piani, Horodecki, Horodecki, PRL 100, 090502 (2008)", "Ferraro et al., PRA 81, 052318 (2010) (discordant states are generic)"]}}, {"uid": "GPT:H1", "branch": "GPT", "native_id": "H1", "inputs": ["GPT:s-coh"], "target": "GPT:t-bb84", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "GPT-level: strong incompatibility ('superposition') in each local theory suffices to run the BB84 key-distribution protocol - key distribution survives even if quantum theory is replaced.", "refs": ["Aubrun, Lami, Palazuelos, Plavala, PRL 128, 160402 (2022)"]}}, {"uid": "GPT:H2", "branch": "GPT", "native_id": "H2", "inputs": ["GPT:e-incomp"], "target": "GPT:t-pom", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Measurement incompatibility is the exact resource for quantum advantage in random access codes.", "refs": ["Carmeli, Heinosaari, Toigo, arXiv:1911.04360 (2020)"]}}, {"uid": "GPT:H3", "branch": "GPT", "native_id": "H3", "inputs": ["GPT:e-ctx"], "target": "GPT:t-pom", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Contextuality quantifies one-shot classical communication advantage with entanglement assistance.", "refs": ["Kunjwal, Quantum 6, 839 (2022)"]}}, {"uid": "GPT:I1", "branch": "GPT", "native_id": "I1", "inputs": ["GPT:ax-ic"], "target": "GPT:m-quantum", "logic": "single", "kind": "open", "kind_native": "open", "status": "open", "polarity": "open", "t": 1.0, "extra": {"statement": "OPEN: no known set of device-independent principles (IC, ML, LO, NANLC...) singles out the quantum correlation set; the almost-quantum set satisfies them (IC unresolved) and obstructs the program; its own GPT status requires violating no-restriction.", "refs": ["Navascues et al., Nat. Commun. 6, 6288 (2015)", "Sainz et al., PRL 120, 200402 (2018)"]}}, {"uid": "GPT:I2", "branch": "GPT", "native_id": "I2", "inputs": ["GPT:s-coh"], "target": "GPT:e-ctx", "logic": "single", "kind": "open", "kind_native": "open", "status": "open", "polarity": "open", "t": 1.0, "extra": {"statement": "GAP G2: no quantitative resource translation coherence -> contextuality is known. Wanted: minimal extra structure under which a coherence monotone lower-bounds a contextuality robustness. Partial: event-graph witnesses; uncertainty-relation nonclassicality; genuinely nonclassical interference aspects.", "refs": ["Wagner, Camillini, Galvao, Quantum 8, 1240 (2024)", "Catani et al., PRL 2022", "Catani et al., PRA 2023"]}}, {"uid": "GPT:I3", "branch": "GPT", "native_id": "I3", "inputs": ["GPT:s-magic"], "target": "GPT:e-ctx", "logic": "single", "kind": "open", "kind_native": "open", "status": "open", "polarity": "open", "t": 1.0, "extra": {"statement": "GAP G3 (even dimensions): no clean iff between qubit magic and a contextuality/negativity measure; state-independent Pauli contextuality and the Zurel-Okay-Raussendorf model obstruct naive formulations. Known: generalized contextuality is necessary for qubit state injection; Lambda-polytope cost functions partially quantify it.", "refs": ["Schmid, Du, Selby, Pusey, PRL 129, 120403 (2022)", "Raussendorf, Browne, Delfosse, Okay, Bermejo-Vega, PRA 95, 052334 (2017)", "Zurel, Okay, Raussendorf, PRL 125, 260404 (2020)"]}}, {"uid": "GPT:I4", "branch": "GPT", "native_id": "I4", "inputs": ["GPT:e-steer"], "target": "GPT:m-classical", "logic": "single", "kind": "open", "kind_native": "open", "status": "open", "polarity": "open", "t": 1.0, "extra": {"statement": "GAP G1: no GPT-level characterization of which composites exhibit steering (the steering analogue of entangleability of cones). Conjecture (this work): every beyond-min composite of nonclassical tomographically-complete GPTs with at least one pure entangled state is steerable.", "refs": ["Chiribella, D'Ariano, Perinotti, PRA 81, 062348 (2010)", "Banik, J. Math. Phys. 56, 052101 (2015)", "Jencova, Plavala, PRA 98, 012133 (2018)", "Plavala et al., Incompatibility in restricted operational theories (2024)"]}}, {"uid": "GPT:I5", "branch": "GPT", "native_id": "I5", "inputs": ["GPT:e-heat"], "target": "GPT:e-ctx", "logic": "single", "kind": "open", "kind_native": "open", "status": "open", "polarity": "open", "t": 1.0, "extra": {"statement": "GAP G4: is every contextual process detectable by SOME thermodynamic anomaly (work/heat/entropy-production statistics)? Wanted: completeness theorem for thermodynamic contextuality witnesses within thermal operations.", "refs": ["Lostaglio, PRL 120, 040602 (2018)", "arXiv:2403.18899", "arXiv:2406.09715"]}}, {"uid": "GPT:I6", "branch": "GPT", "native_id": "I6", "inputs": ["GPT:e-interf3"], "target": "GPT:e-ctx", "logic": "single", "kind": "open", "kind_native": "open", "status": "open", "polarity": "open", "t": 1.0, "extra": {"statement": "GAP G5: relation between higher-order (Sorkin) interference and contextuality/negativity measures is uncharted; the contextuality status of density-cube theories is unknown.", "refs": ["Dakic, Paterek, Brukner, NJP 16, 023028 (2014)", "Barnum, Muller, Ududec, NJP 16, 123029 (2014)"]}}, {"uid": "GPT:I7", "branch": "GPT", "native_id": "I7", "inputs": ["GPT:ax-sorkin"], "target": "GPT:t-secondlaws", "logic": "single", "kind": "open", "kind_native": "open", "status": "open", "polarity": "open", "t": 1.0, "extra": {"statement": "GAP G6: which thermodynamic requirements (well-posed microcanonics, second laws, Landauer) FORCE purification-like axioms? Partial results for sharp theories with purification and for spectrality+strong symmetry; the converse direction is open.", "refs": ["Chiribella, Scandolo, NJP 19, 123043 (2017)", "Krumm, Barnum, Barrett, Muller, NJP 19, 043025 (2017)"]}}, {"uid": "GPT:I8", "branch": "GPT", "native_id": "I8", "inputs": ["GPT:e-ctx"], "target": "GPT:e-bell", "logic": "single", "kind": "open", "kind_native": "open", "status": "open", "polarity": "open", "t": 1.0, "extra": {"statement": "GAP G7: a general monogamy/trade-off theory between single-system contextuality and composite nonlocality is missing; the Wright-Farkas scenario map suggests a unified resource calculus is possible.", "refs": ["Kurzynski, Cabello, Kaszlikowski, PRL 112, 100401 (2014)", "Wright, Farkas, PRL 131, 220202 (2023)"]}}, {"uid": "GPT:I9", "branch": "GPT", "native_id": "I9", "inputs": ["GPT:s-bound"], "target": "GPT:t-secondlaws", "logic": "single", "kind": "open", "kind_native": "open", "status": "open", "polarity": "open", "t": 1.0, "extra": {"statement": "GAP G8b: thermodynamic signature of bound entanglement (work-extraction gap between bound and separable states under LOCC-thermal constraints) is not characterized.", "refs": ["cf. Oppenheim, Horodecki x3, PRL 89, 180402 (2002)"]}}, {"uid": "GPT:I10", "branch": "GPT", "native_id": "I10", "inputs": ["GPT:m-quantum"], "target": "GPT:e-ctx", "logic": "single", "kind": "witness", "kind_native": "witness", "status": "partial", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Witness infrastructure: failures of noncontextuality are testable by linear programming on accessible GPT fragments, robustly to noise, without incompatibility, without ideal detectors, and (with care) without exact tomographic completeness - 'shadows and subsystems' close the tomographic-incompleteness loophole.", "refs": ["Selby, Wolfe, Schmid, Sainz, Rossi, arXiv:2204.11905", "Selby et al., arXiv:2112.04521", "Mazurek et al., Nat. Commun. 7, ncomms11780 (2016)", "arXiv:2409.13024 (2024)", "Muller, Garner, PRX 13, 041001 (2023)"]}}, {"uid": "GPT:S1", "branch": "GPT", "native_id": "S1", "inputs": ["GPT:s-ent"], "target": "GPT:s-coh", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 2.0, "extra": {"statement": "Entangled implies coherent in EVERY product basis: if rho is diagonal in some product basis then rho = sum p_ij |a_i b_j><a_i b_j|, which is separable. (Coherence is basis-relative; this fixes the correct version of 'entangled states also have coherence'.)", "refs": ["elementary; context: Streltsov, Adesso, Plenio, RMP 89, 041003 (2017)"]}}, {"uid": "GPT:S2", "branch": "GPT", "native_id": "S2", "inputs": ["GPT:s-ent"], "target": "GPT:s-discord", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 2.0, "extra": {"statement": "Entangled implies discordant: zero-discord (classical-classical) states are separable, so every entangled state has nonzero discord on both sides.", "refs": ["Ollivier, Zurek, PRL 88, 017901 (2001)", "Henderson, Vedral, J. Phys. A 34, 6899 (2001)"]}}, {"uid": "GPT:S3", "branch": "GPT", "native_id": "S3", "inputs": ["GPT:s-thermal"], "target": "GPT:s-tts", "logic": "single", "kind": "subset", "kind_native": "subset", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "Gibbs states commute with H: thermal is a strict subcluster of TTS/energy-diagonal (TTS also contains diagonal athermal states).", "refs": ["definitional"]}}, {"uid": "GPT:S4", "branch": "GPT", "native_id": "S4", "inputs": ["GPT:s-cohE"], "target": "GPT:s-coh", "logic": "single", "kind": "subset", "kind_native": "subset", "status": "theorem", "polarity": "structural", "t": 2.0, "extra": {"statement": "Energy coherence is basis coherence w.r.t. the energy eigenbasis, and equals asymmetry under the time-translation group (unspeakable coherence); asymmetry monotones, not functions of diagonal populations, quantify it.", "refs": ["Marvian, Spekkens, Nat. Commun. 5, 3821 (2014)", "Marvian, Spekkens, PRA 94, 052324 (2016)"]}}, {"uid": "GPT:S5", "branch": "GPT", "native_id": "S5", "inputs": ["GPT:s-wneg"], "target": "GPT:s-magic", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 2.0, "extra": {"statement": "Odd d: Wigner-negative implies non-stabilizer (stabilizer states have nonnegative Gross-Wigner). Converse FAILS: bound magic states are Wigner-positive yet non-stabilizer (the Wigner polytope strictly contains the stabilizer polytope).", "refs": ["Gross, J. Math. Phys. 47, 122107 (2006)", "Veitch, Ferrie, Gross, Emerson, NJP 14, 113011 (2012)"]}}, {"uid": "GPT:S6", "branch": "GPT", "native_id": "S6", "inputs": ["GPT:s-gauss"], "target": "GPT:s-wneg", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 2.0, "extra": {"statement": "Hudson's theorem: a PURE state has nonnegative Wigner function iff it is Gaussian; so pure non-Gaussian implies Wigner-negative. Mixed non-Gaussian Wigner-positive states exist, so the clusters differ only on mixtures.", "refs": ["Hudson, Rep. Math. Phys. 6, 249 (1974)", "Soto, Claverie, J. Math. Phys. 24, 97 (1983)"]}}, {"uid": "GPT:S7", "branch": "GPT", "native_id": "S7", "inputs": ["GPT:s-zerodisc"], "target": "GPT:s-sep", "logic": "single", "kind": "subset", "kind_native": "subset", "status": "theorem", "polarity": "structural", "t": 2.0, "extra": {"statement": "Classical-classical (zero-discord) states are diagonal in a product basis, hence separable; the inclusion is strict (generic separable states are discordant).", "refs": ["Ferraro et al., PRA 81, 052318 (2010)"]}}, {"uid": "GPT:S8", "branch": "GPT", "native_id": "S8", "inputs": ["GPT:s-thermal"], "target": "GPT:s-cohE", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "definition", "polarity": "no_go", "t": 2.0, "extra": {"statement": "Thermal states carry zero energy coherence ([gamma, H] = 0): the state-side resource for thermodynamic contextuality witnesses is absent by definition.", "refs": ["definitional"]}}, {"uid": "GPT:S9", "branch": "GPT", "native_id": "S9", "inputs": ["GPT:s-stab"], "target": "GPT:s-wneg", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 2.0, "extra": {"statement": "Odd-d stabilizer states (and their convex hull) have nonnegative discrete Wigner function: the negativity witness is blind on this whole cluster.", "refs": ["Gross, J. Math. Phys. 47, 122107 (2006)"]}}, {"uid": "GPT:S10", "branch": "GPT", "native_id": "S10", "inputs": ["GPT:s-bound"], "target": "GPT:s-ent", "logic": "single", "kind": "subset", "kind_native": "subset", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "Bound (PPT) entangled states are a subcluster of entangled states on which the PPT test is blind and distillation fails.", "refs": ["Horodecki, Horodecki, Horodecki, PRL 80, 5239 (1998)"]}}, {"uid": "GPT:P1", "branch": "GPT", "native_id": "P1", "inputs": ["GPT:p-thermalops"], "target": "GPT:p-cov", "logic": "single", "kind": "subset", "kind_native": "subset", "status": "theorem", "polarity": "structural", "t": 2.0, "extra": {"statement": "Thermal operations are time-translation covariant (and Gibbs-preserving): TO is a strict subset of the covariant channels.", "refs": ["Lostaglio, Jennings, Rudolph, Nat. Commun. 6, 6383 (2015)", "Lostaglio, Rep. Prog. Phys. 82, 114001 (2019)"]}}, {"uid": "GPT:P2", "branch": "GPT", "native_id": "P2", "inputs": ["GPT:p-cov"], "target": "GPT:s-cohE", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 2.0, "extra": {"statement": "Covariant (TTS) processes cannot create energy coherence/asymmetry: asymmetry monotones are non-increasing. The process cluster can only hide, never generate, the state-side resource.", "refs": ["Marvian, Spekkens, Nat. Commun. 5, 3821 (2014)"]}}, {"uid": "GPT:P3", "branch": "GPT", "native_id": "P3", "inputs": ["GPT:p-locc"], "target": "GPT:s-ent", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 2.0, "extra": {"statement": "LOCC / non-entangling operations cannot create entanglement; entanglement monotones are non-increasing under them.", "refs": ["Horodecki x4, RMP 81, 865 (2009)"]}}, {"uid": "GPT:P4", "branch": "GPT", "native_id": "P4", "inputs": ["GPT:p-incoh"], "target": "GPT:s-coh", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 2.0, "extra": {"statement": "Incoherent (and dephasing-covariant) operations cannot create basis coherence; coherence monotones are non-increasing.", "refs": ["Baumgratz, Cramer, Plenio, PRL 113, 140401 (2014)"]}}, {"uid": "GPT:P5", "branch": "GPT", "native_id": "P5", "inputs": ["GPT:p-clifford"], "target": "GPT:p-unitary", "logic": "single", "kind": "subset", "kind_native": "subset", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "Clifford unitaries and Gaussian unitaries are subgroups of the unitary dynamics; both are the free reversible operations of their resource theories.", "refs": ["definitional"]}}, {"uid": "GPT:P6", "branch": "GPT", "native_id": "P6", "inputs": ["GPT:p-clifford"], "target": "GPT:t-mbqc", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 2.0, "extra": {"statement": "Stabilizer circuits (Clifford + Pauli measurements on stabilizer inputs) are efficiently classically simulable: the free process cluster alone cannot produce quantum-computational advantage; universality requires injecting the magic cluster.", "refs": ["Gottesman, quant-ph/9807006", "Aaronson, Gottesman, PRA 70, 052328 (2004)", "Veitch et al., NJP 14, 113011 (2012) (odd d)"]}}, {"uid": "GPT:P7", "branch": "GPT", "native_id": "P7", "inputs": ["GPT:p-filter"], "target": "GPT:e-bell", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 2.0, "extra": {"statement": "Local filters activate hidden nonlocality: states with LHV models for unfiltered measurements violate CHSH after SLOCC postselection.", "refs": ["Popescu, PRL 74, 2619 (1995)", "Gisin, Phys. Lett. A 210, 151 (1996)", "Hirsch et al., PRL 111, 160402 (2013)", "Hirsch, Quintino, Bowles, Brunner, PRL 111, 160402 (2013): states with LHV models for ALL POVMs (single copy) whose filtered versions violate CHSH ('genuine hidden nonlocality')"]}}, {"uid": "GPT:P8", "branch": "GPT", "native_id": "P8", "inputs": ["GPT:p-projE"], "target": "GPT:e-kd", "logic": "single", "kind": "hides", "kind_native": "hides", "status": "theorem", "polarity": "no_go", "t": 2.0, "extra": {"statement": "The TPM scheme's first projective energy measurement dephases all input energy coherence: TPM statistics coincide with those of the dephased state, so KD/work negativity and any coherence signal are erased before readout. This is the no-go forcing quasiprobabilities or protocol changes for coherent work statistics.", "refs": ["Perarnau-Llobet, Baumer, Hovhannisyan, Huber, Acin, PRL 118, 070601 (2017)"]}}, {"uid": "GPT:P9", "branch": "GPT", "native_id": "P9", "inputs": ["GPT:p-weak"], "target": "GPT:e-kd", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 2.0, "extra": {"statement": "Weak (and direct) measurement sequences read out KD distributions and weak values without destroying the probed coherence: the process cluster that reveals what TPM hides.", "refs": ["Aharonov, Albert, Vaidman, PRL 60, 1351 (1988)", "Lundeen et al., Nature 474, 188 (2011)"]}}, {"uid": "GPT:P10", "branch": "GPT", "native_id": "P10", "inputs": ["GPT:p-gaussU"], "target": "GPT:s-wneg", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 2.0, "extra": {"statement": "Gaussian operations preserve Wigner positivity: negativity cannot be generated inside the Gaussian process cluster (it is the free cluster of non-Gaussianity resource theories).", "refs": ["Takagi, Zhuang, PRA 97, 062337 (2018)", "Albarelli, Genoni, Serafini, Ferraro, PRA 98, 052350 (2018)"]}}, {"uid": "GPT:P11", "branch": "GPT", "native_id": "P11", "inputs": ["GPT:p-nongauss"], "target": "GPT:s-wneg", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 2.0, "extra": {"statement": "Non-Gaussian operations (cubic-or-higher generators, photon counting) generate Wigner negativity and are required for CV universality - the process-side face of the Moyal lift (GN5).", "refs": ["Lloyd, Braunstein, PRL 82, 1784 (1999)"]}}, {"uid": "GPT:N1", "branch": "GPT", "native_id": "N1", "inputs": ["GPT:p-cov"], "target": "GPT:e-ctx", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "derived", "polarity": "no_go", "t": 2.0, "extra": {"statement": "PROPOSITION N1 (this work; proof in catalog): for nondegenerate H, any fragment whose transformations are covariant and whose effects are TTS ([E,H]=0) has statistics invariant under pre-dephasing of the input - Tr(E T(rho)) = Tr(E T(D(rho))) - so it factors through the commutative energy-diagonal subtheory and is simplex-embeddable: noncontextual, KD-positive, coherence-blind for EVERY input state, coherent ones included. TTS processes do not lack contextuality; they HIDE it. Special case: TPM fluctuation theorems are noncontextual (Lostaglio). Caveat: for degenerate H the fragment retains full quantum blocks and can stay contextual (H proportional to identity makes every process covariant). CONVERSE (U1, round 4): the restriction to nondegenerate H is sharp - for any H the covariant/TTS fragment sees only D(rho) and is operationally the direct sum of quantum theories on the eigenspaces of H with a classical label; it admits a noncontextual model iff every eigenspace is one-dimensional. Scope (C7): the noncontextuality claim holds under the tomographically complete convention for operational equivalence, or with ALL TTS effects in the fragment.", "refs": ["derived (catalog v2, N1)", "special case: Lostaglio, PRL 120, 040602 (2018)", "adjacent: arXiv:2605.09558 (contextuality dissipating under decoherence)"]}}, {"uid": "GPT:N2", "branch": "GPT", "native_id": "N2", "inputs": ["GPT:s-thermal"], "target": "GPT:e-ks", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 2.0, "extra": {"statement": "PROPOSITION N2 (assembled): every state - thermal and maximally mixed included - violates state-independent contextuality inequalities (Peres-Mermin via Cabello's inequality; Yu-Oh 13 rays for the qutrit). So no state cluster is blind for contextuality: the contextual resource can sit entirely on the measurement side. Corollary of N1: any such SI witness set necessarily contains non-TTS measurements when H is nondegenerate. This makes precise the intuition 'TTS/thermal states may correspond to contextuality, while TTS processes hide it'.", "refs": ["Cabello, PRL 101, 210401 (2008)", "Yu, Oh, PRL 108, 030402 (2012)", "Mermin, PRL 65, 3373 (1990); Peres, J. Phys. A 24, L175 (1991)", "corollary: N1"]}}, {"uid": "GPT:W1", "branch": "GPT", "native_id": "W1", "inputs": ["GPT:w-bell"], "target": "GPT:e-bell", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "CHSH functional detects Bell nonlocality at threshold 2; the SAME functional detects the quantum boundary at 2*sqrt(2) (Tsirelson) and PR correlations at 4 - witness-effect pairing is 1-1 up to threshold stratification.", "refs": ["Clauser, Horne, Shimony, Holt, PRL 23, 880 (1969)", "Tsirelson, Lett. Math. Phys. 4, 93 (1980)", "Popescu, Rohrlich, Found. Phys. 24, 379 (1994)"]}}, {"uid": "GPT:W1b", "branch": "GPT", "native_id": "W1b", "inputs": ["GPT:w-bell"], "target": "GPT:e-pr", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "PR correlations are detected by the same CHSH functional at its algebraic maximum 4: the recorded exception to strict 1-1 pairing (threshold stratification).", "refs": ["Popescu, Rohrlich, Found. Phys. 24, 379 (1994)"]}}, {"uid": "GPT:W2", "branch": "GPT", "native_id": "W2", "inputs": ["GPT:w-steer"], "target": "GPT:e-steer", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "Steering inequalities / the LHS-membership SDP detect steering; for finite assemblages the test is complete.", "refs": ["Cavalcanti, Skrzypczyk, Rep. Prog. Phys. 80, 024001 (2017)"]}}, {"uid": "GPT:W3", "branch": "GPT", "native_id": "W3", "inputs": ["GPT:w-incomp"], "target": "GPT:e-incomp", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "The joint-measurability SDP decides incompatibility of any finite measurement set; incompatibility robustness quantifies it.", "refs": ["Designolle, Farkas, Kaniewski, NJP 21, 113053 (2019)"]}}, {"uid": "GPT:W4", "branch": "GPT", "native_id": "W4", "inputs": ["GPT:w-entw"], "target": "GPT:s-ent", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "Entanglement witnesses detect the entangled cluster; complete by Hahn-Banach but not efficiently (separability NP-hard; the PPT test is blind exactly on the bound cluster).", "refs": ["Horodecki x3, Phys. Lett. A 223, 1 (1996)", "Terhal, Phys. Lett. A 271, 319 (2000)", "Gurvits, STOC 2003"]}}, {"uid": "GPT:W5", "branch": "GPT", "native_id": "W5", "inputs": ["GPT:w-ncineq"], "target": "GPT:e-ctx", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "Noncontextuality inequalities / the simplex-embedding LP detect generalized contextuality of an accessible fragment; the LP form is complete for finite fragments.", "refs": ["Schmid, Selby, Wolfe, Kunjwal, Spekkens, PRX Quantum 2, 010331 (2021)", "Selby, Wolfe, Schmid, Sainz, Rossi, arXiv:2204.11905"]}}, {"uid": "GPT:W6", "branch": "GPT", "native_id": "W6", "inputs": ["GPT:w-sic"], "target": "GPT:e-ks", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "State-independent KS operator sets detect state-independent contextuality: the NC bound is violated by every state of the system.", "refs": ["Cabello, PRL 101, 210401 (2008)", "Yu, Oh, PRL 108, 030402 (2012)"]}}, {"uid": "GPT:W7", "branch": "GPT", "native_id": "W7", "inputs": ["GPT:w-kcbs"], "target": "GPT:e-ksdep", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "The KCBS pentagon (and CSW graph generalizations) detect state-dependent KS contextuality; the maximally mixed state does not violate it.", "refs": ["Klyachko, Can, Binicioglu, Shumovsky, PRL 101, 020403 (2008)", "Cabello, Severini, Winter, PRL 112, 040401 (2014)"]}}, {"uid": "GPT:W8", "branch": "GPT", "native_id": "W8", "inputs": ["GPT:w-wig"], "target": "GPT:s-wneg", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "The displaced-parity estimator measures W(alpha) directly (CV); phase-point operators do the same in odd d: the canonical negativity witness.", "refs": ["Royer, PRA 15, 449 (1977)", "Banaszek, Wodkiewicz, PRA 58, 4345 (1998)", "Gross, J. Math. Phys. 47, 122107 (2006)"]}}, {"uid": "GPT:W9", "branch": "GPT", "native_id": "W9", "inputs": ["GPT:w-kd"], "target": "GPT:e-kd", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "Weak-then-strong (direct) measurement reconstructs the KD distribution; its negativity/imaginarity is the detected effect. Imaginary parts exist only because of the complex structure (ax-complex).", "refs": ["Kirkwood, Phys. Rev. 44, 31 (1933)", "Dirac, Rev. Mod. Phys. 17, 195 (1945)", "Lundeen et al., Nature 474, 188 (2011)"]}}, {"uid": "GPT:W10", "branch": "GPT", "native_id": "W10", "inputs": ["GPT:w-weakval"], "target": "GPT:e-weak", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "The postselected weak-measurement protocol detects anomalous weak values; each anomaly is a proof of contextuality (C10).", "refs": ["Aharonov, Albert, Vaidman, PRL 60, 1351 (1988)", "Pusey, PRL 113, 200401 (2014)"]}}, {"uid": "GPT:W11", "branch": "GPT", "native_id": "W11", "inputs": ["GPT:w-workq"], "target": "GPT:e-heat", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "Work-quasiprobability protocols detect anomalous work/heat statistics; negativity of the work quasiprobability certifies contextuality of the protocol (G4).", "refs": ["Allahverdyan, PRE 90, 032137 (2014)", "Lostaglio, PRL 120, 040602 (2018)"]}}, {"uid": "GPT:W12", "branch": "GPT", "native_id": "W12", "inputs": ["GPT:w-magicw"], "target": "GPT:s-magic", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "Magic monotones (robustness, mana, stabilizer extent) witness non-stabilizerness; mana is blind on the Wigner-positive bound-magic subcluster, robustness is not.", "refs": ["Veitch, Mousavian, Gottesman, Emerson, NJP 16, 013009 (2014)", "Howard, Campbell, PRL 118, 090501 (2017)"]}}, {"uid": "GPT:W13", "branch": "GPT", "native_id": "W13", "inputs": ["GPT:w-cohw"], "target": "GPT:s-coh", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "Coherence monotones and event-graph inequalities witness (set) coherence; visibility-based versions witness it in interferometric fragments.", "refs": ["Baumgratz, Cramer, Plenio, PRL 113, 140401 (2014)", "Wagner, Camillini, Galvao, Quantum 8, 1240 (2024)"]}}, {"uid": "GPT:W14", "branch": "GPT", "native_id": "W14", "inputs": ["GPT:w-discw"], "target": "GPT:s-discord", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "The local-broadcasting test detects discord: local broadcastability holds iff discord vanishes.", "refs": ["Piani, Horodecki, Horodecki, PRL 100, 090502 (2008)"]}}, {"uid": "GPT:W15", "branch": "GPT", "native_id": "W15", "inputs": ["GPT:w-clone"], "target": "GPT:e-nobc", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "Cloning-fidelity bounds operationalize no-broadcasting: the certified impossibility of universal cloning above 5/6 (qubits) is the witness; commuting families remain broadcastable.", "refs": ["Buzek, Hillery, PRA 54, 1844 (1996)", "Gisin, Massar, PRL 79, 2153 (1997)", "Barnum et al., PRL 76, 2818 (1996)"]}}, {"uid": "GPT:W16", "branch": "GPT", "native_id": "W16", "inputs": ["GPT:w-vis"], "target": "GPT:e-interf2", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "Fringe visibility detects two-path interference, with the duality bound V^2 + D^2 <= 1. Caveat D3: this witness does NOT separate quantum from epistricted-classical - it detects the phenomenology, not nonclassicality.", "refs": ["Greenberger, Yasin, Phys. Lett. A 128, 391 (1988)", "Englert, PRL 77, 2154 (1996)", "Catani et al., Quantum 7, 1119 (2023)"]}}, {"uid": "GPT:W17", "branch": "GPT", "native_id": "W17", "inputs": ["GPT:w-sorkin"], "target": "GPT:e-interf3", "logic": "single", "kind": "pairs", "kind_native": "pairs", "status": "definition", "polarity": "structural", "t": 2.0, "extra": {"statement": "The Sorkin I3 estimator detects higher-order interference; in quantum theory it is identically zero, so experimentally it is a null test bounding deviations (and the witness that would falsify ax-sorkin).", "refs": ["Sorkin, Mod. Phys. Lett. A 9, 3119 (1994)", "Sinha et al., Science 329, 418 (2010)"]}}, {"uid": "GPT:U1", "branch": "GPT", "native_id": "U1", "inputs": ["GPT:p-cov"], "target": "GPT:e-ctx", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "derived", "polarity": "possibility", "t": 2.6, "extra": {"statement": "THEOREM U1 (combined paper, round 4; closes SG1): for ANY finite-dimensional H, the fragment of all preparations, covariant transformations T and TTS effects E has statistics Tr(E T(rho)) = Tr(E T(D(rho))) (the N1 identity needs no nondegeneracy), so it is operationally the direct sum over eigenspaces H_k of quantum theory on H_k, with a classical label k. Hence it admits a generalized-noncontextual model iff every eigenspace is one-dimensional (N1). If some eigenspace has dimension >= 2 the fragment is preparation-contextual already with T = id: six pure states at 60-degree spacing on a great circle of a two-dimensional subspace of the eigenspace, and the three TTS projective measurements formed by their antipodal pairs (completed by the projector onto the complement), violate P(a != c) <= P(a != b) + P(b != c) for the three binary variables that a preparation-noncontextual model must assign (quantum: 3/4 <= 1/4 + 1/4). What survives time-translation symmetry is exactly the contextuality of quantum theory on the largest degenerate eigenspace, and nothing across eigenspaces. Literature search 2026-11-01: no prior statement found (the ingredients - the dephasing identity and the six-state preparation-contextuality proof - are standard).", "refs": ["derived (combined paper, Sec. 8, round 4)", "six-state proof: Spekkens, PRA 71, 052108 (2005); Mazurek, Pusey, Kunjwal, Resch, Spekkens, Nat. Commun. 7, 11780 (2016)", "sharpens N1"]}}, {"uid": "GPT:U2", "branch": "GPT", "native_id": "U2", "inputs": ["GPT:p-filter"], "target": "GPT:e-ctx", "logic": "single", "kind": "not_implies", "kind_native": "not_implies", "status": "derived", "polarity": "no_go", "t": 2.6, "extra": {"statement": "THEOREM U2 (combined paper, round 4; closes SG5 at the level of models): local filters cannot create or destroy the generalized contextuality of a prepare-measure scenario that contains ALL measurements. Precisely: for a convex set S of states and an invertible operator A, the scenario (S, all POVMs) admits a preparation-and-measurement noncontextual model iff ({A s A*/Tr(A s A*) : s in S}, all POVMs) does; the model transforms by mu'(lambda) = mu(lambda) xi_{A*A}(lambda)/Tr(A*A s) and xi'_M = xi_{A*MA}/xi_{A*A}. Consequently the contextuality of the remote-preparation scenario Lambda_A(rho_AB) with all measurements (A8/R3) is invariant under invertible local filters on either party, whereas Bell nonlocality is not (P7; Hirsch et al. 2013: states local for all POVMs become CHSH-violating after invertible filters). For those states the remote-preparation scenario is contextual before and after filtering (A8): the hidden nonlocality is visible as contextuality without any filter. Filters CAN change which fixed witness detects the contextuality and by how much (Kumari and Patra 2025, PORAC witness) - that is the only form of 'hidden contextuality activation' that remains possible (SG7). Literature search 2026-11-01: invariance statement not found.", "refs": ["derived (combined paper, Sec. 8, round 4)", "Hirsch, Quintino, Bowles, Brunner, PRL 111, 160402 (2013)", "Kumari, Patra, arXiv:2504.18045 (witness-level activation)", "Plavala, Guhne, PRL 132, 100201 (2024), Thm. 1"]}}, {"uid": "GPT:U3", "branch": "GPT", "native_id": "U3", "inputs": ["GPT:m-stab-odd"], "target": "GPT:e-steer", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "derived", "polarity": "possibility", "t": 2.6, "extra": {"statement": "PROPOSITION U3 (combined paper, round 4): the odd-dimensional stabilizer subtheory exhibits EPR steering with respect to quantum local hidden states, although it is noncontextual (C5). Witness: the maximally entangled stabilizer state |Phi_d> = d^{-1/2} sum_j |jj>, Alice's Z and X (Fourier) measurements, Bob's projectors onto the Z and X eigenstates; the functional S = sum_a Tr[sigma_{a|Z} |a><a|] + sum_b Tr[sigma_{b|X} |x_{-b}><x_{-b}|] equals 2, while every assemblage with a local-hidden-state model (hidden states arbitrary quantum states) has S <= 1 + 1/sqrt(d) (largest eigenvalue of the sum of two projectors with overlap 1/sqrt(d)). All objects used are stabilizer objects. Hence steering is present in a discrete-variable noncontextual quantum subtheory, the DV companion of F2 (Gaussian QM), and P4(a) holds with a DV example. The nonnegative Gross representation is itself a local-hidden-state model whose hidden states are phase-space points, not quantum states: the steering of the subtheory is relative to the class of hidden states allowed. Literature search 2026-11-01: not found in this form (the two-basis steering of maximally entangled states is standard).", "refs": ["derived (combined paper, Sec. 8, round 4)", "Gross, J. Math. Phys. 47, 122107 (2006)", "Schmid, Du, Selby, Pusey, PRL 129, 120403 (2022)", "Wiseman, Jones, Doherty, PRL 98, 140402 (2007)"]}}, {"uid": "GPT:U4", "branch": "GPT", "native_id": "U4", "inputs": ["GPT:s-tts"], "target": "GPT:s-magic", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "derived", "polarity": "no_go", "t": 2.6, "extra": {"statement": "PROPOSITION U4 (combined paper, round 4): the TTS cluster contains no magic state iff H is nondegenerate and every eigenvector of H is a stabilizer state. (Nondegenerate H: TTS states are mixtures of the eigenprojectors; if all eigenvectors are stabilizer states these lie in STAB, and if one eigenvector is not, its projector is a TTS magic state. Degenerate H: an eigenspace of dimension >= 2 contains a continuum of pure states and only finitely many stabilizer states, so it contains TTS magic states.) Literature search 2026-11-01: not found.", "refs": ["derived (combined paper, Sec. 8, round 4)"]}}, {"uid": "GPT:U5", "branch": "GPT", "native_id": "U5", "inputs": ["GPT:p-cov"], "target": "GPT:s-magic", "logic": "single", "kind": "hides", "kind_native": "hides", "status": "derived", "polarity": "no_go", "t": 2.6, "extra": {"statement": "PROPOSITION U5 (combined paper, round 4): for H nondegenerate with a stabilizer eigenbasis, covariant transformations with TTS effects see only D(rho), which lies in STAB for every rho (U4); so no magic witness built from TTS effects and covariant pre-processing can certify the magic of any state, even though covariant dynamics creates magic: for H = Z on one qubit, exp(-i H pi/8) is the T gate, covariant, and maps the stabilizer state |+> to a magic state. Covariant processes create magic that covariant probes cannot see. For thermal operations (a subclass) the quantitative conditions for magic generation from stabilizer inputs are in de Oliveira Junior et al. 2025 (U5b). Literature search 2026-11-01: blindness statement not found.", "refs": ["derived (combined paper, Sec. 8, round 4)", "N1 identity", "T gate: Bravyi, Kitaev, PRA 71, 022316 (2005)"]}}, {"uid": "GPT:U5b", "branch": "GPT", "native_id": "U5b", "inputs": ["GPT:p-thermalops"], "target": "GPT:s-magic", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 2.6, "extra": {"statement": "LITERATURE FILL (round 4): thermal operations can generate nonstabiliserness from a stabiliser input. For a qubit prepared in a stabiliser state and coupled to a heat bath, de Oliveira Junior et al. give a necessary and sufficient condition (a witness M(rho) > 1), an analytic characterisation of the reachable nonstabiliser states with quantitative bounds on their nonstabiliserness, the Hamiltonians that maximise generation, and the critical temperatures at which it emerges; for energy-diagonal inputs, if H is aligned with a pure stabiliser direction no magic state is generated (consistent with U4; for a coherent stabiliser input no such statement holds, since exp(-iZ pi/8), itself a thermal operation, creates magic: U5(ii)). The Gibbs-state statement QP5 of the resource network lies within this question, because complete thermalisation is a thermal operation: the Gibbs state of H = -(omega/2) n.sigma with n = (1,1,1)/sqrt(3) has Bloch vector tanh(beta omega/2) n and is a magic state iff tanh(beta omega/2) > 1/sqrt(3) (elementary; not found in explicit form in the cited preprint).", "refs": ["de Oliveira Junior, Macedo, Czartowski, Brask, Chaves, Trading athermality for nonstabiliserness, arXiv:2511.13839 (2025) [verified: arXiv record checked 2026-11-01; journal version not checked]"]}}, {"uid": "GPT:U6", "branch": "GPT", "native_id": "U6", "inputs": ["GPT:s-zerodisc"], "target": "GPT:e-ctx", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 2.6, "extra": {"statement": "LITERATURE FILL with direct proof (round 4): if rho_AB is classical on the steered side A, rho = sum_i p_i |i><i| x tau_i with orthonormal |i>, then every remotely preparable state Tr_B[(1 x E_B) rho] is diagonal in {|i>}, so the remote-preparation scenario with all measurements has, under the tomographically complete convention for operational equivalence, an EXACT preparation-and-measurement noncontextual model (the model of P2/D2); in particular for all classical-classical states. This is the case of Plavala-Guhne Theorem 2 in which the B-side operators of the decomposition lie in the span of Lambda_B(rho); it is exact, whereas their Theorem 3 for general separable states is only robust, and their Eq. (4) is a separable state whose scenario is contextual.", "refs": ["Plavala, Guhne, PRL 132, 100201 (2024), Thm. 2", "direct proof: combined paper, Sec. 8, round 4"]}}, {"uid": "GPT:U7", "branch": "GPT", "native_id": "U7", "inputs": ["GPT:s-discord"], "target": "GPT:e-ctx", "logic": "single", "kind": "not_implies", "kind_native": "not_implies", "status": "counterexample", "polarity": "no_go", "t": 2.6, "extra": {"statement": "PROPOSITION U7 (combined paper, round 4): among separable states (tomographically complete convention), contextuality of the remote-preparation scenario (all measurements) is a property of the steered side's nonclassicality, not of the correlations: it REQUIRES discord on the steered side (contrapositive of U6) but discord on the steered side does not suffice. Counterexample: rho = (1/2)(|0><0| x |0><0| + |+><+| x |1><1|) is discordant on A, and Lambda_A(rho) is the segment between |0><0| and |+><+|, whose scenario with all measurements is simplex-embeddable (every state of the segment is a unique mixture of the endpoints; the map e -> (e(psi_0), e(psi_+)) embeds the effects), hence noncontextual. Sufficiency can hold: Plavala-Guhne's separable state (1/4) sum over {0,1,+,-} of |k><k| x |k'><k'| has Lambda_A = conv{0,1,+,-}, which is preparation-contextual with all measurements (encode 00,11,01,10 as 0,1,+,-: parity-oblivious; measuring (Z+-X)/sqrt2 succeeds with cos^2(pi/8) > 3/4, the preparation-noncontextual bound of the 2-bit parity-oblivious multiplexing game). Literature search 2026-11-01: the characterization not found; new gap SG6.", "refs": ["derived (combined paper, Sec. 8, round 4)", "Plavala, Guhne, PRL 132, 100201 (2024), Eq. (4)", "Spekkens, Buzacott, Keehn, Toner, Pryde, PRL 102, 010401 (2009)"]}}, {"uid": "QRT:MM1", "branch": "QRT", "native_id": "MM1", "inputs": ["QRT:m-asy"], "target": "QRT:m-coh", "logic": "single", "kind": "specializes", "kind_native": "specializes", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "Unspeakable coherence w.r.t. the eigenbasis of an observable = asymmetry under the translation group it generates; the asymmetry theory (TIO for U(1)) is the physically justified coherence theory.", "refs": ["Marvian, Spekkens, PRA 94, 052324 (2016) [verified]"], "via": null}}, {"uid": "QRT:MM2", "branch": "QRT", "native_id": "MM2", "inputs": ["QRT:m-coh"], "target": "QRT:m-asy", "logic": "single", "kind": "distinct", "kind_native": "distinct", "status": "theorem", "polarity": "no_go", "t": 1.1, "extra": {"statement": "Speakable coherence (IO/MIO) is NOT asymmetry: measures of speakable coherence are a proper subset of measures of asymmetry; IO and TIO are inequivalent classes and the IO/MIO framework lacks a symmetry justification.", "refs": ["Marvian, Spekkens, Zanardi, PRA 93, 052331 (2016) [verified]", "Marvian, Spekkens, PRA 94, 052324 (2016) [verified]"], "via": null}}, {"uid": "QRT:MM3", "branch": "QRT", "native_id": "MM3", "inputs": ["QRT:m-ath"], "target": "QRT:F-TYPE", "logic": "single", "kind": "satisfies", "kind_native": "satisfies", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "Athermality = constraint (Gibbs preservation) x symmetry (U(1)-covariance): its second-law constraints factor into free-energy monotones (block-diagonal data) + asymmetry-mode constraints (coherences); neither family alone is complete.", "refs": ["Lostaglio, Korzekwa, Jennings, Rudolph, PRX 5, 021001 (2015) [verified]", "Brandao et al., PNAS 112, 3275 (2015) [knowledge]"], "via": null}}, {"uid": "QRT:MM4", "branch": "QRT", "native_id": "MM4", "inputs": ["QRT:m-ath"], "target": "QRT:m-pur", "logic": "single", "kind": "specializes", "kind_native": "specializes", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "Trivial Hamiltonian limit: Gibbs -> I/d, thermal ops -> noisy ops; purity/nonuniformity is athermality with H proportional to I.", "refs": ["Gour et al., Phys. Rep. 583, 1 (2015) [knowledge]"], "via": null}}, {"uid": "QRT:MM5", "branch": "QRT", "native_id": "MM5", "inputs": ["QRT:m-ima"], "target": "QRT:m-coh", "logic": "single", "kind": "distinct", "kind_native": "distinct", "status": "derived", "polarity": "structural", "t": 1.1, "extra": {"statement": "Imaginarity is the Z2/antiunitary analogue of coherence (free = conjugation-invariant vs dephasing-invariant); it is NOT a G-covariance theory because complex conjugation is not a channel.", "refs": ["Hickey, Gour, J. Phys. A 51, 414009 (2018) [knowledge]"], "via": null}}, {"uid": "QRT:MM6", "branch": "QRT", "native_id": "MM6", "inputs": ["QRT:m-nga"], "target": "QRT:m-mag", "logic": "single", "kind": "equiv", "kind_native": "equiv", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "CV/DV twins: in odd d, mana(rho) = 0 iff discrete-Wigner-positive; in CV, Wigner positivity defines the simulable free cone. Same quasiprobability mechanism, different phase spaces.", "refs": ["Veitch et al., NJP 14, 113011 (2012) [knowledge]", "Mari, Eisert, PRL 109, 230503 (2012) [knowledge]"], "via": null}}, {"uid": "QRT:MM7", "branch": "QRT", "native_id": "MM7", "inputs": ["QRT:m-ent"], "target": "QRT:m-nlo", "logic": "single", "kind": "distinct", "kind_native": "distinct", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "One ladder, three theories: tightening LOCC to 1W-LOCC gives steering, to LOSR gives nonlocality. LOCC is the WRONG free-op class for Bell scenarios; LOSR-entanglement is the resource relevant to nonlocality.", "refs": ["Gallego, Aolita, PRX 5, 041008 (2015) [knowledge]", "Wolfe et al., Quantum 4, 280 (2020) [verified]", "Schmid, Selby, Wolfe, Spekkens, arXiv:1911.12462 [verify published venue]"], "via": null}}, {"uid": "QRT:MM8", "branch": "QRT", "native_id": "MM8", "inputs": ["QRT:m-ctx"], "target": "QRT:m-nlo", "logic": "single", "kind": "contains", "kind_native": "contains", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "Bell scenarios are contextuality scenarios with spacelike contexts; NCW give a unified resource framework. Caveat: NCW restricted to Bell scenarios is NOT equivalent to LOSR (P6).", "refs": ["Amaral et al., PRL 120, 130403 (2018) [verified]", "Santos, Wagner, Amaral, arXiv:2407.02120 [verified]"], "via": null}}, {"uid": "QRT:MM9", "branch": "QRT", "native_id": "MM9", "inputs": ["QRT:m-dis"], "target": "QRT:F-CONVEX", "logic": "single", "kind": "violates", "kind_native": "violates", "status": "counterexample", "polarity": "no_go", "t": 1.1, "extra": {"statement": "The set of classical-classical states is non-convex (mixing classical states of different bases yields discordant states): the convexity axiom fails for discord.", "refs": ["Modi et al., RMP 84, 1655 (2012) [knowledge]"], "via": null}}, {"uid": "QRT:MM10", "branch": "QRT", "native_id": "MM10", "inputs": ["QRT:m-dis"], "target": "QRT:F-QRT", "logic": "single", "kind": "violates", "kind_native": "violates", "status": "counterexample", "polarity": "no_go", "t": 1.1, "extra": {"statement": "Golden-rule failure: local channels can create discord from classical states, so no free-op class containing local processing exists.", "refs": ["Ciccarello, Giovannetti, PRA 85, 010102(R) (2012) [verify]", "Hu et al., PRA 85, 032102 (2012) [verify]"], "via": null}}, {"uid": "QRT:MM11", "branch": "QRT", "native_id": "MM11", "inputs": ["QRT:F-STEIN"], "target": "QRT:p-rng", "logic": "single", "kind": "reversible", "kind_native": "reversible", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Second law restored: under ASYMPTOTICALLY resource-non-generating operations every theory meeting the Brandao-Plenio axioms is reversible, with unique rate function = regularized relative entropy of resource (generalized quantum Stein lemma, proven 2024 after the 2023 gap).", "refs": ["Hayashi, Yamasaki, arXiv:2408.02722 [verified]", "Lami, arXiv:2408.06410 [verified]", "Berta et al., Quantum 7, 1103 (2023) [verify page]"], "via": null}}, {"uid": "QRT:MM12", "branch": "QRT", "native_id": "MM12", "inputs": ["QRT:pX-ent"], "target": "QRT:F-STEIN", "logic": "single", "kind": "irreversible", "kind_native": "irreversible", "status": "theorem", "polarity": "no_go", "t": 1.1, "extra": {"statement": "The entanglement no-go coexists with the Stein-lemma second law: irreversibility holds under EXACT non-generation, reversibility under ASYMPTOTIC non-generation. The exact/asymptotic frontier is the load-bearing hinge (QG4).", "refs": ["Lami, Regula, Nat. Phys. 19, 184 (2023) [verified]", "Hayashi, Yamasaki, arXiv:2408.02722 [verified]"], "via": null}}, {"uid": "QRT:MM13", "branch": "QRT", "native_id": "MM13", "inputs": ["QRT:F-ADV"], "target": "QRT:w-robust", "logic": "single", "kind": "witness", "kind_native": "witness", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "The advantage axiom instantiates as the robustness-discrimination theorem in every convex theory, and survives (multi-copy form) without convexity - so even discord-type quantumness retains an operational-advantage reading.", "refs": ["Takagi et al., PRL 122, 140402 (2019) [verified]", "Kuroiwa, Takagi, Adesso, Yamasaki [verify venue]"], "via": null}}, {"uid": "QRT:MM14", "branch": "QRT", "native_id": "MM14", "inputs": ["QRT:m-inc"], "target": "QRT:F-QRT", "logic": "single", "kind": "satisfies", "kind_native": "satisfies", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "Incompatibility shows the schema extends from states to devices: free objects are classically programmable devices; complete convertibility conditions exist (guessing games).", "refs": ["Buscemi, Chitambar, Zhou, PRL 124, 120401 (2020) [verified]"], "via": null}}, {"uid": "QRT:SS1", "branch": "QRT", "native_id": "SS1", "inputs": ["QRT:sF-coh"], "target": "QRT:sF-ent", "logic": "single", "kind": "subset", "kind_native": "subset", "status": "derived", "polarity": "structural", "t": 1.1, "extra": {"statement": "Free-set containment: states incoherent in a local PRODUCT basis are diagonal in a product basis, hence separable - INC(product basis) is a strict subset of SEP.", "refs": ["elementary; cf. Streltsov, Adesso, Plenio, RMP 89, 041003 (2017) [knowledge]"], "via": null}}, {"uid": "QRT:SS2", "branch": "QRT", "native_id": "SS2", "inputs": ["QRT:d-maxmix"], "target": "QRT:sF-pur", "logic": "single", "kind": "member_free", "kind_native": "member_free", "status": "derived", "polarity": "structural", "t": 1.1, "extra": {"statement": "I/d is the unique purity-free state and lies in every other free set here (SEP, incoherent, symmetric, real, STAB, Wigner-positive); in athermality it is free only for trivial H.", "refs": ["elementary"], "via": null}}, {"uid": "QRT:SS3", "branch": "QRT", "native_id": "SS3", "inputs": ["QRT:d-gibbs"], "target": "QRT:sR-mag", "logic": "single", "kind": "member_resource", "kind_native": "member_resource", "status": "derived", "polarity": "possibility", "t": 1.1, "extra": {"statement": "QP5 (thermal magic): the Gibbs state of a generic interacting Hamiltonian is NOT in STAB - thermal states generically carry magic while being free for athermality, coherence (energy basis), asymmetry and imaginarity. Free-of-one, resource-of-another in a single physical state.", "refs": ["proof sketch in catalog; no dedicated literature located - flagged as gap QG5"], "via": null}}, {"uid": "QRT:SS3b", "branch": "QRT", "native_id": "SS3b", "inputs": ["QRT:d-gibbs"], "target": "QRT:sF-ath", "logic": "single", "kind": "member_free", "kind_native": "member_free", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "Gamma is the unique free state of athermality, and simultaneously a member of the free sets of coherence (energy basis), asymmetry (U(1)) and imaginarity (energy basis).", "refs": ["elementary"], "via": null}}, {"uid": "QRT:SS4", "branch": "QRT", "native_id": "SS4", "inputs": ["QRT:d-plus"], "target": "QRT:sF-mag", "logic": "single", "kind": "member_free", "kind_native": "member_free", "status": "derived", "polarity": "structural", "t": 1.1, "extra": {"statement": "|+> is a stabilizer state and real: magic-free and imaginarity-free. Hence coherence is NOT sufficient for magic.", "refs": ["elementary"], "via": null}}, {"uid": "QRT:SS4b", "branch": "QRT", "native_id": "SS4b", "inputs": ["QRT:d-plus"], "target": "QRT:sR-coh", "logic": "single", "kind": "member_resource", "kind_native": "member_resource", "status": "derived", "polarity": "structural", "t": 1.1, "extra": {"statement": "|+> is the maximal coherence resource (basis Z), a maximal purity resource, and a U(1)-asymmetry resource (H prop Z) - while sitting inside the magic and imaginarity free sets (SS4).", "refs": ["elementary"], "via": null}}, {"uid": "QRT:SS5", "branch": "QRT", "native_id": "SS5", "inputs": ["QRT:d-bell"], "target": "QRT:sF-mag", "logic": "single", "kind": "member_free", "kind_native": "member_free", "status": "derived", "polarity": "structural", "t": 1.1, "extra": {"statement": "|Phi+> is a stabilizer state and real: maximal entanglement with zero magic and zero imaginarity. STAB is not contained in SEP and SEP is not contained in STAB: free sets cut across one another (SS13).", "refs": ["elementary"], "via": null}}, {"uid": "QRT:SS5b", "branch": "QRT", "native_id": "SS5b", "inputs": ["QRT:d-bell"], "target": "QRT:sR-ent", "logic": "single", "kind": "member_resource", "kind_native": "member_resource", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "|Phi+> is the golden unit of entanglement: maximally entangled, maximally steering-capable, Bell-violating with incompatible measurements.", "refs": ["Horodecki x4, RMP 81, 865 (2009) [knowledge]"], "via": null}}, {"uid": "QRT:SS6", "branch": "QRT", "native_id": "SS6", "inputs": ["QRT:d-werner"], "target": "QRT:sF-nlo", "logic": "single", "kind": "member_free", "kind_native": "member_free", "status": "theorem", "polarity": "no_go", "t": 1.1, "extra": {"statement": "Entangled Werner states admit LHV models (projective: Werner 1989; all POVMs: Barrett 2002) and unsteerable ranges (WJD 2007): entangled yet inside the Bell-local and LHS free sets - the strictness witness for the whole hierarchy.", "refs": ["Werner, PRA 40, 4277 (1989) [knowledge]", "Barrett, PRA 65, 042302 (2002) [knowledge]", "Wiseman, Jones, Doherty, PRL 98, 140402 (2007) [knowledge]"], "via": null}}, {"uid": "QRT:SS7", "branch": "QRT", "native_id": "SS7", "inputs": ["QRT:d-bound"], "target": "QRT:sR-nlo", "logic": "single", "kind": "member_resource", "kind_native": "member_resource", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Some PPT bound entangled states violate a Bell inequality (Peres conjecture false): nonlocality without distillable entanglement.", "refs": ["Vertesi, Brunner, Nat. Commun. 5, 5297 (2014) [verify page]"], "via": null}}, {"uid": "QRT:SS8", "branch": "QRT", "native_id": "SS8", "inputs": ["QRT:d-wpos"], "target": "QRT:sR-mag", "logic": "single", "kind": "member_resource", "kind_native": "member_resource", "status": "theorem", "polarity": "no_go", "t": 1.1, "extra": {"statement": "Bound magic: Wigner-positive non-stabilizer states (odd d) are magic resources by set membership yet undistillable and classically simulable.", "refs": ["Veitch, Ferrie, Gross, Emerson, NJP 14, 113011 (2012) [knowledge]"], "via": null}}, {"uid": "QRT:SS9", "branch": "QRT", "native_id": "SS9", "inputs": ["QRT:d-tstate"], "target": "QRT:sR-mag", "logic": "single", "kind": "member_resource", "kind_native": "member_resource", "status": "derived", "polarity": "possibility", "t": 1.1, "extra": {"statement": "The T state is simultaneously a resource of magic, coherence, purity AND imaginarity - a maximal multi-theory resource on one qubit; its injection yields universality (pU-mag).", "refs": ["elementary; injection: Bravyi, Kitaev, PRA 71, 022316 (2005) [knowledge]"], "via": null}}, {"uid": "QRT:SS10", "branch": "QRT", "native_id": "SS10", "inputs": ["QRT:sR-ste"], "target": "QRT:sR-inc", "logic": "single", "kind": "equiv", "kind_native": "equiv", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "One-to-one mapping: every steering problem is a joint-measurability problem and vice versa; steering monotones double as incompatibility monotones.", "refs": ["Uola, Budroni, Guhne, Pellonpaa, PRL 115, 230402 (2015) [verified]", "Quintino, Vertesi, Brunner, PRL 113, 160402 (2014) [knowledge]"], "via": null}}, {"uid": "QRT:SS11", "branch": "QRT", "native_id": "SS11", "inputs": ["QRT:sF-nlo"], "target": "QRT:F-TENSOR", "logic": "single", "kind": "violates", "kind_native": "violates", "status": "derived", "polarity": "no_go", "t": 1.1, "extra": {"statement": "QP2: at the level of quantum STATES, the Bell-local set is not closed under tensor products - superactivation makes k copies of a local entangled state nonlocal. The tensor axiom fails for state-level locality; resolution: the proper objects are boxes under LOSR, where closure holds.", "refs": ["Palazuelos, PRL 109, 190401 (2012) [knowledge]", "Wolfe et al., Quantum 4, 280 (2020) [verified]"], "via": null}}, {"uid": "QRT:SS12", "branch": "QRT", "native_id": "SS12", "inputs": ["QRT:sF-ath"], "target": "QRT:sF-coh", "logic": "single", "kind": "subset", "kind_native": "subset", "status": "derived", "polarity": "structural", "t": 1.1, "extra": {"statement": "{gamma} is a subset of the incoherent states (energy basis, nondegenerate H): the athermality free set sits inside the coherence free set - any free transformation of coherence theory leaves gamma free.", "refs": ["elementary"], "via": null}}, {"uid": "QRT:SS13", "branch": "QRT", "native_id": "SS13", "inputs": ["QRT:sF-mag"], "target": "QRT:sF-ent", "logic": "single", "kind": "distinct", "kind_native": "distinct", "status": "derived", "polarity": "no_go", "t": 1.1, "extra": {"statement": "Transversality: STAB is NOT a subset of SEP (Bell state is stabilizer and entangled) and SEP is NOT a subset of STAB (the product state T tensor |0> is separable and magic). Neither theory's free transformations respect the other's free set.", "refs": ["elementary"], "via": null}}, {"uid": "QRT:SS14", "branch": "QRT", "native_id": "SS14", "inputs": ["QRT:sF-coh"], "target": "QRT:sF-ima", "logic": "single", "kind": "subset", "kind_native": "subset", "status": "derived", "polarity": "structural", "t": 1.1, "extra": {"statement": "Incoherent states are real in the same basis (diagonal entries are probabilities): INC is a strict subset of the real states, so every free state of coherence is also free for imaginarity - but not conversely (real off-diagonal states).", "refs": ["elementary"], "via": null}}, {"uid": "QRT:SS15", "branch": "QRT", "native_id": "SS15", "inputs": ["QRT:sF-nlo"], "target": "QRT:sF-ctx", "logic": "single", "kind": "subset", "kind_native": "subset", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "Bell-local behaviors are exactly the noncontextual behaviors of Bell-type scenarios (spacelike contexts): the nonlocality free set embeds in the contextuality free set scenario-by-scenario. Operations caveat: NCW restricted to Bell scenarios differs from LOSR (P6).", "refs": ["Amaral et al., PRL 120, 130403 (2018) [verified]", "Santos, Wagner, Amaral, arXiv:2407.02120 [verified]"], "via": null}}, {"uid": "QRT:SS16", "branch": "QRT", "native_id": "SS16", "inputs": ["QRT:sF-ent"], "target": "QRT:sF-ste", "logic": "single", "kind": "subset", "kind_native": "subset", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "SEP is a strict subset of the unsteerable states: every separable state admits an LHS model by construction; strictness by unsteerable entangled Werner states.", "refs": ["Wiseman, Jones, Doherty, PRL 98, 140402 (2007) [knowledge]"], "via": null}}, {"uid": "QRT:SS17", "branch": "QRT", "native_id": "SS17", "inputs": ["QRT:sF-ste"], "target": "QRT:sF-nlo", "logic": "single", "kind": "subset", "kind_native": "subset", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "Unsteerable is a strict subset of Bell-local: an LHS model is an LHV model with quantum states on one wing; strictness by steerable yet Bell-local states.", "refs": ["Wiseman, Jones, Doherty, PRL 98, 140402 (2007) [knowledge]", "Quintino et al., PRA 92, 032107 (2015) [knowledge]"], "via": null}}, {"uid": "QRT:SS18", "branch": "QRT", "native_id": "SS18", "inputs": ["QRT:sF-asy"], "target": "QRT:sF-coh", "logic": "single", "kind": "equiv", "kind_native": "equiv", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "State-level identification: U(1)-symmetric = incoherent in the (nondegenerate) energy eigenbasis. The free sets coincide; the MONOTONE sets do not (MM2) - same states, different theories.", "refs": ["Marvian, Spekkens, PRA 94, 052324 (2016) [verified]"], "via": null}}, {"uid": "QRT:SS19", "branch": "QRT", "native_id": "SS19", "inputs": ["QRT:d-ccdis"], "target": "QRT:sR-dis", "logic": "single", "kind": "member_resource", "kind_native": "member_resource", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Discordant separable states: inside the SEP free set of entanglement, yet discord resources - the inputs that the activation protocol (pU-dis) converts into distillable entanglement.", "refs": ["Ollivier, Zurek, PRL 88, 017901 (2001) [knowledge]"], "via": null}}, {"uid": "QRT:C1", "branch": "QRT", "native_id": "C1", "inputs": ["QRT:sR-coh"], "target": "QRT:sR-ent", "logic": "single", "kind": "converts_to", "kind_native": "converts_to", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Faithful conversion: a state can be turned into an entangled one by incoherent operations iff it is coherent; max entanglement generated defines coherence monotones; E_r(output) <= C_r(input), achievable (generalized CNOT).", "refs": ["Streltsov, Singh, Dhar, Bera, Adesso, PRL 115, 020403 (2015) [verified]"], "via": "bipartite incoherent operations (system + incoherent ancilla)"}}, {"uid": "QRT:C2", "branch": "QRT", "native_id": "C2", "inputs": ["QRT:sR-ent"], "target": "QRT:sR-coh", "logic": "single", "kind": "converts_to", "kind_native": "converts_to", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Assisted frameworks: shared entanglement is consumed to create or localize coherence on the incoherent side; entanglement and coherence become interconvertible currencies in the intersection class p-lqicc.", "refs": ["Chitambar, Hsieh, PRL 117, 020402 (2016) [knowledge]", "Chitambar, Streltsov, Rana, Bera, Adesso, Lewenstein, PRL 116, 070402 (2016) [verify author list]"], "via": "LQICC (local quantum-incoherent ops + classical communication)"}}, {"uid": "QRT:C3", "branch": "QRT", "native_id": "C3", "inputs": ["QRT:sR-pur"], "target": "QRT:sR-coh", "logic": "single", "kind": "converts_to", "kind_native": "converts_to", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Purity = maximal coherence achievable by unitaries (distance-based quantifiers coincide exactly); purity also upper-bounds the entanglement and discord producible by global unitaries - the P >= C_max >= E_max cascade (QP4).", "refs": ["Streltsov, Kampermann, Wolk, Gessner, Bruss, NJP 20, 053058 (2018) [verified]"], "via": "unitaries (free in the purity theory)"}}, {"uid": "QRT:C5", "branch": "QRT", "native_id": "C5", "inputs": ["QRT:sR-coh"], "target": "QRT:sR-ath", "logic": "single", "kind": "bounds", "kind_native": "bounds", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "Energy coherence is an athermality resource not captured by free energy: coherence modes evolve under independent constraints, coherence transfer manifests irreversibility beyond free energy, and work is locked in coherence (pX-ath).", "refs": ["Lostaglio, Korzekwa, Jennings, Rudolph, PRX 5, 021001 (2015) [verified]", "Lostaglio, Jennings, Rudolph, Nat. Commun. 6, 6383 (2015) [knowledge]"], "via": "thermal operations"}}, {"uid": "QRT:C6", "branch": "QRT", "native_id": "C6", "inputs": ["QRT:sR-asy"], "target": "QRT:pX-ath", "logic": "single", "kind": "irreversible", "kind_native": "irreversible", "status": "theorem", "polarity": "no_go", "t": 1.1, "extra": {"statement": "The asymmetry resource feeds the no-go: coherence cost of ANY state under thermal processing = its QFI; distillable coherence = 0 for all full-rank states. The asymmetry sector of thermodynamics is maximally irreversible.", "refs": ["Marvian, Nat. Commun. 11, 25 (2020) [verified]"], "via": "thermal/covariant operations, unlimited work allowed"}}, {"uid": "QRT:C7", "branch": "QRT", "native_id": "C7", "inputs": ["QRT:sR-dis"], "target": "QRT:sR-ent", "logic": "single", "kind": "activates", "kind_native": "activates", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Activation: every nonclassically correlated (discordant) state, including separable ones, generates distillable entanglement with ancillas; relative entropy of quantumness = minimal distillable entanglement so generated.", "refs": ["Piani et al., PRL 106, 220403 (2011) [verified]", "Streltsov, Kampermann, Bruss, PRL 106, 160401 (2011) [knowledge]"], "via": "local CNOT/measurement interaction with ancillas, then entanglement distillation (pU-dis)"}}, {"uid": "QRT:C8", "branch": "QRT", "native_id": "C8", "inputs": ["QRT:sR-ent"], "target": "QRT:sR-nlo", "logic": "single", "kind": "converts_to", "kind_native": "converts_to", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Entanglement is necessary for Bell violation; insufficient per copy (Werner/Barrett local models); but superactivatable: many copies of some Bell-local entangled states violate Bell inequalities. Every entangled state wins some semiquantum game (Buscemi).", "refs": ["Palazuelos, PRL 109, 190401 (2012) [knowledge]", "Buscemi, PRL 108, 200401 (2012) [knowledge]"], "via": "local incompatible measurements (single copy); tensoring + local measurements (superactivation)"}}, {"uid": "QRT:C9", "branch": "QRT", "native_id": "C9", "inputs": ["QRT:sR-ent"], "target": "QRT:sR-ste", "logic": "single", "kind": "converts_to", "kind_native": "converts_to", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Strict hierarchy: steerable implies entangled, Bell-nonlocal implies steerable; both converses fail (Werner ranges). Steering requires BOTH entanglement (sR-ent) and incompatibility (sR-inc) jointly.", "refs": ["Wiseman, Jones, Doherty, PRL 98, 140402 (2007) [knowledge]", "Quintino et al., PRA 92, 032107 (2015) [knowledge]"], "via": "incompatible measurements on the untrusted wing"}}, {"uid": "QRT:C10", "branch": "QRT", "native_id": "C10", "inputs": ["QRT:sR-mag"], "target": "QRT:sR-ctx", "logic": "single", "kind": "converts_to", "kind_native": "converts_to", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Contextuality is necessary and (for odd prime d) sufficient for magic-state distillability: nonzero mana implies KS-contextuality w.r.t. stabilizer measurements. Multiqubit case obstructed by state-independent contextuality (QG1).", "refs": ["Howard, Wallman, Veitch, Emerson, Nature 510, 351 (2014) [knowledge, verified in prior network run]"], "via": "stabilizer measurements on the magic state"}}, {"uid": "QRT:C11", "branch": "QRT", "native_id": "C11", "inputs": ["QRT:sR-nga"], "target": "QRT:sR-ctx", "logic": "single", "kind": "equiv", "kind_native": "equiv", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "CV: Wigner negativity iff contextuality (continuous-variable scenario), closing the CV side of the magic-contextuality correspondence.", "refs": ["Booth, Chabaud, Emeriau, PRL 129, 230401 (2022) [knowledge, verified in prior network run]"], "via": null}}, {"uid": "QRT:C12", "branch": "QRT", "native_id": "C12", "inputs": ["QRT:sR-coh"], "target": "QRT:sR-mag", "logic": "single", "kind": "bounds", "kind_native": "bounds", "status": "partial", "polarity": "structural", "t": 1.1, "extra": {"statement": "Coherence is necessary for magic (every nonstabilizer state is coherent in every stabilizer eigenbasis - a stabilizer-diagonal state is a STAB mixture) but radically insufficient (|+>, SS4). No faithful conversion protocol known - QG5.", "refs": ["'Coherence makes quantum systems magical', arXiv:1801.04807 [verify authors/venue]", "necessity: derived, proof sketch in catalog"], "via": null}}, {"uid": "QRT:C13", "branch": "QRT", "native_id": "C13", "inputs": ["QRT:sR-ima"], "target": "QRT:pU-ima", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Imaginarity powers local discrimination: an ENT-free task (discriminating real orthogonal product states) separates imaginarity-free from imaginarity-resourced agents - a cross-theory witness.", "refs": ["Wu et al., PRL 126, 090401 (2021) [verified]", "Wu et al., PRA 103, 032401 (2021) [verified]"], "via": "LOCC with vs without local imaginarity"}}, {"uid": "QRT:C14", "branch": "QRT", "native_id": "C14", "inputs": ["QRT:sR-ath"], "target": "QRT:pU-ath", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Second laws: the Renyi free energies govern deterministic work extraction and state interconversion for block-diagonal states.", "refs": ["Brandao et al., PNAS 112, 3275 (2015) [knowledge]", "Horodecki, Oppenheim, Nat. Commun. 4, 2059 (2013) [knowledge]"], "via": "thermal operations"}}, {"uid": "QRT:C15", "branch": "QRT", "native_id": "C15", "inputs": ["QRT:sR-ent"], "target": "QRT:pU-ath", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Correlations store work: extractable work from correlated states exceeds that from their marginals; entanglement maximizes the single-shot gain - an entanglement resource spent in the thermodynamic task node.", "refs": ["Perarnau-Llobet et al., PRX 5, 041011 (2015) [verify]"], "via": "thermal processing of correlated systems"}}, {"uid": "QRT:C16", "branch": "QRT", "native_id": "C16", "inputs": ["QRT:sR-coh"], "target": "QRT:pU-coh", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Every coherent state has distillable coherence C_r > 0 under IO (no bound coherence); cost is C_f >= C_r. The resource is spent faithfully: distillation succeeds for ALL resource states - rare among the 13 theories (QP3).", "refs": ["Winter, Yang, PRL 116, 120404 (2016) [knowledge]"], "via": "incoherent operations (IO)"}}, {"uid": "QRT:C16b", "branch": "QRT", "native_id": "C16b", "inputs": ["QRT:sR-coh"], "target": "QRT:pX-coh", "logic": "single", "kind": "irreversible", "kind_native": "irreversible", "status": "theorem", "polarity": "no_go", "t": 1.1, "extra": {"statement": "The same resource hits the wall: C_f > C_r generically, so an IO distill-dilute cycle loses coherence; par is restored only under asymptotically-MIO (Stein-lemma regime, MM11).", "refs"
