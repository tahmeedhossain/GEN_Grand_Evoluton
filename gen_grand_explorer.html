_native": "classical", "status": "established", "polarity": "structural", "t": 27, "extra": {"title": "Displacement current", "formula": "Adding μ₀ε₀∂E/∂t to Ampère's law restores consistency with charge conservation.", "section": 9, "text_marker_paragraph": 27}}, {"uid": "EM:g_maxform", "branch": "EM", "native_id": "g_maxform", "inputs": ["EM:ext", "EM:hodge"], "target": "EM:maxwell", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 47, "extra": {"title": "Maxwell's equations as forms", "formula": "dF = 0 and d⋆F = μ₀⋆J.", "section": 15, "text_marker_paragraph": 47}}, {"uid": "EM:g_c", "branch": "EM", "native_id": "g_c", "inputs": ["EM:consts", "EM:maxwell"], "target": "EM:c", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 27, "extra": {"title": "Predicted wave speed", "formula": "Combining the curl equations gives wave equations with speed 1/√(μ₀ε₀).", "section": 9, "text_marker_paragraph": 27}}, {"uid": "EM:g_evolve", "branch": "EM", "native_id": "g_evolve", "inputs": ["EM:EB", "EM:rho", "EM:J", "EM:maxwell", "EM:ddt"], "target": "EM:EB", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 28, "extra": {"title": "Time evolution by Maxwell's equations", "formula": "∂E/∂t = c²∇×B − J/ε₀, ∂B/∂t = −∇×E.", "section": 9, "text_marker_paragraph": 28}}, {"uid": "EM:g_EBpot", "branch": "EM", "native_id": "g_EBpot", "inputs": ["EM:pot", "EM:grad", "EM:curl", "EM:ddt"], "target": "EM:EB", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 31, "extra": {"title": "Fields from potentials", "formula": "E = −∇φ − ∂A/∂t, B = ∇×A, the same for every member of the gauge class.", "section": 10, "text_marker_paragraph": null}}, {"uid": "EM:g_EBF", "branch": "EM", "native_id": "g_EBF", "inputs": ["EM:Fmn", "EM:lorentz"], "target": "EM:EB", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 42, "extra": {"title": "Split F by an observer", "formula": "E and B are the components of F relative to an observer's four-velocity.", "section": 13, "text_marker_paragraph": 42}}, {"uid": "EM:g_u", "branch": "EM", "native_id": "g_u", "inputs": ["EM:EB", "EM:bil"], "target": "EM:u", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 29, "extra": {"title": "Energy density of the field", "formula": "u = ½(ε₀|E|² + |B|²/μ₀).", "section": 9, "text_marker_paragraph": null}}, {"uid": "EM:g_Fstress", "branch": "EM", "native_id": "g_Fstress", "inputs": ["EM:EB", "EM:stress", "EM:ddt"], "target": "EM:F", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 29, "extra": {"title": "Force from the Maxwell stress", "formula": "F = ∮σ·dA over a surface enclosing the charges (minus the change of field momentum inside, added after 1900).", "section": 9, "text_marker_paragraph": 29}}, {"uid": "EM:g_ret", "branch": "EM", "native_id": "g_ret", "inputs": ["EM:rho", "EM:J", "EM:gfix", "EM:wave"], "target": "EM:pot", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 31, "extra": {"title": "Retarded potentials", "formula": "φ(x,t) = (1/4πε₀)∫ρ(x′, t − |x − x′|/c)/|x − x′| d³x′, and likewise for A.", "section": 10, "text_marker_paragraph": 30}}, {"uid": "EM:g_pot2", "branch": "EM", "native_id": "g_pot2", "inputs": ["EM:phi", "EM:A", "EM:gauge"], "target": "EM:pot", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 31, "extra": {"title": "Gauge orbit of a pair", "formula": "All pairs related by gauge transformations form one class.", "section": 10, "text_marker_paragraph": null}}, {"uid": "EM:g_pot1", "branch": "EM", "native_id": "g_pot1", "inputs": ["EM:EB", "EM:poinc"], "target": "EM:pot", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 32, "extra": {"title": "Existence of potentials", "formula": "Fields obeying ∇·B = 0 and Faraday's law come from some (φ, A), at least locally.", "section": 10, "text_marker_paragraph": 32}}, {"uid": "EM:g_Arep", "branch": "EM", "native_id": "g_Arep", "inputs": ["EM:pot", "EM:gfix"], "target": "EM:A", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 31, "extra": {"title": "Pick a representative", "formula": "A gauge condition selects a concrete A from the class.", "section": 10, "text_marker_paragraph": null}}, {"uid": "EM:g_S", "branch": "EM", "native_id": "g_S", "inputs": ["EM:EB", "EM:cross", "EM:poynt"], "target": "EM:S", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 33, "extra": {"title": "Poynting vector", "formula": "S = E×B/μ₀.", "section": 11, "text_marker_paragraph": null}}, {"uid": "EM:g_vac", "branch": "EM", "native_id": "g_vac", "inputs": ["EM:EB", "EM:wave", "EM:fourier"], "target": "EM:vac", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 35, "extra": {"title": "Mode expansion of free fields", "formula": "Source-free solutions as sums of plane waves.", "section": 11, "text_marker_paragraph": null}}, {"uid": "EM:g_wave", "branch": "EM", "native_id": "g_wave", "inputs": ["EM:vac", "EM:fourier"], "target": "EM:wavedat", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 35, "extra": {"title": "Read off wave data", "formula": "Each mode has definite k, ω = c|k| and polarization.", "section": 11, "text_marker_paragraph": null}}, {"uid": "EM:g_g", "branch": "EM", "native_id": "g_g", "inputs": ["EM:S", "EM:c"], "target": "EM:g", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 36, "extra": {"title": "Momentum density", "formula": "g = S/c².", "section": 11, "text_marker_paragraph": null}}, {"uid": "EM:g_FL", "branch": "EM", "native_id": "g_FL", "inputs": ["EM:q", "EM:E", "EM:B", "EM:v", "EM:cross", "EM:vec"], "target": "EM:F", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 37, "extra": {"title": "Lorentz force law", "formula": "F = q(E + v×B).", "section": 12, "text_marker_paragraph": 37}}, {"uid": "EM:g_P1", "branch": "EM", "native_id": "g_P1", "inputs": ["EM:pot", "EM:traj", "EM:wave"], "target": "EM:P", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 39, "extra": {"title": "Larmor formula", "formula": "P = q²a²/(6πε₀c³) for slow charges.", "section": 12, "text_marker_paragraph": 39}}, {"uid": "EM:g_P2", "branch": "EM", "native_id": "g_P2", "inputs": ["EM:S", "EM:div"], "target": "EM:P", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 39, "extra": {"title": "Flux of the Poynting vector", "formula": "P = ∮S·dA over a large sphere.", "section": 12, "text_marker_paragraph": 39}}, {"uid": "EM:g_Amu", "branch": "EM", "native_id": "g_Amu", "inputs": ["EM:pot", "EM:lorentz"], "target": "EM:Amu", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 42, "extra": {"title": "Assemble the four-potential", "formula": "(φ/c, A) transform together as a four-vector.", "section": 13, "text_marker_paragraph": null}}, {"uid": "EM:g_jmu", "branch": "EM", "native_id": "g_jmu", "inputs": ["EM:rho", "EM:J", "EM:lorentz"], "target": "EM:jmu", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 42, "extra": {"title": "Assemble the four-current", "formula": "J^μ = (cρ, J).", "section": 13, "text_marker_paragraph": null}}, {"uid": "EM:g_Fmink", "branch": "EM", "native_id": "g_Fmink", "inputs": ["EM:Amu", "EM:lorentz"], "target": "EM:Fmn", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 42, "extra": {"title": "Antisymmetrized derivative of A", "formula": "F_μν = ∂_μA_ν − ∂_νA_μ (Minkowski).", "section": 13, "text_marker_paragraph": 42}}, {"uid": "EM:g_inv13", "branch": "EM", "native_id": "g_inv13", "inputs": ["EM:Fmn", "EM:lorentz"], "target": "EM:inv", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 42, "extra": {"title": "Contract the field tensor", "formula": "F_μνF^μν ∝ |B|² − |E|²/c² and F_μνF̃^μν ∝ E·B.", "section": 13, "text_marker_paragraph": null}}, {"uid": "EM:g_T", "branch": "EM", "native_id": "g_T", "inputs": ["EM:Fmn", "EM:lorentz"], "target": "EM:T", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 42, "extra": {"title": "Stress–energy tensor", "formula": "T^μν = (1/μ₀)(F^μα F^ν_α − ¼ g^μν F_αβ F^αβ).", "section": 13, "text_marker_paragraph": null}}, {"uid": "EM:g_FEL", "branch": "EM", "native_id": "g_FEL", "inputs": ["EM:traj", "EM:pot", "EM:action"], "target": "EM:F", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 43, "extra": {"title": "Euler–Lagrange equation for a charge", "formula": "Gauge-dependent terms cancel and the result is q(E + v×B).", "section": 14, "text_marker_paragraph": 43}}, {"uid": "EM:g_phase", "branch": "EM", "native_id": "g_phase", "inputs": ["EM:traj", "EM:pot", "EM:legendre"], "target": "EM:phase", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 44, "extra": {"title": "Canonical momentum", "formula": "p = ∂L/∂v = mv + qA.", "section": 14, "text_marker_paragraph": null}}, {"uid": "EM:g_pkin", "branch": "EM", "native_id": "g_pkin", "inputs": ["EM:phase", "EM:pot"], "target": "EM:pkin", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 44, "extra": {"title": "Subtract the potential", "formula": "π = p − qA; the gauge shifts of p and qA cancel.", "section": 14, "text_marker_paragraph": null}}, {"uid": "EM:g_ham", "branch": "EM", "native_id": "g_ham", "inputs": ["EM:phase", "EM:pb"], "target": "EM:traj", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 44, "extra": {"title": "Hamilton's equations", "formula": "dx/dt = {x, H}, dp/dt = {p, H}.", "section": 14, "text_marker_paragraph": null}}, {"uid": "EM:g_fphase", "branch": "EM", "native_id": "g_fphase", "inputs": ["EM:pot", "EM:action", "EM:gauge"], "target": "EM:fphase", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 44, "extra": {"title": "Hamiltonian field theory", "formula": "Canonical pairs from the field Lagrangian, with Gauss's law as a constraint.", "section": 14, "text_marker_paragraph": null}}, {"uid": "EM:g_cons", "branch": "EM", "native_id": "g_cons", "inputs": ["EM:fphase", "EM:phase", "EM:noether"], "target": "EM:cons", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 45, "extra": {"title": "Noether charges of matter plus field", "formula": "Time translations give energy, space translations momentum, rotations angular momentum.", "section": 14, "text_marker_paragraph": null}}, {"uid": "EM:g_noethcont", "branch": "EM", "native_id": "g_noethcont", "inputs": ["EM:noether", "EM:gauge"], "target": "EM:cont", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 46, "extra": {"title": "Charge conservation from gauge symmetry", "formula": "Invariance of the action under gauge changes forces ∂ρ/∂t + ∇·J = 0.", "section": 14, "text_marker_paragraph": 46}}, {"uid": "EM:g_FdA", "branch": "EM", "native_id": "g_FdA", "inputs": ["EM:Amu", "EM:ext"], "target": "EM:Fmn", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 47, "extra": {"title": "F = dA", "formula": "Gauge shifts A → A + dχ drop out since d²χ = 0.", "section": 15, "text_marker_paragraph": null}}, {"uid": "EM:g_inv", "branch": "EM", "native_id": "g_inv", "inputs": ["EM:Fmn", "EM:hodge", "EM:wedge"], "target": "EM:inv", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 47, "extra": {"title": "Invariants as forms", "formula": "F∧F ∝ E·B and F∧⋆F ∝ |E|² − c²|B|².", "section": 15, "text_marker_paragraph": 47}}, {"uid": "EM:g_d2cont", "branch": "EM", "native_id": "g_d2cont", "inputs": ["EM:jmu", "EM:ext", "EM:maxwell"], "target": "EM:cont", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 47, "extra": {"title": "Conservation from d² = 0", "formula": "d⋆J = μ₀⁻¹ d(d⋆F) = 0.", "section": 15, "text_marker_paragraph": 47}}, {"uid": "EM:g_bundle", "branch": "EM", "native_id": "g_bundle", "inputs": ["EM:Amu", "EM:conn", "EM:gauge"], "target": "EM:bundle", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 48, "extra": {"title": "Glue local potentials", "formula": "Potentials on overlapping patches differ by gauge transformations, which glue them into a bundle.", "section": 15, "text_marker_paragraph": null}}, {"uid": "EM:g_Fcurv", "branch": "EM", "native_id": "g_Fcurv", "inputs": ["EM:bundle", "EM:conn"], "target": "EM:Fmn", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 48, "extra": {"title": "Curvature of the connection", "formula": "F is the curvature 2-form of the U(1) connection.", "section": 15, "text_marker_paragraph": 48}}, {"uid": "EM:g_hol", "branch": "EM", "native_id": "g_hol", "inputs": ["EM:bundle", "EM:line"], "target": "EM:hol", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 49, "extra": {"title": "Parallel transport around a loop", "formula": "Holonomy exp(i∮A); classically the loop integral ∮A·dl itself.", "section": 15, "text_marker_paragraph": null}}, {"uid": "EM:g_RJ", "branch": "EM", "native_id": "g_RJ", "inputs": ["EM:vac", "EM:equip"], "target": "EM:bbspec", "logic": "AND", "kind": "failed", "kind_native": "failed", "status": "failed", "polarity": "no_go", "t": 50, "extra": {"title": "Rayleigh–Jeans law (classical)", "formula": "u(ν,T) = 8πν²kT/c³: correct at low frequency, infinite total energy.", "section": 16, "text_marker_paragraph": 50}}, {"uid": "EM:g_planckbb", "branch": "EM", "native_id": "g_planckbb", "inputs": ["EM:vac", "EM:planck", "EM:hbar"], "target": "EM:bbspec", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 51, "extra": {"title": "Planck's law", "formula": "u(ν,T) = (8πhν³/c³)/(e^{hν/kT} − 1).", "section": 16, "text_marker_paragraph": 51}}, {"uid": "EM:g_photowave", "branch": "EM", "native_id": "g_photowave", "inputs": ["EM:S", "EM:wavedat"], "target": "EM:photoel", "logic": "AND", "kind": "failed", "kind_native": "failed", "status": "failed", "polarity": "no_go", "t": 52, "extra": {"title": "Classical wave prediction", "formula": "Electron energy should grow with intensity and arrive after a delay; neither is observed.", "section": 16, "text_marker_paragraph": 52}}, {"uid": "EM:g_photoel", "branch": "EM", "native_id": "g_photoel", "inputs": ["EM:planck", "EM:hbar", "EM:wavedat"], "target": "EM:photoel", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 52, "extra": {"title": "Einstein's photoelectric equation", "formula": "K_max = hν − W.", "section": 16, "text_marker_paragraph": 52}}, {"uid": "EM:g_photon1", "branch": "EM", "native_id": "g_photon1", "inputs": ["EM:planck", "EM:hbar", "EM:wavedat"], "target": "EM:photon", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 52, "extra": {"title": "Light quanta", "formula": "E = hν, p = h/λ (Einstein 1905, Compton 1923).", "section": 16, "text_marker_paragraph": 52}}, {"uid": "EM:g_collapse", "branch": "EM", "native_id": "g_collapse", "inputs": ["EM:P", "EM:traj", "EM:coul"], "target": "EM:spectra", "logic": "AND", "kind": "failed", "kind_native": "failed", "status": "failed", "polarity": "no_go", "t": 53, "extra": {"title": "Classical atom (Larmor)", "formula": "An orbiting electron radiates continuously and spirals into the nucleus within about 10⁻¹¹ s.", "section": 16, "text_marker_paragraph": 53}}, {"uid": "EM:g_bohr", "branch": "EM", "native_id": "g_bohr", "inputs": ["EM:coul", "EM:traj", "EM:hbar"], "target": "EM:bohr", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 53, "extra": {"title": "Bohr's quantization", "formula": "Angular momentum mvr = nħ selects the allowed orbits.", "section": 16, "text_marker_paragraph": 53}}, {"uid": "EM:g_bohrlines", "branch": "EM", "native_id": "g_bohrlines", "inputs": ["EM:bohr", "EM:planck"], "target": "EM:spectra", "logic": "AND", "kind": "derives", "kind_native": "quantum", "status": "established", "polarity": "structural", "t": 53, "extra": {"title": "Bohr's frequency rule", "formula": "hν = Eₙ − Eₘ between stationary orbits.", "section": 16, "text_marker_paragraph": 53}}, {"uid": "EM:g_dirac", "branch": "EM", "native_id": "g_dirac", "inputs": ["EM:pb", "EM:hbar"], "target": "EM:comm", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 55, "extra": {"title": "Dirac's quantization rule", "formula": "{A, B} → [Â, B̂]/iħ.", "section": 17, "text_marker_paragraph": 55}}, {"uid": "EM:g_ops", "branch": "EM", "native_id": "g_ops", "inputs": ["EM:phase", "EM:comm"], "target": "EM:ops", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 55, "extra": {"title": "Phase-space functions become operators", "formula": "f(x, p) → f(x̂, p̂), with an ordering choice.", "section": 17, "text_marker_paragraph": 55}}, {"uid": "EM:g_hilb", "branch": "EM", "native_id": "g_hilb", "inputs": ["EM:phase", "EM:comm", "EM:ops"], "target": "EM:hilb", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 56, "extra": {"title": "Canonical quantization of the state", "formula": "Points (x, p) are replaced by wave functions ψ(x); x̂ multiplies, p̂ = −iħ ∂/∂x.", "section": 17, "text_marker_paragraph": 56}}, {"uid": "EM:g_levels", "branch": "EM", "native_id": "g_levels", "inputs": ["EM:hilb", "EM:ops", "EM:schro", "EM:coul"], "target": "EM:spectra", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 56, "extra": {"title": "Hydrogen from the Schrödinger equation", "formula": "Eₙ = −13.6 eV/n² as eigenvalues of Ĥ.", "section": 17, "text_marker_paragraph": 56}}, {"uid": "EM:g_expect", "branch": "EM", "native_id": "g_expect", "inputs": ["EM:hilb", "EM:born", "EM:ops"], "target": "EM:expect", "logic": "AND", "kind": "derives", "kind_native": "quantum", "status": "established", "polarity": "structural", "t": 57, "extra": {"title": "Born rule statistics", "formula": "Prob(a) = |⟨a|ψ⟩|², ⟨Â⟩ = ⟨ψ|Â|ψ⟩.", "section": 17, "text_marker_paragraph": 57}}, {"uid": "EM:g_ehren", "branch": "EM", "native_id": "g_ehren", "inputs": ["EM:hilb", "EM:schro", "EM:ops"], "target": "EM:traj", "logic": "AND", "kind": "derives", "kind_native": "classical_limit", "status": "established", "polarity": "structural", "t": 57, "extra": {"title": "Ehrenfest's theorem (classical limit)", "formula": "d⟨x̂⟩/dt = ⟨p̂⟩/m, d⟨p̂⟩/dt = ⟨F⟩ ≈ F(⟨x̂⟩).", "section": 17, "text_marker_paragraph": 57}}, {"uid": "EM:g_mincoup", "branch": "EM", "native_id": "g_mincoup", "inputs": ["EM:pkin", "EM:gauge", "EM:comm"], "target": "EM:mincoup", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 58, "extra": {"title": "Quantize the kinetic momentum", "formula": "π̂ = −iħ∇ − qA; a gauge change becomes a phase change of ψ.", "section": 18, "text_marker_paragraph": 58}}, {"uid": "EM:g_landau", "branch": "EM", "native_id": "g_landau", "inputs": ["EM:hilb", "EM:mincoup", "EM:Bfield"], "target": "EM:landau", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 59, "extra": {"title": "Landau quantization", "formula": "Eₙ = ħω_c(n + ½), ω_c = qB/m.", "section": 18, "text_marker_paragraph": 59}}, {"uid": "EM:g_ab", "branch": "EM", "native_id": "g_ab", "inputs": ["EM:hol", "EM:hilb", "EM:mincoup"], "target": "EM:abphase", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 60, "extra": {"title": "Aharonov–Bohm phase", "formula": "Δθ = q∮A·dl/ħ = qΦ_B/ħ.", "section": 18, "text_marker_paragraph": 60}}, {"uid": "EM:g_diraceq", "branch": "EM", "native_id": "g_diraceq", "inputs": ["EM:clifford", "EM:lorentz", "EM:mincoup"], "target": "EM:dirac", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 61, "extra": {"title": "Dirac's relativistic equation", "formula": "(iħγ^μD_μ − mc)ψ = 0.", "section": 19, "text_marker_paragraph": 61}}, {"uid": "EM:g_spinor", "branch": "EM", "native_id": "g_spinor", "inputs": ["EM:dirac", "EM:hilb"], "target": "EM:spinor", "logic": "AND", "kind": "derives", "kind_native": "quantum", "status": "established", "polarity": "structural", "t": 62, "extra": {"title": "Spinor solutions", "formula": "Solutions carry spin ½ and come with positive and negative energy.", "section": 19, "text_marker_paragraph": 62}}, {"uid": "EM:g_gfac", "branch": "EM", "native_id": "g_gfac", "inputs": ["EM:spinor", "EM:dirac", "EM:Bfield"], "target": "EM:gfac", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 62, "extra": {"title": "Dirac's magnetic moment", "formula": "g = 2 exactly at this level of the theory.", "section": 19, "text_marker_paragraph": 62}}, {"uid": "EM:g_finestr", "branch": "EM", "native_id": "g_finestr", "inputs": ["EM:spinor", "EM:dirac", "EM:coul"], "target": "EM:spectra", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 62, "extra": {"title": "Fine structure of hydrogen", "formula": "Levels depend on n and total angular momentum j.", "section": 19, "text_marker_paragraph": 62}}, {"uid": "EM:g_positron", "branch": "EM", "native_id": "g_positron", "inputs": ["EM:spinor", "EM:dirac"], "target": "EM:positron", "logic": "AND", "kind": "derives", "kind_native": "quantum", "status": "established", "polarity": "structural", "t": 63, "extra": {"title": "Negative-energy solutions", "formula": "Holes in the Dirac sea behave as antiparticles.", "section": 19, "text_marker_paragraph": 63}}, {"uid": "EM:g_ladder", "branch": "EM", "native_id": "g_ladder", "inputs": ["EM:vac", "EM:comm"], "target": "EM:ladder", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 64, "extra": {"title": "Each mode is a quantum oscillator", "formula": "a_k, a_k† with [a_k, a_k′†] = δ_kk′.", "section": 20, "text_marker_paragraph": 64}}, {"uid": "EM:g_photon2", "branch": "EM", "native_id": "g_photon2", "inputs": ["EM:ladder", "EM:vac"], "target": "EM:photon", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 64, "extra": {"title": "Photons as field quanta", "formula": "One photon = one excitation of a mode.", "section": 20, "text_marker_paragraph": 64}}, {"uid": "EM:g_fock", "branch": "EM", "native_id": "g_fock", "inputs": ["EM:ladder", "EM:hilb"], "target": "EM:fock", "logic": "AND", "kind": "derives", "kind_native": "quantum", "status": "established", "polarity": "structural", "t": 65, "extra": {"title": "Build Fock space", "formula": "Apply creation operators to the vacuum |0⟩.", "section": 20, "text_marker_paragraph": 65}}, {"uid": "EM:g_spont", "branch": "EM", "native_id": "g_spont", "inputs": ["EM:fock", "EM:ladder", "EM:spectra"], "target": "EM:spont", "logic": "AND", "kind": "derives", "kind_native": "quantum", "status": "established", "polarity": "structural", "t": 65, "extra": {"title": "Vacuum fluctuations drive emission", "formula": "Dirac 1927: the rate scales as ω³ times the squared dipole matrix element.", "section": 20, "text_marker_paragraph": 65}}, {"uid": "EM:g_Aop", "branch": "EM", "native_id": "g_Aop", "inputs": ["EM:fphase", "EM:comm", "EM:gfix"], "target": "EM:Aop", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 66, "extra": {"title": "Canonical quantization of the field", "formula": "[Âᵢ(x), Π̂ⱼ(y)] = iħ δ⊥ᵢⱼ(x − y) in Coulomb gauge.", "section": 20, "text_marker_paragraph": 66}}, {"uid": "EM:g_coherent", "branch": "EM", "native_id": "g_coherent", "inputs": ["EM:fock", "EM:ladder"], "target": "EM:EB", "logic": "AND", "kind": "derives", "kind_native": "classical_limit", "status": "established", "polarity": "structural", "t": 66, "extra": {"title": "Coherent states (classical limit)", "formula": "Glauber 1963: ⟨Ê⟩ and ⟨B̂⟩ obey Maxwell's equations; fluctuations are negligible for many photons.", "section": 20, "text_marker_paragraph": 66}}, {"uid": "EM:g_casimir", "branch": "EM", "native_id": "g_casimir", "inputs": ["EM:ladder", "EM:bc"], "target": "EM:casimir", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 66, "extra": {"title": "Zero-point energy between plates", "formula": "F/A = −π²ħc/240d⁴.", "section": 20, "text_marker_paragraph": 66}}, {"uid": "EM:g_psiop", "branch": "EM", "native_id": "g_psiop", "inputs": ["EM:spinor", "EM:ladder"], "target": "EM:psiop", "logic": "AND", "kind": "derives", "kind_native": "quantum", "status": "established", "polarity": "structural", "t": 67, "extra": {"title": "Quantize the Dirac field", "formula": "Expand ψ in modes with anticommuting operators.", "section": 21, "text_marker_paragraph": 67}}, {"uid": "EM:g_alpha", "branch": "EM", "native_id": "g_alpha", "inputs": ["EM:q", "EM:consts", "EM:hbar", "EM:c"], "target": "EM:alpha", "logic": "AND", "kind": "derives", "kind_native": "quantization", "status": "established", "polarity": "structural", "t": 68, "extra": {"title": "Combine the constants", "formula": "α = e²/4πε₀ħc ≈ 1/137.036.", "section": 21, "text_marker_paragraph": 68}}, {"uid": "EM:g_diverge", "branch": "EM", "native_id": "g_diverge", "inputs": ["EM:pert", "EM:Aop", "EM:psiop"], "target": "EM:lamb", "logic": "AND", "kind": "failed", "kind_native": "failed", "status": "failed", "polarity": "no_go", "t": 70, "extra": {"title": "Naive perturbation theory", "formula": "Self-energy corrections come out infinite.", "section": 21, "text_marker_paragraph": 69}}, {"uid": "EM:g_lambdirac", "branch": "EM", "native_id": "g_lambdirac", "inputs": ["EM:spinor", "EM:dirac", "EM:coul"], "target": "EM:lamb", "logic": "AND", "kind": "failed", "kind_native": "failed", "status": " y": "rewrite of particle production (Step 4)"}}, {"uid": "HEP:fam:o_G:o_prod", "branch": "HEP", "native_id": "fam/o_G/o_prod", "inputs": ["HEP:o_G"], "target": "HEP:o_prod", "logic": "single", "kind": "subset", "kind_native": "observable_family", "status": "established", "polarity": "structural", "t": 4, "extra": {"family": "rewrite of particle production (Step 4)"}}, {"uid": "GPT:GN1", "branch": "GPT", "native_id": "GN1", "inputs": ["GPT:ax-symplectic"], "target": "GPT:m-classical", "logic": "single", "kind": "generates", "kind_native": "generates", "status": "theorem", "polarity": "structural", "t": 2.0, "extra": {"statement": "Classical statistical mechanics: unrestricted probability distributions over phase space form the simplex theory; Liouville flow gives the reversible dynamics.", "refs": ["standard; see Spekkens, arXiv:1409.5041, Sec. 2"]}}, {"uid": "GPT:GN2a", "branch": "GPT", "native_id": "GN2a", "inputs": ["GPT:ax-epirestrict"], "target": "GPT:m-spekkens", "logic": "single", "kind": "generates", "kind_native": "generates", "status": "theorem", "polarity": "structural", "t": 2.0, "extra": {"statement": "Classical ontology + knowledge-balance restriction generates the toy theory (discrete epistricted mechanics).", "refs": ["Spekkens, PRA 75, 032110 (2007)", "Spekkens, Quasi-quantization, arXiv:1409.5041 (2016)"]}}, {"uid": "GPT:GN2b", "branch": "GPT", "native_id": "GN2b", "inputs": ["GPT:ax-epirestrict"], "target": "GPT:m-gaussian", "logic": "single", "kind": "generates", "kind_native": "generates", "status": "theorem", "polarity": "structural", "t": 2.0, "extra": {"statement": "Epistricted Liouville mechanics with the uncertainty-saturating Gaussian restriction reproduces Gaussian quantum mechanics exactly (states, dynamics, quadrature statistics).", "refs": ["Bartlett, Rudolph, Spekkens, PRA 86, 012103 (2012)"]}}, {"uid": "GPT:GN2c", "branch": "GPT", "native_id": "GN2c", "inputs": ["GPT:ax-epirestrict"], "target": "GPT:m-stab-odd", "logic": "single", "kind": "generates", "kind_native": "generates", "status": "theorem", "polarity": "structural", "t": 2.0, "extra": {"statement": "Epistricted Z_d mechanics (discrete symplectic phase space + knowledge balance) reproduces the odd-d stabilizer subtheory; equivalently Gross's nonnegative Wigner representation, which is its UNIQUE noncontextual model.", "refs": ["Spekkens, arXiv:1409.5041", "Gross, J. Math. Phys. 47, 122107 (2006)", "Catani, Browne, NJP 19, 073035 (2017)", "Schmid, Du, Selby, Pusey, PRL 129, 120403 (2022)"]}}, {"uid": "GPT:GN3", "branch": "GPT", "native_id": "GN3", "inputs": ["GPT:ax-epirestrict"], "target": "GPT:m-stab-even", "logic": "single", "kind": "not_implies", "kind_native": "not_implies", "status": "counterexample", "polarity": "no_go", "t": 2.0, "extra": {"statement": "The even-d anomaly: NO epistemic restriction of a classical theory reproduces the qubit stabilizer subtheory - it has no nonnegative diagram-preserving representation and is state-independently contextual (Mermin square).", "refs": ["Schmid, Du, Selby, Pusey, PRL 129, 120403 (2022)", "Spekkens, arXiv:1409.5041 (qubit case noted)", "Mermin, PRL 65, 3373 (1990)"]}}, {"uid": "GPT:GN4", "branch": "GPT", "native_id": "GN4", "inputs": ["GPT:ax-moyal"], "target": "GPT:m-quantum", "logic": "single", "kind": "generates", "kind_native": "generates", "status": "theorem", "polarity": "structural", "t": 2.0, "extra": {"statement": "Full quantum mechanics is the deformation of the Poisson algebra: [f,g]_star = i hbar {f,g}_Moyal, with {f,g}_M = {f,g}_Poisson + O(hbar^2). Groenewold - van Hove: no exact Lie morphism Poisson to commutator exists beyond quadratics, so the lift is necessarily a deformation, not an embedding.", "refs": ["Groenewold, Physica 12, 405 (1946)", "Moyal, Proc. Camb. Phil. Soc. 45, 99 (1949)", "Bayen, Flato, Fronsdal, Lichnerowicz, Sternheimer, Ann. Phys. 111, 61 & 111 (1978)", "Kontsevich, Lett. Math. Phys. 66, 157 (2003)"]}}, {"uid": "GPT:GN5", "branch": "GPT", "native_id": "GN5", "inputs": ["GPT:ax-moyal"], "target": "GPT:s-wneg", "logic": "single", "kind": "generates", "kind_native": "generates", "status": "derived", "polarity": "structural", "t": 2.0, "extra": {"statement": "ASSEMBLED COROLLARY (this work): the beyond-Poisson terms of the Moyal bracket (order hbar^2, nonzero only for non-quadratic Hamiltonians) are exactly the generators of Wigner negativity. Quadratic flows keep Moyal = Poisson, generate Gaussian unitaries, and preserve Wigner positivity; pure Wigner-positive states are exactly Gaussian (Hudson); CV universality and negativity generation require cubic-or-higher generators. Via the CV equivalence (C2), these same terms are what generate contextuality. SCOPE (C8): proved as NECESSITY - quadratic generators keep Moyal = Poisson and preserve Wigner positivity, so creating negativity from a Wigner-positive state needs degree >= 3; not every non-quadratic H creates negativity from every state (a function of the number operator leaves the vacuum invariant).", "refs": ["Groenewold 1946", "Hudson, Rep. Math. Phys. 6, 249 (1974)", "Lloyd, Braunstein, PRL 82, 1784 (1999)", "Takagi, Zhuang, PRA 97, 062337 (2018)", "Booth, Chabaud, Emeriau, PRL 129, 230401 (2022)"]}}, {"uid": "GPT:GN6", "branch": "GPT", "native_id": "GN6", "inputs": ["GPT:ax-complex"], "target": "GPT:ax-loctom", "logic": "single", "kind": "generates", "kind_native": "generates", "status": "theorem", "polarity": "structural", "t": 2.0, "extra": {"statement": "The complex field is the division-ring choice for which quantum theory is locally tomographic; real-amplitude QM violates local tomography (composite real systems are not fixed by local statistics).", "refs": ["Araki, Commun. Math. Phys. 75, 1 (1980)", "Wootters, in Complexity, Entropy and the Physics of Information (1990)", "Hardy, Wootters, Found. Phys. 42, 454 (2012)"]}}, {"uid": "GPT:GN7", "branch": "GPT", "native_id": "GN7", "inputs": ["GPT:ax-complex"], "target": "GPT:m-quantum", "logic": "single", "kind": "generates", "kind_native": "generates", "status": "theorem", "polarity": "structural", "t": 2.0, "extra": {"statement": "i makes i[A,B] Hermitian: observables close as a Lie algebra and coincide with the generators of dynamics (Stone's theorem) - the quantum Noether link. In real QM the generator of a one-parameter unitary group is not an observable without superselection workarounds (Stueckelberg).", "refs": ["Stone, Ann. Math. 33, 643 (1932)", "Stueckelberg, Helv. Phys. Acta 33, 727 (1960)"]}}, {"uid": "GPT:GN9", "branch": "GPT", "native_id": "GN9", "inputs": ["GPT:ax-hbar"], "target": "GPT:ax-epirestrict", "logic": "single", "kind": "generates", "kind_native": "generates", "status": "theorem", "polarity": "structural", "t": 2.0, "extra": {"statement": "hbar sets the epistemic cell: the uncertainty-saturating restriction of epistricted Liouville mechanics is defined by covariance matrices obeying the hbar/2 bound - the classical uncertainty principle that generates Gaussian QM.", "refs": ["Bartlett, Rudolph, Spekkens, PRA 86, 012103 (2012)"]}}, {"uid": "GPT:GN10", "branch": "GPT", "native_id": "GN10", "inputs": ["GPT:ax-hbar"], "target": "GPT:m-classical", "logic": "single", "kind": "generates", "kind_native": "generates", "status": "theorem", "polarity": "structural", "t": 2.0, "extra": {"statement": "hbar to 0 is the contraction: Moyal bracket to Poisson bracket, star product to pointwise product, negativity scale to zero - the simplex (classical) limit of the deformation.", "refs": ["Bayen et al., Ann. Phys. 111 (1978)", "standard deformation-quantization limit"]}}, {"uid": "GPT:E12", "branch": "GPT", "native_id": "E12", "inputs": ["GPT:ax-nosig"], "target": "GPT:m-boxworld", "logic": "single", "kind": "generates", "kind_native": "generates", "status": "theorem", "polarity": "structural", "t": 2.0, "extra": {"statement": "Boxworld is the maximal theory consistent with no-signalling under the no-restriction hypothesis: square state spaces whose extremal bipartite states are PR boxes.", "refs": ["Barrett, PRA 75, 032304 (2007)"]}}, {"uid": "GPT:E13", "branch": "GPT", "native_id": "E13", "inputs": ["GPT:m-sepqt"], "target": "GPT:ax-purif", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 2.0, "extra": {"statement": "Separable quantum theory is defined by the minimal-tensor-product composition axiom; purification fails in it by construction (any purification of a mixed separable marginal would be entangled).", "refs": ["Janotta, Hinrichsen, J. Phys. A 47, 323001 (2014) (min/max tensor products)", "cf. P3, catalog"]}}, {"uid": "GPT:MH1", "branch": "GPT", "native_id": "MH1", "inputs": ["GPT:m-quantum"], "target": "GPT:s-ent", "logic": "single", "kind": "hosts", "kind_native": "hosts", "status": "theorem", "polarity": "structural", "t": 2.3, "extra": {"statement": "Complex quantum theory HOSTS entangled states: for d_A, d_B >= 2 the PSD cone strictly exceeds the separable cone (Bell states), and under purification (E6) every mixed state is the marginal of an entangled pure state. First hop of the generative chain m-quantum -> s-ent -> e-bell: continue via B2 (every pure entangled state violates some Bell inequality) with the process-side input B7 (incompatible local measurements necessary), minding B3 (mixed Werner states are Bell-blind until filtered, B5/K12).", "refs": ["Horodecki x4, RMP 81, 865 (2009)", "Gisin, Phys. Lett. A 154, 201 (1991)", "Chiribella, D'Ariano, Perinotti, PRA 81, 062348 (2010)"]}}, {"uid": "GPT:MH2", "branch": "GPT", "native_id": "MH2", "inputs": ["GPT:m-gaussian"], "target": "GPT:s-ent", "logic": "single", "kind": "hosts", "kind_native": "hosts", "status": "theorem", "polarity": "structural", "t": 2.3, "extra": {"statement": "Gaussian QM hosts entangled states (two-mode squeezed vacuum): steerable with quadratures (F2), Bell-blind under Gaussian measurements (K5), unlocked by non-Gaussian measurements (K6). Hosting a state cluster does not decide which witnesses fire - the process/witness clusters do.", "refs": ["Wiseman, Jones, Doherty, PRL 98, 140402 (2007)", "Banaszek, Wodkiewicz, PRA 58, 4345 (1998)"]}}, {"uid": "GPT:MH3", "branch": "GPT", "native_id": "MH3", "inputs": ["GPT:m-stab-odd"], "target": "GPT:s-ent", "logic": "single", "kind": "hosts", "kind_native": "hosts", "status": "theorem", "polarity": "structural", "t": 2.3, "extra": {"statement": "The odd-d stabilizer subtheory hosts genuinely entangled states (maximally entangled stabilizer states) while remaining noncontextual, with a LOCAL nonnegative model (Gross Wigner on the product phase space). Entanglement without contextuality: the counterexample blocking the reading of 'entangled' as 'contextual'.", "refs": ["Gross, J. Math. Phys. 47, 122107 (2006)", "Schmid, Du, Selby, Pusey, PRL 129, 120403 (2022)"]}}, {"uid": "GPT:MH4", "branch": "GPT", "native_id": "MH4", "inputs": ["GPT:m-boxworld"], "target": "GPT:s-ent", "logic": "single", "kind": "hosts", "kind_native": "hosts", "status": "theorem", "polarity": "structural", "t": 2.3, "extra": {"statement": "Boxworld hosts entangled states: PR boxes are entangled elements of the maximal tensor product of square state spaces, giving maximal CHSH violation despite trivial reversible dynamics (E7).", "refs": ["Barrett, PRA 75, 032304 (2007)"]}}, {"uid": "GPT:R1", "branch": "GPT", "native_id": "R1", "inputs": ["GPT:s-tts"], "target": "GPT:s-discord", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "derived", "polarity": "no_go", "t": 2.4, "extra": {"statement": "PROPOSITION R1 (this work, possibly folklore - proof in catalog): for a noninteracting bipartite Hamiltonian H = H_A + H_B whose TOTAL spectrum is nondegenerate (all sums E_i^A + E_j^B distinct), every TTS state ([rho,H]=0) is diagonal in the product energy eigenbasis, hence classical-classical: zero discord, therefore separable (S7 reversed), unsteerable (B1b) and Bell-local. Entangled or discordant TTS states exist exactly when the total spectrum is degenerate, and all their quantum correlations live inside degeneracy blocks - two equal-gap qubits host the TTS Bell state (|01>+|10>)/sqrt(2) in the {01,10} block. Consistency check: the Micadei et al. arrow-of-time reversal uses exactly such a degenerate-block coherence term. Refines SG1 into a classification: degeneracy is the sole habitat of time-translation-symmetric quantum correlations. SCOPE (C10): TTS states are block diagonal, so coherences and ENTANGLEMENT live inside degeneracy blocks; DISCORD does not - with H_A proportional to 1 and H_B nondegenerate, (1/2)(|0><0| x |0><0| + |+><+| x |1><1|) is TTS, its block components are product states, and it is discordant on A.", "refs": ["derived (catalog v2, R1)", "Micadei et al., Nat. Commun. 10, 2456 (2019)", "composition: S2 + S7 + B1b"]}}, {"uid": "GPT:R2", "branch": "GPT", "native_id": "R2", "inputs": ["GPT:p-cov"], "target": "GPT:e-incomp", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "derived", "polarity": "no_go", "t": 2.4, "extra": {"statement": "LEMMA R2 (this work): for nondegenerate H, any two TTS sharp observables are functions of H and hence commute, and every TTS POVM (all effects commuting with H) is a classical post-processing of the energy measurement; so the TTS measurement cluster contains NO incompatibility. Via Fine (B7) and the steering map (B6) this already erases Bell and steering, and commutativity of the fragment gives a one-line alternative proof of the N1 blindness column. Reading: time-translation symmetry of the probe set collapses the entire effect layer to classical stochastics; every nonclassical effect requires leaving the symmetric cluster. SCOPE (C7): the clause on the N1 blindness column holds under the tomographically complete convention; under the accessible-fragment convention commutativity alone does not exclude contextuality (combined paper, Example 1).", "refs": ["derived (catalog v2, R2)", "Fine, PRL 48, 291 (1982)", "cf. N1"]}}, {"uid": "GPT:R3", "branch": "GPT", "native_id": "R3", "inputs": ["GPT:s-ent"], "target": "GPT:e-ctx", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "derived", "polarity": "possibility", "t": 2.4, "extra": {"statement": "COMPOSED COROLLARY R3 = A8 o B3 (this work; inference checked against PG Theorem 1 wording, not stated by them explicitly): Plavala-Guhne Theorem 1 says a P&M noncontextual model for the steered states together with ALL measurements forces separability; contrapositive: every entangled state - including Werner-region states with LHV models for all single-copy measurements (Werner; Barrett) - yields a CONTEXTUAL sequential scenario. Hence Bell-local yet contextual composite scenarios exist: generalized contextuality is a strictly finer detector of composite nonclassicality than Bell violation. Scope note resolving the apparent clash with MH3: the contextual fragment contains ALL measurements on the steered side; restricted fragments (stabilizer measurements only) can stay noncontextual.", "refs": ["Plavala, Guhne, PRL 132, 100201 (2024), Thm. 1", "Werner, PRA 40, 4277 (1989)", "Barrett, PRA 65, 042302 (2002)"]}}, {"uid": "GPT:R4a", "branch": "GPT", "native_id": "R4a", "inputs": ["GPT:s-magic"], "target": "GPT:s-discord", "logic": "single", "kind": "not_implies", "kind_native": "not_implies", "status": "counterexample", "polarity": "no_go", "t": 2.4, "extra": {"statement": "Magic without discord: |T> tensor |0> is a pure product state - zero discord, zero entanglement, zero correlations of any kind - yet magic. Single-system negativity resources entail no correlation resource.", "refs": ["elementary; T state: Bravyi, Kitaev, PRA 71, 022316 (2005)"]}}, {"uid": "GPT:R4b", "branch": "GPT", "native_id": "R4b", "inputs": ["GPT:s-discord"], "target": "GPT:s-magic", "logic": "single", "kind": "not_implies", "kind_native": "not_implies", "status": "counterexample", "polarity": "no_go", "t": 2.4, "extra": {"statement": "Discord without magic: rho = (1/2)(|0><0| x |0><0| + |+><+| x |+><+|) is a mixture of stabilizer products (inside the stabilizer polytope, non-magic) but discordant on both sides. Proof: if [rho, A x I] = 0 then [P0,A] x P0 = -[P+,A] x P+; P0, P+ are linearly independent operators, so both commutators vanish, so A commutes with P0 and P+, which generate the full qubit algebra, so A is proportional to I - no nontrivial local commuting observable, hence not classical on either side. With R4a: magic and discord are logically independent clusters; no unconditional edge can ever connect them (formerly uncharted, now closed both ways).", "refs": ["derived (catalog v2, R4)", "discord: Ollivier, Zurek, PRL 88, 017901 (2001); Henderson, Vedral, J. Phys. A 34, 6899 (2001)"]}}, {"uid": "GPT:R5", "branch": "GPT", "native_id": "R5", "inputs": ["GPT:s-coh"], "target": "GPT:e-kd", "logic": "single", "kind": "necessary", "kind_native": "necessary", "status": "theorem", "polarity": "possibility", "t": 2.4, "extra": {"statement": "KD-Hudson structure (literature fill for a formerly uncharted cell): pure KD-classical states are characterized by support-uncertainty / complete-incompatibility conditions (De Bievre); noncommutation alone is NOT sufficient for KD nonpositivity (Arvidsson-Shukur, Drori, Yunger Halpern); for DFT-related bases a pure state is KD-classical iff n_A(psi) n_B(psi) = d (Xu, proving De Bievre's conjecture). The KD analogue of the Hudson boundary S6.", "refs": ["De Bievre, PRL 127, 190404 (2021) [citation confirmed via arXiv:2210.02876]", "Arvidsson-Shukur, Drori, Yunger Halpern, J. Phys. A 54, 284001 (2021)", "Xu, Phys. Lett. A 129529 (2024); arXiv:2210.02876 (DFT case: n_A n_B = d)"]}}, {"uid": "GPT:R6", "branch": "GPT", "native_id": "R6", "inputs": ["GPT:ax-epirestrict"], "target": "GPT:e-interf3", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "partial", "polarity": "no_go", "t": 2.4, "extra": {"statement": "Sorkin truncation in the epistricted shell (this work): Gaussian QM and the odd-d stabilizer subtheory are literal subtheories of quantum theory, so they inherit I3 = 0 identically. The discrete toy(-field) theory is NOT a quantum subtheory (it fails to reproduce GHZ-type stabilizer statistics), so nothing fixes its Sorkin order - new sub-gap SG4: define its three-path interferometer and compute I3. SCOPE (C11): I3 = 0 holds in Sorkin's setting (one system, orthogonal path subspaces, blocking = projection, fixed final effect); a Gaussian three-mode experiment with blocking by loss, coherent inputs and homodyne detection has a generically nonzero third difference. In odd prime dimension the epistricted theories coincide operationally with the stabilizer subtheory, so the open Sorkin-order question SG4 concerns the BINARY toy theory.", "refs": ["inheritance: Bartlett, Rudolph, Spekkens, PRA 86, 012103 (2012); Gross, JMP 47, 122107 (2006)", "toy vs qubit-stabilizer divergence: Spekkens, PRA 75, 032110 (2007); Catani, Browne, NJP 19, 073035 (2017)", "Sorkin, Mod. Phys. Lett. A 9, 3119 (1994)"]}}, {"uid": "GPT:A1", "branch": "GPT", "native_id": "A1", "inputs": ["GPT:e-incomp"], "target": "GPT:m-classical", "logic": "single", "kind": "excludes", "kind_native": "excludes", "status": "theorem", "polarity": "no_go", "t": 1.0, "extra": {"statement": "Incompatible measurements exist iff the state space is not a simplex: all measurements of a GPT are compatible iff the theory is classical.", "refs": ["Plavala, PRA 94, 042108 (2016)", "Kuramochi, arXiv:1912.00563 (infinite-dim.)"]}}, {"uid": "GPT:A2", "branch": "GPT", "native_id": "A2", "inputs": ["GPT:e-nobc"], "target": "GPT:m-classical", "logic": "single", "kind": "excludes", "kind_native": "excludes", "status": "theorem", "polarity": "no_go", "t": 1.0, "extra": {"statement": "Generalized no-broadcasting: a GPT admits universal broadcasting iff it is classical; every nonclassical GPT has no-cloning.", "refs": ["Barnum, Barrett, Leifer, Wilce, PRL 99, 240501 (2007)"]}}, {"uid": "GPT:A3", "branch": "GPT", "native_id": "A3", "inputs": ["GPT:m-classical"], "target": "GPT:s-ent", "logic": "single", "kind": "excludes", "kind_native": "excludes", "status": "theorem", "polarity": "no_go", "t": 1.0, "extra": {"statement": "Entangleability of cones - read the polarity: classical ⇔ NO entanglement. Setup: min⊗ = convex hull of product states (separable only); max⊗ = all states positive on every product effect; any consistent composite cone sits between them, and 'entangled' means outside min⊗. THEOREM: min⊗ = max⊗ iff at least one factor is classical (simplicial). Easy direction: a classical factor makes every composite state separable (expand in the simplex basis: w = sum_i e_i ⊗ w_i with w_i = (e_i* ⊗ id)(w) in the other cone), so entanglement with a classical system is impossible - correlation yes, entanglement never. Hard direction (Barker's conjecture, open ~40 years, proved 2021): if BOTH factors are nonclassical, min⊗ ≠ max⊗, so some consistent composite contains entangled states or entangled effects. 'CAN be entangled', not 'must': postulating the minimal tensor product (m-sepqt) remains consistent - actual entanglement is forced only by composition axioms such as purification (E6) or decoherence-to-classical (E10).", "refs": ["Aubrun, Lami, Palazuelos, Plavala, Geom. Funct. Anal. 31, 181 (2021); arXiv:1911.09663"]}}, {"uid": "GPT:A4", "branch": "GPT", "native_id": "A4", "inputs": ["GPT:s-coh"], "target": "GPT:s-ent", "logic": "single", "kind": "equiv", "kind_native": "equiv", "status": "theorem", "polarity": "structural", "t": 1.0, "extra": {"statement": "For any two GPTs: (i) each is nonclassical, (ii) each has strong incompatibility ('superposition'), (iii) the pair is entangleable (entangled states or entangled measurements) - all equivalent. Superposition also suffices to run BB84.", "refs": ["Aubrun, Lami, Palazuelos, Plavala, PRL 128, 160402 (2022); arXiv:2109.04446"]}}, {"uid": "GPT:A5", "branch": "GPT", "native_id": "A5", "inputs": ["GPT:e-ctx"], "target": "GPT:m-classical", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 1.0, "extra": {"statement": "A prepare-measure GPT fragment admits a generalized-noncontextual ontological model iff it is simplex-embeddable (state space embeds in a simplex, effects in its dual).", "refs": ["Schmid, Selby, Wolfe, Kunjwal, Spekkens, PRX Quantum 2, 010331 (2021)", "Shahandeh, PRX Quantum 2, 010330 (2021)"]}}, {"uid": "GPT:A6", "branch": "GPT", "native_id": "A6", "inputs": ["GPT:e-ctx"], "target": "GPT:e-kd", "logic": "single", "kind": "equiv", "kind_native": "equiv", "status": "theorem", "polarity": "structural", "t": 1.0, "extra": {"statement": "Generalized noncontextuality is equivalent to the existence of a nonnegative quasiprobability representation; contextuality = negativity in every such representation.", "refs": ["Spekkens, PRL 101, 020401 (2008)", "Schmid, Selby, Pusey, Spekkens, arXiv:2005.07161"]}}, {"uid": "GPT:A7", "branch": "GPT", "native_id": "A7", "inputs": ["GPT:e-ctx"], "target": "GPT:s-ent", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "derived", "polarity": "possibility", "t": 1.0, "extra": {"statement": "DERIVED COROLLARY (P1): a contextual (tomographically complete) fragment forces a nonsimplicial cone (A5), hence by entangleability of cones (A3) every beyond-minimal composite with another nonclassical system supports entangled states. Converse fails: Spekkens' toy theory is nonsimplicial (entangleable) yet noncontextual. STATUS NOTE (combined paper): a one-step composition of two published theorems; not found stated explicitly (search 2026-11-01) but elementary enough to be folklore - a composed corollary, not a new result.", "refs": ["Derived from PRX Quantum 2, 010331 (2021) + GAFA 31, 181 (2021); escape route: m-sepqt"]}}, {"uid": "GPT:A8", "branch": "GPT", "native_id": "A8", "inputs": ["GPT:s-ent"], "target": "GPT:e-ctx", "logic": "single", "kind": "necessary", "kind_native": "necessary", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Contextuality is a precondition for entanglement: entanglement in a nonlocal scenario can arise only if the sequential scenario obtained by remote state preparation exhibits preparation-and-measurement contextuality; robust absence of entanglement implies absence of contextuality. Noncontextuality inequalities map to entanglement witnesses and vice versa.", "refs": ["Plavala, Guhne, PRL 132, 100201 (2024); arXiv:2209.09942"]}}, {"uid": "GPT:A9", "branch": "GPT", "native_id": "A9", "inputs": ["GPT:e-nobc"], "target": "GPT:e-ctx", "logic": "single", "kind": "equiv", "kind_native": "equiv", "status": "theorem", "polarity": "structural", "t": 1.0, "extra": {"statement": "No-broadcasting characterizes operational contextuality (broadcastability of a fragment corresponds to the existence of a noncontextual model).", "refs": ["Jokinen, Weilenmann, Plavala, Pellonpaa, Kiukas, Uola, PRL 133, 240201 (2024); arXiv:2406.07305"]}}, {"uid": "GPT:A10", "branch": "GPT", "native_id": "A10", "inputs": ["GPT:e-incomp"], "target": "GPT:e-ctx", "logic": "single", "kind": "not_implies", "kind_native": "not_implies", "status": "counterexample", "polarity": "no_go", "t": 1.0, "extra": {"statement": "Incompatibility is neither necessary nor sufficient for generalized contextuality: epistricted theories have incompatible measurements yet are noncontextual, and every quantum contextuality proof can be converted to one using only compatible measurements (even a single CV projective measurement suffices).", "refs": ["Selby, Schmid, Wolfe, Sainz, Kunjwal, Spekkens, PRL 130, 230201 (2023); arXiv:2106.09045", "Plavala, arXiv:2601.14067"]}}, {"uid": "GPT:A11", "branch": "GPT", "native_id": "A11", "inputs": ["GPT:e-incomp"], "target": "GPT:e-ctx", "logic": "single", "kind": "equiv", "kind_native": "equiv", "status": "partial", "polarity": "structural", "t": 1.0, "extra": {"statement": "Conditional equivalence: when ALL quantum states are available as preparations, measurement incompatibility (equivalently steerability) is necessary and sufficient for operational contextuality.", "refs": ["Tavakoli, Uola, Phys. Rev. Research 2, 013011 (2020)"]}}, {"uid": "GPT:B1", "branch": "GPT", "native_id": "B1", "inputs": ["GPT:e-bell"], "target": "GPT:e-steer", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Strict hierarchy: Bell nonlocality implies steerability implies entanglement, with strict inclusions at each level (Werner states witness strictness).", "refs": ["Wiseman, Jones, Doherty, PRL 98, 140402 (2007)", "Quintino et al., PRA 92, 032107 (2015)"]}}, {"uid": "GPT:B1b", "branch": "GPT", "native_id": "B1b", "inputs": ["GPT:e-steer"], "target": "GPT:s-ent", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Steering implies entanglement (LHS models exist for all separable states); inclusion strict.", "refs": ["Wiseman, Jones, Doherty, PRL 98, 140402 (2007)"]}}, {"uid": "GPT:B2", "branch": "GPT", "native_id": "B2", "inputs": ["GPT:s-ent"], "target": "GPT:e-bell", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "partial", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Gisin's theorem: every PURE bipartite (and multipartite) entangled state violates some Bell inequality. Fails for mixed states.", "refs": ["Gisin, Phys. Lett. A 154, 201 (1991)", "Popescu, Rohrlich, Phys. Lett. A 166, 293 (1992)"]}}, {"uid": "GPT:B3", "branch": "GPT", "native_id": "B3", "inputs": ["GPT:s-ent"], "target": "GPT:e-bell", "logic": "single", "kind": "not_implies", "kind_native": "not_implies", "status": "counterexample", "polarity": "no_go", "t": 1.0, "extra": {"statement": "Werner states: entangled mixed states admitting local hidden variable models for all projective measurements, and even for all POVMs.", "refs": ["Werner, PRA 40, 4277 (1989)", "Barrett, PRA 65, 042302 (2002)"]}}, {"uid": "GPT:B4", "branch": "GPT", "native_id": "B4", "inputs": ["GPT:s-ent"], "target": "GPT:e-bell", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "In the measurement-device-independent (semiquantum game) scenario every entangled state outperforms separable ones: 'all entangled states are nonlocal' with quantum inputs.", "refs": ["Buscemi, PRL 108, 200401 (2012)"]}}, {"uid": "GPT:B5", "branch": "GPT", "native_id": "B5", "inputs": ["GPT:s-ent"], "target": "GPT:e-bell", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "partial", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Activation: local filtering reveals hidden nonlocality (even genuinely, for states with LHV models for the filtered statistics), and nonlocality can be superactivated by taking many copies.", "refs": ["Popescu, PRL 74, 2619 (1995)", "Hirsch, Quintino, Bowles, Brunner, PRL 111, 160402 (2013)", "Palazuelos, PRL 109, 190401 (2012)"]}}, {"uid": "GPT:B6", "branch": "GPT", "native_id": "B6", "inputs": ["GPT:e-incomp"], "target": "GPT:e-steer", "logic": "single", "kind": "equiv", "kind_native": "equiv", "status": "theorem", "polarity": "structural", "t": 1.0, "extra": {"statement": "One-to-one map: a measurement assemblage is steerable iff the steering party's measurements are incompatible (quantum theory); joint measurability implies an LHS model and vice versa.", "refs": ["Quintino, Vertesi, Brunner, PRL 113, 160402 (2014)", "Uola, Moroder, Guhne, PRL 113, 160403 (2014)", "Uola, Budroni, Guhne, Pellonpaa, PRL 115, 230402 (2015)"]}}, {"uid": "GPT:B7", "branch": "GPT", "native_id": "B7", "inputs": ["GPT:e-incomp"], "target": "GPT:e-bell", "logic": "single", "kind": "necessary", "kind_native": "necessary", "status": "partial", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Compatible measurements never violate any Bell inequality (Fine); any incompatible PAIR of dichotomic measurements violates CHSH with a suitable state and partner; but general incompatible SETS need not enable any Bell violation.", "refs": ["Fine, PRL 48, 291 (1982)", "Wolf, Perez-Garcia, Fernandez, PRL 103, 230402 (2009)", "Bene, Vertesi, NJP 20, 013021 (2018)", "Hirsch, Quintino, Brunner, PRA 97, 012129 (2018)"]}}, {"uid": "GPT:B8", "branch": "GPT", "native_id": "B8", "inputs": ["GPT:s-bound"], "target": "GPT:t-witness", "logic": "single", "kind": "open", "kind_native": "open", "status": "open", "polarity": "open", "t": 1.0, "extra": {"statement": "OPEN (since 1998): do NPT bound entangled states exist (is PPT necessary for undistillability)? PPT implies undistillable is a theorem.", "refs": ["Horodecki, Horodecki, Horodecki, PRL 80, 5239 (1998)", "DiVincenzo et al., PRA 61, 062312 (2000)"]}}, {"uid": "GPT:B9", "branch": "GPT", "native_id": "B9", "inputs": ["GPT:s-bound"], "target": "GPT:e-bell", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "counterexample", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Peres conjecture is FALSE: there exist PPT (bound) entangled states violating a Bell inequality; bound entanglement can also be steerable.", "refs": ["Vertesi, Brunner, Nat. Commun. 5, 5297 (2014)", "Moroder, Gittsovich, Huber, Guhne, PRL 113, 050404 (2014)"]}}, {"uid": "GPT:B10", "branch": "GPT", "native_id": "B10", "inputs": ["GPT:s-ent"], "target": "GPT:t-witness", "logic": "single", "kind": "witness", "kind_native": "witness", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "A state is entangled iff some entanglement witness detects it (Hahn-Banach); yet deciding separability is NP-hard, so no efficient universal witness exists.", "refs": ["Horodecki x3, Phys. Lett. A 223, 1 (1996)", "Terhal, Phys. Lett. A 271, 319 (2000)", "Gurvits, Proc. STOC 2003, 10"]}}, {"uid": "GPT:B11", "branch": "GPT", "native_id": "B11", "inputs": ["GPT:e-bell"], "target": "GPT:t-undecide", "logic": "single", "kind": "witness", "kind_native": "witness", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "The quantum correlation set is not closed, and approximating the quantum value of a nonlocal game is undecidable (MIP* = RE); Tsirelson's problem and Connes' embedding conjecture resolved in the negative.", "refs": ["Slofstra, Forum Math. Pi 7, e1 (2019)", "Ji, Natarajan, Vidick, Wright, Yuen, arXiv:2001.04383; CACM 64(11), 131 (2021)"]}}, {"uid": "GPT:B12", "branch": "GPT", "native_id": "B12", "inputs": ["GPT:e-bell"], "target": "GPT:t-di", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Bell violation certifies randomness expansion and device-independent QKD.", "refs": ["Pironio et al., Nature 464, 1021 (2010)", "Acin et al., PRL 98, 230501 (2007)"]}}, {"uid": "GPT:B13", "branch": "GPT", "native_id": "B13", "inputs": ["GPT:e-steer"], "target": "GPT:t-1sdi", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Steering certifies one-sided device-independent QKD.", "refs": ["Branciard, Cavalcanti, Walborn, Scarani, Wiseman, PRA 85, 010301(R) (2012)"]}}, {"uid": "GPT:B14", "branch": "GPT", "native_id": "B14", "inputs": ["GPT:s-ent"], "target": "GPT:e-ks", "logic": "single", "kind": "necessary", "kind_native": "necessary", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "For multiqubit systems, every logical KS proof requires entangled measurements and every statistical KS proof requires an entangled state; not every entangled state yields one.", "refs": ["Wright, Kunjwal, Quantum 7, 900 (2023)"]}}, {"uid": "GPT:B15", "branch": "GPT", "native_id": "B15", "inputs": ["GPT:e-ks"], "target": "GPT:e-bell", "logic": "single", "kind": "equiv", "kind_native": "equiv", "status": "partial", "polarity": "structural", "t": 1.0, "extra": {"statement": "Structural bridges: invertible map between Bell-nonlocality and contextuality scenarios; contextuality can be converted into nonlocality; graph-theoretic (CSW) bounds unify both.", "refs": ["Wright, Farkas, PRL 131, 220202 (2023)", "Cabello, PRL 127, 070401 (2021)", "Cabello, Severini, Winter, PRL 112, 040401 (2014)"]}}, {"uid": "GPT:B16", "branch": "GPT", "native_id": "B16", "inputs": ["GPT:e-ks"], "target": "GPT:e-bell", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "partial", "polarity": "no_go", "t": 1.0, "extra": {"statement": "Monogamy between contextuality and nonlocality: in combined scenarios the two resources trade off (no-disturbance monogamy).", "refs": ["Kurzynski, Cabello, Kaszlikowski, PRL 112, 100401 (2014)"]}}, {"uid": "GPT:C1", "branch": "GPT", "native_id": "C1", "inputs": ["GPT:s-wneg"], "target": "GPT:e-ksdep", "logic": "single", "kind": "equiv", "kind_native": "equiv", "status": "theorem", "polarity": "structural", "t": 1.0, "extra": {"statement": "Odd prime dimension: a qudit state enables violation of a noncontextuality inequality with stabilizer measurements iff its discrete Wigner function is negative ('contextuality supplies the magic').", "refs": ["Howard, Wallman, Veitch, Emerson, Nature 510, 351 (2014)", "Delfosse et al. (rebits), PRX 5, 021003 (2015)"]}}, {"uid": "GPT:C2", "branch": "GPT", "native_id": "C2", "inputs": ["GPT:s-wneg"], "target": "GPT:e-ctx", "logic": "single", "kind": "equiv", "kind_native": "equiv", "status": "theorem", "polarity": "structural", "t": 1.0, "extra": {"statement": "Continuous variables: contextuality and Wigner negativity are equivalent with respect to CV Pauli (quadrature-displacement) measurements - CV analogue of Howard et al.", "refs": ["Booth, Chabaud, Emeriau, PRL 129, 230401 (2022)", "arXiv:2112.14788 (homodyne version)"]}}, {"uid": "GPT:C3", "branch": "GPT", "native_id": "C3", "inputs": ["GPT:s-wneg"], "target": "GPT:t-mbqc", "logic": "single", "kind": "necessary", "kind_native": "necessary", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Nonnegative Wigner functions (odd d; CV) admit efficient classical simulation of the circuit, so Wigner negativity is necessary for quantum speedup in these settings.", "refs": ["Veitch, Ferrie, Gross, Emerson, NJP 14, 113011 (2012)", "Mari, Eisert, PRL 109, 230503 (2012)"]}}, {"uid": "GPT:C4", "branch": "GPT", "native_id": "C4", "inputs": ["GPT:s-magic"], "target": "GPT:t-mbqc", "logic": "single", "kind": "necessary", "kind_native": "necessary", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Magic states are the resource promoting fault-tolerant stabilizer operations to universality; quantified by the resource theory of stabilizer computation.", "refs": ["Bravyi, Kitaev, PRA 71, 022316 (2005)", "Veitch, Mousavian, Gottesman, Emerson, NJP 16, 013009 (2014)"]}}, {"uid": "GPT:C5", "branch": "GPT", "native_id": "C5", "inputs": ["GPT:m-stab-odd"], "target": "GPT:e-ctx", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 1.0, "extra": {"statement": "The odd-d stabilizer subtheory has a UNIQUE nonnegative diagram-preserving quasiprobability representation - Gross's Wigner function, equivalent to Spekkens' epistricted toy theory - hence it is noncontextual, with a singled-out classical model.", "refs": ["Schmid, Du, Selby, Pusey, PRL 129, 120403 (2022)", "Gross, J. Math. Phys. 47, 122107 (2006)", "Catani, Browne, NJP 19, 073035 (2017)"]}}, {"uid": "GPT:C6", "branch": "GPT", "native_id": "C6", "inputs": ["GPT:m-stab-even"], "target": "GPT:e-ctx", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "In all even dimensions no nonnegative diagram-preserving quasiprobability representation of the stabilizer subtheory exists: the qubit stabilizer subtheory is generalized-contextual (and state-independently KS-contextual via the Mermin square).", "refs": ["Schmid, Du, Selby, Pusey, PRL 129, 120403 (2022)", "Mermin, PRL 65, 3373 (1990)"]}}, {"uid": "GPT:C7", "branch": "GPT", "native_id": "C7", "inputs": ["GPT:e-ctx"], "target": "GPT:t-mbqc", "logic": "single", "kind": "necessary", "kind_native": "necessary", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Generalized contextuality is a necessary resource for universal quantum computation in the state-injection model (odd d via uniqueness of the Gross representation; qubits via even-d contextuality); KS-contextuality similarly powers MBQC and shallow-circuit advantage.", "refs": ["Schmid, Du, Selby, Pusey, PRL 129, 120403 (2022)", "Howard et al., Nature 510, 351 (2014)", "Raussendorf, PRA 88, 022322 (2013)", "Anders, Browne, PRL 102, 050502 (2009)", "Bravyi, Gosset, Konig, Science 362, 308 (2018)"]}}, {"uid": "GPT:C8", "branch": "GPT", "native_id": "C8", "inputs": ["GPT:s-wneg"], "target": "GPT:t-mbqc", "logic": "single", "kind": "not_implies", "kind_native": "not_implies", "status": "counterexample", "polarity": "no_go", "t": 1.0, "extra": {"statement": "CAVEAT: a nonnegative probabilistic hidden-variable model (Bayesian updates on a finite state space) covers universal quantum computation with magic states for qubits and all qudit dimensions. It is not diagram-preserving, so it evades the noncontextuality no-gos - negativity is representation-relative; generalized contextuality is the invariant statement.", "refs": ["Zurel, Okay, Raussendorf, PRL 125, 260404 (2020)", "Zurel, Okay, Raussendorf, Heimendahl, Quantum 8, 1323 (2024)"]}}, {"uid": "GPT:C9", "branch": "GPT", "native_id": "C9", "inputs": ["GPT:e-kd"], "target": "GPT:e-ctx", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "partial", "polarity": "possibility", "t": 1.0, "extra": {"statement": "KD nonpositivity of suitable experiments implies negativity of every quasiprobability representation, hence contextuality; anomalous weak values are its operational face. Caution: not every KD-negative assignment certifies contextuality once general KD representations are allowed.", "refs": ["Arvidsson-Shukur et al. (KD review), NJP 2024; arXiv:2403.18899", "Schmid, Baldijao, Ying, Wagner, Selby, arXiv:2405.04573"]}}, {"uid": "GPT:C10", "branch": "GPT", "native_id": "C10", "inputs": ["GPT:e-weak"], "target": "GPT:e-ctx", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Anomalous weak values are proofs of generalized contextuality.", "refs": ["Pusey, PRL 113, 200401 (2014)"]}}, {"uid": "GPT:C11", "branch": "GPT", "native_id": "C11", "inputs": ["GPT:e-kd"], "target": "GPT:t-metro", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "KD negativity underlies anomalous postselected Fisher information (metrology beyond classical limits); recently argued necessary for quantum-computational advantage.", "refs": ["Arvidsson-Shukur et al., Nat. Commun. 11, 3775 (2020)", "arXiv:2506.08092"]}}, {"uid": "GPT:C12", "branch": "GPT", "native_id": "C12", "inputs": ["GPT:e-ctx"], "target": "GPT:t-pom", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Preparation contextuality powers parity-oblivious multiplexing (the optimal quantum advantage is a preparation-noncontextuality violation).", "refs": ["Spekkens, Buzacott, Keehn, Toner, Pryde, PRL 102, 010401 (2009)"]}}, {"uid": "GPT:C13", "branch": "GPT", "native_id": "C13", "inputs": ["GPT:e-ctx"], "target": "GPT:t-disc", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Contextual advantage for minimum-error state discrimination.", "refs": ["Schmid, Spekkens, PRX 8, 011015 (2018)"]}}, {"uid": "GPT:C14", "branch": "GPT", "native_id": "C14", "inputs": ["GPT:e-ks"], "target": "GPT:e-ksdep", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Every KS proof converts to a state-dependent noncontextuality inequality violated by every state (statistical form); state-dependent KS contextuality exists from d=3 (KCBS) and requires a non-chordal compatibility graph.", "refs": ["Klyachko, Can, Binicioglu, Shumovsky, PRL 101, 020403 (2008)", "Kunjwal, Spekkens, PRL 115, 110403 (2015)", "Xu, Cabello, PRA 99, 020103(R) (2019)"]}}, {"uid": "GPT:D1", "branch": "GPT", "native_id": "D1", "inputs": ["GPT:s-coh"], "target": "GPT:s-ent", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Within quantum theory, coherence converts faithfully to entanglement by incoherent operations plus an incoherent ancilla (entanglement generated is bounded by input coherence); coherence likewise activates discord.", "refs": ["Streltsov, Singh, Dhar, Bera, Adesso, PRL 115, 020403 (2015)", "Ma, Yadin, Girolami, Vedral, Gu, PRL 116, 160407 (2016)"]}}, {"uid": "GPT:D2", "branch": "GPT", "native_id": "D2", "inputs": ["GPT:s-coh"], "target": "GPT:e-ctx", "logic": "single", "kind": "necessary", "kind_native": "necessary", "status": "derived", "polarity": "possibility", "t": 1.0, "extra": {"statement": "PROPOSITION P2: a prepare-measure fragment whose states and effects are all diagonal in one basis is simplex-embeddable, hence noncontextual; so every contextuality proof needs basis-independent coherence of the state set. Quantitative witnesses exist in interferometric scenarios (event-graph / MZI inequalities). SCOPE (C7, combined paper 2026-11-01): holds when operational equivalence is judged against all of quantum theory (tomographically complete convention); diagonal STATES suffice, effects may be arbitrary. Under the accessible-fragment convention it fails: four diagonal states with the commuting effects P1+P2 and P1+P3 form a preparation-contextual fragment (combined paper, Example 1).", "refs": ["Wagner, Camillini, Galvao, Quantum 8, 1240 (2024)", "Plavala, arXiv:2601.14067 (set coherence <-> contextuality confirmation)"]}}, {"uid": "GPT:D3", "branch": "GPT", "native_id": "D3", "inputs": ["GPT:s-coh"], "target": "GPT:e-ctx", "logic": "single", "kind": "not_implies", "kind_native": "not_implies", "status": "counterexample", "polarity": "no_go", "t": 1.0, "extra": {"statement": "Coherence does NOT suffice for contextuality: epistricted theories (Spekkens toy, Gaussian, odd-d stabilizer) display superposition-like structure and full two-path interference phenomenology (double slit, Elitzur-Vaidman, delayed choice, quantum eraser) while remaining noncontextual. Only specific further aspects of interference are genuinely nonclassical.", "refs": ["Spekkens, PRA 75, 032110 (2007)", "Catani, Leifer, Schmid, Spekkens, Quantum 7, 1119 (2023)", "Catani, Leifer, Scala, Schmid, Spekkens, PRA 2023 (genuinely nonclassical interference)", "Catani et al., PRL 2022 (uncertainty relations)"]}}, {"uid": "GPT:D4", "branch": "GPT", "native_id": "D4", "inputs": ["GPT:s-coh"], "target": "GPT:e-ctx", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "partial", "polarity": "possibility", "t": 1.0, "extra": {"statement": "No coherence threshold: contextuality proofs exist with maximal robustness to dephasing, i.e. arbitrarily small (vanishing) coherence still witnesses contextuality - coherence is necessary but its magnitude is not the resource.", "refs": ["Rossi, Schmid, Selby, Sainz, PRA 2023; arXiv:2212.06856"]}}, {"uid": "GPT:D6", "branch": "GPT", "native_id": "D6", "inputs": ["GPT:m-realqm"], "target": "GPT:e-bell", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 1.0, "extra": {"statement": "Real-amplitude quantum theory (with real tensor composites) reproduces single-site statistics but fails in quantum networks: a three-party entanglement-swapping Bell test separates complex from real QM, and experiments violate the real-QM bound. Imaginarity is a genuine resource.", "refs": ["Renou et al., Nature 600, 625 (2021)", "Li et al., PRL 128, 040402 (2022)", "Chen et al., PRL 128, 040403 (2022)", "Wu et al., PRL 126, 090401 (2021)"]}}, {"uid": "GPT:E1", "branch": "GPT", "native_id": "E1", "inputs": ["GPT:ax-nosig"], "target": "GPT:e-pr", "logic": "single", "kind": "not_implies", "kind_native": "not_implies", "status": "theorem", "polarity": "no_go", "t": 1.0, "extra": {"statement": "No-signalling alone does not forbid superquantum correlations: PR boxes reach CHSH = 4.", "refs": ["Popescu, Rohrlich, Found. Phys. 24, 379 (1994)"]}}, {"uid": "GPT:E2", "branch": "GPT", "native_id": "E2", "inputs": ["GPT:ax-ic"], "target": "GPT:e-pr", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "partial", "polarity": "no_go", "t": 1.0, "extra": {"statement": "Information causality implies the Tsirelson bound (CHSH <= 2 sqrt 2); whether it carves out exactly the quantum set is OPEN.", "refs": ["Pawlowski, Paterek, Kaszlikowski, Scarani, Winter, Zukowski, Nature 461, 1101 (2009)"]}}, {"uid": "GPT:E3", "branch": "GPT", "native_id": "E3", "inputs": ["GPT:ax-ml"], "target": "GPT:e-pr", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 1.0, "extra": {"statement": "Macroscopic locality bounds correlations to the (strictly larger than quantum) NPA level Q1.", "refs": ["Navascues, Wunderlich, Proc. R. Soc. A 466, 881 (2010)"]}}, {"uid": "GPT:E4", "branch": "GPT", "native_id": "E4", "inputs": ["GPT:ax-lo"], "target": "GPT:e-pr", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 1.0, "extra": {"statement": "Local orthogonality / exclusivity rules out PR boxes and reproduces the quantum (Lovasz-theta) bound of the KCBS contextuality inequality.", "refs": ["Fritz, Sainz, Augusiak, Brask, Chaves, Leverrier, Acin, Nat. Commun. 4, 2263 (2013)", "Cabello, PRL 110, 060402 (2013)", "Cabello, Severini, Winter, PRL 112, 040401 (2014)"]}}, {"uid": "GPT:E5", "branch": "GPT", "native_id": "E5", "inputs": ["GPT:m-aq"], "target": "GPT:ax-norestrict", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 1.0, "extra": {"statement": "Almost-quantum correlations satisfy the main device-independent principles yet strictly exceed quantum; NO GPT satisfying the no-restriction hypothesis reproduces them - a restriction on measurements is forced.", "refs": ["Navascues, Guryanova, Hoban, Acin, Nat. Commun. 6, 6288 (2015)", "Sainz, Guryanova, Acin, Navascues, PRL 120, 200402 (2018)"]}}, {"uid": "GPT:E6", "branch": "GPT", "native_id": "E6", "inputs": ["GPT:ax-purif"], "target": "GPT:s-ent", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Purification forces entanglement (purifications of mixed states are entangled) and yields no-cloning, steering of ensembles, probabilistic teleportation, reversible dilation and no-information-without-disturbance; with five further informational axioms (causality, perfect distinguishability, ideal compression, local tomography, atomicity of composition) it singles out quantum theory.", "refs": ["Chiribella, D'Ariano, Perinotti, PRA 81, 062348 (2010)", "Chiribella, D'Ariano, Perinotti, PRA 84, 012311 (2011)", "Masanes, Muller, NJP 13, 063001 (2011)", "Hardy, quant-ph/0101012"]}}, {"uid": "GPT:E7", "branch": "GPT", "native_id": "E7", "inputs": ["GPT:m-boxworld"], "target": "GPT:e-pr", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 1.0, "extra": {"statement": "Boxworld attains maximal no-signalling nonlocality (PR boxes) but all its reversible dynamics are trivial (local operations + permutations): no entanglement swapping, no dynamics-based teleportation.", "refs": ["Barrett, PRA 75, 032304 (2007)", "Gross, Muller, Colbeck, Dahlsten, PRL 104, 080402 (2010)"]}}, {"uid": "GPT:E8", "branch": "GPT", "native_id": "E8", "inputs": ["GPT:m-quantum"], "target": "GPT:e-pr", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 1.0, "extra": {"statement": "CEILING, not source: locally quantum systems + no-signalling composition force all bipartite correlations into the quantum set, so superquantum (PR) correlations are excluded and the Tsirelson bound emerges from local structure alone. The GENERATIVE route to Bell violation is the chain m-quantum -hosts-> s-ent (MH1) -> e-bell (B2: pure entangled states, with incompatible measurements per B7); this edge only caps that chain from above.", "refs": ["Barnum, Beigi, Boixo, Elliott, Wehner, PRL 104, 140401 (2010)", "Tsirelson, Lett. Math. Phys. 4, 93 (1980)"]}}, {"uid": "GPT:E9", "branch": "GPT", "native_id": "E9", "inputs": ["GPT:ax-sorkin"], "target": "GPT:e-interf3", "logic": "single", "kind": "forbids", "kind_native": "forbids", "status": "theorem", "polarity": "no_go", "t": 1.0, "extra": {"statement": "Quantum theory has exactly second-order interference (Sorkin hierarchy truncates); experiments bound third-order terms; higher-order interference is excluded by purity principles in GPTs, while 'density cube' theories realize it.", "refs": ["Sorkin, Mod. Phys. Lett. A 9, 3119 (1994)", "Sinha et al., Science 329, 418 (2010)", "Barnum, Muller, Ududec, NJP 16, 123029 (2014)", "Dak
