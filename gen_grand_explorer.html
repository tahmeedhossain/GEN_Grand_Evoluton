: ["Winter, Yang, PRL 116, 120404 (2016) [knowledge]", "Brandao, Gour, PRL 115, 070503 (2015) [knowledge]"], "via": "incoherent operations (IO), generic mixed states"}}, {"uid": "QRT:C17", "branch": "QRT", "native_id": "C17", "inputs": ["QRT:sR-mag"], "target": "QRT:pX-mag", "logic": "single", "kind": "irreversible", "kind_native": "irreversible", "status": "partial", "polarity": "no_go", "t": 1.1, "extra": {"statement": "Magic is asymptotically irreversible under stabilizer protocols: maximal-mana state classes exist that do not interconvert at unit rate; Wigner-positive magic cannot be distilled at all.", "refs": ["Wang, Wilde, Su [verify: PRL 124, 090505 (2020) / NJP 21, 103002 (2019)]", "Veitch et al., NJP 14, 113011 (2012) [knowledge]"], "via": "stabilizer operations"}}, {"uid": "QRT:C18", "branch": "QRT", "native_id": "C18", "inputs": ["QRT:p-cat"], "target": "QRT:pU-ent", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Catalysis changes the pre-order: entanglement catalysis (LOCC + returned catalyst) enables otherwise impossible pure-state conversions; catalytic coherence enables repeated coherence use; a candidate route around pX-ent via entanglement batteries (QG9).", "refs": ["Jonathan, Plenio, PRL 83, 3566 (1999) [knowledge]", "Aberg, PRL 113, 150402 (2014) [knowledge]", "Datta et al., Rep. Prog. Phys. 86, 116002 (2023) [verified]"], "via": null}}, {"uid": "QRT:C19", "branch": "QRT", "native_id": "C19", "inputs": ["QRT:sR-inc"], "target": "QRT:sR-ste", "logic": "single", "kind": "converts_to", "kind_native": "converts_to", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Incompatibility converts to steering: measuring an incompatible set on one half of a maximally entangled state produces a steerable assemblage, and every steerable assemblage arises this way (the constructive direction of SS10).", "refs": ["Uola et al., PRL 115, 230402 (2015) [verified]", "Quintino, Vertesi, Brunner, PRL 113, 160402 (2014) [knowledge]"], "via": "applying the incompatible set to one wing of a full-Schmidt-rank entangled state"}}, {"uid": "QRT:P1", "branch": "QRT", "native_id": "P1", "inputs": ["QRT:pF-nlo"], "target": "QRT:pF-ste", "logic": "single", "kind": "subset", "kind_native": "subset", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "Operation ladder, first rung: LOSR is a strict subset of 1W-LOCC (adding one-way communication from the trusted wing).", "refs": ["Gallego, Aolita, PRX 5, 041008 (2015) [knowledge]", "Wolfe et al., Quantum 4, 280 (2020) [verified]"], "via": null}}, {"uid": "QRT:P1b", "branch": "QRT", "native_id": "P1b", "inputs": ["QRT:pF-ste"], "target": "QRT:pF-ent", "logic": "single", "kind": "subset", "kind_native": "subset", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "Operation ladder, second rung: 1W-LOCC is a strict subset of LOCC; above LOCC the ladder continues through SEP-ops, PPT-ops, NE. Each rung changes which states count as equivalent resources.", "refs": ["Gallego, Aolita, PRX 5, 041008 (2015) [knowledge]", "Horodecki x4, RMP 81, 865 (2009) [knowledge]"], "via": null}}, {"uid": "QRT:P2", "branch": "QRT", "native_id": "P2", "inputs": ["QRT:pF-asy"], "target": "QRT:pF-coh", "logic": "single", "kind": "contains", "kind_native": "contains", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "TIO (covariant for U(1)) is a strict subset of DIO; SIO < IO, DIO < MIO; IO and DIO incomparable: the coherence free-op lattice, with the symmetry-justified class at the bottom.", "refs": ["Marvian, Spekkens, PRA 94, 052324 (2016) [verified]", "Chitambar, Gour, PRL 117, 030401 (2016) [verify]"], "via": null}}, {"uid": "QRT:P3", "branch": "QRT", "native_id": "P3", "inputs": ["QRT:pF-ath"], "target": "QRT:pF-coh", "logic": "single", "kind": "contains", "kind_native": "contains", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "TO are time-translation covariant AND Gibbs-preserving; GPO strictly exceeds TO because a Gibbs-preserving map can create energy coherence while TO (covariant) cannot. Whether TO = GPO intersect TIO exactly is QG2.", "refs": ["Faist, Oppenheim, Renner, NJP 17, 043003 (2015) [verified]"], "via": null}}, {"uid": "QRT:P4", "branch": "QRT", "native_id": "P4", "inputs": ["QRT:pF-pur"], "target": "QRT:pF-ath", "logic": "single", "kind": "specializes", "kind_native": "specializes", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "Noisy operations = thermal operations at trivial Hamiltonian; noisy subset of unital with the same induced state pre-order (majorization).", "refs": ["Gour et al., Phys. Rep. 583, 1 (2015) [knowledge]"], "via": null}}, {"uid": "QRT:P5", "branch": "QRT", "native_id": "P5", "inputs": ["QRT:p-lqicc"], "target": "QRT:pF-ent", "logic": "single", "kind": "contains", "kind_native": "contains", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "LQICC/LICC = LOCC with one or both labs restricted to incoherent local processing: the intersection class in which the ENT-COH exchange rates (C1, C2) are formulated.", "refs": ["Chitambar, Hsieh, PRL 117, 020402 (2016) [knowledge]"], "via": null}}, {"uid": "QRT:P6", "branch": "QRT", "native_id": "P6", "inputs": ["QRT:pF-ctx"], "target": "QRT:pF-nlo", "logic": "single", "kind": "distinct", "kind_native": "distinct", "status": "theorem", "polarity": "no_go", "t": 1.1, "extra": {"statement": "Noncontextual wirings restricted to Bell scenarios are NOT equivalent to LOSR: the two candidate unifications of 'classical operations' disagree, leaving the correct common free-op class open (QG3).", "refs": ["Santos, Wagner, Amaral, arXiv:2407.02120 [verified]"], "via": null}}, {"uid": "QRT:P7", "branch": "QRT", "native_id": "P7", "inputs": ["QRT:pF-inc"], "target": "QRT:pF-ste", "logic": "single", "kind": "equiv", "kind_native": "equiv", "status": "partial", "polarity": "structural", "t": 1.1, "extra": {"statement": "Via the steering-incompatibility correspondence, incompatibility-non-increasing pre/post-processing maps onto the 1W-LOCC structure of steering (channel-state duality on assemblages).", "refs": ["Uola et al., PRL 115, 230402 (2015) [verified]", "Kiukas, Budroni, Uola, Pellonpaa, PRA 96, 042331 (2017) [verify]"], "via": null}}, {"uid": "QRT:P8", "branch": "QRT", "native_id": "P8", "inputs": ["QRT:p-rng"], "target": "QRT:pX-ent", "logic": "single", "kind": "bounds", "kind_native": "bounds", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "Reversibility is class-sensitive: exact NE -> irreversible (pX-ent); asymptotically NE -> reversible at E_r^infinity (MM11). The pair pinpoints the exact/asymptotic frontier as the load-bearing axiom (QG4).", "refs": ["Lami, Regula, Nat. Phys. 19, 184 (2023) [verified]", "Hayashi, Yamasaki, arXiv:2408.02722 [verified]"], "via": null}}, {"uid": "QRT:W1", "branch": "QRT", "native_id": "W1", "inputs": ["QRT:F-CONVEX"], "target": "QRT:w-hahn", "logic": "single", "kind": "implies", "kind_native": "implies", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Convexity axiom -> witness layer: every resource state of every convex closed theory is linearly witnessed.", "refs": ["Chitambar, Gour, RMP 91, 025001 (2019) [knowledge]"], "via": null}}, {"uid": "QRT:W2", "branch": "QRT", "native_id": "W2", "inputs": ["QRT:w-robust"], "target": "QRT:t-discrim", "logic": "single", "kind": "witness", "kind_native": "witness", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Generalized robustness = exact maximal advantage in subchannel discrimination; universal across convex theories (entanglement, coherence, magic explicitly included).", "refs": ["Takagi et al., PRL 122, 140402 (2019) [verified]"], "via": null}}, {"uid": "QRT:W3", "branch": "QRT", "native_id": "W3", "inputs": ["QRT:wD-nlo"], "target": "QRT:wQ-nlo", "logic": "single", "kind": "distinct", "kind_native": "distinct", "status": "theorem", "polarity": "no_go", "t": 1.1, "extra": {"statement": "Witnessing is not quantifying: the degrees of violation of all facet Bell inequalities suffice to DETECT nonclassicality but do not determine the LOSR convertibility pre-order.", "refs": ["Wolfe et al., Quantum 4, 280 (2020) [verified]"], "via": null}}, {"uid": "QRT:W4", "branch": "QRT", "native_id": "W4", "inputs": ["QRT:wD-ste"], "target": "QRT:sR-ste", "logic": "single", "kind": "witness", "kind_native": "witness", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "LHS membership is SDP-testable; steering inequalities import one-to-one from joint-measurability criteria (SS10).", "refs": ["Uola et al., PRL 115, 230402 (2015) [verified]"], "via": null}}, {"uid": "QRT:W5", "branch": "QRT", "native_id": "W5", "inputs": ["QRT:wQ-asy"], "target": "QRT:sR-asy", "logic": "single", "kind": "witness", "kind_native": "witness", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "QFI witnesses and quantifies asymmetry; quantum speed limits reinterpreted as asymmetry monotone bounds; QFI = thermal coherence cost (operational meaning via pX-ath).", "refs": ["Marvian, Spekkens, Zanardi, PRA 93, 052331 (2016) [verified]", "Marvian, Nat. Commun. 11, 25 (2020) [verified]"], "via": null}}, {"uid": "QRT:W6", "branch": "QRT", "native_id": "W6", "inputs": ["QRT:wQ-inc"], "target": "QRT:sR-inc", "logic": "single", "kind": "witness", "kind_native": "witness", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "The guessing-game family with post-measurement information is a COMPLETE monotone set: it decides device convertibility, not just detection.", "refs": ["Buscemi, Chitambar, Zhou, PRL 124, 120401 (2020) [verified]"], "via": null}}, {"uid": "QRT:W7", "branch": "QRT", "native_id": "W7", "inputs": ["QRT:wQ-ath"], "target": "QRT:sR-ath", "logic": "single", "kind": "witness", "kind_native": "witness", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "The F_alpha family is complete for block-diagonal athermality; the coherent sector needs asymmetry-mode witnesses in addition - the axiom factorization visible at witness level (MM3).", "refs": ["Brandao et al., PNAS 112, 3275 (2015) [knowledge]", "Lostaglio et al., PRX 5, 021001 (2015) [verified]"], "via": null}}, {"uid": "QRT:W8", "branch": "QRT", "native_id": "W8", "inputs": ["QRT:wD-ima"], "target": "QRT:sR-ima", "logic": "single", "kind": "witness", "kind_native": "witness", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "The LOCC-vs-real-LOCC discrimination gap witnesses imaginarity operationally (realized in optics).", "refs": ["Wu et al., PRL 126, 090401 (2021) [verified]"], "via": null}}, {"uid": "QRT:W9", "branch": "QRT", "native_id": "W9", "inputs": ["QRT:sR-mag"], "target": "QRT:pU-mag", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Magic spent through injection buys universality; monotones (robustness of magic) quantify the simulation overhead and distillation bounds.", "refs": ["Bravyi, Kitaev, PRA 71, 022316 (2005) [knowledge]", "Howard, Campbell, PRL 118, 090501 (2017) [knowledge]"], "via": null}}, {"uid": "QRT:W10", "branch": "QRT", "native_id": "W10", "inputs": ["QRT:sR-ctx"], "target": "QRT:pU-ctx", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Preparation contextuality powers parity-oblivious multiplexing beyond any noncontextual bound.", "refs": ["Spekkens et al., PRL 102, 010401 (2009) [verify]"], "via": null}}, {"uid": "QRT:W11", "branch": "QRT", "native_id": "W11", "inputs": ["QRT:sR-nlo"], "target": "QRT:pU-nlo", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Bell violation certifies device-independent key and randomness.", "refs": ["Brunner et al., RMP 86, 419 (2014) [knowledge]"], "via": null}}, {"uid": "QRT:W12", "branch": "QRT", "native_id": "W12", "inputs": ["QRT:sR-ste"], "target": "QRT:pU-ste", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Steering is the exact resource of one-sided device-independent QKD.", "refs": ["Branciard et al., PRA 85, 010301(R) (2012) [verify]"], "via": null}}, {"uid": "QRT:W13", "branch": "QRT", "native_id": "W13", "inputs": ["QRT:sR-asy"], "target": "QRT:pU-asy", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Phase/parameter estimation sensitivity is an asymmetry monotone (QFI); clocks and reference frames are asymmetry batteries.", "refs": ["Marvian, Nat. Commun. 11, 25 (2020) [verified]"], "via": null}}, {"uid": "QRT:W14", "branch": "QRT", "native_id": "W14", "inputs": ["QRT:sR-ent"], "target": "QRT:pU-ent", "logic": "single", "kind": "enables", "kind_native": "enables", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Ebits enable teleportation/dense coding; semiquantum games certify every entangled state as useful.", "refs": ["Buscemi, PRL 108, 200401 (2012) [knowledge]"], "via": null}}, {"uid": "QRT:W15", "branch": "QRT", "native_id": "W15", "inputs": ["QRT:wQ-ent"], "target": "QRT:pX-ent", "logic": "single", "kind": "bounds", "kind_native": "bounds", "status": "theorem", "polarity": "structural", "t": 1.1, "extra": {"statement": "The E_D < E_C gap measured by the monotones is the single-shot face of the irreversibility the no-go node formalizes; no single monotone can govern all transformations.", "refs": ["Horodecki x4, RMP 81, 865 (2009) [knowledge]", "Lami, Regula, Nat. Phys. 19, 184 (2023) [verified]"], "via": null}}, {"uid": "QRT:W16", "branch": "QRT", "native_id": "W16", "inputs": ["QRT:wD-ent"], "target": "QRT:sR-ent", "logic": "single", "kind": "witness", "kind_native": "witness", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Entanglement witnesses detect every entangled state (Hahn-Banach complete); PPT is a one-sided test blind to NPT structure; separability is NP-hard to decide.", "refs": ["Horodecki x4, RMP 81, 865 (2009) [knowledge]"], "via": null}}, {"uid": "QRT:W17", "branch": "QRT", "native_id": "W17", "inputs": ["QRT:wD-coh"], "target": "QRT:sR-coh", "logic": "single", "kind": "witness", "kind_native": "witness", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Robustness of coherence is directly measurable (witness-based lower bounds; interferometric interpretation).", "refs": ["Napoli et al., PRL 116, 150502 (2016) [verify]"], "via": null}}, {"uid": "QRT:W18", "branch": "QRT", "native_id": "W18", "inputs": ["QRT:wD-mag"], "target": "QRT:sR-mag", "logic": "single", "kind": "witness", "kind_native": "witness", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Mana and robustness of magic witness nonstabilizerness and quantify classical-simulation overhead and distillation bounds.", "refs": ["Howard, Campbell, PRL 118, 090501 (2017) [knowledge]", "Veitch et al., NJP 16, 013009 (2014) [knowledge]"], "via": null}}, {"uid": "QRT:W19", "branch": "QRT", "native_id": "W19", "inputs": ["QRT:wD-ctx"], "target": "QRT:sR-ctx", "logic": "single", "kind": "witness", "kind_native": "witness", "status": "theorem", "polarity": "possibility", "t": 1.1, "extra": {"statement": "Noncontextuality inequalities detect contextual behaviors; the contextual fraction grades them.", "refs": ["Amaral et al., PRL 120, 130403 (2018) [verified]", "Abramsky, Barbosa, Mansfield, PRL <script>
const D = JSON.parse(document.getElementById('data').textContent);
const byUid = {}; D.nodes.forEach(n => byUid[n.uid] = n);
const inR = {}, outR = {}; D.routes.forEach(r => { (inR[r.target] = inR[r.target] || []).push(r); r.inputs.forEach(u => (outR[u] = outR[u] || []).push(r)); });
const conceptOf = {}; D.concepts.forEach(c => c.members.forEach(u => conceptOf[u] = c));
const BT = {UP:'University Physics reader (D)', EM:'EM history reader (D)', LG:'LocGlob energy flow (D)', HEP:'Standard Model history (H)', GPT:'Nonclassicality network (E)', QRT:'Resource-theory network (E)'};
const ORDER = ['UP','EM','LG','HEP','GPT','QRT'];
let state = {view:'branch', branch:'HEP', sel:null, q:'', flipsOnly:false, era:'all'};
document.getElementById('counts').textContent = `${D.counts.branches} branches · ${D.counts.nodes} nodes · ${D.counts.routes} routes · ${D.counts.concepts} shared concepts (${D.counts.role_flips} role flips)`;
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function rich(s){return esc(s).replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/_\{([^}]*)\}/g,'<sub>$1</sub>');}
const SUBORDER=['S.point','S.field','S.hilbert','S.uir','S.sector','S.cluster','S.free','S.resource','S.dist','M.law','M.frame','M.axiom','M.model','M.fund','M.eff','M.cand','M.cluster','M.process','O.direct','O.effect','O.witness','O.task'];
function nav(){
  const n = document.getElementById('nav'); n.innerHTML = '';
  const mk = (label, on, fn) => { const b = document.createElement('button'); b.textContent = label; if(on) b.className='on'; b.onclick = fn; n.appendChild(b); };
  ORDER.forEach(b => mk(b, state.view==='branch' && state.branch===b, () => { state.view='branch'; state.branch=b; state.sel=null; render(); }));
  mk('Concepts', state.view==='concepts', () => { state.view='concepts'; render(); });
  mk('Signatures', state.view==='sig', () => { state.view='sig'; render(); });
  mk('Agenda', state.view==='agenda', () => { state.view='agenda'; render(); });
  mk('About', state.view==='about', () => { state.view='about'; render(); });
  const inp = document.createElement('input'); inp.placeholder = 'search label / id'; inp.value = state.q; inp.oninput = e => { state.q = e.target.value.toLowerCase(); render(); }; n.appendChild(inp);
  mk(state.flipsOnly ? 'glued only ✓' : 'glued only', state.flipsOnly, () => { state.flipsOnly = !state.flipsOnly; render(); });
}
function nodeMatches(n){ if(state.flipsOnly && !n.concept) return false; if(!state.q) return true; return (n.label+' '+n.native_id+' '+(n.concept||'')).toLowerCase().includes(state.q); }
function chip(n){
  const c = conceptOf[n.uid]; const cls = ['chip']; if(c) cls.push(c.flip ? 'flip' : 'glued'); if(state.sel===n.uid) cls.push('sel');
  return `<button class="${cls.join(' ')}" data-uid="${n.uid}">${rich(n.label)}<span class="t">${n.t!=null?('t='+n.t):''}</span></button>`;
}
function renderBranch(){
  const main = document.getElementById('main'); const nodes = D.nodes.filter(n => n.branch===state.branch && nodeMatches(n));
  const br = D.branches.find(b => b.id===state.branch);
  let html = '';
  for (const L of ['S','M','O']) {
    const groups = {}; nodes.filter(n => n.layer===L).forEach(n => (groups[n.sublayer] = groups[n.sublayer] || []).push(n));
    html += `<section class="col ${L}"><h2>${{S:'States',M:'Models',O:'Observables'}[L]} · ${nodes.filter(n=>n.layer===L).length}</h2>`;
    Object.keys(groups).sort((a,b)=>SUBORDER.indexOf(a)-SUBORDER.indexOf(b)).forEach(g => { html += `<div class="sub">${esc(g)} (${groups[g].length})</div>` + groups[g].sort((a,b)=>(a.t??0)-(b.t??0)).map(chip).join(''); });
    html += '</section>';
  }
  html += `<aside id="rail">${state.sel ? railNode(byUid[state.sel]) : railBranch(br)}</aside>`;
  main.innerHTML = html;
  main.querySelectorAll('.chip').forEach(b => b.onclick = () => { state.sel = b.dataset.uid; render(); });
  main.querySelectorAll('a[data-uid]').forEach(a => a.onclick = () => { const u = a.dataset.uid; state.branch = u.split(':')[0]; state.sel = u; state.view='branch'; render(); });
}
function railBranch(br){
  const pb = D.counts.per_branch[br.id];
  return `<h3>${esc(BT[br.id])}</h3><div>${esc(br.title)}</div><div class="k">source</div><div>${esc(br.source)} · version ${esc(br.version)}</div><div class="k">time axis</div><div>${esc(br.time_axis)}</div>
  <div class="k">layer map</div><div>${Object.entries(br.layer_map).map(([k,v])=>`${esc(k)} → ${v}`).join('; ')}</div><div class="k">counts</div><div>${pb.nodes} nodes (S ${pb.S}, M ${pb.M}, O ${pb.O}), ${pb.routes} routes, ${pb.AND} AND routes, ${pb.or_targets} OR targets</div>
  <div class="k">notes</div><div>${esc(br.notes)}</div><div class="k">legend</div><div>grey left bar: node glued to a concept in another branch; orange left bar: the concept changes layer across branches (role flip). Click a node for its routes and its concept.</div>`;
}
function routeLine(r, dir){
  const legs = r.inputs.map(u => `<a data-uid="${u}">${rich(byUid[u].label)}</a>`).join(' ∧ ');
  const tgt = `<a data-uid="${r.target}">${rich(byUid[r.target].label)}</a>`;
  const txt = r.extra.rel || r.extra.statement || r.extra.formula || r.extra.title || r.extra.label || '';
  return `<div class="r"><b>${esc(r.native_id)}</b> ${esc(r.kind)}${r.kind_native!==r.kind?' ('+esc(r.kind_native)+')':''} · ${esc(r.status)} · ${esc(r.polarity)}<br>${legs} → ${tgt}${txt?'<br><span style="color:#444">'+esc(String(txt).slice(0,420))+'</span>':''}</div>`;
}
function railNode(n){
  const c = conceptOf[n.uid]; const ex = n.extra || {};
  const desc = ex.desc || ex.description || ex.statement || ex.def || '';
  let h = `<h3>${rich(n.label)}</h3><span class="pill ${n.layer}">${n.layer} · ${esc(n.sublayer)}</span><span style="color:#666;font-size:12px">${esc(n.branch)}:${esc(n.native_id)} · native layer ${esc(n.native_layer)}${n.era?' · '+esc(n.era):''}${n.t!=null?' · t='+n.t:''}</span>`;
  if (desc) h += `<div class="k">description</div><div>${esc(desc)}</div>`;
  if (ex.formula || ex.math_structure) h += `<div class="k">mathematics</div><div>${esc(ex.formula||'')} ${esc(ex.math_structure||'')}</div>`;
  if (ex.properties && ex.properties.length) h += `<div class="k">properties</div><div>${ex.properties.map(esc).join('; ')}</div>`;
  if (ex.refs && ex.refs.length) h += `<div class="k">references</div><div>${ex.refs.map(esc).join('; ')}</div>`;
  if (ex.steps_present) h += `<div class="k">steps present</div><div>${ex.steps_present.join(', ')}${ex.in_final?' (in the final graph)':''}</div>`;
  if (c) { h += `<div class="k">concept</div><div><b>${esc(c.label)}</b> <code>${esc(c.id)}</code>${c.flip?' <span class="flip">role flip</span>':''}<br>${esc(c.note)}</div><div class="k">members in other branches</div>`;
    h += c.members.filter(u => u!==n.uid).map(u => `<div class="r"><span class="pill ${byUid[u].layer}">${byUid[u].layer}</span><a data-uid="${u}">${rich(byUid[u].label)}</a> <span style="color:#666">(${esc(u)})</span></div>`).join('') || '<div>—</div>'; }
  const cx = D.cross_edges.filter(e => e.from===n.uid || e.to===n.uid || (c && e.to==='c:'+c.id));
  if (cx.length) h += `<div class="k">cross-edges</div>` + cx.map(e => `<div class="r">${esc(e.from)} —${esc(e.relation)}→ ${esc(e.to)}${e.note?'<br><span style="color:#444">'+esc(e.note)+'</span>':''}</div>`).join('');
  const ins = inR[n.uid] || [], outs = outR[n.uid] || [];
  h += `<div class="k">routes into this node (${ins.length})</div>` + (ins.map(r => routeLine(r)).join('') || '<div>— primitive in this branch</div>');
  h += `<div class="k">routes out of this node (${outs.length})</div>` + (outs.map(r => routeLine(r)).join('') || '<div>—</div>');
  return h;
}
function renderConcepts(){
  const main = document.getElementById('main'); const cs = D.concepts.filter(c => !state.q || (c.label+' '+c.id+' '+c.members.join(' ')).toLowerCase().includes(state.q)).filter(c => !state.flipsOnly || c.flip);
  let h = `<div class="view"><p>${cs.length} concepts. A concept is one physical idea that appears in two or more branches; the role (layer) of its member nodes is read from the data. <span class="flip">Orange</span> rows are role flips. Click a member to open it.</p><div class="tw"><table><tr><th>concept</th><th>label</th><th>members (branch: role · node)</th><th>note</th></tr>`;
  cs.forEach(c => { h += `<tr><td><code>${esc(c.id)}</code>${c.flip?'<br><span class="flip">flip</span>':''}</td><td>${esc(c.label)}</td><td>${c.members.map(u => `${u.split(':')[0]}: <span class="pill ${byUid[u].layer}">${byUid[u].layer}</span><a data-uid="${u}">${rich(byUid[u].label)}</a>`).join('<br>')}</td><td style="max-width:360px">${esc(c.note)}</td></tr>`; });
  h += '</table></div></div>'; main.innerHTML = h;
  main.querySelectorAll('a[data-uid]').forEach(a => a.onclick = () => { const u = a.dataset.uid; state.branch = u.split(':')[0]; state.sel = u; state.view='branch'; render(); });
}
function renderSig(){
  const main = document.getElementById('main'); const R = D.results; let h = '<div class="view"><p>Layer-pair signatures: leg–route incidences from the input layer (row) to the target layer (column). The support of the matrix defines the branch type. For HEP the expanded routes (generic layer edges expanded to every sector) and the record-level counts of the final step are both given.</p><div style="display:flex;flex-wrap:wrap;gap:18px">';
