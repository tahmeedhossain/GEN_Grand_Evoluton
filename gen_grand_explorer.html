: "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 52, "concept": "force", "extra": {"symbol": "F⃗", "primitive": true, "postulate": false, "description": "A push or pull on a body, with magnitude and direction; measured by the stretch of a calibrated spring. SI unit the newton, 1 N = 1 kg·m/s².", "vol": 1, "section": "5.1", "chapter": 5, "order": 51}}, {"uid": "UP:fbd", "branch": "UP", "native_id": "fbd", "label": "Free-body diagram", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 53, "concept": null, "extra": {"symbol": "FBD", "primitive": false, "postulate": false, "description": "Isolates one body and draws every external force on it as a vector from the body; the starting point of every force problem.", "vol": 1, "section": "5.1", "chapter": 5, "order": 52}}, {"uid": "UP:Fnet", "branch": "UP", "native_id": "Fnet", "label": "Net external force", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 54, "concept": null, "extra": {"symbol": "F⃗_net", "primitive": false, "postulate": false, "description": "Vector sum of all external forces on a body.", "vol": 1, "section": "5.1", "chapter": 5, "order": 53}}, {"uid": "UP:n1", "branch": "UP", "native_id": "n1", "label": "Newton's first law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 55, "concept": null, "extra": {"symbol": "F⃗_net = 0 ⇒ v⃗ = const", "primitive": false, "postulate": true, "description": "A body keeps its velocity unless a net external force acts; this tendency is inertia, measured by mass.", "vol": 1, "section": "5.2", "chapter": 5, "order": 54}}, {"uid": "UP:inframe", "branch": "UP", "native_id": "inframe", "label": "Inertial reference frame", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 56, "concept": null, "extra": {"symbol": "inertial frame", "primitive": false, "postulate": false, "description": "A frame in which the first law holds; any frame moving at constant velocity relative to one is also inertial.", "vol": 1, "section": "5.2", "chapter": 5, "order": 55}}, {"uid": "UP:n2", "branch": "UP", "native_id": "n2", "label": "Newton's second law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 57, "concept": null, "extra": {"symbol": "F⃗_net = m a⃗", "primitive": false, "postulate": true, "description": "The net external force on a body equals its mass times its acceleration; one equation per component.", "vol": 1, "section": "5.3", "chapter": 5, "order": 56}}, {"uid": "UP:w", "branch": "UP", "native_id": "w", "label": "Weight", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 59, "concept": null, "extra": {"symbol": "w⃗ = m g⃗", "primitive": false, "postulate": false, "description": "Gravitational force of the Earth on a body near its surface; proportional to mass, unlike mass itself it depends on location.", "vol": 1, "section": "5.4", "chapter": 5, "order": 57}}, {"uid": "UP:n3", "branch": "UP", "native_id": "n3", "label": "Newton's third law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 61, "concept": null, "extra": {"symbol": "F⃗_AB = −F⃗_BA", "primitive": false, "postulate": true, "description": "Forces come in pairs: when A pushes on B, B pushes back on A with an equal and opposite force. The two act on different bodies.", "vol": 1, "section": "5.5", "chapter": 5, "order": 58}}, {"uid": "UP:Nf", "branch": "UP", "native_id": "Nf", "label": "Normal force", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 63, "concept": null, "extra": {"symbol": "N⃗", "primitive": false, "postulate": false, "description": "Contact force perpendicular to a surface, as large as needed to stop the body from moving into it.", "vol": 1, "section": "5.6", "chapter": 5, "order": 59}}, {"uid": "UP:T", "branch": "UP", "native_id": "T", "label": "Tension", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 64, "concept": null, "extra": {"symbol": "T", "primitive": false, "postulate": false, "description": "Pulling force transmitted along a string or cable.", "vol": 1, "section": "5.6", "chapter": 5, "order": 60}}, {"uid": "UP:hooke", "branch": "UP", "native_id": "hooke", "label": "Hooke's law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 65, "concept": null, "extra": {"symbol": "F = −kx", "primitive": false, "postulate": true, "description": "A spring pulls back with a force proportional to its stretch from the relaxed length.", "vol": 1, "section": "5.6", "chapter": 5, "order": 61}}, {"uid": "UP:frict", "branch": "UP", "native_id": "frict", "label": "Friction law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 69, "concept": null, "extra": {"symbol": "f ≤ μN", "primitive": false, "postulate": false, "description": "Contact force parallel to a surface that opposes relative motion (kinetic) or its onset (static), proportional to the normal force.", "vol": 1, "section": "6.2", "chapter": 6, "order": 62}}, {"uid": "UP:fs", "branch": "UP", "native_id": "fs", "label": "Static friction", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 70, "concept": null, "extra": {"symbol": "f_s ≤ μ_s N", "primitive": false, "postulate": false, "description": "Friction between surfaces not sliding relative to each other; adjusts up to a maximum μ_s N.", "vol": 1, "section": "6.2", "chapter": 6, "order": 63}}, {"uid": "UP:fk", "branch": "UP", "native_id": "fk", "label": "Kinetic friction", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 71, "concept": null, "extra": {"symbol": "f_k = μ_k N", "primitive": false, "postulate": false, "description": "Friction between sliding surfaces, opposite to the relative velocity.", "vol": 1, "section": "6.2", "chapter": 6, "order": 64}}, {"uid": "UP:Fc", "branch": "UP", "native_id": "Fc", "label": "Centripetal force", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 72, "concept": null, "extra": {"symbol": "F_c = mv²/r", "primitive": false, "postulate": false, "description": "Net force toward the centre that a circular motion requires; supplied by tension, friction, gravity or a normal force.", "vol": 1, "section": "6.3", "chapter": 6, "order": 65}}, {"uid": "UP:bank", "branch": "UP", "native_id": "bank", "label": "Banked curve", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 73, "concept": null, "extra": {"symbol": "tan θ = v²/(rg)", "primitive": false, "postulate": false, "description": "A road tilted so the horizontal part of the normal force supplies the centripetal force at a design speed.", "vol": 1, "section": "6.3", "chapter": 6, "order": 66}}, {"uid": "UP:noninert", "branch": "UP", "native_id": "noninert", "label": "Noninertial frame", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 74, "concept": null, "extra": {"symbol": "a⃗_frame ≠ 0", "primitive": false, "postulate": false, "description": "An accelerating or rotating frame; the laws of motion hold there only if inertial (fictitious) forces such as the centrifugal force are added.", "vol": 1, "section": "6.3", "chapter": 6, "order": 67}}, {"uid": "UP:Fcor", "branch": "UP", "native_id": "Fcor", "label": "Coriolis force", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 75, "concept": null, "extra": {"symbol": "F⃗ = −2m ω⃗ × v⃗′", "primitive": false, "postulate": false, "description": "Inertial force on a body moving relative to a rotating frame, perpendicular to its velocity; deflects winds and projectiles on Earth.", "vol": 1, "section": "6.3", "chapter": 6, "order": 68}}, {"uid": "UP:FD", "branch": "UP", "native_id": "FD", "label": "Drag force", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 76, "concept": null, "extra": {"symbol": "F_D = ½CρAv²", "primitive": false, "postulate": false, "description": "Resistance of a fluid to a body moving through it; grows with the square of speed for fast motion, linearly for slow motion in viscous fluid.", "vol": 1, "section": "6.4", "chapter": 6, "order": 69}}, {"uid": "UP:vT", "branch": "UP", "native_id": "vT", "label": "Terminal velocity", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 77, "concept": null, "extra": {"symbol": "v_T = √(2mg/(ρCA))", "primitive": false, "postulate": false, "description": "Constant speed reached when the drag force balances the weight.", "vol": 1, "section": "6.4", "chapter": 6, "order": 70}}, {"uid": "UP:W", "branch": "UP", "native_id": "W", "label": "Work", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 79, "concept": null, "extra": {"symbol": "W = ∫F⃗·dr⃗", "primitive": false, "postulate": false, "description": "Energy transferred by a force acting along a displacement; only the component of force along the path does work. SI unit the joule.", "vol": 1, "section": "7.1", "chapter": 7, "order": 71}}, {"uid": "UP:K", "branch": "UP", "native_id": "K", "label": "Kinetic energy", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 81, "concept": null, "extra": {"symbol": "K = ½mv²", "primitive": false, "postulate": false, "description": "Energy of motion of a particle; depends on the frame through the speed.", "vol": 1, "section": "7.2", "chapter": 7, "order": 72}}, {"uid": "UP:Wnet", "branch": "UP", "native_id": "Wnet", "label": "Net work", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 83, "concept": null, "extra": {"symbol": "W_net", "primitive": false, "postulate": false, "description": "Work done by the net force, equal to the sum of the works of all forces.", "vol": 1, "section": "7.3", "chapter": 7, "order": 73}}, {"uid": "UP:wet", "branch": "UP", "native_id": "wet", "label": "Work–energy theorem", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 84, "concept": null, "extra": {"symbol": "W_net = ΔK", "primitive": false, "postulate": false, "description": "The net work done on a particle equals its change of kinetic energy.", "vol": 1, "section": "7.3", "chapter": 7, "order": 74}}, {"uid": "UP:P", "branch": "UP", "native_id": "P", "label": "Power", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 86, "concept": null, "extra": {"symbol": "P = dW/dt", "primitive": false, "postulate": false, "description": "Rate at which work is done; P = F⃗·v⃗ for a force acting on a moving body. Average power is work over elapsed time.", "vol": 1, "section": "7.4", "chapter": 7, "order": 75}}, {"uid": "UP:U", "branch": "UP", "native_id": "U", "label": "Potential energy", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 89, "concept": null, "extra": {"symbol": "U(r⃗)", "primitive": false, "postulate": false, "description": "Energy of a system stored in its configuration; only differences are physical, so the zero can be chosen freely.", "vol": 1, "section": "8.1", "chapter": 8, "order": 76}}, {"uid": "UP:Ugrav", "branch": "UP", "native_id": "Ugrav", "label": "Gravitational potential energy (near Earth)", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 90, "concept": null, "extra": {"symbol": "U = mgy", "primitive": false, "postulate": false, "description": "Potential energy of the body–Earth system for a height y near the surface.", "vol": 1, "section": "8.1", "chapter": 8, "order": 77}}, {"uid": "UP:Uel", "branch": "UP", "native_id": "Uel", "label": "Elastic potential energy", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 91, "concept": null, "extra": {"symbol": "U = ½kx²", "primitive": false, "postulate": false, "description": "Potential energy stored in a stretched or compressed spring.", "vol": 1, "section": "8.1", "chapter": 8, "order": 78}}, {"uid": "UP:cons", "branch": "UP", "native_id": "cons", "label": "Conservative force", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 92, "concept": null, "extra": {"symbol": "∮F⃗·dr⃗ = 0", "primitive": false, "postulate": false, "description": "A force whose work between two points is independent of the path; equivalently zero around every closed path, and derivable from a potential energy.", "vol": 1, "section": "8.2", "chapter": 8, "order": 79}}, {"uid": "UP:Wnc", "branch": "UP", "native_id": "Wnc", "label": "Work of nonconservative forces", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 94, "concept": null, "extra": {"symbol": "W_nc", "primitive": false, "postulate": false, "description": "Work by forces such as friction or air resistance, which depends on the path and changes the mechanical energy.", "vol": 1, "section": "8.2", "chapter": 8, "order": 80}}, {"uid": "UP:Emech", "branch": "UP", "native_id": "Emech", "label": "Mechanical energy", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 95, "concept": null, "extra": {"symbol": "E = K + U", "primitive": false, "postulate": false, "description": "Kinetic plus potential energy of a system.", "vol": 1, "section": "8.3", "chapter": 8, "order": 81}}, {"uid": "UP:econs", "branch": "UP", "native_id": "econs", "label": "Conservation of mechanical energy", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 96, "concept": null, "extra": {"symbol": "ΔE = W_nc", "primitive": false, "postulate": false, "description": "Mechanical energy changes only through the work of nonconservative forces; without them it is a conserved quantity.", "vol": 1, "section": "8.3", "chapter": 8, "order": 82}}, {"uid": "UP:pediag", "branch": "UP", "native_id": "pediag", "label": "Potential-energy diagram", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 98, "concept": null, "extra": {"symbol": "U(x) and E", "primitive": false, "postulate": false, "description": "A plot of U(x) with the total energy as a horizontal line; motion is allowed only where E ≥ U, and reverses at turning points.", "vol": 1, "section": "8.4", "chapter": 8, "order": 83}}, {"uid": "UP:eqpt", "branch": "UP", "native_id": "eqpt", "label": "Equilibrium point", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 99, "concept": null, "extra": {"symbol": "dU/dx = 0", "primitive": false, "postulate": false, "description": "A position where the force vanishes; stable at a minimum of U (small disturbances oscillate), unstable at a maximum.", "vol": 1, "section": "8.4", "chapter": 8, "order": 84}}, {"uid": "UP:p", "branch": "UP", "native_id": "p", "label": "Momentum", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 102, "concept": "momentum", "extra": {"symbol": "p⃗ = m v⃗", "primitive": false, "postulate": false, "description": "Mass times velocity; a vector.", "vol": 1, "section": "9.1", "chapter": 9, "order": 85}}, {"uid": "UP:J", "branch": "UP", "native_id": "J", "label": "Impulse", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 104, "concept": null, "extra": {"symbol": "J⃗ = ∫F⃗ dt", "primitive": false, "postulate": false, "description": "Time integral of a force; for a short collision, average force times duration.", "vol": 1, "section": "9.2", "chapter": 9, "order": 86}}, {"uid": "UP:imt", "branch": "UP", "native_id": "imt", "label": "Impulse–momentum theorem", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 105, "concept": null, "extra": {"symbol": "J⃗ = Δp⃗", "primitive": false, "postulate": false, "description": "The impulse of the net force equals the change of momentum.", "vol": 1, "section": "9.2", "chapter": 9, "order": 87}}, {"uid": "UP:sys", "branch": "UP", "native_id": "sys", "label": "System of particles", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 106, "concept": null, "extra": {"symbol": "{m_j, r⃗_j(t)}", "primitive": false, "postulate": false, "description": "A chosen set of bodies; forces split into internal (between members) and external. A closed system has no net external force.", "vol": 1, "section": "9.3", "chapter": 9, "order": 88}}, {"uid": "UP:pcons", "branch": "UP", "native_id": "pcons", "label": "Conservation of momentum", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 107, "concept": null, "extra": {"symbol": "Σ p⃗_j = const", "primitive": false, "postulate": false, "description": "The total momentum of a closed system does not change, whatever happens inside it.", "vol": 1, "section": "9.3", "chapter": 9, "order": 89}}, {"uid": "UP:coll", "branch": "UP", "native_id": "coll", "label": "Collisions", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 109, "concept": null, "extra": {"symbol": "P conserved; K?", "primitive": false, "postulate": false, "description": "Collisions conserve momentum; they are classified by kinetic energy: elastic (kept), inelastic (lost), perfectly inelastic (bodies stick together), explosion (gained).", "vol": 1, "section": "9.4", "chapter": 9, "order": 90}}, {"uid": "UP:rcm", "branch": "UP", "native_id": "rcm", "label": "Center of mass", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 112, "concept": null, "extra": {"symbol": "r⃗_CM = Σ m_j r⃗_j / M", "primitive": false, "postulate": false, "description": "Mass-weighted average position of a system; for a continuous body r⃗_CM = (1/M)∫ r⃗ dm.", "vol": 1, "section": "9.6", "chapter": 9, "order": 91}}, {"uid": "UP:n2sys", "branch": "UP", "native_id": "n2sys", "label": "Second law for a system", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 113, "concept": null, "extra": {"symbol": "F⃗_ext = M a⃗_CM", "primitive": false, "postulate": false, "description": "The centre of mass moves like a single particle of total mass M acted on by the external forces alone.", "vol": 1, "section": "9.6", "chapter": 9, "order": 92}}, {"uid": "UP:lmd", "branch": "UP", "native_id": "lmd", "label": "Linear mass density", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 114, "concept": null, "extra": {"symbol": "λ = dm/dx", "primitive": false, "postulate": false, "description": "Mass per unit length of a rod or string; used to integrate over continuous bodies.", "vol": 1, "section": "9.6", "chapter": 9, "order": 93}}, {"uid": "UP:rocket", "branch": "UP", "native_id": "rocket", "label": "Rocket equation", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 115, "concept": null, "extra": {"symbol": "Δv = u ln(m_i/m)", "primitive": false, "postulate": false, "description": "A rocket gains speed by ejecting mass backward at exhaust speed u; the gain depends on the logarithm of the mass ratio.", "vol": 1, "section": "9.7", "chapter": 9, "order": 94}}, {"uid": "UP:rigid", "branch": "UP", "native_id": "rigid", "label": "Rigid body on a fixed axis", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 117, "concept": null, "extra": {"symbol": "θ(t)", "primitive": false, "postulate": false, "description": "A body whose particles keep their mutual distances, turning about a fixed axis: every particle moves on a circle and one angle describes them all.", "vol": 1, "section": "10.0", "chapter": 10, "order": 95}}, {"uid": "UP:theta", "branch": "UP", "native_id": "theta", "label": "Angular position", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 118, "concept": null, "extra": {"symbol": "θ = s/r", "primitive": false, "postulate": false, "description": "Angle of a reference line of the body from a fixed direction, in radians: arc length over radius.", "vol": 1, "section": "10.1", "chapter": 10, "order": 96}}, {"uid": "UP:angvel", "branch": "UP", "native_id": "angvel", "label": "Angular velocity", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 119, "concept": null, "extra": {"symbol": "ω⃗ = dθ/dt", "primitive": false, "postulate": false, "description": "Rate of change of angular position; as a vector it points along the axis by the right-hand rule. Tangential speed v_t = rω.", "vol": 1, "section": "10.1", "chapter": 10, "order": 97}}, {"uid": "UP:alpha", "branch": "UP", "native_id": "alpha", "label": "Angular acceleration", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 120, "concept": null, "extra": {"symbol": "α = dω/dt", "primitive": false, "postulate": false, "description": "Rate of change of angular velocity; tangential acceleration of a point is a_t = rα.", "vol": 1, "section": "10.1", "chapter": 10, "order": 98}}, {"uid": "UP:rotkin", "branch": "UP", "native_id": "rotkin", "label": "Rotational kinematics", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 121, "concept": null, "extra": {"symbol": "θ = θ₀ + ω₀t + ½αt²", "primitive": false, "postulate": false, "description": "Equations for rotation at constant angular acceleration, the same form as the linear ones with θ, ω, α in place of x, v, a.", "vol": 1, "section": "10.2", "chapter": 10, "order": 99}}, {"uid": "UP:Krot", "branch": "UP", "native_id": "Krot", "label": "Rotational kinetic energy", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 123, "concept": null, "extra": {"symbol": "K = ½Iω²", "primitive": false, "postulate": false, "description": "Kinetic energy of a rotating rigid body, the sum of ½m_j v_j² with v_j = r_{j}ω.", "vol": 1, "section": "10.4", "chapter": 10, "order": 100}}, {"uid": "UP:I", "branch": "UP", "native_id": "I", "label": "Moment of inertia", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 124, "concept": null, "extra": {"symbol": "I = Σ m_j r_j²", "primitive": false, "postulate": false, "description": "Rotational inertia: how mass is distributed about the axis. Depends on the axis chosen.", "vol": 1, "section": "10.4", "chapter": 10, "order": 101}}, {"uid": "UP:paxis", "branch": "UP", "native_id": "paxis", "label": "Parallel-axis theorem", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 127, "concept": null, "extra": {"symbol": "I = I_CM + Md²", "primitive": false, "postulate": false, "description": "The moment of inertia about any axis equals that about the parallel axis through the centre of mass plus Md².", "vol": 1, "section": "10.5", "chapter": 10, "order": 102}}, {"uid": "UP:smd", "branch": "UP", "native_id": "smd", "label": "Surface mass density", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 128, "concept": null, "extra": {"symbol": "σ = dm/dA", "primitive": false, "postulate": false, "description": "Mass per unit area of a thin sheet or disk.", "vol": 1, "section": "10.5", "chapter": 10, "order": 103}}, {"uid": "UP:tau", "branch": "UP", "native_id": "tau", "label": "Torque", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 129, "concept": null, "extra": {"symbol": "τ⃗ = r⃗ × F⃗", "primitive": false, "postulate": false, "description": "The turning effect of a force about a point or axis: force times lever arm, |τ| = r⊥F, signed by the right-hand rule.", "vol": 1, "section": "10.6", "chapter": 10, "order": 104}}, {"uid": "UP:n2rot", "branch": "UP", "native_id": "n2rot", "label": "Second law for rotation", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 131, "concept": null, "extra": {"symbol": "Στ = Iα", "primitive": false, "postulate": false, "description": "Net torque about a fixed axis equals moment of inertia times angular acceleration.", "vol": 1, "section": "10.7", "chapter": 10, "order": 105}}, {"uid": "UP:Wrot", "branch": "UP", "native_id": "Wrot", "label": "Rotational work", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 133, "concept": null, "extra": {"symbol": "W = ∫ τ dθ", "primitive": false, "postulate": false, "description": "Work done by a torque as the body turns.", "vol": 1, "section": "10.8", "chapter": 10, "order": 106}}, {"uid": "UP:roll", "branch": "UP", "native_id": "roll", "label": "Rolling without slipping", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 138, "concept": null, "extra": {"symbol": "v_CM = Rω", "primitive": false, "postulate": false, "description": "A wheel rolls without slipping when its contact point is instantaneously at rest; translation and rotation are then locked together.", "vol": 1, "section": "11.1", "chapter": 11, "order": 107}}, {"uid": "UP:Lang", "branch": "UP", "native_id": "Lang", "label": "Angular momentum", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 140, "concept": null, "extra": {"symbol": "l⃗ = r⃗ × p⃗", "primitive": false, "postulate": false, "description": "Moment of momentum about a point; for a rigid body rotating about a symmetry axis, L = Iω.", "vol": 1, "section": "11.2", "chapter": 11, "order": 108}}, {"uid": "UP:dLdt", "branch": "UP", "native_id": "dLdt", "label": "Torque law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 142, "concept": null, "extra": {"symbol": "dL⃗/dt = Στ⃗", "primitive": false, "postulate": false, "description": "The rate of change of angular momentum equals the net external torque.", "vol": 1, "section": "11.2", "chapter": 11, "order": 109}}, {"uid": "UP:Lcons", "branch": "UP", "native_id": "Lcons", "label": "Conservation of angular momentum", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 143, "concept": null, "extra": {"symbol": "L⃗ = const", "primitive": false, "postulate": false, "description": "With no net external torque, the total angular momentum is constant; a skater who pulls in her arms (smaller I) spins faster.", "vol": 1, "section": "11.3", "chapter": 11, "order": 110}}, {"uid": "UP:omegaP", "branch": "UP", "native_id": "omegaP", "label": "Precession rate", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 145, "concept": null, "extra": {"symbol": "ω_P = rMg/(Iω)", "primitive": false, "postulate": false, "description": "Slow turning of a spinning top's axis, because gravity's torque changes the direction of L⃗ rather than its size.", "vol": 1, "section": "11.4", "chapter": 11, "order": 111}}, {"uid": "UP:staticeq", "branch": "UP", "native_id": "staticeq", "label": "Static equilibrium", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 148, "concept": null, "extra": {"symbol": "v⃗_CM = 0, ω⃗ = 0", "primitive": false, "postulate": false, "description": "A rigid body at rest that stays at rest; it has no translational and no rotational acceleration.", "vol": 1, "section": "12.1", "chapter": 12, "order": 112}}, {"uid": "UP:eqcond", "branch": "UP", "native_id": "eqcond", "label": "Equilibrium conditions", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 149, "concept": null, "extra": {"symbol": "ΣF⃗ = 0,  Στ⃗ = 0", "primitive": false, "postulate": false, "description": "The first condition (zero net force) prevents translation; the second (zero net torque) prevents rotation.", "vol": 1, "section": "12.1", "chapter": 12, "order": 113}}, {"uid": "UP:rcg", "branch": "UP", "native_id": "rcg", "label": "Center of gravity", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 150, "concept": null, "extra": {"symbol": "r⃗_CG", "primitive": false, "postulate": false, "description": "Point where the total weight can be taken to act; it coincides with the centre of mass in a uniform gravitational field.", "vol": 1, "section": "12.1", "chapter": 12, "order": 114}}, {"uid": "UP:stress", "branch": "UP", "native_id": "stress", "label": "Stress", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 152, "concept": null, "extra": {"symbol": "F/A", "primitive": false, "postulate": false, "description": "Force per unit area that deforms a body: tensile or compressive (perpendicular), bulk (from all sides), shear (parallel to the surface).", "vol": 1, "section": "12.3", "chapter": 12, "order": 115}}, {"uid": "UP:strain", "branch": "UP", "native_id": "strain", "label": "Strain", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 153, "concept": null, "extra": {"symbol": "ΔL/L₀", "primitive": false, "postulate": false, "description": "Fractional deformation: change of length, volume or shear offset divided by the original size; dimensionless.", "vol": 1, "section": "12.3", "chapter": 12, "order": 116}}, {"uid": "UP:elin", "branch": "UP", "native_id": "elin", "label": "Linear elasticity", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 153, "concept": null, "extra": {"symbol": "stress = modulus × strain", "primitive": false, "postulate": false, "description": "For small deformations stress is proportional to strain; the constant is the elastic modulus of the material for that kind of deformation.", "vol": 1, "section": "12.3", "chapter": 12, "order": 117}}, {"uid": "UP:Ymod", "branch": "UP", "native_id": "Ymod", "label": "Young's modulus", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 154, "concept": null, "extra": {"symbol": "Y", "primitive": false, "postulate": false, "description": "Elastic modulus for tension or compression along one direction.", "vol": 1, "section": "12.3", "chapter": 12, "order": 118}}, {"uid": "UP:Bmod", "branch": "UP", "native_id": "Bmod", "label": "Bulk modulus", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 155, "concept": null, "extra": {"symbol": "B = −Δp/(ΔV/V₀)", "primitive": false, "postulate": false, "description": "Elastic modulus for uniform compression; its inverse is the compressibility.", "vol": 1, "section": "12.3", "chapter": 12, "order": 119}}, {"uid": "UP:Smod", "branch": "UP", "native_id": "Smod", "label": "Shear modulus", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 155, "concept": null, "extra": {"symbol": "S", "primitive": false, "postulate": false, "description": "Elastic modulus for shear deformation.", "vol": 1, "section": "12.3", "chapter": 12, "order": 120}}, {"uid": "UP:pres", "branch": "UP", "native_id": "pres", "label": "Pressure", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 155, "concept": null, "extra": {"symbol": "p = F⊥/A", "primitive": false, "postulate": false, "description": "Perpendicular force per unit area; a scalar. SI unit the pascal, 1 Pa = 1 N/m².", "vol": 1, "section": "12.3", "chapter": 12, "order": 121}}, {"uid": "UP:ssdiag", "branch": "UP", "native_id": "ssdiag", "label": "Stress–strain diagram", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 156, "concept": null, "extra": {"symbol": "σ(ε)", "primitive": false, "postulate": false, "description": "A material is linear up to the proportionality limit, elastic (returns to shape) up to the elastic limit, plastic beyond it, and breaks at the ultimate stress.", "vol": 1, "section": "12.4", "chapter": 12, "order": 122}}, {"uid": "UP:G", "branch": "UP", "native_id": "G", "label": "Gravitational constant", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 160, "concept": null, "extra": {"symbol": "G", "primitive": true, "postulate": false, "description": "Strength of gravity between two masses, 6.674 × 10⁻¹¹ N·m²/kg², first measured with a torsion balance (Cavendish).", "vol": 1, "section": "13.1", "chapter": 13, "order": 123}}, {"uid": "UP:ngrav", "branch": "UP", "native_id": "ngrav", "label": "Newton's law of gravitation", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 160, "concept": null, "extra": {"symbol": "F = Gm₁m₂/r²", "primitive": false, "postulate": true, "description": "Every pair of point masses attracts along the line joining them with a force proportional to both masses and inversely to the square of the distance.", "vol": 1, "section": "13.1", "chapter": 13, "order": 124}}, {"uid": "UP:gfield", "branch": "UP", "native_id": "gfield", "label": "Gravitational field", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 162, "concept": null, "extra": {"symbol": "g⃗ = F⃗/m", "primitive": false, "postulate": false, "description": "Gravitational force per unit mass at a point; it exists whether or not a test mass is there.", "vol": 1, "section": "13.2", "chapter": 13, "order": 125}}, {"uid": "UP:wapp", "branch": "UP", "native_id": "wapp", "label": "Apparent weight", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 163, "concept": null, "extra": {"symbol": "w_app", "primitive": false, "postulate": false, "description": "What a scale reads: the normal force, which differs from mg in an accelerating or rotating frame (reduced at the equator by Earth's rotation).", "vol": 1, "section": "13.2", "chapter": 13, "order": 126}}, {"uid": "UP:Ugr", "branch": "UP", "native_id": "Ugr", "label": "Gravitational potential energy", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 165, "concept": null, "extra": {"symbol": "U = −GMm/r", "primitive": false, "postulate": false, "description": "Potential energy of two masses at any separation, with zero at infinite separation; near Earth's surface it reduces to mgy.", "vol": 1, "section": "13.3", "chapter": 13, "order": 127}}, {"uid": "UP:vesc", "branch": "UP", "native_id": "vesc", "label": "Escape velocity", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 167, "concept": null, "extra": {"symbol": "v_esc = √(2GM/R)", "primitive": false, "postulate": false, "description": "Minimum launch speed for a body to move off to infinite distance.", "vol": 1, "section": "13.3", "chapter": 13, "order": 128}}, {"uid": "UP:bound", "branch": "UP", "native_id": "bound", "label": "Gravitationally bound orbit", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 168, "concept": null, "extra": {"symbol": "E = K + U < 0", "primitive": false, "postulate": false, "description": "A system whose total energy is negative cannot separate to infinity; the bodies stay within a maximum distance.", "vol": 1, "section": "13.3", "chapter": 13, "order": 129}}, {"uid": "UP:vorb", "branch": "UP", "native_id": "vorb", "label": "Orbital speed", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 169, "concept": null, "extra": {"symbol": "v = √(GM/r)", "primitive": false, "postulate": false, "description": "Speed of a circular orbit at radius r; independent of the satellite's mass.", "vol": 1, "section": "13.4", "chapter": 13, "order": 130}}, {"uid": "UP:Torb", "branch": "UP", "native_id": "Torb", "label": "Orbital period", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 170, "concept": null, "extra": {"symbol": "T = 2π√(r³/GM)", "primitive": false, "postulate": false, "description": "Time for one circular orbit.", "vol": 1, "section": "13.4", "chapter": 13, "order": 131}}, {"uid": "UP:kep1", "branch": "UP", "native_id": "kep1", "label": "Kepler's first law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 171, "concept": null, "extra": {"symbol": "orbit = ellipse, Sun at a focus", "primitive": false, "postulate": false, "description": "Every planet moves on an ellipse with the Sun at one focus; derived by Newton from the inverse-square law.", "vol": 1, "section": "13.5", "chapter": 13, "order": 132}}, {"uid": "UP:orbit", "branch": "UP", "native_id": "orbit", "label": "Elliptical orbit", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 172, "concept": null, "extra": {"symbol": "r(θ) = α/(1 + e cos θ)", "primitive": false, "postulate": false, "description": "The orbital state: an ellipse traced periodically, closest to the Sun at perihelion and farthest at aphelion.", "vol": 1, "section": "13.5", "chapter": 13, "order": 133}}, {"uid": "UP:kep2", "branch": "UP", "native_id": "kep2", "label": "Kepler's second law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 173, "concept": null, "extra": {"symbol": "dA/dt = const", "primitive": false, "postulate": false, "description": "The line from Sun to planet sweeps equal areas in equal times, so a planet moves fastest at perihelion.", "vol": 1, "section": "13.5", "chapter": 13, "order": 134}}, {"uid": "UP:kep3", "branch": "UP", "native_id": "kep3", "label": "Kepler's third law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 174, "concept": null, "extra": {"symbol": "T² = 4π²a³/(GM)", "primitive": false, "postulate": false, "description": "The square of the orbital period is proportional to the cube of the semimajor axis.", "vol": 1, "section": "13.5", "chapter": 13, "order": 135}}, {"uid": "UP:Ftide", "branch": "UP", "native_id": "Ftide", "label": "Tidal force", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 175, "concept": null, "extra": {"symbol": "ΔF ≈ 2GMmΔr/r³", "primitive": false, "postulate": false, "description": "Difference in the gravitational pull across a body; it stretches the body along the line to the attracting mass. Sun and Moon aligned give spring tides, at right angles neap tides.", "vol": 1, "section": "13.6", "chapter": 13, "order": 136}}, {"uid": "UP:c", "branch": "UP", "native_id": "c", "label": "Speed of light", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 177, "concept": "speed_of_light", "extra": {"symbol": "c", "primitive": true, "postulate": false, "description": "Speed of light in vacuum, exactly 299 792 458 m/s by the definition of the metre (≈ 2.998 × 10⁸ m/s).", "vol": 1, "section": "13.7", "chapter": 13, "order": 137}}, {"uid": "UP:GR", "branch": "UP", "native_id": "GR", "label": "General relativity", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "relativistic", "t": 177, "concept": null, "extra": {"symbol": "G_μν = 8πG T_μν / c⁴", "primitive": false, "postulate": false, "description": "Gravity is the curvature of space-time produced by mass and energy; free bodies follow the straightest paths of the curved geometry.", "vol": 1, "section": "13.7", "chapter": 13, "order": 138}}, {"uid": "UP:equiv", "branch": "UP", "native_id": "equiv", "label": "Principle of equivalence", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "relativistic", "t": 178, "concept": null, "extra": {"symbol": "gravity ≡ acceleration (locally)", "primitive": false, "postulate": true, "description": "No local experiment can distinguish a uniform gravitational field from an accelerated frame; a freely falling frame is locally inertial.", "vol": 1, "section": "13.7", "chapter": 13, "order": 139}}, {"uid": "UP:bh", "branch": "UP", "native_id": "bh", "label": "Black hole", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "relativistic", "t": 179, "concept": null, "extra": {"symbol": "r < R_S", "primitive": false, "postulate": false, "description": "A mass compressed inside its Schwarzschild radius; nothing, not even light, escapes from inside the event horizon.", "vol": 1, "section": "13.7", "chapter": 13, "order": 140}}, {"uid": "UP:RS", "branch": "UP", "native_id": "RS", "label": "Schwarzschild radius", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "relativistic", "t": 179, "concept": null, "extra": {"symbol": "R_S = 2GM/c²", "primitive": false, "postulate": false, "description": "Radius at which the escape velocity from a mass M reaches the speed of light; it marks the event horizon.", "vol": 1, "section": "13.7", "chapter": 13, "order": 141}}, {"uid": "UP:fluid", "branch": "UP", "native_id": "fluid", "label": "Fluid", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 182, "concept": null, "extra": {"symbol": "ρ(r⃗), p(r⃗)", "primitive": false, "postulate": false, "description": "A liquid or gas: matter that flows because it cannot resist a shear stress when at rest; described by fields such as density and pressure.", "vol": 1, "section": "14.1", "chapter": 14, "order": 142}}, {"uid": "UP:rho", "branch": "UP", "native_id": "rho", "label": "Density", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 183, "concept": null, "extra": {"symbol": "ρ = m/V", "primitive": false, "postulate": false, "description": "Mass per unit volume.", "vol": 1, "section": "14.1", "chapter": 14, "order": 143}}, {"uid": "UP:sg", "branch": "UP", "native_id": "sg", "label": "Specific gravity", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 183, "concept": null, "extra": {"symbol": "ρ/ρ_water", "primitive": false, "postulate": false, "description": "Density relative to that of water; dimensionless.", "vol": 1, "section": "14.1", "chapter": 14, "order": 144}}, {"uid": "UP:pabs", "branch": "UP", "native_id": "pabs", "label": "Gauge and absolute pressure", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 184, "concept": null, "extra": {"symbol": "p_abs = p_g + p_atm", "primitive": false, "postulate": false, "description": "Gauges read pressure relative to the atmosphere; absolute pressure adds atmospheric pressure.", "vol": 1, "section": "14.2", "chapter": 14, "order": 145}}, {"uid": "UP:hydro", "branch": "UP", "native_id": "hydro", "label": "Hydrostatic equilibrium", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 185, "concept": null, "extra": {"symbol": "dp/dy = −ρg", "primitive": false, "postulate": false, "description": "In a fluid at rest pressure grows with depth so that each fluid element is balanced: p = p₀ + ρgh for constant density.", "vol": 1, "section": "14.3", "chapter": 14, "order": 146}}, {"uid": "UP:pascal", "branch": "UP", "native_id": "pascal", "label": "Pascal's principle", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 186, "concept": null, "extra": {"symbol": "Δp transmitted undiminished", "primitive": false, "postulate": false, "description": "A pressure change applied to an enclosed fluid reaches every part of it; a hydraulic jack multiplies force by the area ratio.", "vol": 1, "section": "14.3", "chapter": 14, "order": 147}}, {"uid": "UP:FB", "branch": "UP", "native_id": "FB", "label": "Buoyant force", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 187, "concept": null, "extra": {"symbol": "F_B = ρ_fl V g", "primitive": false, "postulate": false, "description": "Net upward force of a fluid on an immersed body.", "vol": 1, "section": "14.4", "chapter": 14, "order": 148}}, {"uid": "UP:archi", "branch": "UP", "native_id": "archi", "label": "Archimedes' principle", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 188, "concept": null, "extra": {"symbol": "F_B = weight of displaced fluid", "primitive": false, "postulate": false, "description": "A body immersed in a fluid is pushed up by a force equal to the weight of the fluid it displaces.", "vol": 1, "section": "14.4", "chapter": 14, "order": 149}}, {"uid": "UP:ideal", "branch": "UP", "native_id": "ideal", "label": "Ideal fluid", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 189, "concept": null, "extra": {"symbol": "incompressible, nonviscous", "primitive": false, "postulate": false, "description": "A model fluid with constant density and no internal friction; its steady flow is laminar.", "vol": 1, "section": "14.5", "chapter": 14, "order": 150}}, {"uid": "UP:eta", "branch": "UP", "native_id": "eta", "label": "Viscosity", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 189, "concept": null, "extra": {"symbol": "η = FL/(vA)", "primitive": false, "postulate": false, "description": "Internal friction of a fluid: the shear stress needed per velocity gradient.", "vol": 1, "section": "14.5", "chapter": 14, "order": 151}}, {"uid": "UP:flow", "branch": "UP", "native_id": "flow", "label": "Fluid flow", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 190, "concept": null, "extra": {"symbol": "v⃗(r⃗, t)", "primitive": false, "postulate": false, "description": "The motion of a fluid: a velocity at every point. In laminar flow the layers slide smoothly; in turbulent flow eddies mix them.", "vol": 1, "section": "14.5", "chapter": 14, "order": 152}}, {"uid": "UP:Q", "branch": "UP", "native_id": "Q", "label": "Flow rate", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 190, "concept": null, "extra": {"symbol": "Q = dV/dt = Av", "primitive": false, "postulate": false, "description": "Volume of fluid passing a cross section per unit time.", "vol": 1, "section": "14.5", "chapter": 14, "order": 153}}, {"uid": "UP:contin", "branch": "UP", "native_id": "contin", "label": "Continuity equation", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 191, "concept": null, "extra": {"symbol": "ρ₁A₁v₁ = ρ₂A₂v₂", "primitive": false, "postulate": false, "description": "Mass entering a flow tube equals mass leaving; for an incompressible fluid A₁v₁ = A₂v₂, so the flow speeds up where the tube narrows.", "vol": 1, "section": "14.5", "chapter": 14, "order": 154}}, {"uid": "UP:bern", "branch": "UP", "native_id": "bern", "label": "Bernoulli's equation", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 192, "concept": null, "extra": {"symbol": "p + ½ρv² + ρgy = const", "primitive": false, "postulate": false, "description": "Along a streamline of an ideal fluid, pressure plus kinetic and potential energy per volume is constant; faster flow means lower pressure (Bernoulli's principle).", "vol": 1, "section": "14.6", "chapter": 14, "order": 155}}, {"uid": "UP:poise", "branch": "UP", "native_id": "poise", "label": "Poiseuille's law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 194, "concept": null, "extra": {"symbol": "Q = (p₂ − p₁)πr⁴/(8ηl)", "primitive": false, "postulate": false, "description": "Laminar viscous flow through a tube: flow rate is the pressure difference over a resistance R = 8ηl/(πr⁴).", "vol": 1, "section": "14.7", "chapter": 14, "order": 156}}, {"uid": "UP:Re", "branch": "UP", "native_id": "Re", "label": "Reynolds number", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 195, "concept": null, "extra": {"symbol": "N_R = 2ρvr/η", "primitive": false, "postulate": false, "description": "Dimensionless ratio of inertial to viscous effects; flow in a tube is laminar below about 2000 and turbulent above about 3000.", "vol": 1, "section": "14.7", "chapter": 14, "order": 157}}, {"uid": "UP:Tper", "branch": "UP", "native_id": "Tper", "label": "Period", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 197, "concept": null, "extra": {"symbol": "T", "primitive": false, "postulate": false, "description": "Time for one cycle of a periodic motion (an oscillation).", "vol": 1, "section": "15.1", "chapter": 15, "order": 158}}, {"uid": "UP:freq", "branch": "UP", "native_id": "freq", "label": "Frequency", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 197, "concept": null, "extra": {"symbol": "f = 1/T", "primitive": false, "postulate": false, "description": "Number of cycles per unit time; SI unit the hertz.", "vol": 1, "section": "15.1", "chapter": 15, "order": 159}}, {"uid": "UP:sho", "branch": "UP", "native_id": "sho", "label": "Simple harmonic oscillator", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 198, "concept": null, "extra": {"symbol": "m d²x/dt² = −kx", "primitive": false, "postulate": false, "description": "A mass on an ideal spring: the restoring force is proportional to displacement, giving simple harmonic motion.", "vol": 1, "section": "15.1", "chapter": 15, "order": 160}}, {"uid": "UP:shm", "branch": "UP", "native_id": "shm", "label": "Harmonic oscillation", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 199, "concept": null, "extra": {"symbol": "x(t) = A cos(ωt + φ)", "primitive": false, "postulate": false, "description": "The oscillator's state: amplitude A and phase shift φ about the equilibrium position; equivalently the pair (x, v) at one instant.", "vol": 1, "section": "15.1", "chapter": 15, "order": 161}}, {"uid": "UP:kspr", "branch": "UP", "native_id": "kspr", "label": "Force constant", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 200, "concept": null, "extra": {"symbol": "k", "primitive": false, "postulate": false, "description": "Stiffness of a spring: force per unit stretch, in N/m.", "vol": 1, "section": "15.1", "chapter": 15, "order": 162}}, {"uid": "UP:Frest", "branch": "UP", "native_id": "Frest", "label": "Restoring force", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 201, "concept": null, "extra": {"symbol": "F = −k(x − x₀)", "primitive": false, "postulate": false, "description": "Force that pushes a body back toward a stable equilibrium point; linear for small displacements.", "vol": 1, "section": "15.2", "chapter": 15, "order": 163}}, {"uid": "UP:spend", "branch": "UP", "native_id": "spend", "label": "Simple pendulum", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 204, "concept": null, "extra": {"symbol": "T = 2π√(L/g)", "primitive": false, "postulate": false, "description": "A point mass on a light string; for small angles it is a harmonic oscillator whose period depends only on length and g.", "vol": 1, "section": "15.4", "chapter": 15, "order": 164}}, {"uid": "UP:ppend", "branch": "UP", "native_id": "ppend", "label": "Physical pendulum", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 205, "concept": null, "extra": {"symbol": "T = 2π√(I/(mgL))", "primitive": false, "postulate": false, "description": "An extended body swinging about a pivot; its period depends on its moment of inertia and the distance L from pivot to centre of mass.", "vol": 1, "section": "15.4", "chapter": 15, "order": 165}}, {"uid": "UP:tpend", "branch": "UP", "native_id": "tpend", "label": "Torsional pendulum", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 206, "concept": null, "extra": {"symbol": "T = 2π√(I/κ)", "primitive": false, "postulate": false, "description": "A body twisting on a wire whose restoring torque is proportional to the twist angle.", "vol": 1, "section": "15.4", "chapter": 15, "order": 166}}, {"uid": "UP:damp", "branch": "UP", "native_id": "damp", "label": "Damped oscillator", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 207, "concept": null, "extra": {"symbol": "mẍ + bẋ + kx = 0", "primitive": false, "postulate": false, "description": "An oscillator with a drag force proportional to velocity; it is underdamped (decaying oscillation), critically damped or overdamped (no oscillation).", "vol": 1, "section": "15.5", "chapter": 15, "order": 167}}, {"uid": "UP:forced", "branch": "UP", "native_id": "forced", "label": "Driven oscillator and resonance", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 209, "concept": null, "extra": {"symbol": "mẍ + bẋ + kx = F₀ sin ωt", "primitive": false, "postulate": false, "description": "A damped oscillator pushed periodically settles into motion at the driving frequency; its amplitude peaks (resonance) when the driving frequency is near the natural one.", "vol": 1, "section": "15.6", "chapter": 15, "order": 168}}, {"uid": "UP:wave", "branch": "UP", "native_id": "wave", "label": "Wave", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 211, "concept": null, "extra": {"symbol": "y(x, t)", "primitive": false, "postulate": false, "description": "A disturbance that travels through a medium (mechanical wave) while each part of the medium only oscillates about its equilibrium; transverse or longitudinal.", "vol": 1, "section": "16.1", "chapter": 16, "order": 169}}, {"uid": "UP:lam", "branch": "UP", "native_id": "lam", "label": "Wavelength", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 212, "concept": null, "extra": {"symbol": "λ", "primitive": false, "postulate": false, "description": "Distance between adjacent identical points of a periodic wave.", "vol": 1, "section": "16.1", "chapter": 16, "order": 170}}, {"uid": "UP:vwave", "branch": "UP", "native_id": "vwave", "label": "Wave speed", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 212, "concept": null, "extra": {"symbol": "v = λ/T = λf", "primitive": false, "postulate": false, "description": "Speed at which the disturbance propagates; set by the medium, not by the source.", "vol": 1, "section": "16.1", "chapter": 16, "order": 171}}, {"uid": "UP:trav", "branch": "UP", "native_id": "trav", "label": "Traveling wave function", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 213, "concept": null, "extra": {"symbol": "y = f(x ∓ vt)", "primitive": false, "postulate": false, "description": "A wave shape that moves without changing; a pulse is a single such disturbance and y = A sin(kx − ωt + φ) is the periodic case.", "vol": 1, "section": "16.2", "chapter": 16, "order": 172}}, {"uid": "UP:kwave", "branch": "UP", "native_id": "kwave", "label": "Wave number", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 214, "concept": null, "extra": {"symbol": "k = 2π/λ", "primitive": false, "postulate": false, "description": "Spatial angular frequency of a wave, in rad/m; v = ω/k.", "vol": 1, "section": "16.2", "chapter": 16, "order": 173}}, {"uid": "UP:waveeq", "branch": "UP", "native_id": "waveeq", "label": "Linear wave equation", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 215, "concept": null, "extra": {"symbol": "∂²y/∂x² = (1/v²) ∂²y/∂t²", "primitive": false, "postulate": false, "description": "The equation satisfied by every wave travelling at speed v in a linear medium.", "vol": 1, "section": "16.2", "chapter": 16, "order": 174}}, {"uid": "UP:Pwave", "branch": "UP", "native_id": "Pwave", "label": "Wave power", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 218, "concept": null, "extra": {"symbol": "P_ave = ½μA²ω²v", "primitive": false, "postulate": false, "description": "Energy per unit time carried by a wave; proportional to the square of the amplitude and of the frequency.", "vol": 1, "section": "16.4", "chapter": 16, "order": 175}}, {"uid": "UP:Iint", "branch": "UP", "native_id": "Iint", "label": "Intensity", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 219, "concept": null, "extra": {"symbol": "I = P/A", "primitive": false, "postulate": false, "description": "Power per unit area carried by a wave; for a spherical wave I = P/(4πr²).", "vol": 1, "section": "16.4", "chapter": 16, "order": 176}}, {"uid": "UP:bc", "branch": "UP", "native_id": "bc", "label": "Boundary conditions", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 220, "concept": null, "extra": {"symbol": "fixed or free end", "primitive": false, "postulate": false, "description": "At a fixed end the displacement is zero and a reflected pulse is inverted; at a free end the slope is zero and the pulse returns upright.", "vol": 1, "section": "16.5", "chapter": 16, "order": 177}}, {"uid": "UP:interf", "branch": "UP", "native_id": "interf", "label": "Interference", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 221, "concept": null, "extra": {"symbol": "y_R = [2A cos(φ/2)] sin(kx − ωt + φ/2)", "primitive": false, "postulate": false, "description": "Two overlapping waves add constructively (in phase, double amplitude) or destructively (half a cycle apart, cancel).", "vol": 1, "section": "16.5", "chapter": 16, "order": 178}}, {"uid": "UP:superp", "branch": "UP", "native_id": "superp", "label": "Superposition principle", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 222, "concept": null, "extra": {"symbol": "y = y₁ + y₂", "primitive": false, "postulate": false, "description": "When waves overlap, the displacements add; follows from the linearity of the wave equation.", "vol": 1, "section": "16.5", "chapter": 16, "order": 179}}, {"uid": "UP:standw", "branch": "UP", "native_id": "standw", "label": "Standing wave", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 223, "concept": null, "extra": {"symbol": "y = [2A sin kx] cos ωt", "primitive": false, "postulate": false, "description": "Two equal waves moving in opposite directions produce a pattern that does not travel: nodes stay at rest, antinodes oscillate most.", "vol": 1, "section": "16.6", "chapter": 16, "order": 180}}, {"uid": "UP:modes", "branch": "UP", "native_id": "modes", "label": "Normal modes", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 224, "concept": null, "extra": {"symbol": "λ_n = 2L/n,  f_n = n v/2L", "primitive": false, "postulate": false, "description": "A string fixed at both ends can only hold standing waves that fit its length: the fundamental and its overtones.", "vol": 1, "section": "16.6", "chapter": 16, "order": 181}}, {"uid": "UP:sound", "branch": "UP", "native_id": "sound", "label": "Sound wave", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 226, "concept": null, "extra": {"symbol": "Δp(x, t),  s(x, t)", "primitive": false, "postulate": false, "description": "A longitudinal wave of compressions and rarefactions in a medium; the pressure wave is a quarter cycle out of phase with the displacement wave.", "vol": 1, "section": "17.1", "chapter": 17, "order": 182}}, {"uid": "UP:vsound", "branch": "UP", "native_id": "vsound", "label": "Speed of sound", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 227, "concept": null, "extra": {"symbol": "v = √(B/ρ)", "primitive": false, "postulate": false, "description": "Set by an elastic property over an inertial property of the medium: √(B/ρ) in fluids, √(Y/ρ) in solids, √(γRT/M) in an ideal gas.", "vol": 1, "section": "17.2", "chapter": 17, "order": 183}}, {"uid": "UP:beta", "branch": "UP", "native_id": "beta", "label": "Sound intensity level", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 229, "concept": null, "extra": {"symbol": "β = 10 log₁₀(I/I₀) dB", "primitive": false, "postulate": false, "description": "Logarithmic measure of intensity relative to the threshold I₀ = 10⁻¹² W/m².", "vol": 1, "section": "17.3", "chapter": 17, "order": 184}}, {"uid": "UP:tubemodes", "branch": "UP", "native_id": "tubemodes", "label": "Air-column modes", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 232, "concept": null, "extra": {"symbol": "f_n = nv/2L or nv/4L", "primitive": false, "postulate": false, "description": "Standing sound waves in a tube: open at both ends all harmonics f_n = nv/2L; closed at one end only odd ones, f_n = nv/4L.", "vol": 1, "section": "17.4", "chapter": 17, "order": 185}}, {"uid": "UP:fbeat", "branch": "UP", "native_id": "fbeat", "label": "Beat frequency", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 235, "concept": null, "extra": {"symbol": "f_B = |f₂ − f₁|", "primitive": false, "postulate": false, "description": "Two sounds of slightly different frequency produce a loudness that rises and falls at the difference frequency.", "vol": 1, "section": "17.6", "chapter": 17, "order": 186}}, {"uid": "UP:fdop", "branch": "UP", "native_id": "fdop", "label": "Doppler-shifted frequency", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 236, "concept": null, "extra": {"symbol": "f_o = f_s (v ± v_o)/(v ∓ v_s)", "primitive": false, "postulate": false, "description": "The frequency heard changes when source or observer moves through the medium: higher when approaching, lower when receding.", "vol": 1, "section": "17.7", "chapter": 17, "order": 187}}, {"uid": "UP:shock", "branch": "UP", "native_id": "shock", "label": "Shock wave", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 238, "concept": null, "extra": {"symbol": "sin θ = v/v_s = 1/M", "primitive": false, "postulate": false, "description": "A source faster than sound piles up its wavefronts on a cone; the pressure jump is heard as a sonic boom, and a boat's bow wake is the surface analogue.", "vol": 1, "section": "17.8", "chapter": 17, "order": 188}}, {"uid": "UP:temp", "branch": "UP", "native_id": "temp", "label": "Temperature", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 240, "concept": null, "extra": {"symbol": "T", "primitive": false, "postulate": false, "description": "How hot a body is, read from a thermometer; bodies in thermal equilibrium share one temperature. SI unit the kelvin.", "vol": 2, "section": "1.1", "chapter": 1, "order": 189}}, {"uid": "UP:theq", "branch": "UP", "native_id": "theq", "label": "Thermal equilibrium", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 240, "concept": null, "extra": {"symbol": "A ~ B", "primitive": false, "postulate": false, "description": "The state reached by bodies in thermal contact when heat transfer between them has stopped.", "vol": 2, "section": "1.1", "chapter": 1, "order": 190}}, {"uid": "UP:zeroth", "branch": "UP", "native_id": "zeroth", "label": "Zeroth law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 241, "concept": null, "extra": {"symbol": "A ~ C, B ~ C ⇒ A ~ B", "primitive": false, "postulate": true, "description": "Two bodies each in thermal equilibrium with a third are in equilibrium with each other.", "vol": 2, "section": "1.1", "chapter": 1, "order": 191}}, {"uid": "UP:tscale", "branch": "UP", "native_id": "tscale", "label": "Temperature scales", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 242, "concept": null, "extra": {"symbol": "T_K = T_C + 273.15", "primitive": false, "postulate": false, "description": "Celsius and Fahrenheit are relative scales; the Kelvin scale is absolute, with zero at absolute zero and the triple point of water at 273.16 K.", "vol": 2, "section": "1.2", "chapter": 1, "order": 192}}, {"uid": "UP:texp", "branch": "UP", "native_id": "texp", "label": "Thermal expansion", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 244, "concept": null, "extra": {"symbol": "ΔL = αLΔT,  ΔV = βVΔT", "primitive": false, "postulate": false, "description": "Most materials grow when heated: linearly in the temperature change for small changes; β ≈ 3α for isotropic solids. Water below 4 °C is an exception.", "vol": 2, "section": "1.3", "chapter": 1, "order": 193}}, {"uid": "UP:tstress", "branch": "UP", "native_id": "tstress", "label": "Thermal stress", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 246, "concept": null, "extra": {"symbol": "σ = YαΔT", "primitive": false, "postulate": false, "description": "Stress that appears when a body is prevented from expanding or contracting.", "vol": 2, "section": "1.3", "chapter": 1, "order": 194}}, {"uid": "UP:heat", "branch": "UP", "native_id": "heat", "label": "Heat", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 247, "concept": null, "extra": {"symbol": "Q", "primitive": false, "postulate": false, "description": "Energy transferred between bodies because of their temperature difference. 1 cal = 4.186 J (mechanical equivalent of heat).", "vol": 2, "section": "1.4", "chapter": 1, "order": 195}}, {"uid": "UP:cspec", "branch": "UP", "native_id": "cspec", "label": "Specific heat", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 248, "concept": null, "extra": {"symbol": "Q = mcΔT", "primitive": false, "postulate": false, "description": "Heat needed per unit mass to raise the temperature by one kelvin.", "vol": 2, "section": "1.4", "chapter": 1, "order": 196}}, {"uid": "UP:calor", "branch": "UP", "native_id": "calor", "label": "Calorimetry", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 249, "concept": null, "extra": {"symbol": "Q_hot + Q_cold = 0", "primitive": false, "postulate": false, "description": "Heat lost by the hot bodies in an insulated container equals heat gained by the cold ones.", "vol": 2, "section": "1.4", "chapter": 1, "order": 197}}, {"uid": "UP:phase", "branch": "UP", "native_id": "phase", "label": "Phase diagram", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 251, "concept": null, "extra": {"symbol": "regions in the (p, T) plane", "primitive": false, "postulate": false, "description": "Which phase (solid, liquid, gas) is stable at each pressure and temperature; the coexistence lines meet at the triple point and the liquid–vapor line ends at the critical point.", "vol": 2, "section": "1.5", "chapter": 1, "order": 198}}, {"uid": "UP:Lheat", "branch": "UP", "native_id": "Lheat", "label": "Latent heat", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 253, "concept": null, "extra": {"symbol": "Q = mL", "primitive": false, "postulate": false, "description": "Heat absorbed or released at constant temperature during a phase change: heat of fusion, vaporization or sublimation.", "vol": 2, "section": "1.5", "chapter": 1, "order": 199}}, {"uid": "UP:fourier", "branch": "UP", "native_id": "fourier", "label": "Heat conduction", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 254, "concept": null, "extra": {"symbol": "P = kA(T_h − T_c)/d", "primitive": false, "postulate": false, "description": "Heat flows through a material at a rate proportional to area and temperature difference and inversely to thickness.", "vol": 2, "section": "1.6", "chapter": 1, "order": 200}}, {"uid": "UP:convect", "branch": "UP", "native_id": "convect", "label": "Convection", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 256, "concept": null, "extra": {"symbol": "heat carried by flow", "primitive": false, "postulate": false, "description": "Heat transported by bulk motion of a fluid, driven by buoyancy (natural) or by pumps and fans (forced).", "vol": 2, "section": "1.6", "chapter": 1, "order": 201}}, {"uid": "UP:sbl", "branch": "UP", "native_id": "sbl", "label": "Stefan–Boltzmann law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 257, "concept": null, "extra": {"symbol": "P = σeAT⁴", "primitive": false, "postulate": true, "description": "Every body radiates energy at a rate proportional to the fourth power of its absolute temperature; the net rate is σeA(T₂⁴ − T₁⁴).", "vol": 2, "section": "1.6", "chapter": 1, "order": 202}}, {"uid": "UP:igl", "branch": "UP", "native_id": "igl", "label": "Ideal gas law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 259, "concept": null, "extra": {"symbol": "pV = N k_B T = nRT", "primitive": false, "postulate": false, "description": "For a dilute gas, pressure times volume is proportional to the number of molecules and the absolute temperature (Boyle, Charles and Gay-Lussac combined).", "vol": 2, "section": "2.1", "chapter": 2, "order": 203}}, {"uid": "UP:kB", "branch": "UP", "native_id": "kB", "label": "Boltzmann constant", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 260, "concept": null, "extra": {"symbol": "k_B", "primitive": true, "postulate": false, "description": "Converts temperature to energy per molecule: 1.38 × 10⁻²³ J/K.", "vol": 2, "section": "2.1", "chapter": 2, "order": 204}}, {"uid": "UP:NA", "branch": "UP", "native_id": "NA", "label": "Avogadro's number", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 260, "concept": null, "extra": {"symbol": "N_A", "primitive": true, "postulate": false, "description": "Number of molecules in one mole, 6.02 × 10²³ mol⁻¹; the mole counts amount of substance.", "vol": 2, "section": "2.1", "chapter": 2, "order": 205}}, {"uid": "UP:Rgas", "branch": "UP", "native_id": "Rgas", "label": "Gas constant", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 260, "concept": null, "extra": {"symbol": "R = N_A k_B", "primitive": false, "postulate": false, "description": "Boltzmann's constant per mole: 8.31 J/(mol·K).", "vol": 2, "section": "2.1", "chapter": 2, "order": 206}}, {"uid": "UP:vdw", "branch": "UP", "native_id": "vdw", "label": "Van der Waals equation", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 261, "concept": null, "extra": {"symbol": "[p + a(n/V)²](V − nb) = nRT", "primitive": false, "postulate": false, "description": "Corrects the ideal gas law for attraction between molecules (a) and their own volume (b); predicts liquefaction below a critical temperature.", "vol": 2, "section": "2.1", "chapter": 2, "order": 207}}, {"uid": "UP:pV", "branch": "UP", "native_id": "pV", "label": "Equilibrium state of a gas", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 262, "concept": null, "extra": {"symbol": "point (p, V)", "primitive": false, "postulate": false, "description": "A gas in equilibrium is fixed by two of p, V, T; the third follows from the equation of state, so the state is a point on a pV diagram.", "vol": 2, "section": "2.1", "chapter": 2, "order": 208}}, {"uid": "UP:kinth", "branch": "UP", "native_id": "kinth", "label": "Kinetic theory of gases", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 263, "concept": null, "extra": {"symbol": "pV = ⅓ N m ⟨v²⟩", "primitive": false, "postulate": false, "description": "A gas is many point molecules in random motion; pressure is the momentum they transfer to the walls in collisions.", "vol": 2, "section": "2.2", "chapter": 2, "order": 209}}, {"uid": "UP:Eint", "branch": "UP", "native_id": "Eint", "label": "Internal energy", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 264, "concept": null, "extra": {"symbol": "E_int = (3/2) N k_B T", "primitive": false, "postulate": false, "description": "Total kinetic and potential energy of the molecules; for a monatomic ideal gas only kinetic, (3/2)Nk_BT.", "vol": 2, "section": "2.2", "chapter": 2, "order": 210}}, {"uid": "UP:vrms", "branch": "UP", "native_id": "vrms", "label": "rms speed", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 264, "concept": null, "extra": {"symbol": "v_rms = √(3k_BT/m)", "primitive": false, "postulate": false, "description": "Square root of the mean square molecular speed.", "vol": 2, "section": "2.2", "chapter": 2, "order": 211}}, {"uid": "UP:dalton", "branch": "UP", "native_id": "dalton", "label": "Dalton's law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 265, "concept": null, "extra": {"symbol": "p = Σ p_i", "primitive": false, "postulate": false, "description": "In a mixture each gas exerts its own partial pressure as if alone; the total pressure is their sum.", "vol": 2, "section": "2.2", "chapter": 2, "order": 212}}, {"uid": "UP:mfp", "branch": "UP", "native_id": "mfp", "label": "Mean free path", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 266, "concept": null, "extra": {"symbol": "λ = k_BT/(4√2 π r² p)", "primitive": false, "postulate": false, "description": "Average distance a molecule travels between collisions; divided by the mean speed it gives the mean free time.", "vol": 2, "section": "2.2", "chapter": 2, "order": 213}}, {"uid": "UP:CV", "branch": "UP", "native_id": "CV", "label": "Molar heat capacity at constant volume", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 267, "concept": null, "extra": {"symbol": "C_V = (d/2)R", "primitive": false, "postulate": false, "description": "Heat per mole per kelvin at fixed volume.", "vol": 2, "section": "2.3", "chapter": 2, "order": 214}}, {"uid": "UP:equip", "branch": "UP", "native_id": "equip", "label": "Equipartition theorem", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 268, "concept": null, "extra": {"symbol": "½ k_B T per degree of freedom", "primitive": false, "postulate": false, "description": "In thermal equilibrium each quadratic term in a molecule's energy (degree of freedom) carries an average energy ½k_BT.", "vol": 2, "section": "2.3", "chapter": 2, "order": 215}}, {"uid": "UP:mbd", "branch": "UP", "native_id": "mbd", "label": "Maxwell–Boltzmann distribution", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 271, "concept": "gibbs_state", "extra": {"symbol": "f(v) ∝ v² e^{−mv²/2k_BT}", "primitive": false, "postulate": false, "description": "The equilibrium distribution of molecular speeds in an ideal gas.", "vol": 2, "section": "2.4", "chapter": 2, "order": 216}}, {"uid": "UP:vp", "branch": "UP", "native_id": "vp", "label": "Most probable speed", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 272, "concept": null, "extra": {"symbol": "v_p = √(2k_BT/m)", "primitive": false, "postulate": false, "description": "Speed at the peak of the Maxwell–Boltzmann distribution; below the mean and rms speeds.", "vol": 2, "section": "2.4", "chapter": 2, "order": 217}}, {"uid": "UP:tsys", "branch": "UP", "native_id": "tsys", "label": "Thermodynamic system", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 274, "concept": null, "extra": {"symbol": "system / surroundings", "primitive": false, "postulate": false, "description": "A part of the world separated by a boundary from its surroundings (environment); closed if no matter crosses, open otherwise. In equilibrium a few variables describe it.", "vol": 2, "section": "3.1", "chapter": 3, "order": 218}}, {"uid": "UP:eos", "branch": "UP", "native_id": "eos", "label": "Equation of state", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 275, "concept": null, "extra": {"symbol": "f(p, V, T) = 0", "primitive": false, "postulate": false, "description": "A relation among the state variables of a system in equilibrium.", "vol": 2, "section": "3.1", "chapter": 3, "order": 219}}, {"uid": "UP:qsproc", "branch": "UP", "native_id": "qsproc", "label": "Quasi-static process", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 276, "concept": null, "extra": {"symbol": "path in the pV plane", "primitive": false, "postulate": false, "description": "A process slow enough that the system passes through a sequence of equilibrium states, so it is a curve on the pV diagram.", "vol": 2, "section": "3.2", "chapter": 3, "order": 220}}, {"uid": "UP:Wpv", "branch": "UP", "native_id": "Wpv", "label": "Work done by a gas", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 277, "concept": null, "extra": {"symbol": "W = ∫ p dV", "primitive": false, "postulate": false, "description": "Work done by a system that changes volume; the area under the path on the pV diagram, so it depends on the path.", "vol": 2, "section": "3.2", "chapter": 3, "order": 221}}, {"uid": "UP:flaw", "branch": "UP", "native_id": "flaw", "label": "First law of thermodynamics", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 279, "concept": null, "extra": {"symbol": "ΔE_int = Q − W", "primitive": false, "postulate": false, "description": "The change of internal energy equals the heat added to the system minus the work done by the system.", "vol": 2, "section": "3.3", "chapter": 3, "order": 222}}, {"uid": "UP:tproc", "branch": "UP", "native_id": "tproc", "label": "Thermodynamic processes", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 281, "concept": null, "extra": {"symbol": "isothermal, isobaric, isochoric, adiabatic, cyclic", "primitive": false, "postulate": false, "description": "Paths with one quantity held fixed: T (isothermal), p (isobaric), V (isochoric), or no heat exchanged (adiabatic); a cyclic process returns to its start. A reversible process can be run backward through the same states.", "vol": 2, "section": "3.4", "chapter": 3, "order": 223}}, {"uid": "UP:Cp", "branch": "UP", "native_id": "Cp", "label": "Molar heat capacity at constant pressure", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 283, "concept": null, "extra": {"symbol": "C_p = C_V + R", "primitive": false, "postulate": false, "description": "Heat per mole per kelvin at fixed pressure; larger than C_V because the gas also does work.", "vol": 2, "section": "3.5", "chapter": 3, "order": 224}}, {"uid": "UP:adiab", "branch": "UP", "native_id": "adiab", "label": "Adiabatic process of an ideal gas", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 285, "concept": null, "extra": {"symbol": "pV^γ = const", "primitive": false, "postulate": false, "description": "In a quasi-static adiabatic expansion the gas cools; pressure and volume follow pV^γ = constant with γ = C_p/C_V.", "vol": 2, "section": "3.6", "chapter": 3, "order": 225}}, {"uid": "UP:irrev", "branch": "UP", "native_id": "irrev", "label": "Irreversible process", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 288, "concept": null, "extra": {"symbol": "real process", "primitive": false, "postulate": false, "description": "A process that cannot be undone without leaving a change in the surroundings: f
