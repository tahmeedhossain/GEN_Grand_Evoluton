k", "statement": "A quantum resource theory is a pair (F, O): free states F and free operations O with the golden rule O(F) subset of F. The maximal class is RNG (resource non-generating). Theories are classified by how O is justified physically.", "refs": ["Chitambar, Gour, RMP 91, 025001 (2019) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:F-CONVEX", "branch": "QRT", "native_id": "F-CONVEX", "label": "Convexity axiom", "layer": "M", "sublayer": "M.axiom", "native_layer": "model/framework", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "framework", "role": "framework", "statement": "F convex and closed. Then every resource state is separated from F by a hyperplane: witnesses exist, and the generalized robustness R(rho) = min{s : (rho + s sigma)/(1+s) in F} is well defined.", "refs": ["Chitambar, Gour, RMP 91, 025001 (2019) [knowledge]", "Vidal, Tarrach, PRA 59, 141 (1999) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:F-TENSOR", "branch": "QRT", "native_id": "F-TENSOR", "label": "Tensor / monoidal axiom", "layer": "M", "sublayer": "M.axiom", "native_layer": "model/framework", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "framework", "role": "framework", "statement": "F closed under tensor products and partial trace (symmetric monoidal structure of Coecke-Fritz-Spekkens). Prerequisite for asymptotic (many-copy) rates.", "refs": ["Coecke, Fritz, Spekkens, Inf. Comput. 250, 59 (2016) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:F-STEIN", "branch": "QRT", "native_id": "F-STEIN", "label": "Generalized Stein lemma / second law", "layer": "M", "sublayer": "M.axiom", "native_layer": "model/framework", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "framework", "role": "framework", "statement": "For F satisfying the Brandao-Plenio axioms, the Stein exponent of resource testing equals the regularized relative entropy of resource; consequence: asymptotic reversibility under asymptotically resource-non-generating operations, with the regularized relative entropy as the unique 'entropy'. History: claimed 2010, proof gap found 2023 (Berta et al., Quantum 7, 1103 (2023) [verify page]), proven 2024.", "refs": ["Hayashi, Yamasaki, arXiv:2408.02722 [verified]", "Lami, arXiv:2408.06410 [verified]", "Brandao, Gour, PRL 115, 070503 (2015) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:F-ADV", "branch": "QRT", "native_id": "F-ADV", "label": "Universal operational advantage", "layer": "M", "sublayer": "M.axiom", "native_layer": "model/framework", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "framework", "role": "framework", "statement": "In any convex QRT, every resource state strictly outperforms all free states in some (sub)channel discrimination task, and the generalized robustness is the exact maximal advantage. Extended beyond convexity via multi-copy discrimination.", "refs": ["Takagi, Regula, Bu, Liu, Adesso, PRL 122, 140402 (2019) [verified]", "Takagi, Regula, PRX 9, 031053 (2019) [verified]", "Kuroiwa, Takagi, Adesso, Yamasaki, 'Every quantum helps' [verify venue]"], "status": "theorem"}}, {"uid": "QRT:F-TYPE", "branch": "QRT", "native_id": "F-TYPE", "label": "QP1: typology of free operations", "layer": "M", "sublayer": "M.axiom", "native_layer": "model/framework", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "framework", "role": "framework", "statement": "DERIVED classification. The 12 proper theories split by the physical justification of O: symmetry-type (asymmetry; unspeakable coherence; imaginarity as antiunitary Z2 analogue), subtheory-type (magic, CV non-Gaussianity), partition-type (entanglement, steering, nonlocality, contextuality, incompatibility), constraint-type (purity, athermality). Athermality is the unique two-type intersection, mirrored at state level (unique free state = the one symmetric Gibbs state) and witness level (second laws factor into free-energy + coherence families).", "refs": ["classification assembled here; cf. Chitambar, Gour, RMP 91, 025001 (2019) [knowledge]"], "status": "derived"}}, {"uid": "QRT:p-lqicc", "branch": "QRT", "native_id": "p-lqicc", "label": "LQICC / LICC (ENT x COH)", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/framework", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "shared", "role": "framework", "statement": "Intersection classes (local quantum-incoherent operations and classical communication): the arena in which entanglement and coherence are interconverted and assisted-distilled.", "refs": ["Chitambar, Hsieh, PRL 117, 020402 (2016) [knowledge]", "Streltsov et al., PRL 116, 240405 (2016) [verify]", "Chitambar et al., PRL 116, 070402 (2016) [verify]"], "status": "theorem"}}, {"uid": "QRT:p-cat", "branch": "QRT", "native_id": "p-cat", "label": "Catalysis", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/framework", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "shared", "role": "framework", "statement": "Catalysts enlarge the reachable set in many theories: entanglement catalysis (Jonathan-Plenio), catalytic coherence (Aberg), catalytic thermodynamics; a cross-theory phenomenon of the operations layer and a candidate route around exact-RNG irreversibility (entanglement battery, QG9).", "refs": ["Jonathan, Plenio, PRL 83, 3566 (1999) [knowledge]", "Aberg, PRL 113, 150402 (2014) [knowledge]", "Datta, Kondra, Miller, Streltsov, Rep. Prog. Phys. 86, 116002 (2023) [verified]"], "status": "theorem"}}, {"uid": "QRT:p-rng", "branch": "QRT", "native_id": "p-rng", "label": "Maximal (RNG) classes", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/framework", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "shared", "role": "framework", "statement": "NE (entanglement), MIO (coherence), GPO (athermality), CSPO-type (magic), covariant (asymmetry), unital (purity). Reversibility statements live here and are class-sensitive: exact vs asymptotic non-generation is the load-bearing distinction.", "refs": ["Chitambar, Gour, RMP 91, 025001 (2019) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:w-hahn", "branch": "QRT", "native_id": "w-hahn", "label": "Witness existence (Hahn-Banach)", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/framework", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "framework", "role": "framework", "statement": "Convexity + closedness of F implies every resource state is detected by some linear witness. The convexity axiom translated to the witness layer.", "refs": ["Chitambar, Gour, RMP 91, 025001 (2019) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:w-robust", "branch": "QRT", "native_id": "w-robust", "label": "Robustness = discrimination advantage", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/framework", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "framework", "role": "framework", "statement": "Generalized robustness is exactly the maximal advantage of a resource state over all free states in a class of subchannel discrimination tasks - one witness/task pair that every convex theory instantiates.", "refs": ["Takagi et al., PRL 122, 140402 (2019) [verified]", "Takagi, Regula, PRX 9, 031053 (2019) [verified]"], "status": "theorem"}}, {"uid": "QRT:t-discrim", "branch": "QRT", "native_id": "t-discrim", "label": "Channel discrimination (universal task)", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/framework", "era": "quantum", "t": 1.1, "concept": "discrimination", "extra": {"theory": "framework", "role": "framework", "statement": "The universal task: every resource of every convex theory buys a strict advantage here; steering's version is subchannel discrimination with 1W-LOCC measurements.", "refs": ["Takagi et al., PRL 122, 140402 (2019) [verified]", "Piani, Watrous, PRL 114, 060404 (2015) [verify]"], "status": "theorem"}}, {"uid": "QRT:m-pur", "branch": "QRT", "native_id": "m-pur", "label": "Constraint: no purity source", "layer": "M", "sublayer": "M.model", "native_layer": "model/model", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "pur", "role": "model", "statement": "Constraint-type model: the only free state is the maximally mixed one; free ops = noisy operations; state pre-order = majorization; equivalent to athermality with trivial Hamiltonian.", "refs": ["Gour et al., Phys. Rep. 583, 1 (2015) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:m-ath", "branch": "QRT", "native_id": "m-ath", "label": "Gibbs constraint x U(1) covariance", "layer": "M", "sublayer": "M.model", "native_layer": "model/model", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ath", "role": "model", "statement": "Constraint x symmetry type: energy conservation (U(1)-covariance of TO) + unique full-rank fixed point gamma (Gibbs preservation). Block-diagonal sector governed by thermomajorization; coherent sector by asymmetry theory. The unique two-axiom intersection of the typology (QP1).", "refs": ["Brandao et al., PRL 111, 250404 (2013) [knowledge]", "Lostaglio, Korzekwa, Jennings, Rudolph, PRX 5, 021001 (2015) [verified]"], "status": "theorem"}}, {"uid": "QRT:m-asy", "branch": "QRT", "native_id": "m-asy", "label": "G-covariance (reference frames)", "layer": "M", "sublayer": "M.model", "native_layer": "model/model", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "asy", "role": "model", "statement": "Symmetry-type: group G acts by a unitary representation; free = invariant states; O = covariant channels. Monotone set strictly larger than speakable-coherence monotone set.", "refs": ["Gour, Spekkens, NJP 10, 033023 (2008) [knowledge]", "Marvian, Spekkens, Zanardi, PRA 93, 052331 (2016) [verified]"], "status": "theorem"}}, {"uid": "QRT:m-coh", "branch": "QRT", "native_id": "m-coh", "label": "Dephasing-defined (basis-relative)", "layer": "M", "sublayer": "M.model", "native_layer": "model/model", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "coh", "role": "model", "statement": "F = fixed points of the dephasing map Delta. Free-op zoo MIO > {IO, DIO} > SIO reflects the absence of a single physical justification (Marvian-Spekkens critique); TIO < DIO is the symmetry-justified subclass.", "refs": ["Marvian, Spekkens, PRA 94, 052324 (2016) [verified]", "Chitambar, Gour, PRL 117, 030401 (2016) [verify]"], "status": "theorem"}}, {"uid": "QRT:m-ima", "branch": "QRT", "native_id": "m-ima", "label": "Antiunitary Z2 (conjugation)", "layer": "M", "sublayer": "M.model", "native_layer": "model/model", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ima", "role": "model", "statement": "Z2 analogue of coherence with respect to an ANTIUNITARY (complex conjugation K): free = K-invariant states. Not a G-covariance theory in the usual sense because K is not a channel; free ops defined by real Kraus operators.", "refs": ["Hickey, Gour, J. Phys. A 51, 414009 (2018) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:m-mag", "branch": "QRT", "native_id": "m-mag", "label": "Stabilizer subtheory (Gottesman-Knill)", "layer": "M", "sublayer": "M.model", "native_layer": "model/model", "era": "quantum", "t": 1.1, "concept": "stabilizer_subtheory", "extra": {"theory": "mag", "role": "model", "statement": "Subtheory-type: the stabilizer subtheory is classically simulable; resource = whatever lies outside its convex hull. Odd d: distillation-relevant boundary characterized by discrete-Wigner positivity.", "refs": ["Veitch et al., NJP 16, 013009 (2014) [knowledge]", "Veitch, Ferrie, Gross, Emerson, NJP 14, 113011 (2012) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:m-nga", "branch": "QRT", "native_id": "m-nga", "label": "Gaussian subtheory (CV)", "layer": "M", "sublayer": "M.model", "native_layer": "model/model", "era": "quantum", "t": 1.1, "concept": "gaussian_subtheory", "extra": {"theory": "nga", "role": "model", "statement": "Subtheory-type CV twin of ", "native_layer": "model/model", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ctx", "role": "model", "statement": "Partition-type over compatibility structures: behaviors on measurement scenarios; O = noncontextual wirings; unifies KS contextuality and Bell nonlocality in one framework.", "refs": ["Amaral, Cabello, Terra Cunha, Aolita, PRL 120, 130403 (2018) [verified]"], "status": "theorem"}}, {"uid": "QRT:m-inc", "branch": "QRT", "native_id": "m-inc", "label": "Device programmability", "layer": "M", "sublayer": "M.model", "native_layer": "model/model", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "inc", "role": "model", "statement": "Resource on measurement DEVICES, not states: incompatibility = quantum programmability of a classical-output device; complete convertibility conditions via discrimination with post-measurement information. Shows the QRT schema extends to dynamical objects.", "refs": ["Buscemi, Chitambar, Zhou, PRL 124, 120401 (2020) [verified]"], "status": "theorem"}}, {"uid": "QRT:m-dis", "branch": "QRT", "native_id": "m-dis", "label": "Fails convexity + golden rule", "layer": "M", "sublayer": "M.model", "native_layer": "model/model", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "dis", "role": "model", "statement": "FAILS two framework axioms: (i) the classical-state set is non-convex; (ii) local channels can create discord, so no golden-rule free-op class contains even local processing. Discord quantities remain meaningful but discord is not a QRT in the standard sense.", "refs": ["Modi et al., RMP 84, 1655 (2012) [knowledge]", "Ciccarello, Giovannetti, PRA 85, 010102(R) (2012) [verify]", "Hu et al., PRA 85, 032102 (2012) [verify]"], "status": "counterexample"}}, {"uid": "QRT:sF-pur", "branch": "QRT", "native_id": "sF-pur", "label": "I/d (unique free state)", "layer": "S", "sublayer": "S.free", "native_layer": "state/free_state", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "pur", "role": "free_state", "statement": "The free set is the single state I/d - the smallest free set in the compilation, making purity the bottom currency: every other theory's free set contains it.", "refs": ["Gour et al., Phys. Rep. 583, 1 (2015) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:sR-pur", "branch": "QRT", "native_id": "sR-pur", "label": "Nonuniform states", "layer": "S", "sublayer": "S.resource", "native_layer": "state/resource_state", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "pur", "role": "resource_state", "statement": "Any rho != I/d is a resource. Pre-order: majorization (complete); asymptotic rate log d - S(rho); fully reversible with no bound resources - the benchmark reversible theory.", "refs": ["Gour et al., Phys. Rep. 583, 1 (2015) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:sF-ath", "branch": "QRT", "native_id": "sF-ath", "label": "Gibbs state gamma (unique)", "layer": "S", "sublayer": "S.free", "native_layer": "state/free_state", "era": "quantum", "t": 1.1, "concept": "gibbs_state", "extra": {"theory": "ath", "role": "free_state", "statement": "Unique free state e^{-beta H}/Z: the only state that is both a fixed point of the Gibbs constraint AND U(1)-symmetric - the state-level shadow of the two-axiom intersection (QP1).", "refs": ["Horodecki, Oppenheim, Nat. Commun. 4, 2059 (2013) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:sR-ath", "branch": "QRT", "native_id": "sR-ath", "label": "Athermal states", "layer": "S", "sublayer": "S.resource", "native_layer": "state/resource_state", "era": "quantum", "t": 1.1, "concept": "athermal_states", "extra": {"theory": "ath", "role": "resource_state", "statement": "Any rho != gamma. Block-diagonal sector ordered by thermomajorization; coherent sector constrained independently by asymmetry modes (neither family alone complete).", "refs": ["Horodecki, Oppenheim, Nat. Commun. 4, 2059 (2013) [knowledge]", "Lostaglio et al., PRX 5, 021001 (2015) [verified]"], "status": "theorem"}}, {"uid": "QRT:sF-asy", "branch": "QRT", "native_id": "sF-asy", "label": "Symmetric (G-invariant) states", "layer": "S", "sublayer": "S.free", "native_layer": "state/free_state", "era": "quantum", "t": 1.1, "concept": "symmetric_states", "extra": {"theory": "asy", "role": "free_state", "statement": "U_g rho U_g^dag = rho for all g. For U(1) generated by H with nondegenerate spectrum: exactly the energy-incoherent states.", "refs": ["Gour, Spekkens, NJP 10, 033023 (2008) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:sR-asy", "branch": "QRT", "native_id": "sR-asy", "label": "Asymmetric states (clocks/frames)", "layer": "S", "sublayer": "S.resource", "native_layer": "state/resource_state", "era": "quantum", "t": 1.1, "concept": "asymmetric_states", "extra": {"theory": "asy", "role": "resource_state", "statement": "[rho, H] != 0 for translations: unspeakable coherence. Quantified by the QFI family; pure-state asymmetry not captured by any single entropic measure.", "refs": ["Marvian, Spekkens, PRA 94, 052324 (2016) [verified]"], "status": "theorem"}}, {"uid": "QRT:sF-coh", "branch": "QRT", "native_id": "sF-coh", "label": "Incoherent (diagonal) states", "layer": "S", "sublayer": "S.free", "native_layer": "state/free_state", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "coh", "role": "free_state", "statement": "Diagonal in the fixed reference basis: Delta(rho) = rho.", "refs": ["Baumgratz, Cramer, Plenio, PRL 113, 140401 (2014) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:sR-coh", "branch": "QRT", "native_id": "sR-coh", "label": "Coherent states", "layer": "S", "sublayer": "S.resource", "native_layer": "state/resource_state", "era": "quantum", "t": 1.1, "concept": "coherent_states", "extra": {"theory": "coh", "role": "resource_state", "statement": "Off-diagonal in the fixed basis; golden unit |+_d>. Every coherent state is distillable at rate C_r under IO - no bound coherence exists.", "refs": ["Winter, Yang, PRL 116, 120404 (2016) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:sF-ima", "branch": "QRT", "native_id": "sF-ima", "label": "Real states", "layer": "S", "sublayer": "S.free", "native_layer": "state/free_state", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ima", "role": "free_state", "statement": "Density matrices with real entries in the fixed basis (invariant under conjugation K).", "refs": ["Hickey, Gour, J. Phys. A 51, 414009 (2018) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:sR-ima", "branch": "QRT", "native_id": "sR-ima", "label": "Imaginary states", "layer": "S", "sublayer": "S.resource", "native_layer": "state/resource_state", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ima", "role": "resource_state", "statement": "States with nonzero imaginary parts; golden unit (|0> + i|1>)/sqrt(2); qubit and pure-state conversion fully solved.", "refs": ["Wu et al., PRA 103, 032401 (2021) [verified]"], "status": "theorem"}}, {"uid": "QRT:sF-mag", "branch": "QRT", "native_id": "sF-mag", "label": "STAB (stabilizer polytope)", "layer": "S", "sublayer": "S.free", "native_layer": "state/free_state", "era": "quantum", "t": 1.1, "concept": "stabilizer_states", "extra": {"theory": "mag", "role": "free_state", "statement": "Convex hull of stabilizer states; classically simulable (Gottesman-Knill). Contains maximally entangled states (Bell, GHZ): free-of-magic is not free-of-entanglement.", "refs": ["Veitch et al., NJP 16, 013009 (2014) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:sR-mag", "branch": "QRT", "native_id": "sR-mag", "label": "Magic (non-stabilizer) states", "layer": "S", "sublayer": "S.resource", "native_layer": "state/resource_state", "era": "quantum", "t": 1.1, "concept": "magic_states", "extra": {"theory": "mag", "role": "resource_state", "statement": "Outside STAB; golden unit T state. Odd d: mana > 0 iff discrete-Wigner-negative; Wigner-positive non-stabilizer states are BOUND magic (undistillable).", "refs": ["Veitch, Ferrie, Gross, Emerson, NJP 14, 113011 (2012) [knowledge]", "Bravyi, Kitaev, PRA 71, 022316 (2005) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:sF-nga", "branch": "QRT", "native_id": "sF-nga", "label": "Wigner-positive states", "layer": "S", "sublayer": "S.free", "native_layer": "state/free_state", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "nga", "role": "free_state", "statement": "Nonnegative CV Wigner function (resp. convex hull of Gaussians); positive-Wigner dynamics is classically simulable.", "refs": ["Mari, Eisert, PRL 109, 230503 (2012) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:sR-nga", "branch": "QRT", "native_id": "sR-nga", "label": "Wigner-negative states", "layer": "S", "sublayer": "S.resource", "native_layer": "state/resource_state", "era": "quantum", "t": 1.1, "concept": "wigner_negative", "extra": {"theory": "nga", "role": "resource_state", "statement": "Negativity of the CV Wigner function; golden unit Fock |1>; necessary for CV computational advantage and equivalent to CV contextuality.", "refs": ["Takagi, Zhuang, PRA 97, 062337 (2018) [knowledge]", "Booth, Chabaud, Emeriau, PRL 129, 230401 (2022) [knowledge, verified in prior network run]"], "status": "theorem"}}, {"uid": "QRT:sF-ent", "branch": "QRT", "native_id": "sF-ent", "label": "SEP (separable states)", "layer": "S", "sublayer": "S.free", "native_layer": "state/free_state", "era": "quantum", "t": 1.1, "concept": "separable_states", "extra": {"theory": "ent", "role": "free_state", "statement": "Convex mixtures of product states. Deciding membership is NP-hard; witnesses complete by Hahn-Banach.", "refs": ["Horodecki x4, RMP 81, 865 (2009) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:sR-ent", "branch": "QRT", "native_id": "sR-ent", "label": "Entangled states", "layer": "S", "sublayer": "S.resource", "native_layer": "state/resource_state", "era": "quantum", "t": 1.1, "concept": "entangled_states", "extra": {"theory": "ent", "role": "resource_state", "statement": "Outside SEP; golden unit ebit |Phi+>. E_D < E_C in general: bound entangled (PPT) states have E_D = 0 < E_C.", "refs": ["Horodecki x4, RMP 81, 865 (2009) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:sF-ste", "branch": "QRT", "native_id": "sF-ste", "label": "LHS (unsteerable) assemblages", "layer": "S", "sublayer": "S.free", "native_layer": "state/free_state", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ste", "role": "free_state", "statement": "Assemblages admitting local-hidden-state models. Strictly between the neighbors: SEP < unsteerable < Bell-local, both inclusions strict (Werner ranges).", "refs": ["Wiseman, Jones, Doherty, PRL 98, 140402 (2007) [knowledge]", "Quintino et al., PRA 92, 032107 (2015) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:sR-ste", "branch": "QRT", "native_id": "sR-ste", "label": "Steerable assemblages", "layer": "S", "sublayer": "S.resource", "native_layer": "state/resource_state", "era": "quantum", "t": 1.1, "concept": "epr_steering", "extra": {"theory": "ste", "role": "resource_state", "statement": "No LHS model. Steering requires BOTH entanglement of the state and incompatibility of the untrusted measurements, jointly.", "refs": ["Wiseman, Jones, Doherty, PRL 98, 140402 (2007) [knowledge]", "Uola et al., PRL 115, 230402 (2015) [verified]"], "status": "theorem"}}, {"uid": "QRT:sF-nlo", "branch": "QRT", "native_id": "sF-nlo", "label": "Local (classical-cause) boxes", "layer": "S", "sublayer": "S.free", "native_layer": "state/free_state", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "nlo", "role": "free_state", "statement": "Common-cause boxes explained by a classical causal model. Caveat QP2: the STATE-level Bell-local set is not tensor-stable (superactivation); boxes under LOSR, not states, are the proper free objects.", "refs": ["Wolfe et al., Quantum 4, 280 (2020) [verified]", "Palazuelos, PRL 109, 190401 (2012) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:sR-nlo", "branch": "QRT", "native_id": "sR-nlo", "label": "Nonlocal boxes", "layer": "S", "sublayer": "S.resource", "native_layer": "state/resource_state", "era": "quantum", "t": 1.1, "concept": "bell_nonlocality", "extra": {"theory": "nlo", "role": "resource_state", "statement": "Boxes violating some Bell inequality; every convexly extremal quantumly realizable box is at the top of the quantum LOSR pre-order; the PR box is the beyond-quantum top.", "refs": ["Wolfe et al., Quantum 4, 280 (2020) [verified]"], "status": "theorem"}}, {"uid": "QRT:sF-ctx", "branch": "QRT", "native_id": "sF-ctx", "label": "Noncontextual behaviors", "layer": "S", "sublayer": "S.free", "native_layer": "state/free_state", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ctx", "role": "free_state", "statement": "Behaviors with noncontextual models on the scenario's compatibility structure. Bell-local behaviors are the special case where contexts are spacelike (SS15).", "refs": ["Amaral et al., PRL 120, 130403 (2018) [verified]"], "status": "theorem"}}, {"uid": "QRT:sR-ctx", "branch": "QRT", "native_id": "sR-ctx", "label": "Contextual behaviors", "layer": "S", "sublayer": "S.resource", "native_layer": "state/resource_state", "era": "quantum", "t": 1.1, "concept": "ks_contextuality", "extra": {"theory": "ctx", "role": "resource_state", "statement": "Violate some noncontextuality inequality; maximally contextual boxes ('contextuality bits') exist for broad scenario classes.", "refs": ["Amaral et al., PRL 120, 130403 (2018) [verified]"], "status": "theorem"}}, {"uid": "QRT:sF-inc", "branch": "QRT", "native_id": "sF-inc", "label": "Jointly measurable sets", "layer": "S", "sublayer": "S.free", "native_layer": "state/free_state", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "inc", "role": "free_state", "statement": "POVM collections with a parent measurement - equivalently, devices programmable with classical programs.", "refs": ["Heinosaari, Miyadera, Ziman, J. Phys. A 49, 123001 (2016) [knowledge]", "Buscemi, Chitambar, Zhou, PRL 124, 120401 (2020) [verified]"], "status": "theorem"}}, {"uid": "QRT:sR-inc", "branch": "QRT", "native_id": "sR-inc", "label": "Incompatible sets", "layer": "S", "sublayer": "S.resource", "native_layer": "state/resource_state", "era": "quantum", "t": 1.1, "concept": "measurement_incompatibility", "extra": {"theory": "inc", "role": "resource_state", "statement": "No parent POVM. In one-to-one correspondence with steerable assemblages (SS10); golden unit: mutually unbiased sharp pair.", "refs": ["Uola et al., PRL 115, 230402 (2015) [verified]"], "status": "theorem"}}, {"uid": "QRT:sF-dis", "branch": "QRT", "native_id": "sF-dis", "label": "Classical-classical states", "layer": "S", "sublayer": "S.free", "native_layer": "state/free_state", "era": "quantum", "t": 1.1, "concept": "zero_discord", "extra": {"theory": "dis", "role": "free_state", "statement": "Diagonal in a product basis; locally broadcastable. The set is NON-CONVEX: mixing CC states of different bases is discordant - the convexity-axiom violation (MM9).", "refs": ["Ollivier, Zurek, PRL 88, 017901 (2001) [knowledge]", "Modi et al., RMP 84, 1655 (2012) [knowledge]"], "status": "counterexample"}}, {"uid": "QRT:sR-dis", "branch": "QRT", "native_id": "sR-dis", "label": "Discordant states", "layer": "S", "sublayer": "S.resource", "native_layer": "state/resource_state", "era": "quantum", "t": 1.1, "concept": "discordant_states", "extra": {"theory": "dis", "role": "resource_state", "statement": "Any state not classical-classical, separable states included. Relative entropy of quantumness = minimal distillable entanglement generated by the activation protocol.", "refs": ["Piani et al., PRL 106, 220403 (2011) [verified]"], "status": "theorem"}}, {"uid": "QRT:d-maxmix", "branch": "QRT", "native_id": "d-maxmix", "label": "I/d - shared bottom", "layer": "S", "sublayer": "S.dist", "native_layer": "state/dist", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "pur", "role": "dist", "statement": "Member of every free set considered here EXCEPT purity, where it is the unique free state, and athermality, where it is free only at infinite temperature (trivial H). The universal bottom of all pre-orders.", "refs": ["derived (membership checks are elementary)"], "status": "derived"}}, {"uid": "QRT:d-gibbs", "branch": "QRT", "native_id": "d-gibbs", "label": "Gibbs gamma - thermal magic", "layer": "S", "sublayer": "S.dist", "native_layer": "state/dist", "era": "quantum", "t": 1.1, "concept": "gibbs_state", "extra": {"theory": "ath", "role": "dist", "statement": "Unique athermality-free state; incoherent in the energy basis (nondegenerate H); U(1)-symmetric; real in the energy basis; separable for noninteracting local H. But for a generic interacting H, gamma is NOT a stabilizer state: the thermal state of one theory is a magic resource of another (QP5).", "refs": ["derived (proof sketch in catalog)"], "status": "derived"}}, {"uid": "QRT:d-plus", "branch": "QRT", "native_id": "d-plus", "label": "|+> - coherent yet magic-free", "layer": "S", "sublayer": "S.dist", "native_layer": "state/dist", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "coh", "role": "dist", "statement": "Stabilizer and real and pure: free in magic and imaginarity, maximal resource in coherence (basis Z), purity, and U(1)-asymmetry (H prop Z). Witnesses that coherence is NOT sufficient for magic.", "refs": ["derived (elementary)"], "status": "derived"}}, {"uid": "QRT:d-tstate", "branch": "QRT", "native_id": "d-tstate", "label": "T state - four-theory resource", "layer": "S", "sublayer": "S.dist", "native_layer": "state/dist", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "mag", "role": "dist", "statement": "(|0> + e^{i pi/4}|1>)/sqrt(2): simultaneously a resource of magic, coherence, purity AND imaginarity; injection yields the T gate and universality.", "refs": ["Bravyi, Kitaev, PRA 71, 022316 (2005) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:d-wpos", "branch": "QRT", "native_id": "d-wpos", "label": "Wigner-positive magic (bound)", "layer": "S", "sublayer": "S.dist", "native_layer": "state/dist", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "nga", "role": "dist", "statement": "Odd d: states outside STAB yet with mana = 0; useless for magic distillation and classically simulable - the magic analogue of bound entanglement.", "refs": ["Veitch, Ferrie, Gross, Emerson, NJP 14, 113011 (2012) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:d-bell", "branch": "QRT", "native_id": "d-bell", "label": "Bell |Phi+> - entangled, magic-free", "layer": "S", "sublayer": "S.dist", "native_layer": "state/dist", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ent", "role": "dist", "statement": "Maximally entangled, maximally steering-capable, Bell-violating (with incompatible measurements) - yet a stabilizer state (magic-free) and real (imaginarity-free). Shows STAB is not inside SEP: free sets of different theories cut across each other.", "refs": ["derived (elementary)"], "status": "derived"}}, {"uid": "QRT:d-werner", "branch": "QRT", "native_id": "d-werner", "label": "Werner states - strictness witness", "layer": "S", "sublayer": "S.dist", "native_layer": "state/dist", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ste", "role": "dist", "statement": "Entangled for p > 1/3; admit LHV models for projective measurements in a range (Werner) and even for POVMs (Barrett); unsteerable range (WJD). The canonical witness that SEP < unsteerable < Bell-local is strict.", "refs": ["Werner, PRA 40, 4277 (1989) [knowledge]", "Barrett, PRA 65, 042302 (2002) [knowledge]", "Wiseman, Jones, Doherty, PRL 98, 140402 (2007) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:d-bound", "branch": "QRT", "native_id": "d-bound", "label": "Bound entangled states", "layer": "S", "sublayer": "S.dist", "native_layer": "state/dist", "era": "quantum", "t": 1.1, "concept": "bound_entangled", "extra": {"theory": "nlo", "role": "dist", "statement": "PPT entangled: E_D = 0 < E_C. Some bound entangled states violate Bell inequalities (Peres conjecture false): nonlocality without distillability.", "refs": ["Vertesi, Brunner, Nat. Commun. 5, 5297 (2014) [verify page]", "Horodecki x4, RMP 81, 865 (2009) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:d-ccdis", "branch": "QRT", "native_id": "d-ccdis", "label": "Discordant separable states", "layer": "S", "sublayer": "S.dist", "native_layer": "state/dist", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "dis", "role": "dist", "statement": "Separable (entanglement-free) yet discordant; the input class for discord-to-entanglement activation.", "refs": ["Ollivier, Zurek, PRL 88, 017901 (2001) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:pF-pur", "branch": "QRT", "native_id": "pF-pur", "label": "Noisy / unital operations", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/free_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "pur", "role": "free_ops", "statement": "Noisy operations (unitaries + maximally mixed ancillas + partial trace); unital maps give the same single-system state pre-order (majorization).", "refs": ["Gour et al., Phys. Rep. 583, 1 (2015) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:pU-pur", "branch": "QRT", "native_id": "pU-pur", "label": "Work from purity; coherence prep", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/use_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "pur", "role": "use_ops", "statement": "Purity as fuel: kT ln2 of work per pure bit (Landauer/Szilard); and via free unitaries it converts into maximal coherence in any chosen basis, which bounds downstream entanglement and discord generation (QP4 cascade).", "refs": ["Landauer/Szilard [knowledge]", "Streltsov, Kampermann, Wolk, Gessner, Bruss, NJP 20, 053058 (2018) [verified]"], "status": "theorem"}}, {"uid": "QRT:pF-ath", "branch": "QRT", "native_id": "pF-ath", "label": "Thermal operations (TO)", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/free_ops", "era": "quantum", "t": 1.1, "concept": "thermal_operations", "extra": {"theory": "ath", "role": "free_ops", "statement": "Energy-conserving unitaries + Gibbs ancillas: Gibbs-preserving AND U(1)-covariant. Strictly inside GPO: a Gibbs-preserving map can create energy coherence while TO cannot. Whether TO = GPO intersect TIO exactly is open here (QG2).", "refs": ["Faist, Oppenheim, Renner, NJP 17, 043003 (2015) [verified]"], "status": "theorem"}}, {"uid": "QRT:pU-ath", "branch": "QRT", "native_id": "pU-ath", "label": "Work extraction & conversion", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/use_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ath", "role": "use_ops", "statement": "Spending athermality: single-shot deterministic work set by min-free-energy; the F_alpha second laws govern which conversions TO can perform; correlations (incl. entanglement) carry extra extractable work beyond the marginals.", "refs": ["Horodecki, Oppenheim, Nat. Commun. 4, 2059 (2013) [knowledge]", "Brandao et al., PNAS 112, 3275 (2015) [knowledge]", "Perarnau-Llobet et al., PRX 5, 041011 (2015) [verify]"], "status": "theorem"}}, {"uid": "QRT:pX-ath", "branch": "QRT", "native_id": "pX-ath", "label": "No coherence distillation; work locking", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/no_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ath", "role": "no_ops", "statement": "Impossible even with resources: coherence distillation machines do not exist - under thermal/covariant processing the distillable coherence of every full-rank state is ZERO even with unlimited work, while the coherence cost equals the QFI; and work stored in coherence is locked - not extractable without an external phase reference.", "refs": ["Marvian, Nat. Commun. 11, 25 (2020) [verified]", "Lostaglio, Jennings, Rudolph, Nat. Commun. 6, 6383 (2015) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:pF-asy", "branch": "QRT", "native_id": "pF-asy", "label": "G-covariant channels", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/free_ops", "era": "quantum", "t": 1.1, "concept": "covariant_operations", "extra": {"theory": "asy", "role": "free_ops", "statement": "Channels commuting with the group action. For U(1) time translations: TIO, strictly inside DIO (group averaging implements dephasing covariance).", "refs": ["Marvian, Spekkens, PRA 94, 052324 (2016) [verified]"], "status": "theorem"}}, {"uid": "QRT:pU-asy", "branch": "QRT", "native_id": "pU-asy", "label": "Metrology, clocks, catalytic use", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/use_ops", "era": "quantum", "t": 1.1, "concept": "metrology", "extra": {"theory": "asy", "role": "use_ops", "statement": "Spending asymmetry: phase-estimation precision = QFI (an asymmetry monotone); clock synchronization and reference-frame alignment consume it; catalytic coherence (Aberg) permits repeated use of one coherent battery.", "refs": ["Marvian, Nat. Commun. 11, 25 (2020) [verified]", "Aberg, PRL 113, 150402 (2014) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:pF-coh", "branch": "QRT", "native_id": "pF-coh", "label": "Incoherent-op lattice (MIO...SIO)", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/free_ops", "era": "quantum", "t": 1.1, "concept": "incoherent_operations", "extra": {"theory": "coh", "role": "free_ops", "statement": "SIO subset of IO and DIO; IO, DIO subset of MIO; TIO subset of DIO; IO and DIO incomparable. MIO = maximal (RNG) class.", "refs": ["Marvian, Spekkens, PRA 94, 052324 (2016) [verified]", "Chitambar, Gour, PRL 117, 030401 (2016) [verify]"], "status": "theorem"}}, {"uid": "QRT:pU-coh", "branch": "QRT", "native_id": "pU-coh", "label": "Distillation & dilution (IO)", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/use_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "coh", "role": "use_ops", "statement": "Spending coherence: every coherent state distills |+> at rate C_r under IO; dilution from |+> costs C_f; coherent inputs power what incoherent ones cannot - e.g. entanglement generation via bipartite IO (C1).", "refs": ["Winter, Yang, PRL 116, 120404 (2016) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:pX-coh", "branch": "QRT", "native_id": "pX-coh", "label": "No reversible IO cycle (mixed)", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/no_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "coh", "role": "no_ops", "statement": "Impossible even with resources: under IO, C_f > C_r for generic mixed states, so distill-then-dilute cannot return the input at par. Reversibility holds only under asymptotically resource-non-generating (MIO-type) operations at rate C_r (Stein-lemma regime).", "refs": ["Winter, Yang, PRL 116, 120404 (2016) [knowledge]", "Brandao, Gour, PRL 115, 070503 (2015) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:pF-ima", "branch": "QRT", "native_id": "pF-ima", "label": "Real operations (real Kraus)", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/free_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ima", "role": "free_ops", "statement": "Channels with real Kraus operators; local real ops + classical communication (LRCC) define the distributed theory.", "refs": ["Wu et al., PRL 126, 090401 (2021) [verified]"], "status": "theorem"}}, {"uid": "QRT:pU-ima", "branch": "QRT", "native_id": "pU-ima", "label": "Local discrimination with i", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/use_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ima", "role": "use_ops", "statement": "Spending imaginarity: real orthogonal pure-state pairs that LOCC distinguishes perfectly become indistinguishable (no better than guessing in the worst case) when one party is restricted to real operations - the imaginary resource buys the gap.", "refs": ["Wu et al., PRL 126, 090401 (2021) [verified]", "Wu et al., PRA 103, 032401 (2021) [verified]"], "status": "theorem"}}, {"uid": "QRT:pF-mag", "branch": "QRT", "native_id": "pF-mag", "label": "Stabilizer ops / CSPO", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/free_ops", "era": "quantum", "t": 1.1, "concept": "stabilizer_operations", "extra": {"theory": "mag", "role": "free_ops", "statement": "Stabilizer protocols (Clifford unitaries, Pauli measurements, stabilizer ancillas, feed-forward) subset of completely stabilizer-preserving operations (channel-maximal class for simulation bounds).", "refs": ["Seddon, Campbell, Proc. R. Soc. A 475, 20190251 (2019) [verify]"], "status": "theorem"}}, {"uid": "QRT:pU-mag", "branch": "QRT", "native_id": "pU-mag", "label": "State injection -> universality", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/use_ops", "era": "quantum", "t": 1.1, "concept": "state_injection", "extra": {"theory": "mag", "role": "use_ops", "statement": "Spending magic: T-state injection promotes stabilizer circuits to universal quantum computation; robustness of magic prices the classical-simulation overhead of the spent states.", "refs": ["Bravyi, Kitaev, PRA 71, 022316 (2005) [knowledge]", "Howard, Campbell, PRL 118, 090501 (2017) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:pX-mag", "branch": "QRT", "native_id": "pX-mag", "label": "Bound magic; no unit-rate cycle", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/no_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "mag", "role": "no_ops", "statement": "Impossible even with resources: Wigner-positive magic states cannot be distilled by stabilizer operations (bound magic); and equal-mana state classes exist that do NOT interconvert at unit rate - magic is asymptotically irreversible under STAB ops.", "refs": ["Veitch, Ferrie, Gross, Emerson, NJP 14, 113011 (2012) [knowledge]", "Wang, Wilde, Su [verify: PRL 124, 090505 (2020) / NJP 21, 103002 (2019)]"], "status": "partial"}}, {"uid": "QRT:pF-nga", "branch": "QRT", "native_id": "pF-nga", "label": "Gaussian protocols", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/free_ops", "era": "quantum", "t": 1.1, "concept": "gaussian_operations", "extra": {"theory": "nga", "role": "free_ops", "statement": "Gaussian unitaries, Gaussian measurements, feed-forward; cannot create Wigner negativity.", "refs": ["Takagi, Zhuang, PRA 97, 062337 (2018) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:pU-nga", "branch": "QRT", "native_id": "pU-nga", "label": "Negativity -> CV advantage", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/use_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "nga", "role": "use_ops", "statement": "Spending Wigner negativity: injected into Gaussian circuits it lifts them beyond efficient classical simulation - the CV analogue of magic injection.", "refs": ["Mari, Eisert, PRL 109, 230503 (2012) [knowledge]", "Lloyd, Braunstein, PRL 82, 1784 (1999) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:pF-ent", "branch": "QRT", "native_id": "pF-ent", "label": "LOCC (< SEP < PPT < NE)", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/free_ops", "era": "quantum", "t": 1.1, "concept": "locc", "extra": {"theory": "ent", "role": "free_ops", "statement": "Local operations + classical communication; the ladder continues upward through separable, PPT-preserving and non-entangling operations, each step changing which states count as equivalent.", "refs": ["Horodecki x4, RMP 81, 865 (2009) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:pU-ent", "branch": "QRT", "native_id": "pU-ent", "label": "Teleportation, dense coding, distillation", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/use_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ent", "role": "use_ops", "statement": "Spending ebits: teleportation and dense coding consume maximal entanglement; distillation protocols concentrate noisy entanglement; every entangled state wins some semiquantum game (Buscemi) - a measurement-device-independent certificate that all entanglement is usable.", "refs": ["Buscemi, PRL 108, 200401 (2012) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:pX-ent", "branch": "QRT", "native_id": "pX-ent", "label": "No second law (exact NE); bound ENT", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/no_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ent", "role": "no_ops", "statement": "Impossible even with resources: under EXACTLY non-entangling operations, entanglement manipulation is asymptotically irreversible - no single measure governs all transformations, so no axiomatic second law; and bound entangled states cannot be distilled by LOCC at all (E_D = 0 < E_C).", "refs": ["Lami, Regula, Nat. Phys. 19, 184 (2023) [verified]", "Horodecki x4, RMP 81, 865 (2009) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:pF-ste", "branch": "QRT", "native_id": "pF-ste", "label": "One-way LOCC (trusted -> untrusted)", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/free_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ste", "role": "free_ops", "statement": "Local ops + one-way classical communication from the trusted party: the free operations that cannot create steering.", "refs": ["Gallego, Aolita, PRX 5, 041008 (2015) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:pU-ste", "branch": "QRT", "native_id": "pU-ste", "label": "1sDI QKD; subchannel discrimination", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/use_ops", "era": "quantum", "t": 1.1, "concept": "one_sided_di", "extra": {"theory": "ste", "role": "use_ops", "statement": "Spending steering: one-sided device-independent key distribution is secured exactly by steerability; steering = advantage in subchannel discrimination restricted to 1W-LOCC measurements (Piani-Watrous).", "refs": ["Branciard et al., PRA 85, 010301(R) (2012) [verify]", "Piani, Watrous, PRL 114, 060404 (2015) [verify]"], "status": "theorem"}}, {"uid": "QRT:pF-nlo", "branch": "QRT", "native_id": "pF-nlo", "label": "LOSR wirings (polytope)", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/free_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "nlo", "role": "free_ops", "statement": "The free operations on common-cause boxes form a polytope; convertibility between boxes is decidable by linear programming.", "refs": ["Wolfe et al., Quantum 4, 280 (2020) [verified]"], "status": "theorem"}}, {"uid": "QRT:pU-nlo", "branch": "QRT", "native_id": "pU-nlo", "label": "DI certification; superactivation", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/use_ops", "era": "quantum", "t": 1.1, "concept": "di_tasks", "extra": {"theory": "nlo", "role": "use_ops", "statement": "Spending nonlocality: Bell violation certifies device-independent keys and randomness; and tensoring + local measurements SUPERACTIVATES hidden nonlocality - k copies of some Bell-local entangled states jointly violate a Bell inequality (Palazuelos).", "refs": ["Brunner et al., RMP 86, 419 (2014) [knowledge]", "Palazuelos, PRL 109, 190401 (2012) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:pF-ctx", "branch": "QRT", "native_id": "pF-ctx", "label": "Noncontextual wirings (NCW)", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/free_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ctx", "role": "free_ops", "statement": "Explicit parametrized class of contextuality-free operations on behaviors; forms a convex set; restricted to Bell scenarios NCW is NOT the same operation set as LOSR (P6).", "refs": ["Amaral et al., PRL 120, 130403 (2018) [verified]", "Santos, Wagner, Amaral, arXiv:2407.02120 [verified]"], "status": "theorem"}}, {"uid": "QRT:pU-ctx", "branch": "QRT", "native_id": "pU-ctx", "label": "POM / RAC advantage", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/use_ops", "era": "quantum", "t": 1.1, "concept": "pom_rac", "extra": {"theory": "ctx", "role": "use_ops", "statement": "Spending contextuality: preparation contextuality powers parity-oblivious multiplexing beyond any noncontextual bound; contextual fraction quantifies the advantage.", "refs": ["Spekkens, Buzacott, Keehn, Toner, Pryde, PRL 102, 010401 (2009) [verify]", "Abramsky, Barbosa, Mansfield, PRL 119, 050504 (2017) [verify]"], "status": "theorem"}}, {"uid": "QRT:pF-inc", "branch": "QRT", "native_id": "pF-inc", "label": "Pre- + classical post-processing", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/free_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "inc", "role": "free_ops", "statement": "Compatibility-non-decreasing maps on devices: quantum pre-processing by a channel + classical post-processing of outcomes.", "refs": ["Buscemi, Chitambar, Zhou, PRL 124, 120401 (2020) [verified]"], "status": "theorem"}}, {"uid": "QRT:pU-inc", "branch": "QRT", "native_id": "pU-inc", "label": "Discrimination with PMI", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/use_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "inc", "role": "use_ops", "statement": "Spending incompatibility: every incompatible set strictly beats all compatible ones in some state-discrimination game with post-measurement information; the game family is COMPLETE for the convertibility pre-order.", "refs": ["Buscemi, Chitambar, Zhou, PRL 124, 120401 (2020) [verified]", "Carmeli, Heinosaari, Toigo, PRL 122, 130402 (2019) [verify]", "Skrzypczyk, Supic, Cavalcanti, PRL 122, 130403 (2019) [verify]"], "status": "theorem"}}, {"uid": "QRT:pF-dis", "branch": "QRT", "native_id": "pF-dis", "label": "No free-op class exists", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/free_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "dis", "role": "free_ops", "statement": "Golden-rule failure: a local channel acting on one share of a classical-classical state can CREATE discord, so no free-operation class containing even local processing exists - the operations-layer pathology that disqualifies discord as a standard QRT.", "refs": ["Ciccarello, Giovannetti, PRA 85, 010102(R) (2012) [verify]", "Hu et al., PRA 85, 032102 (2012) [verify]"], "status": "counterexample"}}, {"uid": "QRT:pU-dis", "branch": "QRT", "native_id": "pU-dis", "label": "Activation protocol (CNOT)", "layer": "M", "sublayer": "M.process", "native_layer": "process_cptp/use_ops", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "dis", "role": "use_ops", "statement": "Spending discord: local CNOT interactions with ancillas map any discordant state (separable included) to one with distillable system-ancilla entanglement; REQ = the minimal entanglement so generated. Also: discord = minimal entanglement created between system and apparatus in a measurement.", "refs": ["Piani et al., PRL 106, 220403 (2011) [verified]", "Streltsov, Kampermann, Bruss, PRL 106, 160401 (2011) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:wD-pur", "branch": "QRT", "native_id": "wD-pur", "label": "Purity detectors", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/detector", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "pur", "role": "detector", "statement": "Tr rho^2 > 1/d, or any measurement statistics deviating from uniform - the simplest witness in the compilation.", "refs": ["elementary [knowledge]"], "status": "theorem"}}, {"uid": "QRT:wQ-pur", "branch": "QRT", "native_id": "wQ-pur", "label": "Nonuniformity monotones", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/quantifier", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "pur", "role": "quantifier", "statement": "log d - S(rho) and the Renyi nonuniformity family; majorization is a COMPLETE monotone family - detection and quantification coincide here.", "refs": ["Gour et al., Phys. Rep. 583, 1 (2015) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:wD-ath", "branch": "QRT", "native_id": "wD-ath", "label": "Athermality witnesses", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/detector", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ath", "role": "detector", "statement": "Deviation from Gibbs statistics; operationally, any positive extractable work certifies athermality.", "refs": ["Horodecki, Oppenheim, Nat. Commun. 4, 2059 (2013) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:wQ-ath", "branch": "QRT", "native_id": "wQ-ath", "label": "Second laws F_alpha + modes", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/quantifier", "era": "quantum", "t": 1.1, "concept": "second_law", "extra": {"theory": "ath", "role": "quantifier", "statement": "The Renyi free energies F_alpha (complete on block-diagonal states) PLUS the asymmetry-mode monotones for coherences: two families, jointly complete, separately incomplete - the witness-level image of the two-axiom model (QP1).", "refs": ["Brandao et al., PNAS 112, 3275 (2015) [knowledge]", "Lostaglio et al., PRX 5, 021001 (2015) [verified]"], "status": "theorem"}}, {"uid": "QRT:wD-asy", "branch": "QRT", "native_id": "wD-asy", "label": "Covariance tests", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/detector", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "asy", "role": "detector", "statement": "Any noninvariance of outcome statistics under the group action; mode-resolved tomography detects which asymmetry modes are populated.", "refs": ["Marvian, Spekkens, PRA 94, 052324 (2016) [verified]"], "status": "theorem"}}, {"uid": "QRT:wQ-asy", "branch": "QRT", "native_id": "wQ-asy", "label": "QFI family; speed limits", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/quantifier", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "asy", "role": "quantifier", "statement": "Quantum Fisher information is an asymmetry monotone; Mandelstam-Tamm and Margolus-Levitin speed limits are asymmetry bounds; under thermal covariant processing QFI is exactly the coherence COST.", "refs": ["Marvian, Spekkens, Zanardi, PRA 93, 052331 (2016) [verified]", "Marvian, Nat. Commun. 11, 25 (2020) [verified]"], "status": "theorem"}}, {"uid": "QRT:wD-coh", "branch": "QRT", "native_id": "wD-coh", "label": "Interferometric witnesses", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/detector", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "coh", "role": "detector", "statement": "Robustness of coherence is directly measurable via witness-based lower bounds and interferometric visibility.", "refs": ["Napoli et al., PRL 116, 150502 (2016) [verify]"], "status": "theorem"}}, {"uid": "QRT:wQ-coh", "branch": "QRT", "native_id": "wQ-coh", "label": "C_r, C_f, l1, robustness", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/quantifier", "era": "quantum", "t": 1.1, "concept": "coherence_monotones", "extra": {"theory": "coh", "role": "quantifier", "statement": "Relative entropy of coherence C_r (= distillable), coherence of formation C_f (= cost), l1-norm, robustness (= discrimination advantage, W2 instance).", "refs": ["Winter, Yang, PRL 116, 120404 (2016) [knowledge]", "Takagi et al., PRL 122, 140402 (2019) [verified]"], "status": "theorem"}}, {"uid": "QRT:wD-ima", "branch": "QRT", "native_id": "wD-ima", "label": "LOCC vs real-LOCC gap", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/detector", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ima", "role": "detector", "statement": "Operational witness: the discrimination gap that appears when one party is restricted to real operations; realized in optical experiments.", "refs": ["Wu et al., PRL 126, 090401 (2021) [verified]"], "status": "theorem"}}, {"uid": "QRT:wQ-ima", "branch": "QRT", "native_id": "wQ-ima", "label": "Imaginarity monotones", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/quantifier", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ima", "role": "quantifier", "statement": "Robustness of imaginarity and geometric imaginarity; pure-state and qubit conversion fully characterized by them.", "refs": ["Wu et al., PRA 103, 032401 (2021) [verified]"], "status": "theorem"}}, {"uid": "QRT:wD-mag", "branch": "QRT", "native_id": "wD-mag", "label": "Magic witnesses", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/detector", "era": "quantum", "t": 1.1, "concept": "magic_witness", "extra": {"theory": "mag", "role": "detector", "statement": "Mana > 0 (odd d), robustness > 1, stabilizer-fidelity thresholds: each certifies nonstabilizerness.", "refs": ["Veitch et al., NJP 16, 013009 (2014) [knowledge]", "Howard, Campbell, PRL 118, 090501 (2017) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:wQ-mag", "branch": "QRT", "native_id": "wQ-mag", "label": "Mana; robustness of magic", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/quantifier", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "mag", "role": "quantifier", "statement": "Mana (additive, odd d), robustness of magic (prices classical-simulation overhead), stabilizer extent - quantifiers tied to distillation and simulation bounds.", "refs": ["Veitch et al., NJP 16, 013009 (2014) [knowledge]", "Howard, Campbell, PRL 118, 090501 (2017) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:wD-nga", "branch": "QRT", "native_id": "wD-nga", "label": "Negativity estimators", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/detector", "era": "quantum", "t": 1.1, "concept": "wigner_witness", "extra": {"theory": "nga", "role": "detector", "statement": "Displaced-parity measurements reconstruct W(alpha) point by point; any measured negative value certifies the resource.", "refs": ["standard CV tomography [knowledge]"], "status": "theorem"}}, {"uid": "QRT:wQ-nga", "branch": "QRT", "native_id": "wQ-nga", "label": "Wigner log-negativity", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/quantifier", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "nga", "role": "quantifier", "statement": "Monotone under Gaussian protocols; bounds the cost of classical simulation of CV circuits.", "refs": ["Takagi, Zhuang, PRA 97, 062337 (2018) [knowledge]", "Albarelli et al., PRA 98, 052350 (2018) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:wD-ent", "branch": "QRT", "native_id": "wD-ent", "label": "Entanglement witnesses; PPT", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/detector", "era": "quantum", "t": 1.1, "concept": "entanglement_witness", "extra": {"theory": "ent", "role": "detector", "statement": "Linear witnesses are complete for the convex SEP set (Hahn-Banach); PPT is a one-sided criterion; deciding separability is NP-hard.", "refs": ["Horodecki x4, RMP 81, 865 (2009) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:wQ-ent", "branch": "QRT", "native_id": "wQ-ent", "label": "E_D, E_C, E_r, negativity", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/quantifier", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ent", "role": "quantifier", "statement": "Distillable entanglement, entanglement cost, relative entropy of entanglement, negativity, robustness. The E_D < E_C gap on bound states is the single-shot face of the irreversibility formalized in pX-ent.", "refs": ["Horodecki x4, RMP 81, 865 (2009) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:wD-ste", "branch": "QRT", "native_id": "wD-ste", "label": "Steering inequalities; LHS-SDP", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/detector", "era": "quantum", "t": 1.1, "concept": "steering_witness", "extra": {"theory": "ste", "role": "detector", "statement": "SDP membership tests for LHS models; steering inequalities import one-to-one from joint-measurability (incompatibility) criteria.", "refs": ["Uola et al., PRL 115, 230402 (2015) [verified]"], "status": "theorem"}}, {"uid": "QRT:wQ-ste", "branch": "QRT", "native_id": "wQ-ste", "label": "Steering robustness & weight", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/quantifier", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ste", "role": "quantifier", "statement": "Steering robustness equals the advantage in subchannel discrimination with 1W-LOCC measurements - the steering instance of the universal robustness theorem.", "refs": ["Piani, Watrous, PRL 114, 060404 (2015) [verify]"], "status": "theorem"}}, {"uid": "QRT:wD-nlo", "branch": "QRT", "native_id": "wD-nlo", "label": "Bell inequalities (detect only)", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/detector", "era": "quantum", "t": 1.1, "concept": "bell_witness", "extra": {"theory": "nlo", "role": "detector", "statement": "Facet Bell-inequality violations certify nonclassicality of the common cause.", "refs": ["Wolfe et al., Quantum 4, 280 (2020) [verified]"], "status": "theorem"}}, {"uid": "QRT:wQ-nlo", "branch": "QRT", "native_id": "wQ-nlo", "label": "LOSR monotones (quantify)", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/quantifier", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "nlo", "role": "quantifier", "statement": "The information in the degrees of violation of ALL facet Bell inequalities does NOT determine the LOSR pre-order: quantification strictly exceeds witnessing in this theory.", "refs": ["Wolfe et al., Quantum 4, 280 (2020) [verified]"], "status": "theorem"}}, {"uid": "QRT:wD-ctx", "branch": "QRT", "native_id": "wD-ctx", "label": "Noncontextuality inequalities", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/detector", "era": "quantum", "t": 1.1, "concept": "noncontextuality_witness", "extra": {"theory": "ctx", "role": "detector", "statement": "Scenario inequalities; the contextual fraction detects and grades violation.", "refs": ["Amaral et al., PRL 120, 130403 (2018) [verified]", "Abramsky, Barbosa, Mansfield, PRL 119, 050504 (2017) [verify]"], "status": "theorem"}}, {"uid": "QRT:wQ-ctx", "branch": "QRT", "native_id": "wQ-ctx", "label": "Rel. entropy of contextuality", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/quantifier", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "ctx", "role": "quantifier", "statement": "An NCW-monotone (the completeness question for a monotone family under NCW is open territory, cf. QG3).", "refs": ["Amaral et al., PRL 120, 130403 (2018) [verified]"], "status": "theorem"}}, {"uid": "QRT:wD-inc", "branch": "QRT", "native_id": "wD-inc", "label": "Incompatibility witnesses", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/detector", "era": "quantum", "t": 1.1, "concept": "incompatibility_witness", "extra": {"theory": "inc", "role": "detector", "statement": "Detection via steering (SS10), via noise robustness thresholds, and via discrimination advantages.", "refs": ["Designolle, Farkas, Kaniewski, NJP 21, 113053 (2019) [verify]", "Carmeli, Heinosaari, Toigo, PRL 122, 130402 (2019) [verify]"], "status": "theorem"}}, {"uid": "QRT:wQ-inc", "branch": "QRT", "native_id": "wQ-inc", "label": "Guessing-game family (complete)", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/quantifier", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "inc", "role": "quantifier", "statement": "State discrimination with post-measurement information yields a COMPLETE monotone family: it decides convertibility of programmable devices, not just detection.", "refs": ["Buscemi, Chitambar, Zhou, PRL 124, 120401 (2020) [verified]"], "status": "theorem"}}, {"uid": "QRT:wD-dis", "branch": "QRT", "native_id": "wD-dis", "label": "Local-broadcasting test", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/detector", "era": "quantum", "t": 1.1, "concept": "discord_witness", "extra": {"theory": "dis", "role": "detector", "statement": "A state is locally broadcastable iff it has zero discord; operational failure of local broadcasting witnesses discord.", "refs": ["Piani, Horodecki, Horodecki, PRL 100, 090502 (2008) [knowledge]"], "status": "theorem"}}, {"uid": "QRT:wQ-dis", "branch": "QRT", "native_id": "wQ-dis", "label": "Discord; REQ", "layer": "O", "sublayer": "O.witness", "native_layer": "witness/quantifier", "era": "quantum", "t": 1.1, "concept": null, "extra": {"theory": "dis", "role": "quantifier", "statement": "Quantum discord; relative entropy of quantumness = minimal distillable entanglement generated by activation - a quantifier with an entanglement-denominated operational meaning.", "refs": ["Ollivier, Zurek, PRL 88, 017901 (2001) [knowledge]", "Piani et al., PRL 106, 220403 (2011) [verified]"], "status": "theorem"}}], "routes": [{"uid": "EM:g_newton", "branch": "EM", "native_id": "g_newton", "inputs": ["EM:F", "EM:ddt"], "target": "EM:traj", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 2, "extra": {"title": "Newton's second law", "formula": "m dv/dt = F, dx/dt = v, integrated forward in time.", "section": 1, "text_marker_paragraph": 2}}, {"uid": "EM:g_v", "branch": "EM", "native_id": "g_v", "inputs": ["EM:traj"], "target": "EM:v", "logic": "single", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 2, "extra": {"title": "Read off velocity", "formula": "v = dx/dt.", "section": 1, "text_marker_paragraph": null}}, {"uid": "EM:g_rtraj", "branch": "EM", "native_id": "g_rtraj", "inputs": ["EM:traj"], "target": "EM:r", "logic": "single", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 2, "extra": {"title": "Position along a trajectory", "formula": "The position component of the state of motion.", "section": 1, "text_marker_paragraph": null}}, {"uid": "EM:g_pos", "branch": "EM", "native_id": "g_pos", "inputs": ["EM:pts"], "target": "EM:r", "logic": "single", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 8, "extra": {"title": "Read positions off the configuration", "formula": "A coordinate of the configuration is a position measurement.", "section": 3, "text_marker_paragraph": null}}, {"uid": "EM:g_Fc", "branch": "EM", "native_id": "g_Fc", "inputs": ["EM:pts", "EM:coul", "EM:vec"], "target": "EM:F", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 8, "extra": {"title": "Coulomb force sum", "formula": "Fᵢ = Σⱼ k qᵢqⱼ(xᵢ − xⱼ)/|xᵢ − xⱼ|³.", "section": 3, "text_marker_paragraph": 8}}, {"uid": "EM:g_rho", "branch": "EM", "native_id": "g_rho", "inputs": ["EM:pts", "EM:delta"], "target": "EM:rho", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 10, "extra": {"title": "Point charges as a density", "formula": "ρ(x) = Σ qᵢ δ³(x − xᵢ).", "section": 4, "text_marker_paragraph": null}}, {"uid": "EM:g_Q", "branch": "EM", "native_id": "g_Q", "inputs": ["EM:rho", "EM:addq"], "target": "EM:q", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 10, "extra": {"title": "Total charge from density", "formula": "Q = ∫ρ dV.", "section": 4, "text_marker_paragraph": null}}, {"uid": "EM:g_Etest", "branch": "EM", "native_id": "g_Etest", "inputs": ["EM:F", "EM:q"], "target": "EM:E", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 13, "extra": {"title": "Test-charge definition", "formula": "E = lim F/q as q → 0.", "section": 4, "text_marker_paragraph": null}}, {"uid": "EM:g_Eeval", "branch": "EM", "native_id": "g_Eeval", "inputs": ["EM:Efield", "EM:r"], "target": "EM:E", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 13, "extra": {"title": "Evaluate the field at a point", "formula": "The observable E(x₀) is the state E(·) evaluated at x₀.", "section": 4, "text_marker_paragraph": null}}, {"uid": "EM:g_Ecoul", "branch": "EM", "native_id": "g_Ecoul", "inputs": ["EM:rho", "EM:coul", "EM:sup"], "target": "EM:Efield", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 13, "extra": {"title": "Coulomb integral", "formula": "E(x) = (1/4πε₀)∫ρ(x′)(x − x′)/|x − x′|³ d³x′.", "section": 4, "text_marker_paragraph": null}}, {"uid": "EM:g_Egauss", "branch": "EM", "native_id": "g_Egauss", "inputs": ["EM:rho", "EM:div", "EM:sym"], "target": "EM:Efield", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 13, "extra": {"title": "Gauss's law with symmetry", "formula": "Avoids integration when symmetry fixes the field's shape.", "section": 4, "text_marker_paragraph": null}}, {"uid": "EM:g_Egrad", "branch": "EM", "native_id": "g_Egrad", "inputs": ["EM:phi", "EM:grad"], "target": "EM:Efield", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 13, "extra": {"title": "Field from the potential", "formula": "E = −∇φ.", "section": 4, "text_marker_paragraph": null}}, {"uid": "EM:g_static", "branch": "EM", "native_id": "g_static", "inputs": ["EM:EB", "EM:ddt"], "target": "EM:Efield", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 28, "extra": {"title": "Static limit of the dynamical field", "formula": "With ∂/∂t = 0 the electric part decouples and is curl-free.", "section": 9, "text_marker_paragraph": 28}}, {"uid": "EM:g_flux", "branch": "EM", "native_id": "g_flux", "inputs": ["EM:Efield", "EM:div"], "target": "EM:PhiE", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 13, "extra": {"title": "Direct flux integral", "formula": "Φ_E = ∮E·dA.", "section": 4, "text_marker_paragraph": null}}, {"uid": "EM:g_gausslaw", "branch": "EM", "native_id": "g_gausslaw", "inputs": ["EM:q", "EM:div"], "target": "EM:PhiE", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 12, "extra": {"title": "Gauss's law", "formula": "Φ_E = Q_enc/ε₀.", "section": 4, "text_marker_paragraph": 12}}, {"uid": "EM:g_philine", "branch": "EM", "native_id": "g_philine", "inputs": ["EM:Efield", "EM:line"], "target": "EM:phi", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 13, "extra": {"title": "Potential from a line integral", "formula": "φ(x) = −∫E·dl from an arbitrary reference point.", "section": 4, "text_marker_paragraph": null}}, {"uid": "EM:g_poisson", "branch": "EM", "native_id": "g_poisson", "inputs": ["EM:rho", "EM:lap", "EM:bc"], "target": "EM:phi", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 11, "extra": {"title": "Solve Poisson's equation", "formula": "∇²φ = −ρ/ε₀ with boundary conditions.", "section": 4, "text_marker_paragraph": null}}, {"uid": "EM:g_phistatic", "branch": "EM", "native_id": "g_phistatic", "inputs": ["EM:pot", "EM:gfix"], "target": "EM:phi", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 31, "extra": {"title": "Static limit of the gauge potential", "formula": "For static fields in Coulomb gauge, the scalar part of the representative is the electrostatic potential.", "section": 10, "text_marker_paragraph": null}}, {"uid": "EM:g_U1", "branch": "EM", "native_id": "g_U1", "inputs": ["EM:rho", "EM:phi", "EM:bil"], "target": "EM:U", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 13, "extra": {"title": "Energy as charge times potential", "formula": "U = ½∫ρφ dV.", "section": 4, "text_marker_paragraph": null}}, {"uid": "EM:g_U2", "branch": "EM", "native_id": "g_U2", "inputs": ["EM:Efield", "EM:bil"], "target": "EM:U", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 13, "extra": {"title": "Energy stored in the field", "formula": "U = (ε₀/2)∫|E|² dV.", "section": 4, "text_marker_paragraph": null}}, {"uid": "EM:g_dV1", "branch": "EM", "native_id": "g_dV1", "inputs": ["EM:phi", "EM:r"], "target": "EM:dV", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 16, "extra": {"title": "Difference of potential values", "formula": "ΔV = φ(b) − φ(a); the arbitrary constant cancels.", "section": 5, "text_marker_paragraph": 16}}, {"uid": "EM:g_dV2", "branch": "EM", "native_id": "g_dV2", "inputs": ["EM:Efield", "EM:line", "EM:r"], "target": "EM:dV", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 16, "extra": {"title": "Line integral of the field", "formula": "ΔV = −∫ₐᵇ E·dl, path-independent in statics.", "section": 5, "text_marker_paragraph": 16}}, {"uid": "EM:g_C", "branch": "EM", "native_id": "g_C", "inputs": ["EM:q", "EM:dV", "EM:bc"], "target": "EM:C", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 14, "extra": {"title": "Capacitance", "formula": "C = Q/ΔV; linearity makes the ratio independent of Q.", "section": 5, "text_marker_paragraph": null}}, {"uid": "EM:g_I", "branch": "EM", "native_id": "g_I", "inputs": ["EM:J", "EM:div"], "target": "EM:I", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 15, "extra": {"title": "Current as flux of J", "formula": "I = ∫J·dA.", "section": 5, "text_marker_paragraph": null}}, {"uid": "EM:g_R", "branch": "EM", "native_id": "g_R", "inputs": ["EM:dV", "EM:I"], "target": "EM:R", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 15, "extra": {"title": "Resistance from voltage and current", "formula": "R = ΔV/I.", "section": 5, "text_marker_paragraph": null}}, {"uid": "EM:g_Johm", "branch": "EM", "native_id": "g_Johm", "inputs": ["EM:Efield", "EM:ohm"], "target": "EM:J", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 15, "extra": {"title": "Local Ohm's law", "formula": "J = σE inside a conductor.", "section": 5, "text_marker_paragraph": null}}, {"uid": "EM:g_rhoevol", "branch": "EM", "native_id": "g_rhoevol", "inputs": ["EM:J", "EM:cont"], "target": "EM:rho", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 16, "extra": {"title": "Density evolves by continuity", "formula": "∂ρ/∂t = −∇·J updates ρ in time.", "section": 5, "text_marker_paragraph": null}}, {"uid": "EM:g_Bbs", "branch": "EM", "native_id": "g_Bbs", "inputs": ["EM:J", "EM:bs", "EM:sup"], "target": "EM:Bfield", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 19, "extra": {"title": "Biot–Savart integral", "formula": "B(x) = (μ₀/4π)∫J × (x − x′)/|x − x′|³ d³x′.", "section": 6, "text_marker_paragraph": 18}}, {"uid": "EM:g_Bamp", "branch": "EM", "native_id": "g_Bamp", "inputs": ["EM:J", "EM:curl", "EM:sym"], "target": "EM:Bfield", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 19, "extra": {"title": "Ampère's law with symmetry", "formula": "∮B·dl = μ₀I_enc.", "section": 6, "text_marker_paragraph": 19}}, {"uid": "EM:g_Bcurl", "branch": "EM", "native_id": "g_Bcurl", "inputs": ["EM:A", "EM:curl"], "target": "EM:Bfield", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 23, "extra": {"title": "Field from the vector potential", "formula": "B = ∇×A.", "section": 8, "text_marker_paragraph": 23}}, {"uid": "EM:g_Beval", "branch": "EM", "native_id": "g_Beval", "inputs": ["EM:Bfield", "EM:r"], "target": "EM:B", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 19, "extra": {"title": "Evaluate the field at a point", "formula": "B(x₀) from the field B(·).", "section": 6, "text_marker_paragraph": null}}, {"uid": "EM:g_Bforce", "branch": "EM", "native_id": "g_Bforce", "inputs": ["EM:F", "EM:q", "EM:v", "EM:cross"], "target": "EM:B", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 38, "extra": {"title": "Infer B from the velocity-dependent force", "formula": "Solve F − qE = q v×B for B using several velocities.", "section": 12, "text_marker_paragraph": 38}}, {"uid": "EM:g_Fwire", "branch": "EM", "native_id": "g_Fwire", "inputs": ["EM:I", "EM:B", "EM:cross"], "target": "EM:F", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 19, "extra": {"title": "Force on a current element", "formula": "dF = I dl × B (Ampère, Laplace).", "section": 6, "text_marker_paragraph": 19}}, {"uid": "EM:g_PhiB", "branch": "EM", "native_id": "g_PhiB", "inputs": ["EM:Bfield", "EM:div"], "target": "EM:PhiB", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 20, "extra": {"title": "Flux integral of B", "formula": "Φ_B = ∫B·dA; any surface with the same boundary gives the same answer because ∇·B = 0.", "section": 7, "text_marker_paragraph": null}}, {"uid": "EM:g_PhiBA", "branch": "EM", "native_id": "g_PhiBA", "inputs": ["EM:A", "EM:line", "EM:curl"], "target": "EM:PhiB", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 23, "extra": {"title": "Flux from the loop integral of A", "formula": "Φ_B = ∮A·dl by Stokes' theorem.", "section": 8, "text_marker_paragraph": 23}}, {"uid": "EM:g_emf1", "branch": "EM", "native_id": "g_emf1", "inputs": ["EM:PhiB", "EM:ddt", "EM:faraday"], "target": "EM:emf", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 20, "extra": {"title": "Faraday's flux rule", "formula": "ℰ = −dΦ_B/dt.", "section": 7, "text_marker_paragraph": 20}}, {"uid": "EM:g_emf2", "branch": "EM", "native_id": "g_emf2", "inputs": ["EM:EB", "EM:traj", "EM:line", "EM:cross"], "target": "EM:emf", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 28, "extra": {"title": "Direct loop integral", "formula": "ℰ = ∮(E + v×B)·dl.", "section": 9, "text_marker_paragraph": null}}, {"uid": "EM:g_eps", "branch": "EM", "native_id": "g_eps", "inputs": ["EM:F", "EM:q", "EM:r", "EM:I", "EM:coul", "EM:bs"], "target": "EM:consts", "logic": "AND", "kind": "derives", "kind_native": "classical", "status": "established", "polarity": "structural", "t": 24, "extra": {"title": "Measure the couplings", "formula": "ε₀ from the strength of electric forces, μ₀ from forces between currents.", "section": 8, "text_marker_paragraph": 24}}, {"uid": "EM:g_disp", "branch": "EM", "native_id": "g_disp", "inputs": ["EM:cont", "EM:curl"], "target": "EM:maxwell", "logic": "AND", "kind": "derives", "kind
