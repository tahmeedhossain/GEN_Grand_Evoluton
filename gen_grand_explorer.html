, "t": 2, "concept": "force", "extra": {"symbol": "F", "derived": false, "description": "Measured from a body's acceleration (F = ma) or by balancing it against a known force. Every force law in the story predicts it, so more and more alternative routes lead here.", "math_structure": null, "properties": null, "section": 1}}, {"uid": "EM:r", "branch": "EM", "native_id": "r", "label": "Position", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 2, "concept": "position", "extra": {"symbol": "x", "derived": false, "description": "Where a body sits in Euclidean 3-space, measured with rulers. Separations r = x − x′ enter every force law. A primitive geometric observable.", "math_structure": null, "properties": null, "section": 1}}, {"uid": "EM:v", "branch": "EM", "native_id": "v", "label": "Velocity", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 2, "concept": "velocity", "extra": {"symbol": "v", "derived": true, "description": "v = dx/dt from successive position measurements. It becomes essential once magnetic forces turn out to depend on motion.", "math_structure": null, "properties": null, "section": 1}}, {"uid": "EM:traj", "branch": "EM", "native_id": "traj", "label": "Particle state of motion", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 2, "concept": null, "extra": {"symbol": "(x,v)", "derived": false, "description": "Position and velocity together: Newton's description of a body's state.", "math_structure": "Point of the tangent bundle Tℝ³; over time, a curve x(t).", "properties": null, "section": 1}}, {"uid": "EM:vec", "branch": "EM", "native_id": "vec", "label": "Vector addition", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 2, "concept": "vector_addition", "extra": {"symbol": "+", "derived": false, "description": "How forces and fields combine. Because order and grouping do not matter, the total force from any number of sources is well defined.", "math_structure": null, "properties": ["commutative", "associative", "identity 0", "inverses", "abelian group"], "section": 1}}, {"uid": "EM:ddt", "branch": "EM", "native_id": "ddt", "label": "Time derivative", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 2, "concept": "time_derivative", "extra": {"symbol": "∂ₜ", "derived": false, "description": "Generates time evolution. Its commuting with spatial derivatives is used when the curl equations are combined into wave equations.", "math_structure": null, "properties": ["linear", "commutes with ∇ for smooth fields", "Leibniz rule"], "section": 1}}, {"uid": "EM:q", "branch": "EM", "native_id": "q", "label": "Electric charge", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 5, "concept": "electric_charge", "extra": {"symbol": "q", "derived": false, "description": "A signed scalar property of bodies, inferred from the forces they exert on one another. Experimentally additive and conserved, and (Millikan) quantized in units of e.", "math_structure": null, "properties": null, "section": 2}}, {"uid": "EM:addq", "branch": "EM", "native_id": "addq", "label": "Additivity and conservation of charge", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 5, "concept": "charge_conservation", "extra": {"symbol": "Σq", "derived": false, "description": "Franklin's principle: charges add with sign, and electrification only moves charge from one body to another. A global statement that the continuity equation later makes local.", "math_structure": null, "properties": ["signed quantity", "additive (group ℝ under +)", "conserved in isolated systems"], "section": 2}}, {"uid": "EM:coul", "branch": "EM", "native_id": "coul", "label": "Coulomb law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 7, "concept": "coulomb_law", "extra": {"symbol": "1/r²", "derived": false, "description": "k q₁q₂ r̂/r² with k = 1/4πε₀. Exchange symmetry gives Newton's third law; the inverse-square form is exactly what makes Gauss's law hold.", "math_structure": null, "properties": ["inverse-square", "central", "exchange-symmetric", "rotation-invariant", "homogeneous of degree −2"], "section": 3}}, {"uid": "EM:pts", "branch": "EM", "native_id": "pts", "label": "Point-charge configuration", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 8, "concept": "point_charges", "extra": {"symbol": "{xᵢ}", "derived": false, "description": "The simplest state of an electrostatic system: which charges there are and where they sit.", "math_structure": "A point in ℝ³ᴺ with a charge label qᵢ on each of N points.", "properties": null, "section": 3}}, {"uid": "EM:sup", "branch": "EM", "native_id": "sup", "label": "Superposition", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 8, "concept": "superposition", "extra": {"symbol": "Σ", "derived": false, "description": "The map from sources to forces and fields is linear: contributions from separate sources simply add. Exact in vacuum Maxwell theory.", "math_structure": null, "properties": ["additive", "homogeneous", "linear operator"], "section": 3}}, {"uid": "EM:lap", "branch": "EM", "native_id": "lap", "label": "Poisson's equation", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 9, "concept": null, "extra": {"symbol": "∇²", "derived": false, "description": "∇²φ = −ρ/ε₀. Linearity means solutions superpose; uniqueness means sources plus boundary data fully determine the state.", "math_structure": null, "properties": ["linear", "elliptic", "self-adjoint", "Green's function −1/4π|x − x′|", "unique with boundary data"], "section": 4}}, {"uid": "EM:rho", "branch": "EM", "native_id": "rho", "label": "Charge density", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 10, "concept": "charge_density", "extra": {"symbol": "ρ", "derived": false, "description": "Charge per unit volume. Smooth densities and point charges (via δ functions) are elements of the same space.", "math_structure": "Scalar distribution (signed measure) on ℝ³.", "properties": null, "section": 4}}, {"uid": "EM:delta", "branch": "EM", "native_id": "delta", "label": "Delta function", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 10, "concept": null, "extra": {"symbol": "δ", "derived": false, "description": "Lets point charges and smooth densities live in one space: ρ = Σ qᵢ δ³(x − xᵢ). Introduced by Dirac (1927) and made rigorous by Schwartz (1945).", "math_structure": null, "properties": ["linear functional", "∫δ(x − a) f = f(a)", "support at a point"], "section": 4}}, {"uid": "EM:phi", "branch": "EM", "native_id": "phi", "label": "Potential up to a constant", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 11, "concept": "electric_potential", "extra": {"symbol": "[φ]", "derived": false, "description": "The electrostatic state written as one scalar function, with its built-in redundancy made explicit.", "math_structure": "Element of the quotient C^∞(ℝ³)/ℝ: an equivalence class of functions differing by constants.", "properties": null, "section": 4}}, {"uid": "EM:bc", "branch": "EM", "native_id": "bc", "label": "Boundary values", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 11, "concept": null, "extra": {"symbol": "∂Ω", "derived": false, "description": "The part of the state fixed by conductors and the outside world. Needed to make Poisson's problem well posed.", "math_structure": "Values φ|∂Ω (Dirichlet) or ∂φ/∂n (Neumann) on boundary surfaces.", "properties": null, "section": 4}}, {"uid": "EM:grad", "branch": "EM", "native_id": "grad", "label": "Gradient", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 11, "concept": null, "extra": {"symbol": "∇", "derived": false, "description": "Because ∇ kills constants, φ and φ + c give the same force. This is the first redundancy (gauge freedom) in the description of the state.", "math_structure": null, "properties": ["linear", "kernel = constants", "∇×∇f = 0"], "section": 4}}, {"uid": "EM:div", "branch": "EM", "native_id": "div", "label": "Divergence theorem", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 12, "concept": null, "extra": {"symbol": "∇·", "derived": false, "description": "Converts local statements about sources into statements about flux through surfaces, and back. Also used for any flux integral.", "math_structure": null, "properties": ["linear", "∫∇·F dV = ∮F·dA", "∇·(r̂/r²) = 4πδ³"], "section": 4}}, {"uid": "EM:PhiE", "branch": "EM", "native_id": "PhiE", "label": "Electric flux", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 12, "concept": "electric_flux", "extra": {"symbol": "ΦE", "derived": true, "description": "Φ_E = ∮E·dA through a closed surface. Gauss's law says it equals Q_enc/ε₀ however the enclosed charges are arranged.", "math_structure": null, "properties": null, "section": 4}}, {"uid": "EM:sym", "branch": "EM", "native_id": "sym", "label": "Symmetry arguments", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 12, "concept": null, "extra": {"symbol": "G", "derived": false, "description": "If a source distribution is unchanged by rotations, translations or reflections, the field it produces must transform the same way. With Gauss's or Ampère's law this fixes fields without integrating.", "math_structure": null, "properties": ["group action on space", "equivariance", "invariance"], "section": 4}}, {"uid": "EM:E", "branch": "EM", "native_id": "E", "label": "Electric field value", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 13, "concept": null, "extra": {"symbol": "E", "derived": true, "description": "Operationally E = lim F/q for a small test charge at rest: a derived observable built from force and charge measurements.", "math_structure": null, "properties": null, "section": 4}}, {"uid": "EM:Efield", "branch": "EM", "native_id": "Efield", "label": "Electric field", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 13, "concept": "electric_field", "extra": {"symbol": "E(·)", "derived": false, "description": "The whole field as one object, a function on space. A calculating device for Green and Gauss; a physical state for Faraday and Maxwell.", "math_structure": "Vector field ℝ³ → ℝ³ (curl-free in statics).", "properties": null, "section": 4}}, {"uid": "EM:line", "branch": "EM", "native_id": "line", "label": "Line integrals", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 13, "concept": null, "extra": {"symbol": "∫dl", "derived": false, "description": "Integrals along curves. Path independence holds for curl-free fields on regions without holes; the exception returns with holonomy in the final section.", "math_structure": null, "properties": ["additive over joined paths", "sign flips on reversal", "path-independent ⇔ curl-free (simply connected)"], "section": 4}}, {"uid": "EM:U", "branch": "EM", "native_id": "U", "label": "Electrostatic energy", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 13, "concept": "electrostatic_energy", "extra": {"symbol": "U", "derived": true, "description": "Work needed to assemble a configuration from charges far apart. Measured through work done or heat released on discharge.", "math_structure": null, "properties": null, "section": 4}}, {"uid": "EM:bil", "branch": "EM", "native_id": "bil", "label": "Quadratic energy form", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 13, "concept": null, "extra": {"symbol": "½⟨,⟩", "derived": false, "description": "U(E₁ + E₂) = U(E₁) + U(E₂) + a cross term. The cross term is why energies do not simply add even though fields do.", "math_structure": null, "properties": ["symmetric bilinear", "positive definite", "not additive in fields"], "section": 4}}, {"uid": "EM:dV", "branch": "EM", "native_id": "dV", "label": "Voltage", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 14, "concept": null, "extra": {"symbol": "ΔV", "derived": true, "description": "Volta's tension, a potential difference φ(b) − φ(a): what a voltmeter reads. Invariant under φ → φ + const, which is why it is measurable while φ itself is not.", "math_structure": null, "properties": null, "section": 5}}, {"uid": "EM:C", "branch": "EM", "native_id": "C", "label": "Capacitance", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 14, "concept": "capacitance", "extra": {"symbol": "C", "derived": true, "description": "C = Q/ΔV for a conductor or pair of conductors. Depends only on geometry (and the medium) because electrostatics is linear.", "math_structure": null, "properties": null, "section": 5}}, {"uid": "EM:I", "branch": "EM", "native_id": "I", "label": "Current", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 15, "concept": "current", "extra": {"symbol": "I", "derived": true, "description": "I = dQ/dt through a surface, read by an ammeter. Equal to the flux of the current density.", "math_structure": null, "properties": null, "section": 5}}, {"uid": "EM:J", "branch": "EM", "native_id": "J", "label": "Current density", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 15, "concept": "current_density", "extra": {"symbol": "J", "derived": false, "description": "Charge flux per unit area. Together with ρ it specifies all the sources of the field.", "math_structure": "Vector field J(x, t); in steady flow ∇·J = 0.", "properties": null, "section": 5}}, {"uid": "EM:R", "branch": "EM", "native_id": "R", "label": "Resistance", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 15, "concept": "resistance", "extra": {"symbol": "R", "derived": true, "description": "R = ΔV/I for a conductor. Ohm found it independent of the current for a given wire at fixed temperature.", "math_structure": null, "properties": null, "section": 5}}, {"uid": "EM:ohm", "branch": "EM", "native_id": "ohm", "label": "Ohm's law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 15, "concept": "ohm_law", "extra": {"symbol": "σ", "derived": false, "description": "J = σE inside a conductor, or ΔV = IR for a whole wire. Unlike Maxwell's equations it describes a material, valid for many conductors at moderate fields.", "math_structure": null, "properties": ["linear constitutive relation", "material-dependent", "not a fundamental law"], "section": 5}}, {"uid": "EM:cont", "branch": "EM", "native_id": "cont", "label": "Continuity equation", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 16, "concept": null, "extra": {"symbol": "∂ₜρ", "derived": false, "description": "Charge cannot vanish in one place and reappear in another: change inside a volume equals flux through its boundary. Later developments derive it rather than assume it.", "math_structure": null, "properties": ["local conservation", "∂ρ/∂t + ∇·J = 0"], "section": 5}}, {"uid": "EM:B", "branch": "EM", "native_id": "B", "label": "Magnetic field value", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 18, "concept": "magnetic_field_value", "extra": {"symbol": "B", "derived": true, "description": "The magnetic action at a point, read with a compass or a probe coil, or inferred from the velocity-dependent force on a moving charge.", "math_structure": null, "properties": null, "section": 6}}, {"uid": "EM:bs", "branch": "EM", "native_id": "bs", "label": "Biot–Savart law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 18, "concept": "biot_savart", "extra": {"symbol": "BS", "derived": false, "description": "Field of a current element, (μ₀/4π) I dl × r̂/r². The magnetic counterpart of the Coulomb law.", "math_structure": null, "properties": ["linear in current", "inverse-square", "⟂ to dl and r̂"], "section": 6}}, {"uid": "EM:cross", "branch": "EM", "native_id": "cross", "label": "Cross product", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 18, "concept": "cross_product", "extra": {"symbol": "×", "derived": false, "description": "a×b = −b×a, and a×(b×c) ≠ (a×b)×c. Its dependence on handedness makes B a pseudovector, and since v×B ⟂ v, magnetic forces do no work.", "math_structure": null, "properties": ["bilinear", "anticommutative", "non-associative", "Jacobi identity", "orientation-dependent"], "section": 6}}, {"uid": "EM:curl", "branch": "EM", "native_id": "curl", "label": "Curl and Stokes' theorem", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 19, "concept": null, "extra": {"symbol": "∇×", "derived": false, "description": "Measures circulation. The identity div∘curl = 0 is what later forces the displacement current.", "math_structure": null, "properties": ["linear", "∇·(∇×F) = 0", "∮F·dl = ∫(∇×F)·dA"], "section": 6}}, {"uid": "EM:Bfield", "branch": "EM", "native_id": "Bfield", "label": "Magnetic field", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 19, "concept": "magnetic_field", "extra": {"symbol": "B(·)", "derived": false, "description": "The magnetic field as a single object on space.", "math_structure": "Divergence-free pseudovector field on ℝ³.", "properties": null, "section": 6}}, {"uid": "EM:emf", "branch": "EM", "native_id": "emf", "label": "Electromotive force", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 20, "concept": "emf", "extra": {"symbol": "ℰ", "derived": true, "description": "ℰ = ∮(E + v×B)·dl around a circuit, measured as the voltage across a small gap in the loop.", "math_structure": null, "properties": null, "section": 7}}, {"uid": "EM:PhiB", "branch": "EM", "native_id": "PhiB", "label": "Magnetic flux", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 20, "concept": "magnetic_flux", "extra": {"symbol": "ΦB", "derived": true, "description": "Φ_B = ∫B·dA through a surface bounded by a loop: Faraday's count of lines of force threading a circuit.", "math_structure": null, "properties": null, "section": 7}}, {"uid": "EM:faraday", "branch": "EM", "native_id": "faraday", "label": "Faraday's law", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 20, "concept": "faraday_law", "extra": {"symbol": "−Φ̇", "derived": false, "description": "A changing magnetic flux induces a circulating electric field; the minus sign makes induced currents oppose the change.", "math_structure": null, "properties": ["linear", "∇×E = −∂B/∂t", "Lenz sign"], "section": 7}}, {"uid": "EM:A", "branch": "EM", "native_id": "A", "label": "Vector potential", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 23, "concept": null, "extra": {"symbol": "A", "derived": false, "description": "Neumann's and Thomson's potential, Maxwell's electromagnetic momentum. Useful for calculation; not observable by itself.", "math_structure": "Vector field A(x, t) whose curl is B: one representative of a gauge class.", "properties": null, "section": 8}}, {"uid": "EM:consts", "branch": "EM", "native_id": "consts", "label": "Couplings ε₀ and μ₀", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 24, "concept": null, "extra": {"symbol": "ε₀μ₀", "derived": false, "description": "Fix the strength of electric forces between charges and magnetic forces between currents. 1/√(ε₀μ₀) is the speed Weber and Kohlrausch found as a ratio of units. (In the 2019 SI they are fixed through the measured fine-structure constant.)", "math_structure": null, "properties": null, "section": 8}}, {"uid": "EM:c", "branch": "EM", "native_id": "c", "label": "Speed of light", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 25, "concept": "speed_of_light", "extra": {"symbol": "c", "derived": false, "description": "Measured astronomically (Rømer 1676, Bradley 1729) and on Earth by Fizeau (1849). After Maxwell it is also predicted from ε₀ and μ₀. Only the prediction is drawn as a route; the measurements are not.", "math_structure": null, "properties": null, "section": 8}}, {"uid": "EM:maxwell", "branch": "EM", "native_id": "maxwell", "label": "Maxwell's equations", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 27, "concept": "maxwell_equations", "extra": {"symbol": "Mx", "derived": false, "description": "The complete field law. Gauss's two laws constrain each moment; Faraday's and the Ampère–Maxwell law evolve it.", "math_structure": null, "properties": ["linear", "first-order hyperbolic", "2 constraints + 2 evolution equations", "constraints preserved iff continuity holds"], "section": 9}}, {"uid": "EM:EB", "branch": "EM", "native_id": "EB", "label": "Dynamical field state", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 28, "concept": "em_field_state", "extra": {"symbol": "(E,B)", "derived": false, "description": "Electric and magnetic fields as one state that evolves in time.", "math_structure": "Pair of vector fields with ∇·E = ρ/ε₀ and ∇·B = 0 at one time: Cauchy data.", "properties": null, "section": 9}}, {"uid": "EM:u", "branch": "EM", "native_id": "u", "label": "Field energy density", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 29, "concept": null, "extra": {"symbol": "u", "derived": true, "description": "u = ½(ε₀|E|² + |B|²/μ₀). Integrates to the total energy stored in the field.", "math_structure": null, "properties": null, "section": 9}}, {"uid": "EM:stress", "branch": "EM", "native_id": "stress", "label": "Maxwell stress tensor", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 29, "concept": null, "extra": {"symbol": "σᵢⱼ", "derived": false, "description": "Expresses the force on charges inside a volume as a surface integral over the field around them.", "math_structure": null, "properties": ["symmetric rank-2 tensor", "quadratic in fields", "momentum balance"], "section": 9}}, {"uid": "EM:wave", "branch": "EM", "native_id": "wave", "label": "Wave operator", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 30, "concept": null, "extra": {"symbol": "□", "derived": false, "description": "□ = c⁻²∂²/∂t² − ∇². Choosing the retarded Green's function means influences travel at c from the past.", "math_structure": null, "properties": ["linear", "hyperbolic", "Lorentz-invariant", "retarded and advanced Green's functions"], "section": 10}}, {"uid": "EM:gfix", "branch": "EM", "native_id": "gfix", "label": "Gauge fixing", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 31, "concept": null, "extra": {"symbol": "∂·A", "derived": false, "description": "A rule that picks one pair (φ, A) from each class, chosen to simplify the equations.", "math_structure": null, "properties": ["selects one representative", "Coulomb ∇·A = 0", "Lorenz ∇·A + c⁻²∂ₜφ = 0", "residual freedom remains"], "section": 10}}, {"uid": "EM:gauge", "branch": "EM", "native_id": "gauge", "label": "Gauge transformations", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 31, "concept": null, "extra": {"symbol": "χ", "derived": false, "description": "(φ, A) → (φ − ∂χ/∂t, A + ∇χ). Two transformations compose in either order to χ₁ + χ₂: the group is commutative.", "math_structure": null, "properties": ["abelian group U(1)", "commutative composition", "associative", "leave E and B invariant"], "section": 10}}, {"uid": "EM:pot", "branch": "EM", "native_id": "pot", "label": "Gauge class of potentials", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 31, "concept": null, "extra": {"symbol": "[φ,A]", "derived": false, "description": "The physical state in the potential description. Everything observable is a function of these classes.", "math_structure": "Orbit of the gauge group in the space of pairs (φ, A): a point of a quotient space.", "properties": null, "section": 10}}, {"uid": "EM:poinc", "branch": "EM", "native_id": "poinc", "label": "Poincaré lemma", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 32, "concept": null, "extra": {"symbol": "P", "derived": false, "description": "∇·B = 0 ⇒ B = ∇×A, and ∇×(E + ∂A/∂t) = 0 ⇒ E + ∂A/∂t = −∇φ. It can fail on regions with holes, which is where holonomy lives.", "math_structure": null, "properties": ["closed ⇒ exact", "holds on contractible regions", "topology-dependent"], "section": 10}}, {"uid": "EM:poynt", "branch": "EM", "native_id": "poynt", "label": "Poynting's theorem", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 33, "concept": "poynting_theorem", "extra": {"symbol": "∇·S", "derived": false, "description": "∂u/∂t + ∇·S = −J·E: field energy changes by flowing away or by doing work on charges.", "math_structure": null, "properties": ["local conservation law", "quadratic in fields"], "section": 11}}, {"uid": "EM:S", "branch": "EM", "native_id": "S", "label": "Poynting vector", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 33, "concept": "poynting_vector", "extra": {"symbol": "S", "derived": true, "description": "S = E×B/μ₀, the energy flux in W/m². Its time average is the intensity a detector measures.", "math_structure": null, "properties": null, "section": 11}}, {"uid": "EM:wavedat", "branch": "EM", "native_id": "wavedat", "label": "Wave data", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 35, "concept": null, "extra": {"symbol": "λ,ω", "derived": true, "description": "Wavelength, frequency and polarization, measured with standing waves, interferometers and polarizers. In vacuum ω = c|k| and k ⟂ E ⟂ B.", "math_structure": null, "properties": null, "section": 11}}, {"uid": "EM:vac", "branch": "EM", "native_id": "vac", "label": "Radiation modes", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 35, "concept": null, "extra": {"symbol": "ak", "derived": false, "description": "The source-free field described by its modes rather than by its values at points.", "math_structure": "Amplitudes a(k, λ) for wave vectors k and two transverse polarizations λ.", "properties": null, "section": 11}}, {"uid": "EM:fourier", "branch": "EM", "native_id": "fourier", "label": "Fourier decomposition", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 35, "concept": null, "extra": {"symbol": "ℱ", "derived": false, "description": "Writes any field as a superposition of plane waves e^{i(k·x − ωt)}, in which the field equations become algebraic.", "math_structure": null, "properties": ["linear isomorphism", "unitary (Parseval)", "diagonalizes ∇ and □"], "section": 11}}, {"uid": "EM:g", "branch": "EM", "native_id": "g", "label": "Field momentum density", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 36, "concept": null, "extra": {"symbol": "g", "derived": true, "description": "g = S/c². Observed as radiation pressure on mirrors and absorbers.", "math_structure": null, "properties": null, "section": 11}}, {"uid": "EM:P", "branch": "EM", "native_id": "P", "label": "Radiated power", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 39, "concept": null, "extra": {"symbol": "P", "derived": true, "description": "Energy per unit time leaving an accelerating charge through a distant sphere.", "math_structure": null, "properties": null, "section": 12}}, {"uid": "EM:lorentz", "branch": "EM", "native_id": "lorentz", "label": "Lorentz group", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 40, "concept": "lorentz_transformation", "extra": {"symbol": "Λ", "derived": false, "description": "Two non-parallel boosts compose to a boost plus a rotation (the Wigner rotation). Under boosts, E and B mix.", "math_structure": null, "properties": ["associative", "non-commutative", "preserves the Minkowski metric"], "section": 13}}, {"uid": "EM:Amu", "branch": "EM", "native_id": "Amu", "label": "Four-potential", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 42, "concept": null, "extra": {"symbol": "Aμ", "derived": false, "description": "Scalar and vector potentials as a single spacetime object.", "math_structure": "1-form A on Minkowski spacetime with components (φ/c, A).", "properties": null, "section": 13}}, {"uid": "EM:jmu", "branch": "EM", "native_id": "jmu", "label": "Four-current", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 42, "concept": null, "extra": {"symbol": "J^μ", "derived": false, "description": "Charge and current density as a single spacetime object.", "math_structure": "Vector field on spacetime (cρ, J), equivalently the 3-form ⋆J.", "properties": null, "section": 13}}, {"uid": "EM:Fmn", "branch": "EM", "native_id": "Fmn", "label": "Field tensor", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 42, "concept": null, "extra": {"symbol": "Fμν", "derived": false, "description": "Electric and magnetic fields as one observer-independent object.", "math_structure": "Antisymmetric rank-2 tensor (2-form) on spacetime; F₀ᵢ ∝ Eᵢ/c, Fᵢⱼ ∝ εᵢⱼₖBₖ.", "properties": null, "section": 13}}, {"uid": "EM:inv", "branch": "EM", "native_id": "inv", "label": "Lorentz invariants", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 42, "concept": null, "extra": {"symbol": "E·B", "derived": true, "description": "E·B and |E|² − c²|B|² take the same value for every inertial observer. If E ⟂ B and |E| < c|B|, some frame sees a purely magnetic field.", "math_structure": null, "properties": null, "section": 13}}, {"uid": "EM:T", "branch": "EM", "native_id": "T", "label": "Energy–momentum tensor", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 42, "concept": null, "extra": {"symbol": "Tμν", "derived": true, "description": "One symmetric tensor whose components, for a given observer, are the energy density, Poynting flux, momentum density and Maxwell stress.", "math_structure": null, "properties": null, "section": 13}}, {"uid": "EM:action", "branch": "EM", "native_id": "action", "label": "Action principle", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 43, "concept": "lagrangian", "extra": {"symbol": "δS", "derived": false, "description": "Under a gauge change L shifts by q dχ/dt, a total time derivative, so the equations of motion are unchanged.", "math_structure": null, "properties": ["variational", "Euler–Lagrange equations", "L defined up to a total derivative"], "section": 14}}, {"uid": "EM:legendre", "branch": "EM", "native_id": "legendre", "label": "Legendre transform", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 44, "concept": null, "extra": {"symbol": "L→H", "derived": false, "description": "Moves from the velocity description to the momentum description: p = ∂L/∂v, H = p·v − L.", "math_structure": null, "properties": ["involutive", "requires convexity", "velocities ↦ momenta"], "section": 14}}, {"uid": "EM:phase", "branch": "EM", "native_id": "phase", "label": "Particle phase space", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 44, "concept": null, "extra": {"symbol": "(x,p)", "derived": false, "description": "The Hamiltonian state of a charge. Using kinetic momenta as coordinates instead puts the magnetic field into the symplectic form.", "math_structure": "Cotangent bundle T*ℝ³ with symplectic form ω = dp∧dx.", "properties": null, "section": 14}}, {"uid": "EM:pkin", "branch": "EM", "native_id": "pkin", "label": "Kinetic momentum", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 44, "concept": null, "extra": {"symbol": "mv", "derived": true, "description": "π = mv = p − qA. Gauge-invariant and measurable, for example from the curvature of a particle track. The canonical momentum p is not.", "math_structure": null, "properties": null, "section": 14}}, {"uid": "EM:pb", "branch": "EM", "native_id": "pb", "label": "Poisson bracket", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 44, "concept": "poisson_structure", "extra": {"symbol": "{,}", "derived": false, "description": "dF/dt = {F, H}. In a magnetic field the kinetic momenta do not commute: a classical non-commutativity that becomes Landau levels in quantum mechanics.", "math_structure": null, "properties": ["bilinear", "antisymmetric", "Jacobi identity (Lie algebra)", "Leibniz rule", "{πᵢ, πⱼ} = q εᵢⱼₖBₖ"], "section": 14}}, {"uid": "EM:fphase", "branch": "EM", "native_id": "fphase", "label": "Field phase space", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 44, "concept": null, "extra": {"symbol": "(A,Π)", "derived": false, "description": "The field as a constrained Hamiltonian system. Gauss's law generates the gauge transformations.", "math_structure": "Canonical pairs (A, Π = −ε₀E) with Gauss's law as a constraint, reduced by gauge orbits.", "properties": null, "section": 14}}, {"uid": "EM:noether", "branch": "EM", "native_id": "noether", "label": "Noether's theorem", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 45, "concept": null, "extra": {"symbol": "N", "derived": false, "description": "Every continuous symmetry of the action yields a conservation law.", "math_structure": null, "properties": ["continuous symmetry ↔ conserved current"], "section": 14}}, {"uid": "EM:cons", "branch": "EM", "native_id": "cons", "label": "Conserved totals", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 45, "concept": null, "extra": {"symbol": "E,P,L", "derived": true, "description": "Total energy, momentum and angular momentum of matter plus field. Conservation holds only when the field's contributions are included.", "math_structure": null, "properties": null, "section": 14}}, {"uid": "EM:ext", "branch": "EM", "native_id": "ext", "label": "Exterior derivative", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 47, "concept": null, "extra": {"symbol": "d", "derived": false, "description": "Unifies grad, curl and div. d² = 0 contains both curl∘grad = 0 and div∘curl = 0.", "math_structure": null, "properties": ["linear", "d∘d = 0", "graded Leibniz rule", "metric-free"], "section": 15}}, {"uid": "EM:wedge", "branch": "EM", "native_id": "wedge", "label": "Wedge product", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 47, "concept": null, "extra": {"symbol": "∧", "derived": false, "description": "α∧β = (−1)^{pq} β∧α: 1-forms anticommute, 2-forms commute. F∧F is a 4-form proportional to E·B.", "math_structure": null, "properties": ["associative", "graded-commutative", "bilinear"], "section": 15}}, {"uid": "EM:hodge", "branch": "EM", "native_id": "hodge", "label": "Hodge star", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 47, "concept": null, "extra": {"symbol": "⋆", "derived": false, "description": "Carries all metric (and constitutive) information. In form language it is the only place c and spacetime geometry enter Maxwell's equations.", "math_structure": null, "properties": ["linear", "metric-dependent", "⋆⋆ = ±1"], "section": 15}}, {"uid": "EM:bundle", "branch": "EM", "native_id": "bundle", "label": "U(1) bundle", "layer": "S", "sublayer": "S.field", "native_layer": "state", "era": "classical", "t": 48, "concept": null, "extra": {"symbol": "P→M", "derived": false, "description": "The global geometric state. It can carry information, such as holonomy around holes, that no single local potential captures.", "math_structure": "Principal U(1)-bundle over spacetime with a connection 1-form; potentials are its local expressions.", "properties": null, "section": 15}}, {"uid": "EM:conn", "branch": "EM", "native_id": "conn", "label": "U(1) connection", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 48, "concept": null, "extra": {"symbol": "∇A", "derived": false, "description": "In a non-abelian (Yang–Mills) theory the curvature is dA + A∧A. Electromagnetism's commutative group keeps it linear.", "math_structure": null, "properties": ["abelian structure group", "curvature F = dA (no A∧A)", "gauge = bundle automorphism", "defines holonomy"], "section": 15}}, {"uid": "EM:hol", "branch": "EM", "native_id": "hol", "label": "Holonomy", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 49, "concept": null, "extra": {"symbol": "∮A", "derived": true, "description": "∮A·dl around a closed loop: gauge-invariant and equal to the enclosed flux. Around a solenoid it is non-zero on loops where B = 0. With ħ, the phase exp(iq∮A·dl/ħ) is the Aharonov–Bohm phase.", "math_structure": null, "properties": null, "section": 15}}, {"uid": "EM:bbspec", "branch": "EM", "native_id": "bbspec", "label": "Blackbody spectrum", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 50, "concept": "blackbody", "extra": {"symbol": "uν", "derived": false, "description": "Energy density of cavity radiation per unit frequency at temperature T, measured with bolometers around 1900. It has a peak and falls at high frequency, which classical physics cannot reproduce.", "math_structure": null, "properties": null, "section": 16}}, {"uid": "EM:equip", "branch": "EM", "native_id": "equip", "label": "Equipartition theorem", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 50, "concept": null, "extra": {"symbol": "½kT", "derived": false, "description": "Classical statistical mechanics gives every oscillator mean energy kT. Applied to infinitely many radiation modes, it gives infinite energy.", "math_structure": null, "properties": ["½kT per quadratic degree of freedom", "classical statistical mechanics", "fails when kT ≪ hν"], "section": 16}}, {"uid": "EM:planck", "branch": "EM", "native_id": "planck", "label": "Planck relation", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 51, "concept": "planck_relation", "extra": {"symbol": "E=hν", "derived": false, "description": "The first quantum rule. It ties a frequency, a wave property, to an energy, a particle property.", "math_structure": null, "properties": ["energy exchanged in steps hν", "links particle energy to wave frequency", "p = h/λ for light"], "section": 16}}, {"uid": "EM:hbar", "branch": "EM", "native_id": "hbar", "label": "Planck's constant", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 51, "concept": "planck_constant", "extra": {"symbol": "ħ", "derived": false, "description": "h ≈ 6.626 × 10⁻³⁴ J s, with ħ = h/2π. The quantum of action; classical physics is the regime where actions are large compared with ħ. Exact by definition in the 2019 SI.", "math_structure": null, "properties": null, "section": 16}}, {"uid": "EM:photoel", "branch": "EM", "native_id": "photoel", "label": "Photoelectric effect", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 52, "concept": null, "extra": {"symbol": "Kmax", "derived": true, "description": "Maximum kinetic energy of electrons ejected by light. It rises linearly with frequency above a threshold and does not depend on intensity.", "math_structure": null, "properties": null, "section": 16}}, {"uid": "EM:photon", "branch": "EM", "native_id": "photon", "label": "Photon", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 52, "concept": "photon", "extra": {"symbol": "γ", "derived": false, "description": "A quantum of the electromagnetic field, with energy ħω and momentum ħk. Detected one at a time by photomultipliers and in Compton scattering.", "math_structure": null, "properties": null, "section": 16}}, {"uid": "EM:spectra", "branch": "EM", "native_id": "spectra", "label": "Spectral lines", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 53, "concept": "spectral_lines", "extra": {"symbol": "λₙₘ", "derived": false, "description": "Sharp wavelengths emitted or absorbed by atoms. Hydrogen's lines fit 1/λ = R(1/m² − 1/n²).", "math_structure": null, "properties": null, "section": 16}}, {"uid": "EM:bohr", "branch": "EM", "native_id": "bohr", "label": "Bohr orbits", "layer": "S", "sublayer": "S.hilbert", "native_layer": "state", "era": "quantum", "t": 53, "concept": "bohr_model", "extra": {"symbol": "n", "derived": false, "description": "The old quantum theory's hybrid state: classical orbits with quantum selection rules. Superseded by quantum mechanics but historically the bridge.", "math_structure": "Discrete set of classical orbits labelled by n, with angular momentum nħ.", "properties": null, "section": 16}}, {"uid": "EM:comm", "branch": "EM", "native_id": "comm", "label": "Canonical commutator", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 55, "concept": "poisson_to_commutator", "extra": {"symbol": "[,]", "derived": false, "description": "Shares every algebraic property of the Poisson bracket, which is why Dirac could map one to the other. Its non-zero value iħ is the quantum.", "math_structure": null, "properties": ["bilinear", "antisymmetric", "Jacobi identity", "[x̂, p̂] = iħ", "non-commutative"], "section": 17}}, {"uid": "EM:ops", "branch": "EM", "native_id": "ops", "label": "Operator algebra", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 55, "concept": "observable_postulate", "extra": {"symbol": "Â", "derived": false, "description": "Observables become operators on states. Position and momentum no longer commute, so they cannot both be sharp: Heisenberg's uncertainty relation.", "math_structure": null, "properties": ["associative", "non-commutative", "observables are self-adjoint", "eigenvalues = possible outcomes"], "section": 17}}, {"uid": "EM:schro", "branch": "EM", "native_id": "schro", "label": "Schrödinger equation", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 56, "concept": "schrodinger_evolution", "extra": {"symbol": "iħ∂ₜ", "derived": false, "description": "iħ ∂ψ/∂t = Ĥψ. Linearity means quantum states superpose, the quantum descendant of the superposition principle of Part I.", "math_structure": null, "properties": ["linear", "unitary evolution", "first order in time"], "section": 17}}, {"uid": "EM:hilb", "branch": "EM", "native_id": "hilb", "label": "Hilbert-space state", "layer": "S", "sublayer": "S.hilbert", "native_layer": "state", "era": "quantum", "t": 56, "concept": "hilbert_state", "extra": {"symbol": "|ψ⟩", "derived": false, "description": "Replaces the point in phase space. It assigns amplitudes, not definite values, to every observable.", "math_structure": "Unit ray in a complex Hilbert space (a vector up to an overall phase).", "properties": null, "section": 17}}, {"uid": "EM:born", "branch": "EM", "native_id": "born", "label": "Born rule", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 57, "concept": "observable_postulate", "extra": {"symbol": "|⟨⟩|²", "derived": false, "description": "Connects the abstract state to what detectors record: frequencies of outcomes over many runs.", "math_structure": null, "properties": ["probability = |amplitude|²", "non-negative, sums to 1"], "section": 17}}, {"uid": "EM:expect", "branch": "EM", "native_id": "expect", "label": "Outcome statistics", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 57, "concept": "outcome_statistics", "extra": {"symbol": "⟨Â⟩", "derived": true, "description": "Probabilities and averages of measurement results over many identically prepared systems.", "math_structure": null, "properties": null, "section": 17}}, {"uid": "EM:mincoup", "branch": "EM", "native_id": "mincoup", "label": "Minimal coupling", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 58, "concept": null, "extra": {"symbol": "p−qA", "derived": false, "description": "The quantum version of the classical kinetic momentum. It makes the potentials, not only the fields, act on charged quantum particles.", "math_structure": null, "properties": ["p̂ → −iħ∇ − qA", "gauge change = local phase change", "covariant derivative"], "section": 18}}, {"uid": "EM:landau", "branch": "EM", "native_id": "landau", "label": "Landau levels", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 59, "concept": null, "extra": {"symbol": "ħωc", "derived": true, "description": "Discrete energies of a charge in a uniform magnetic field, seen in cyclotron resonance and the quantum Hall effect.", "math_structure": null, "properties": null, "section": 18}}, {"uid": "EM:abphase", "branch": "EM", "native_id": "abphase", "label": "Aharonov–Bohm shift", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 60, "concept": null, "extra": {"symbol": "Δθ", "derived": true, "description": "Shift of an interference pattern by qΦ_B/ħ for electrons passing around a region of magnetic flux they never enter.", "math_structure": null, "properties": null, "section": 18}}, {"uid": "EM:clifford", "branch": "EM", "native_id": "clifford", "label": "Clifford algebra", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 61, "concept": null, "extra": {"symbol": "γ^μ", "derived": false, "description": "The algebra needed to take a square root of p² − m²c². Its anticommutation, not commutation, is what produces spin ½.", "math_structure": null, "properties": ["{γ^μ, γ^ν} = 2η^μν", "anticommuting generators", "associative"], "section": 19}}, {"uid": "EM:dirac", "branch": "EM", "native_id": "dirac", "label": "Dirac equation", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 61, "concept": null, "extra": {"symbol": "iγ·D", "derived": false, "description": "The relativistic wave equation of the electron, the matter half of QED.", "math_structure": null, "properties": ["linear", "first order", "Lorentz-covariant", "minimal coupling built in"], "section": 19}}, {"uid": "EM:spinor", "branch": "EM", "native_id": "spinor", "label": "Dirac spinor", "layer": "S", "sublayer": "S.hilbert", "native_layer": "state", "era": "quantum", "t": 62, "concept": null, "extra": {"symbol": "ψ", "derived": false, "description": "A spinor changes sign under a full 360° rotation, something no classical vector field does.", "math_structure": "4-component field transforming under SL(2,ℂ), the double cover of the Lorentz group.", "properties": null, "section": 19}}, {"uid": "EM:gfac", "branch": "EM", "native_id": "gfac", "label": "Electron g-factor", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 62, "concept": null, "extra": {"symbol": "g", "derived": true, "description": "Ratio of the electron's magnetic moment to its spin in natural units. Dirac predicted exactly 2.", "math_structure": null, "properties": null, "section": 19}}, {"uid": "EM:positron", "branch": "EM", "native_id": "positron", "label": "Positron", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 63, "concept": null, "extra": {"symbol": "e⁺", "derived": false, "description": "The electron's antiparticle, same mass, opposite charge. Electron–positron pairs are created and annihilated.", "math_structure": null, "properties": null, "section": 19}}, {"uid": "EM:ladder", "branch": "EM", "native_id": "ladder", "label": "Creation and annihilation operators", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 64, "concept": "creation_annihilation", "extra": {"symbol": "a,a†", "derived": false, "description": "Quantizing each field mode as an oscillator. Commutators give bosons (photons); anticommutators give fermions (electrons).", "math_structure": null, "properties": ["[a, a†] = 1 for photons", "{b, b†} = 1 for electrons", "raise or lower quanta by one"], "section": 20}}, {"uid": "EM:fock", "branch": "EM", "native_id": "fock", "label": "Fock space", "layer": "S", "sublayer": "S.hilbert", "native_layer": "state", "era": "quantum", "t": 65, "concept": null, "extra": {"symbol": "|nk⟩", "derived": false, "description": "The state space of a quantum field, in which particle number can change.", "math_structure": "Direct sum of n-particle Hilbert spaces, n = 0, 1, 2, …; basis labelled by occupation numbers.", "properties": null, "section": 20}}, {"uid": "EM:Aop", "branch": "EM", "native_id": "Aop", "label": "Field operator", "layer": "S", "sublayer": "S.hilbert", "native_layer": "state", "era": "quantum", "t": 66, "concept": null, "extra": {"symbol": "Â(x)", "derived": false, "description": "The quantized electromagnetic potential. Its expectation values in coherent states are classical fields.", "math_structure": "Operator-valued distribution on Fock space (Coulomb gauge: transverse components only).", "properties": null, "section": 20}}, {"uid": "EM:spont", "branch": "EM", "native_id": "spont", "label": "Spontaneous emission rate", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 65, "concept": null, "extra": {"symbol": "A₂₁", "derived": true, "description": "Rate at which an excited atom emits a photon with no field present, set by vacuum fluctuations.", "math_structure": null, "properties": null, "section": 20}}, {"uid": "EM:casimir", "branch": "EM", "native_id": "casimir", "label": "Casimir force", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 66, "concept": null, "extra": {"symbol": "FC", "derived": true, "description": "Attraction between uncharged parallel plates due to the change in zero-point energy of the field modes between them.", "math_structure": null, "properties": null, "section": 20}}, {"uid": "EM:psiop", "branch": "EM", "native_id": "psiop", "label": "Electron–positron field", "layer": "S", "sublayer": "S.hilbert", "native_layer": "state", "era": "quantum", "t": 67, "concept": "electron_field", "extra": {"symbol": "ψ̂", "derived": false, "description": "The electron as the quantum of a field. It annihilates electrons and creates positrons.", "math_structure": "Anticommuting operator-valued spinor field on Fock space.", "properties": null, "section": 21}}, {"uid": "EM:alpha", "branch": "EM", "native_id": "alpha", "label": "Fine-structure constant", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 68, "concept": "fine_structure_constant", "extra": {"symbol": "α", "derived": true, "description": "α = e²/4πε₀ħc ≈ 1/137.036, the dimensionless strength of electromagnetism. Measured from the electron's g-factor and from atom-recoil experiments.", "math_structure": null, "properties": null, "section": 21}}, {"uid": "EM:pert", "branch": "EM", "native_id": "pert", "label": "Perturbation series", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 68, "concept": null, "extra": {"symbol": "Σαⁿ", "derived": false, "description": "Expands amplitudes in powers of the small coupling α. Each higher order involves more virtual particles.", "math_structure": null, "properties": ["power series in α", "asymptotic rather than convergent", "computed order by order"], "section": 21}}, {"uid": "EM:lamb", "branch": "EM", "native_id": "lamb", "label": "Lamb shift", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 70, "concept": "lamb_shift", "extra": {"symbol": "ΔEL", "derived": false, "description": "Splitting between hydrogen's 2S½ and 2P½ levels: about 1000 MHz in Lamb and Retherford's 1947 measurement, about 1058 MHz in later, more precise measurements.", "math_structure": null, "properties": null, "section": 21}}, {"uid": "EM:amm", "branch": "EM", "native_id": "amm", "label": "Anomalous magnetic moment", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 70, "concept": "anomalous_moment", "extra": {"symbol": "ae", "derived": true, "description": "a_e = (g − 2)/2 ≈ 0.00115965, measured by Kusch and Foley (1947) and today to about a tenth of a part per billion.", "math_structure": null, "properties": null, "section": 21}}, {"uid": "EM:renorm", "branch": "EM", "native_id": "renorm", "label": "Renormalization", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 71, "concept": null, "extra": {"symbol": "Z", "derived": false, "description": "Expresses predictions in terms of measured quantities, so that infinities cancel. Later understood through the renormalization group.", "math_structure": null, "properties": ["absorbs divergences into measured m and e", "finitely many parameters (renormalizable)", "scale-dependent couplings"], "section": 22}}, {"uid": "EM:pathint", "branch": "EM", "native_id": "pathint", "label": "Path integral", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 72, "concept": null, "extra": {"symbol": "∫Dx", "derived": false, "description": "Quantizes using the classical action directly, so the action principle of Part I becomes the core of quantum theory.", "math_structure": null, "properties": ["sum over histories", "weight e^{iS/ħ}", "classical path = stationary phase"], "section": 22}}, {"uid": "EM:feyn", "branch": "EM", "native_id": "feyn", "label": "Feynman diagrams", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 72, "concept": null, "extra": {"symbol": "FD", "derived": false, "description": "Pictorial rules for the terms of the perturbation series.", "math_structure": null, "properties": ["propagators and vertices", "each vertex contributes √α", "combinatorial rules"], "section": 22}}, {"uid": "EM:smatrix", "branch": "EM", "native_id": "smatrix", "label": "S-matrix", "layer": "S", "sublayer": "S.hilbert", "native_layer": "state", "era": "quantum", "t": 73, "concept": null, "extra": {"symbol": "Sfi", "derived": false, "description": "Packages everything that can be measured in a scattering experiment.", "math_structure": "Unitary operator on Fock space mapping incoming to outgoing states.", "properties": null, "section": 22}}, {"uid": "EM:xsec", "branch": "EM", "native_id": "xsec", "label": "Cross sections", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 73, "concept": "cross_section", "extra": {"symbol": "σ", "derived": true, "description": "Scattering rates per unit flux, measured in collision experiments (Compton, Møller, Bhabha scattering).", "math_structure": null, "properties": null, "section": 22}}, {"uid": "EM:runalpha", "branch": "EM", "native_id": "runalpha", "label": "Running coupling", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "quantum", "t": 74, "concept": null, "extra": {"symbol": "α(Q)", "derived": true, "description": "The effective strength of electromagnetism at momentum transfer Q, measured at colliders: about 1/128 at the Z mass.", "math_structure": null, "properties": null, "section": 22}}, {"uid": "EM:localgauge", "branch": "EM", "native_id": "localgauge", "label": "Local gauge principle", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 75, "concept": null, "extra": {"symbol": "U(1)ₓ", "derived": false, "description": "Demanding local phase invariance requires a connection, the electromagnetic potential, and fixes how it couples to charge.", "math_structure": null, "properties": ["phase change at each point", "forces a covariant derivative", "abelian"], "section": 23}}, {"uid": "EM:qedL", "branch": "EM", "native_id": "qedL", "label": "QED Lagrangian", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 76, "concept": "qed_interaction", "extra": {"symbol": "ℒQED", "derived": false, "description": "The complete specification of quantum electrodynamics in one line: Dirac field plus Maxwell field, coupled through the covariant derivative.", "math_structure": null, "properties": ["Lorentz-invariant", "local U(1) gauge-invariant", "renormalizable"], "section": 23}}, {"uid": "EM:ward", "branch": "EM", "native_id": "ward", "label": "Ward–Takahashi identities", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "quantum", "t": 76, "concept": null, "extra": {"symbol": "WT", "derived": false, "description": "Relations among amplitudes implied by gauge symmetry; they protect the theory's consistency through renormalization.", "math_structure": null, "properties": ["consequence of gauge invariance", "photon stays massless", "universal charge renormalization"], "section": 23}}, {"uid": "UP:omag", "branch": "UP", "native_id": "omag", "label": "Order of magnitude", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 2, "concept": null, "extra": {"symbol": "10ⁿ", "primitive": false, "postulate": true, "description": "Rounds a value to the nearest power of ten so that very different scales can be compared multiplicatively.", "vol": 1, "section": "1.1", "chapter": 1, "order": 0}}, {"uid": "UP:si", "branch": "UP", "native_id": "si", "label": "SI system of units", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 3, "concept": null, "extra": {"symbol": "SI", "primitive": false, "postulate": true, "description": "The convention that fixes base quantities and their units and builds every other unit as a product of powers of them.", "vol": 1, "section": "1.2", "chapter": 1, "order": 1}}, {"uid": "UP:t", "branch": "UP", "native_id": "t", "label": "Time", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 4, "concept": null, "extra": {"symbol": "t", "primitive": true, "postulate": false, "description": "Read from a clock. SI unit the second, fixed by the caesium-133 hyperfine transition frequency.", "vol": 1, "section": "1.2", "chapter": 1, "order": 2}}, {"uid": "UP:L", "branch": "UP", "native_id": "L", "label": "Length", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 4, "concept": null, "extra": {"symbol": "ℓ", "primitive": true, "postulate": false, "description": "Read from a ruler. SI unit the metre, fixed by the distance light travels in vacuum in 1/299 792 458 s.", "vol": 1, "section": "1.2", "chapter": 1, "order": 3}}, {"uid": "UP:m", "branch": "UP", "native_id": "m", "label": "Mass", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 4, "concept": "mass", "extra": {"symbol": "m", "primitive": true, "postulate": false, "description": "Inertial measure of the amount of matter, read from a balance. SI unit the kilogram, fixed since 2019 through Planck's constant.", "vol": 1, "section": "1.2", "chapter": 1, "order": 4}}, {"uid": "UP:conv", "branch": "UP", "native_id": "conv", "label": "Unit conversion", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 5, "concept": null, "extra": {"symbol": "×(1 km / 1000 m)", "primitive": false, "postulate": false, "description": "Multiplies a quantity by a ratio equal to one, so the number changes and the quantity does not.", "vol": 1, "section": "1.3", "chapter": 1, "order": 5}}, {"uid": "UP:dim", "branch": "UP", "native_id": "dim", "label": "Dimensional analysis", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 6, "concept": null, "extra": {"symbol": "[Q]", "primitive": false, "postulate": false, "description": "Tracks the powers of base dimensions in a quantity; an equation is admissible only if both sides carry the same dimension.", "vol": 1, "section": "1.4", "chapter": 1, "order": 6}}, {"uid": "UP:est", "branch": "UP", "native_id": "est", "label": "Estimation (Fermi)", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 7, "concept": null, "extra": {"symbol": "Q ≈ 10ⁿ", "primitive": false, "postulate": false, "description": "Obtains an order-of-magnitude answer from rough inputs combined in a dimensionally consistent way.", "vol": 1, "section": "1.5", "chapter": 1, "order": 7}}, {"uid": "UP:disc", "branch": "UP", "native_id": "disc", "label": "Discrepancy", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 8, "concept": null, "extra": {"symbol": "A − A_acc", "primitive": false, "postulate": false, "description": "Difference between a measured value and the accepted value; a small discrepancy means high accuracy.", "vol": 1, "section": "1.6", "chapter": 1, "order": 8}}, {"uid": "UP:unc", "branch": "UP", "native_id": "unc", "label": "Uncertainty", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 8, "concept": null, "extra": {"symbol": "δA", "primitive": false, "postulate": false, "description": "The spread of a measured value; percent uncertainty δA/A·100 % compares it with the value itself. Small spread means high precision.", "vol": 1, "section": "1.6", "chapter": 1, "order": 9}}, {"uid": "UP:prop", "branch": "UP", "native_id": "prop", "label": "Uncertainty propagation", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 9, "concept": null, "extra": {"symbol": "δ(AB)/AB ≈ δA/A + δB/B", "primitive": false, "postulate": false, "description": "For products and quotients the percent uncertainties add (to first order), which bounds the uncertainty of a result.", "vol": 1, "section": "1.6", "chapter": 1, "order": 10}}, {"uid": "UP:sigfig", "branch": "UP", "native_id": "sigfig", "label": "Significant figures", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 10, "concept": null, "extra": {"symbol": "s.f.", "primitive": false, "postulate": false, "description": "Bookkeeping rule that keeps only the digits supported by the uncertainty of the inputs.", "vol": 1, "section": "1.6", "chapter": 1, "order": 11}}, {"uid": "UP:scal", "branch": "UP", "native_id": "scal", "label": "Scalar", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 13, "concept": null, "extra": {"symbol": "α", "primitive": false, "postulate": true, "description": "A quantity fixed by one real number and a unit; scalars obey ordinary arithmetic.", "vol": 1, "section": "2.1", "chapter": 2, "order": 12}}, {"uid": "UP:vec", "branch": "UP", "native_id": "vec", "label": "Vector", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 13, "concept": null, "extra": {"symbol": "A⃗", "primitive": false, "postulate": true, "description": "A quantity with magnitude and direction; displacement is the model case. Two vectors can be parallel, antiparallel or orthogonal.", "vol": 1, "section": "2.1", "chapter": 2, "order": 13}}, {"uid": "UP:vadd", "branch": "UP", "native_id": "vadd", "label": "Vector addition", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 14, "concept": "vector_addition", "extra": {"symbol": "A⃗ + B⃗", "primitive": false, "postulate": false, "description": "Combines vectors head to tail (or by the parallelogram) into a resultant; subtraction adds the antiparallel vector.", "vol": 1, "section": "2.1", "chapter": 2, "order": 14}}, {"uid": "UP:vscale", "branch": "UP", "native_id": "vscale", "label": "Multiplication by a scalar", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 15, "concept": null, "extra": {"symbol": "αA⃗", "primitive": false, "postulate": false, "description": "Stretches a vector by |α| and reverses it if α < 0; dividing a vector by its magnitude gives a unit vector.", "vol": 1, "section": "2.1", "chapter": 2, "order": 15}}, {"uid": "UP:comp", "branch": "UP", "native_id": "comp", "label": "Vector components", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 16, "concept": null, "extra": {"symbol": "A⃗ = A_x î + A_y ĵ + A_z k̂", "primitive": false, "postulate": false, "description": "Writes a vector in the orthonormal basis of a Cartesian coordinate system; vector equations become one scalar equation per axis.", "vol": 1, "section": "2.2", "chapter": 2, "order": 16}}, {"uid": "UP:polar", "branch": "UP", "native_id": "polar", "label": "Polar coordinates", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 17, "concept": null, "extra": {"symbol": "(r, φ)", "primitive": false, "postulate": false, "description": "Locates a point in a plane by its distance from the origin and an angle from the x-axis.", "vol": 1, "section": "2.2", "chapter": 2, "order": 17}}, {"uid": "UP:dot", "branch": "UP", "native_id": "dot", "label": "Scalar product", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 19, "concept": null, "extra": {"symbol": "A⃗·B⃗", "primitive": false, "postulate": false, "description": "Multiplies two vectors into a scalar, AB cos φ; it projects one vector on another and vanishes for orthogonal vectors.", "vol": 1, "section": "2.4", "chapter": 2, "order": 18}}, {"uid": "UP:cross", "branch": "UP", "native_id": "cross", "label": "Vector product", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 20, "concept": "cross_product", "extra": {"symbol": "A⃗×B⃗", "primitive": false, "postulate": false, "description": "Multiplies two vectors into a vector perpendicular to both, of magnitude AB sin φ, oriented by the right-hand rule.", "vol": 1, "section": "2.4", "chapter": 2, "order": 19}}, {"uid": "UP:x", "branch": "UP", "native_id": "x", "label": "Position", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 22, "concept": null, "extra": {"symbol": "x", "primitive": false, "postulate": false, "description": "Coordinate of the body on an axis of the frame at a given instant.", "vol": 1, "section": "3.1", "chapter": 3, "order": 20}}, {"uid": "UP:frame", "branch": "UP", "native_id": "frame", "label": "Reference frame", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 22, "concept": null, "extra": {"symbol": "(O; x, y, z; t)", "primitive": false, "postulate": false, "description": "An origin and axes against which positions are measured, together with a clock.", "vol": 1, "section": "3.1", "chapter": 3, "order": 21}}, {"uid": "UP:xt", "branch": "UP", "native_id": "xt", "label": "Motion on a line", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 23, "concept": null, "extra": {"symbol": "x(t)", "primitive": false, "postulate": false, "description": "The kinematic state of a body on a line: its position at every instant.", "vol": 1, "section": "3.1", "chapter": 3, "order": 22}}, {"uid": "UP:dx", "branch": "UP", "native_id": "dx", "label": "Displacement", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 23, "concept": null, "extra": {"symbol": "Δx", "primitive": false, "postulate": false, "description": "Change of position between two instants; signed. A total displacement is the sum of successive displacements.", "vol": 1, "section": "3.1", "chapter": 3, "order": 23}}, {"uid": "UP:dist", "branch": "UP", "native_id": "dist", "label": "Distance traveled", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 24, "concept": null, "extra": {"symbol": "d", "primitive": false, "postulate": false, "description": "Total length of path covered, never negative; it can exceed the magnitude of the displacement.", "vol": 1, "section": "3.1", "chapter": 3, "order": 24}}, {"uid": "UP:vavg", "branch": "UP", "native_id": "vavg", "label": "Average velocity", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 25, "concept": null, "extra": {"symbol": "v̄", "primitive": false, "postulate": false, "description": "Displacement divided by the elapsed time; it depends only on the end points of the interval.", "vol": 1, "section": "3.1", "chapter": 3, "order": 25}}, {"uid": "UP:dtm", "branch": "UP", "native_id": "dtm", "label": "Elapsed time", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 25, "concept": null, "extra": {"symbol": "Δt", "primitive": false, "postulate": false, "description": "Duration of an interval between two clock readings.", "vol": 1, "section": "3.1", "chapter": 3, "order": 26}}, {"uid": "UP:ddt", "branch": "UP", "native_id": "ddt", "label": "Time derivative", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 26, "concept": "time_derivative", "extra": {"symbol": "d/dt", "primitive": false, "postulate": true, "description": "The limit of a difference quotient as the interval shrinks; turns a quantity known at every instant into its rate of change.", "vol": 1, "section": "3.2", "chapter": 3, "order": 27}}, {"uid": "UP:v", "branch": "UP", "native_id": "v", "label": "Instantaneous velocity", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 26, "concept": "velocity", "extra": {"symbol": "v", "primitive": false, "postulate": false, "description": "Rate of change of position at an instant: the slope of x(t).", "vol": 1, "section": "3.2", "chapter": 3, "order": 28}}, {"uid": "UP:savg", "branch": "UP", "native_id": "savg", "label": "Average speed", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 27, "concept": null, "extra": {"symbol": "s̄", "primitive": false, "postulate": false, "description": "Distance traveled divided by elapsed time.", "vol": 1, "section": "3.2", "chapter": 3, "order": 29}}, {"uid": "UP:speed", "branch": "UP", "native_id": "speed", "label": "Speed", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 27, "concept": null, "extra": {"symbol": "|v|", "primitive": false, "postulate": false, "description": "Magnitude of the instantaneous velocity.", "vol": 1, "section": "3.2", "chapter": 3, "order": 30}}, {"uid": "UP:aavg", "branch": "UP", "native_id": "aavg", "label": "Average acceleration", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 28, "concept": null, "extra": {"symbol": "ā", "primitive": false, "postulate": false, "description": "Change of velocity divided by elapsed time.", "vol": 1, "section": "3.3", "chapter": 3, "order": 31}}, {"uid": "UP:a", "branch": "UP", "native_id": "a", "label": "Instantaneous acceleration", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 29, "concept": null, "extra": {"symbol": "a", "primitive": false, "postulate": false, "description": "Rate of change of velocity: the slope of v(t) and the second derivative of x(t), which sets the concavity of its graph.", "vol": 1, "section": "3.3", "chapter": 3, "order": 32}}, {"uid": "UP:kin", "branch": "UP", "native_id": "kin", "label": "Constant-acceleration kinematics", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 30, "concept": null, "extra": {"symbol": "x = x₀ + v₀t + ½at²", "primitive": false, "postulate": false, "description": "The motion when acceleration does not change: velocity linear and position quadratic in time.", "vol": 1, "section": "3.4", "chapter": 3, "order": 33}}, {"uid": "UP:ffall", "branch": "UP", "native_id": "ffall", "label": "Free fall", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 32, "concept": null, "extra": {"symbol": "y = y₀ + v₀t − ½gt²", "primitive": false, "postulate": false, "description": "Vertical motion with acceleration −g; Galileo's result that the motion does not depend on the mass.", "vol": 1, "section": "3.5", "chapter": 3, "order": 34}}, {"uid": "UP:g", "branch": "UP", "native_id": "g", "label": "Free-fall acceleration", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 32, "concept": null, "extra": {"symbol": "g", "primitive": true, "postulate": false, "description": "Acceleration of a body falling near Earth's surface without air resistance: about 9.80 m/s², the same for all bodies at one place.", "vol": 1, "section": "3.5", "chapter": 3, "order": 35}}, {"uid": "UP:integ", "branch": "UP", "native_id": "integ", "label": "Time integral", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 34, "concept": null, "extra": {"symbol": "∫ dt", "primitive": false, "postulate": true, "description": "Accumulates a rate over time; undoes the derivative up to a constant fixed by initial conditions.", "vol": 1, "section": "3.6", "chapter": 3, "order": 36}}, {"uid": "UP:r", "branch": "UP", "native_id": "r", "label": "Position vector", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 37, "concept": "position", "extra": {"symbol": "r⃗", "primitive": false, "postulate": false, "description": "Vector from the origin of the frame to the body: r⃗ = x î + y ĵ + z k̂.", "vol": 1, "section": "4.1", "chapter": 4, "order": 37}}, {"uid": "UP:rt", "branch": "UP", "native_id": "rt", "label": "Trajectory", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 37, "concept": null, "extra": {"symbol": "r⃗(t)", "primitive": false, "postulate": false, "description": "The kinematic state in space: the curve traced by the position vector, made of three independent motions along the axes.", "vol": 1, "section": "4.1", "chapter": 4, "order": 38}}, {"uid": "UP:dr", "branch": "UP", "native_id": "dr", "label": "Displacement vector", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 38, "concept": null, "extra": {"symbol": "Δr⃗", "primitive": false, "postulate": false, "description": "Change of the position vector between two instants.", "vol": 1, "section": "4.1", "chapter": 4, "order": 39}}, {"uid": "UP:vvec", "branch": "UP", "native_id": "vvec", "label": "Velocity vector", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 39, "concept": null, "extra": {"symbol": "v⃗", "primitive": false, "postulate": false, "description": "Rate of change of the position vector; tangent to the trajectory.", "vol": 1, "section": "4.1", "chapter": 4, "order": 40}}, {"uid": "UP:avec", "branch": "UP", "native_id": "avec", "label": "Acceleration vector", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 40, "concept": null, "extra": {"symbol": "a⃗", "primitive": false, "postulate": false, "description": "Rate of change of the velocity vector; in curved motion it has parts across and along the path (total acceleration).", "vol": 1, "section": "4.2", "chapter": 4, "order": 41}}, {"uid": "UP:proj", "branch": "UP", "native_id": "proj", "label": "Projectile motion", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 42, "concept": null, "extra": {"symbol": "a⃗ = −g ĵ", "primitive": false, "postulate": false, "description": "Motion under gravity alone: uniform horizontally, free fall vertically, the two independent.", "vol": 1, "section": "4.3", "chapter": 4, "order": 42}}, {"uid": "UP:tof", "branch": "UP", "native_id": "tof", "label": "Time of flight", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 43, "concept": null, "extra": {"symbol": "T_tof", "primitive": false, "postulate": false, "description": "Time a projectile spends in the air.", "vol": 1, "section": "4.3", "chapter": 4, "order": 43}}, {"uid": "UP:rng", "branch": "UP", "native_id": "rng", "label": "Range", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 43, "concept": null, "extra": {"symbol": "R", "primitive": false, "postulate": false, "description": "Horizontal distance traveled by a projectile landing at its launch height.", "vol": 1, "section": "4.3", "chapter": 4, "order": 44}}, {"uid": "UP:circ", "branch": "UP", "native_id": "circ", "label": "Circular motion", "layer": "S", "sublayer": "S.point", "native_layer": "state", "era": "classical", "t": 45, "concept": null, "extra": {"symbol": "φ(t) on a circle", "primitive": false, "postulate": false, "description": "The state of a body moving on a circle of radius r: its angle at every instant.", "vol": 1, "section": "4.4", "chapter": 4, "order": 45}}, {"uid": "UP:ac", "branch": "UP", "native_id": "ac", "label": "Centripetal acceleration", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 46, "concept": null, "extra": {"symbol": "a_C", "primitive": false, "postulate": false, "description": "Acceleration toward the centre needed to keep a body on a circle.", "vol": 1, "section": "4.4", "chapter": 4, "order": 46}}, {"uid": "UP:omega", "branch": "UP", "native_id": "omega", "label": "Angular frequency", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 47, "concept": null, "extra": {"symbol": "ω", "primitive": false, "postulate": false, "description": "Rate at which the angle advances, in rad/s; constant in uniform circular motion.", "vol": 1, "section": "4.4", "chapter": 4, "order": 47}}, {"uid": "UP:at", "branch": "UP", "native_id": "at", "label": "Tangential acceleration", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 48, "concept": null, "extra": {"symbol": "a_T", "primitive": false, "postulate": false, "description": "Rate of change of speed; directed along the path.", "vol": 1, "section": "4.4", "chapter": 4, "order": 48}}, {"uid": "UP:galrel", "branch": "UP", "native_id": "galrel", "label": "Relative motion", "layer": "M", "sublayer": "M.law", "native_layer": "model", "era": "classical", "t": 49, "concept": null, "extra": {"symbol": "v⃗_PS = v⃗_PS′ + v⃗_S′S", "primitive": false, "postulate": false, "description": "Converts positions and velocities between two reference frames in relative motion by adding the frames' relative position and velocity.", "vol": 1, "section": "4.5", "chapter": 4, "order": 49}}, {"uid": "UP:vrel", "branch": "UP", "native_id": "vrel", "label": "Relative velocity", "layer": "O", "sublayer": "O.direct", "native_layer": "observable", "era": "classical", "t": 50, "concept": null, "extra": {"symbol": "v⃗_PS′", "primitive": false, "postulate": false, "description": "Velocity of a body measured in a frame that itself moves.", "vol": 1, "section": "4.5", "chapter": 4, "order": 50}}, {"uid": "UP:F", "branch": "UP", "native_id": "F", "label": "Force", "layer"
