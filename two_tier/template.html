<!DOCTYPE html>
<html lang="en" data-gen-version="two-tier">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-Tier Epistemic Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: header, view tabs; each view is one main column beside a sticky detail rail.
     The evolution view stacks: time controls, the method strip (two tiers x eight phases + two cross-tier steps),
     then the network as two tier bands x three layer columns. Layer hue is the only categorical colour;
     branch is a lane, tier is a band, membership is a line or a dot inside a cluster box. */
  --surface:#fcfcfb; --panel:#ffffff; --wash:#f1f0ec; --ink:#0b0b0b; --ink2:#52514e; --mute:#7d7c77; --line:#dad9d3;
  --S:#2a78d6; --M:#eb6834; --O:#1baf7a; --good:#0ca30c; --crit:#d03b3b; --warn:#b97a00;
  --h0:#f1f0ec; --h1:#d3d2cc; --h2:#a9a8a1; --h3:#6f6e69; --h4:#2c2c2a;
  --font-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI","Noto Sans Math","DejaVu Sans",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --surface:#1a1a19; --panel:#232322; --wash:#2b2b29; --ink:#f0efec; --ink2:#c3c2b7; --mute:#94938b; --line:#3d3d39;
    --S:#3987e5; --M:#d95926; --O:#199e70; --good:#0ca30c; --crit:#e66767; --warn:#fab219;
    --h0:#2b2b29; --h1:#4a4a46; --h2:#75746e; --h3:#a8a79f; --h4:#eeede9; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --surface:#1a1a19; --panel:#232322; --wash:#2b2b29; --ink:#f0efec; --ink2:#c3c2b7; --mute:#94938b; --line:#3d3d39;
  --S:#3987e5; --M:#d95926; --O:#199e70; --good:#0ca30c; --crit:#e66767; --warn:#fab219;
  --h0:#2b2b29; --h1:#4a4a46; --h2:#75746e; --h3:#a8a79f; --h4:#eeede9; }
*{box-sizing:border-box}
html{font-size:15px}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-body);line-height:1.45}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1680px;margin:0 auto;padding:0 18px 48px}
header.top{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline;padding:16px 0 8px}
header.top h1{font-family:var(--font-display);font-weight:600;font-size:1.6rem;line-height:1.15;margin:0;text-wrap:balance}
header.top p{margin:0;color:var(--ink2);font-size:.9rem;max-width:95ch}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
nav.tabs a{padding:7px 12px;text-decoration:none;color:var(--ink2);border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;font-weight:500;margin-bottom:-1px}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--panel);border-color:var(--line)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:16px;align-items:start}
@media (max-width:1150px){.grid{grid-template-columns:minmax(0,1fr)}}
.rail{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.88rem}
@media (max-width:1150px){.rail{position:static;max-height:none}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
h2{font-family:var(--font-display);font-weight:600;font-size:1.15rem;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:600;font-size:.98rem;margin:10px 0 4px}
p{margin:0 0 8px;max-width:78ch}
.muted{color:var(--ink2)} .small{font-size:.84rem} .mono{font-family:var(--font-mono);font-size:.82em}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;vertical-align:top;padding:4px 8px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--ink2);font-size:.76rem;letter-spacing:.03em;text-transform:uppercase}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.74rem;color:var(--ink2);margin:0 3px 3px 0;white-space:nowrap}
.tag.S{border-color:var(--S)} .tag.M{border-color:var(--M)} .tag.O{border-color:var(--O)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.sw.S{background:var(--S)} .sw.M{background:var(--M)} .sw.O{background:var(--O)}
.linkbtn{background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--mute);text-underline-offset:2px;text-align:left}
.linkbtn:hover{text-decoration-color:var(--ink)}
.bt{display:inline-block;font-family:var(--font-mono);font-size:.7em;color:var(--mute);margin-left:4px}
/* ---------- time controls */
.ctl{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.ctl button,.ctl select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer}
.ctl select{max-width:100%;min-width:0;text-overflow:ellipsis}
.ctl button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ctl .year{font-family:var(--font-display);font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:4.2ch}
.ctl input[type=range]{flex:1 1 260px;min-width:160px;accent-color:var(--ink)}
.ctl label{display:inline-flex;gap:5px;align-items:center;font-size:.84rem;color:var(--ink2)}
.heat{display:grid;grid-template-columns:86px minmax(0,1fr);gap:2px 8px;align-items:center;margin-top:8px;font-size:.72rem;color:var(--ink2)}
.heat .row{display:flex;height:9px;cursor:pointer}
.heat .row i{flex:1 1 0;min-width:0}
.q0{background:var(--h0)} .q1{background:var(--h1)} .q2{background:var(--h2)} .q3{background:var(--h3)} .q4{background:var(--h4)}
.heat .row i.cur{outline:1.5px solid var(--ink);outline-offset:0;position:relative;z-index:1}
.heat .axis{display:flex;justify-content:space-between;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.heat .axis .lg{display:inline-flex;flex-wrap:wrap;gap:2px 12px;align-items:center}
.heat .axis .lg i{display:inline-block;width:10px;height:9px;margin-right:3px;vertical-align:-1px}
.stop{margin-top:8px;border-left:3px solid var(--ink);padding:2px 0 2px 10px;font-size:.88rem}
.stop b{font-family:var(--font-display);font-size:1rem}
.stop ul{margin:2px 0 0;padding-left:16px;color:var(--ink2)}
/* ---------- method strip */
.seq{display:grid;grid-template-columns:78px repeat(8,minmax(60px,1fr)) repeat(2,minmax(72px,1.15fr));gap:3px;font-size:.74rem;min-width:860px}
.seq .xn{grid-column:2 / span 8;align-self:center;text-align:right;color:var(--mute);padding-right:8px}
.seq .hd{color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;font-size:.68rem;align-self:end;padding:0 2px}
.seq .tl{align-self:center;font-weight:600;font-size:.76rem;line-height:1.2}
.cell{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:3px 5px;text-align:left;cursor:pointer;min-height:44px;display:flex;flex-direction:column;justify-content:space-between}
.cell .t{color:var(--ink2);line-height:1.15}
.cell .n{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.cell .n b{font-size:1.02rem;font-family:var(--font-display)}
.cell .n span{color:var(--mute)}
.cell.on{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.cell.on .t{color:var(--ink)}
.cell.zero .n b{color:var(--mute);font-weight:500}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.cell.x{grid-row:span 1;background:var(--wash)}
/* ---------- network map */
.tools{margin:8px 0}
.findbox{position:relative;flex:1 1 210px;min-width:170px;max-width:300px}
.findbox input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 9px}
.found{display:none;position:absolute;z-index:15;left:0;top:100%;margin-top:3px;min-width:100%;width:max-content;max-width:min(460px,86vw);background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.16);max-height:330px;overflow:auto}
.found.open{display:block}
.ctl .found button{display:block;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:5px 9px;font-size:.84rem;cursor:pointer;white-space:normal}
.ctl .found button:hover,.ctl .found button:focus-visible{background:var(--wash)}
.zl{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--ink2);min-width:4ch;text-align:center}
.kept{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin:0 0 8px}
.keptchip{cursor:default}
.keptchip .x{border:none;background:none;cursor:pointer;padding:0 2px;color:var(--ink2);font-size:1rem;line-height:1}
.hint{color:var(--ink2);font-size:.8rem;margin:8px 0 0;max-width:none}
.maphost{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);margin-bottom:8px}
svg.net{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none;color:var(--ink);font-family:var(--font-body)}
svg.net.grab{cursor:grabbing}
svg.net text{font-size:var(--fs,11px);dominant-baseline:central;fill:var(--ink)}
svg.net .band{fill:none;stroke:var(--line);vector-effect:non-scaling-stroke}
svg.net text.bt2{font-size:var(--fh,13px);font-weight:600;cursor:pointer}
svg.net text.ch{font-size:var(--fh,12px);fill:var(--ink2);cursor:pointer}
svg.net text.ll{font-family:var(--font-mono);fill:var(--mute);cursor:pointer;font-size:calc(var(--fs,11px)*.86)}
svg.net text.bt2:hover,svg.net text.ch:hover,svg.net text.ll:hover{text-decoration:underline}
svg.net .lsep{stroke:var(--line);stroke-dasharray:1 3;vector-effect:non-scaling-stroke}
svg.net rect.sw.S,svg.net .nm.S .nk{fill:var(--S)} svg.net rect.sw.M,svg.net .nm.M .nk{fill:var(--M)} svg.net rect.sw.O,svg.net .nm.O .nk{fill:var(--O)}
svg.net .nh{fill:transparent;cursor:pointer}
svg.net .nm{cursor:pointer}
svg.net .nm .no{fill:none;stroke:none;vector-effect:non-scaling-stroke;pointer-events:none}
svg.net .nm.pod .no{stroke-width:1.2px}
svg.net .nm.pod.S .no{stroke:var(--S)} svg.net .nm.pod.M .no{stroke:var(--M)} svg.net .nm.pod.O .no{stroke:var(--O)}
svg.net .nm.hov .no{fill:var(--wash)}
svg.net .nm.new .no,svg.net .nm.pod.new .no{stroke:var(--ink);stroke-width:1.7px}
svg.net .nm.rel .no,svg.net .nm.pod.rel .no{stroke:var(--ink);stroke-width:1.3px;stroke-dasharray:3 2}
svg.net .nm.pin .no,svg.net .nm.pod.pin .no{stroke:var(--ink);stroke-width:1.7px;stroke-dasharray:7 2}
svg.net .nm.sel .no,svg.net .nm.pod.sel .no{stroke:var(--ink);stroke-width:2.6px;stroke-dasharray:none;fill:var(--wash)}
svg.net .nm.gone{opacity:.36}
svg.net.dimmed .nm:not(.sel):not(.rel):not(.pin){opacity:.4}
svg.net.nolabel .nl{display:none}
svg.net .nl .nx{fill:var(--mute)}
svg.net .md{fill:var(--ink);stroke:var(--ink);stroke-width:.8px;vector-effect:non-scaling-stroke}
svg.net .md.dv{fill:var(--panel)} svg.net .md.ct{fill:url(#half)} svg.net .md.ud{fill:none;stroke-dasharray:1 1.6}
svg.net #half .h1{stop-color:var(--ink)} svg.net #half .h2{stop-color:var(--panel)}
svg.net .edge{cursor:pointer}
svg.net .edge .ln{fill:none;stroke:var(--ink);stroke-width:.9px;opacity:.24;vector-effect:non-scaling-stroke}
svg.net .edge .hit{fill:none;stroke:transparent;stroke-width:11px;vector-effect:non-scaling-stroke;pointer-events:stroke}
svg.net .edge.cut .ln{stroke-dasharray:5 3} svg.net .edge.aggregate .ln{stroke-dasharray:1.5 3;stroke-linecap:round} svg.net .edge.test .ln{stroke-dasharray:7 2 1.5 2}
svg.net .edge.criterion .ln{stroke-dasharray:9 3} svg.net .edge.subset .ln{stroke-dasharray:3 2} svg.net .edge.der .ln{stroke-dasharray:2 4}
svg.net .edge.a.now .ln{opacity:.5}
svg.net.dimmed .edge:not(.sel):not(.foc) .ln{opacity:.13}
svg.net.dimmed .edge:not(.sel):not(.foc) .hd{opacity:.4}
svg.net .edge.foc .ln{opacity:.85;stroke-width:1.5px}
svg.net .edge .ed,svg.net .edge .ah{fill:var(--ink);opacity:.45}
svg.net .edge .hd{fill:var(--ink);stroke:var(--panel);stroke-width:1.4px;vector-effect:non-scaling-stroke;opacity:.8}
svg.net .edge.r .hd{fill:var(--panel);stroke:var(--ink)}
svg.net .edge:hover .ln,svg.net .edge.sel .ln{opacity:1;stroke-width:2.4px}
svg.net .edge:hover .hd,svg.net .edge.sel .hd,svg.net .edge:hover .ed,svg.net .edge.sel .ed,svg.net .edge:hover .ah,svg.net .edge.sel .ah{opacity:1}
svg.net .edge.sel .hd{stroke:var(--ink);stroke-width:2.6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.76rem;color:var(--ink2);align-items:center}
.legend svg{vertical-align:middle;color:var(--ink)}
.legend .pm i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-right:3px}
.legend .pm i.dv{background:transparent;border:1px solid var(--ink)}
.legend .pm i.ct{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%);border:1px solid var(--ink)}
.legend .pm i.ud{background:transparent;border:1px dotted var(--ink2)}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--surface);padding:4px 8px;border-radius:5px;font-size:.78rem;max-width:320px;display:none;line-height:1.3}
#tip span{opacity:.75}
/* ---------- rail */
.rail h2{font-size:1.05rem;margin-bottom:2px}
.kv{display:grid;grid-template-columns:86px minmax(0,1fr);gap:3px 8px;margin:6px 0}
.kv dt{color:var(--ink2)} .kv dd{margin:0;overflow-wrap:anywhere}
.stmt{border-left:3px solid var(--line);padding:3px 8px;margin:6px 0;overflow-wrap:anywhere}
ul.items{list-style:none;margin:4px 0;padding:0}
ul.items li{padding:3px 0;border-bottom:1px dotted var(--line);overflow-wrap:anywhere}
ul.items li .mono{color:var(--ink2)}
details{margin:6px 0} summary{cursor:pointer;color:var(--ink2)}
.rail h3{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);font-family:var(--font-body);margin:12px 0 4px}
.sent{font-weight:500;margin:4px 0 6px;overflow-wrap:anywhere}
.card2{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:6px 0;background:var(--surface);overflow-wrap:anywhere}
.card2 .hd2{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;font-size:.8rem;color:var(--ink2)}
.card2 h3{margin-top:8px}
ul.refs{margin:4px 0;padding-left:16px;font-size:.84rem} ul.refs li{margin:2px 0;overflow-wrap:anywhere}
ol.steps{margin:4px 0;padding-left:18px} ol.steps li{margin:6px 0}
dl.kv.data{grid-template-columns:minmax(84px,40%) minmax(0,1fr);font-size:.82rem;margin:4px 0}
dl.kv.data dl.kv.data{margin:0}
/* ---------- clusters */
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}
.clist{position:relative;max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.clist button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:5px 8px;cursor:pointer;font-size:.84rem}
.clist button.sel{background:var(--wash)}
.clist button .c{color:var(--ink2);font-variant-numeric:tabular-nums;font-size:.76rem;white-space:nowrap}
.clist .gh{padding:4px 8px;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);background:var(--wash);border-bottom:1px solid var(--line);position:sticky;top:0}
.eye{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.eye .grp{border:1.5px solid var(--line);border-radius:6px;padding:5px 7px;min-width:150px;max-width:100%}
.eye .grp h4{margin:0 0 4px;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin:0 3px 3px 0;font-size:.78rem;background:var(--surface);cursor:pointer}
.chip.dv{border-style:dashed} .chip.ct{border-style:dotted}
.chip .sw{margin-right:0}
table.inc{font-size:.72rem} table.inc th,table.inc td{padding:2px 3px;text-align:center;border:1px solid var(--line)}
table.inc th.rot{height:92px;vertical-align:bottom;white-space:nowrap;text-transform:none;letter-spacing:0;font-weight:500}
table.inc th.rot div{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left}
table.inc td.rl,table.inc th.rl{text-align:left;white-space:nowrap}
table.inc td.na{background:repeating-linear-gradient(45deg,transparent 0 3px,var(--line) 3px 4px)}
table.inc td{cursor:default;font-family:var(--font-mono)}
table.inc td.rl{font-family:var(--font-body)}
.ok{color:var(--good);font-weight:600} .no{color:var(--crit);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.card b{display:block;font-family:var(--font-display);font-size:1.45rem;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.card span{color:var(--ink2);font-size:.8rem}
figure{margin:0} figcaption{color:var(--ink2);font-size:.82rem;margin-top:4px;max-width:90ch}
svg.pipe{width:100%;min-width:900px;max-width:1180px;height:auto;color:var(--ink)}
svg.pipe text{font-family:var(--font-body)}
.err{color:var(--crit);padding:20px}

</style>
</head>

<div class="wrap">
  <header class="top">
    <h1>Two-tier epistemic network</h1>
    <p id="lede">The six released concept graphs of the Great Epistemic Network read as one network. System-specific nodes sit in the lower tier, generic ones in the upper tier. Select any node or line for its statement, its references and the data of its checks.</p>
  </header>
  <nav class="tabs" id="tabs" aria-label="Views"></nav>
  <main id="view"><p class="muted">Loading the network…</p></main>
</div>
<div id="tip" role="tooltip"></div>
