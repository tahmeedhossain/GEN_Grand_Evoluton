:"predict","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"LITERATURE FILL (round 4): thermal operations can generate nonstabiliserness from a stabiliser input. For a qubit prepared in a stabiliser state and coupled to a heat bath, de Oliveira Junior et al. give a necessary and sufficient condition (a witness M(rho) > 1), an analytic characterisation of the"},{"uid":"GPT:U6","branch":"GPT","native_id":"U6","inputs":["GPT:s-zerodisc"],"target":"GPT:e-ctx","logic":"single","kind":"forbids","kind_native":"forbids","status":"theorem","polarity":"no_go","year":2024,"year_prov":"cited","phase":"falsify","rule":"R14 close (no-go)","removed":false,"step_first":null,"step_last":null,"text":"LITERATURE FILL with direct proof (round 4): if rho_AB is classical on the steered side A, rho = sum_i p_i |i><i| x tau_i with orthonormal |i>, then every remotely preparable state Tr_B[(1 x E_B) rho] is diagonal in {|i>}, so the remote-preparation scenario with all measurements has, under the tomog"},{"uid":"GPT:U7","branch":"GPT","native_id":"U7","inputs":["GPT:s-discord"],"target":"GPT:e-ctx","logic":"single","kind":"not_implies","kind_native":"not_implies","status":"counterexample","polarity":"no_go","year":2009,"year_prov":"cited","phase":"falsify","rule":"R14 close (no-go)","removed":false,"step_first":null,"step_last":null,"text":"PROPOSITION U7 (combined paper, round 4): among separable states (tomographically complete convention), contextuality of the remote-preparation scenario (all measurements) is a property of the steered side's nonclassicality, not of the correlations: it REQUIRES discord on the steered side (contrapos"},{"uid":"QRT:MM1","branch":"QRT","native_id":"MM1","inputs":["QRT:m-asy"],"target":"QRT:m-coh","logic":"single","kind":"specializes","kind_native":"specializes","status":"theorem","polarity":"structural","year":2016,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Unspeakable coherence w.r.t. the eigenbasis of an observable = asymmetry under the translation group it generates; the asymmetry theory (TIO for U(1)) is the physically justified coherence theory."},{"uid":"QRT:MM2","branch":"QRT","native_id":"MM2","inputs":["QRT:m-coh"],"target":"QRT:m-asy","logic":"single","kind":"distinct","kind_native":"distinct","status":"theorem","polarity":"no_go","year":2016,"year_prov":"cited","phase":"falsify","rule":"R14 close (no-go)","removed":false,"step_first":null,"step_last":null,"text":"Speakable coherence (IO/MIO) is NOT asymmetry: measures of speakable coherence are a proper subset of measures of asymmetry; IO and TIO are inequivalent classes and the IO/MIO framework lacks a symmetry justification."},{"uid":"QRT:MM3","branch":"QRT","native_id":"MM3","inputs":["QRT:m-ath"],"target":"QRT:F-TYPE","logic":"single","kind":"satisfies","kind_native":"satisfies","status":"theorem","polarity":"structural","year":2015,"year_prov":"cited","phase":"restructure","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Athermality = constraint (Gibbs preservation) x symmetry (U(1)-covariance): its second-law constraints factor into free-energy monotones (block-diagonal data) + asymmetry-mode constraints (coherences); neither family alone is complete."},{"uid":"QRT:MM4","branch":"QRT","native_id":"MM4","inputs":["QRT:m-ath"],"target":"QRT:m-pur","logic":"single","kind":"specializes","kind_native":"specializes","status":"theorem","polarity":"structural","year":2015,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Trivial Hamiltonian limit: Gibbs -> I/d, thermal ops -> noisy ops; purity/nonuniformity is athermality with H proportional to I."},{"uid":"QRT:MM5","branch":"QRT","native_id":"MM5","inputs":["QRT:m-ima"],"target":"QRT:m-coh","logic":"single","kind":"distinct","kind_native":"distinct","status":"derived","polarity":"structural","year":2018,"year_prov":"cited","phase":"falsify","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Imaginarity is the Z2/antiunitary analogue of coherence (free = conjugation-invariant vs dephasing-invariant); it is NOT a G-covariance theory because complex conjugation is not a channel."},{"uid":"QRT:MM6","branch":"QRT","native_id":"MM6","inputs":["QRT:m-nga"],"target":"QRT:m-mag","logic":"single","kind":"equiv","kind_native":"equiv","status":"theorem","polarity":"structural","year":2012,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"CV/DV twins: in odd d, mana(rho) = 0 iff discrete-Wigner-positive; in CV, Wigner positivity defines the simulable free cone. Same quasiprobability mechanism, different phase spaces."},{"uid":"QRT:MM7","branch":"QRT","native_id":"MM7","inputs":["QRT:m-ent"],"target":"QRT:m-nlo","logic":"single","kind":"distinct","kind_native":"distinct","status":"theorem","polarity":"structural","year":2015,"year_prov":"cited","phase":"falsify","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"One ladder, three theories: tightening LOCC to 1W-LOCC gives steering, to LOSR gives nonlocality. LOCC is the WRONG free-op class for Bell scenarios; LOSR-entanglement is the resource relevant to nonlocality."},{"uid":"QRT:MM8","branch":"QRT","native_id":"MM8","inputs":["QRT:m-ctx"],"target":"QRT:m-nlo","logic":"single","kind":"contains","kind_native":"contains","status":"theorem","polarity":"structural","year":2018,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Bell scenarios are contextuality scenarios with spacelike contexts; NCW give a unified resource framework. Caveat: NCW restricted to Bell scenarios is NOT equivalent to LOSR (P6)."},{"uid":"QRT:MM9","branch":"QRT","native_id":"MM9","inputs":["QRT:m-dis"],"target":"QRT:F-CONVEX","logic":"single","kind":"violates","kind_native":"violates","status":"counterexample","polarity":"no_go","year":2012,"year_prov":"cited","phase":"falsify","rule":"R14 close (no-go)","removed":false,"step_first":null,"step_last":null,"text":"The set of classical-classical states is non-convex (mixing classical states of different bases yields discordant states): the convexity axiom fails for discord."},{"uid":"QRT:MM10","branch":"QRT","native_id":"MM10","inputs":["QRT:m-dis"],"target":"QRT:F-QRT","logic":"single","kind":"violates","kind_native":"violates","status":"counterexample","polarity":"no_go","year":2012,"year_prov":"cited","phase":"falsify","rule":"R14 close (no-go)","removed":false,"step_first":null,"step_last":null,"text":"Golden-rule failure: local channels can create discord from classical states, so no free-op class containing local processing exists."},{"uid":"QRT:MM11","branch":"QRT","native_id":"MM11","inputs":["QRT:F-STEIN"],"target":"QRT:p-rng","logic":"single","kind":"reversible","kind_native":"reversible","status":"theorem","polarity":"possibility","year":2023,"year_prov":"cited","phase":"predict","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Second law restored: under ASYMPTOTICALLY resource-non-generating operations every theory meeting the Brandao-Plenio axioms is reversible, with unique rate function = regularized relative entropy of resource (generalized quantum Stein lemma, proven 2024 after the 2023 gap)."},{"uid":"QRT:MM12","branch":"QRT","native_id":"MM12","inputs":["QRT:pX-ent"],"target":"QRT:F-STEIN","logic":"single","kind":"irreversible","kind_native":"irreversible","status":"theorem","polarity":"no_go","year":2023,"year_prov":"cited","phase":"falsify","rule":"R14 close (no-go)","removed":false,"step_first":null,"step_last":null,"text":"The entanglement no-go coexists with the Stein-lemma second law: irreversibility holds under EXACT non-generation, reversibility under ASYMPTOTIC non-generation. The exact/asymptotic frontier is the load-bearing hinge (QG4)."},{"uid":"QRT:MM13","branch":"QRT","native_id":"MM13","inputs":["QRT:F-ADV"],"target":"QRT:w-robust","logic":"single","kind":"witness","kind_native":"witness","status":"theorem","polarity":"possibility","year":2019,"year_prov":"cited","phase":"observe","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"The advantage axiom instantiates as the robustness-discrimination theorem in every convex theory, and survives (multi-copy form) without convexity - so even discord-type quantumness retains an operational-advantage reading."},{"uid":"QRT:MM14","branch":"QRT","native_id":"MM14","inputs":["QRT:m-inc"],"target":"QRT:F-QRT","logic":"single","kind":"satisfies","kind_native":"satisfies","status":"theorem","polarity":"structural","year":2020,"year_prov":"cited","phase":"restructure","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Incompatibility shows the schema extends from states to devices: free objects are classically programmable devices; complete convertibility conditions exist (guessing games)."},{"uid":"QRT:SS1","branch":"QRT","native_id":"SS1","inputs":["QRT:sF-coh"],"target":"QRT:sF-ent","logic":"single","kind":"subset","kind_native":"subset","status":"derived","polarity":"structural","year":2017,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Free-set containment: states incoherent in a local PRODUCT basis are diagonal in a product basis, hence separable - INC(product basis) is a strict subset of SEP."},{"uid":"QRT:SS2","branch":"QRT","native_id":"SS2","inputs":["QRT:d-maxmix"],"target":"QRT:sF-pur","logic":"single","kind":"member_free","kind_native":"member_free","status":"derived","polarity":"structural","year":2026,"year_prov":"propagated","phase":"restructure","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"I/d is the unique purity-free state and lies in every other free set here (SEP, incoherent, symmetric, real, STAB, Wigner-positive); in athermality it is free only for trivial H."},{"uid":"QRT:SS3","branch":"QRT","native_id":"SS3","inputs":["QRT:d-gibbs"],"target":"QRT:sR-mag","logic":"single","kind":"member_resource","kind_native":"member_resource","status":"derived","polarity":"possibility","year":2026,"year_prov":"propagated","phase":"restructure","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"QP5 (thermal magic): the Gibbs state of a generic interacting Hamiltonian is NOT in STAB - thermal states generically carry magic while being free for athermality, coherence (energy basis), asymmetry and imaginarity. Free-of-one, resource-of-another in a single physical state."},{"uid":"QRT:SS3b","branch":"QRT","native_id":"SS3b","inputs":["QRT:d-gibbs"],"target":"QRT:sF-ath","logic":"single","kind":"member_free","kind_native":"member_free","status":"theorem","polarity":"structural","year":2026,"year_prov":"propagated","phase":"restructure","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Gamma is the unique free state of athermality, and simultaneously a member of the free sets of coherence (energy basis), asymmetry (U(1)) and imaginarity (energy basis)."},{"uid":"QRT:SS4","branch":"QRT","native_id":"SS4","inputs":["QRT:d-plus"],"target":"QRT:sF-mag","logic":"single","kind":"member_free","kind_native":"member_free","status":"derived","polarity":"structural","year":2026,"year_prov":"propagated","phase":"restructure","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"|+> is a stabilizer state and real: magic-free and imaginarity-free. Hence coherence is NOT sufficient for magic."},{"uid":"QRT:SS4b","branch":"QRT","native_id":"SS4b","inputs":["QRT:d-plus"],"target":"QRT:sR-coh","logic":"single","kind":"member_resource","kind_native":"member_resource","status":"derived","polarity":"structural","year":2026,"year_prov":"propagated","phase":"restructure","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"|+> is the maximal coherence resource (basis Z), a maximal purity resource, and a U(1)-asymmetry resource (H prop Z) - while sitting inside the magic and imaginarity free sets (SS4)."},{"uid":"QRT:SS5","branch":"QRT","native_id":"SS5","inputs":["QRT:d-bell"],"target":"QRT:sF-mag","logic":"single","kind":"member_free","kind_native":"member_free","status":"derived","polarity":"structural","year":2014,"year_prov":"propagated","phase":"restructure","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"|Phi+> is a stabilizer state and real: maximal entanglement with zero magic and zero imaginarity. STAB is not contained in SEP and SEP is not contained in STAB: free sets cut across one another (SS13)."},{"uid":"QRT:SS5b","branch":"QRT","native_id":"SS5b","inputs":["QRT:d-bell"],"target":"QRT:sR-ent","logic":"single","kind":"member_resource","kind_native":"member_resource","status":"theorem","polarity":"structural","year":2009,"year_prov":"cited","phase":"restructure","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"|Phi+> is the golden unit of entanglement: maximally entangled, maximally steering-capable, Bell-violating with incompatible measurements."},{"uid":"QRT:SS6","branch":"QRT","native_id":"SS6","inputs":["QRT:d-werner"],"target":"QRT:sF-nlo","logic":"single","kind":"member_free","kind_native":"member_free","status":"theorem","polarity":"no_go","year":1989,"year_prov":"cited","phase":"restructure","rule":"R14 close (no-go)","removed":false,"step_first":null,"step_last":null,"text":"Entangled Werner states admit LHV models (projective: Werner 1989; all POVMs: Barrett 2002) and unsteerable ranges (WJD 2007): entangled yet inside the Bell-local and LHS free sets - the strictness witness for the whole hierarchy."},{"uid":"QRT:SS7","branch":"QRT","native_id":"SS7","inputs":["QRT:d-bound"],"target":"QRT:sR-nlo","logic":"single","kind":"member_resource","kind_native":"member_resource","status":"theorem","polarity":"possibility","year":2014,"year_prov":"cited","phase":"restructure","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Some PPT bound entangled states violate a Bell inequality (Peres conjecture false): nonlocality without distillable entanglement."},{"uid":"QRT:SS8","branch":"QRT","native_id":"SS8","inputs":["QRT:d-wpos"],"target":"QRT:sR-mag","logic":"single","kind":"member_resource","kind_native":"member_resource","status":"theorem","polarity":"no_go","year":2012,"year_prov":"cited","phase":"restructure","rule":"R14 close (no-go)","removed":false,"step_first":null,"step_last":null,"text":"Bound magic: Wigner-positive non-stabilizer states (odd d) are magic resources by set membership yet undistillable and classically simulable."},{"uid":"QRT:SS9","branch":"QRT","native_id":"SS9","inputs":["QRT:d-tstate"],"target":"QRT:sR-mag","logic":"single","kind":"member_resource","kind_native":"member_resource","status":"derived","polarity":"possibility","year":2005,"year_prov":"cited","phase":"restructure","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"The T state is simultaneously a resource of magic, coherence, purity AND imaginarity - a maximal multi-theory resource on one qubit; its injection yields universality (pU-mag)."},{"uid":"QRT:SS10","branch":"QRT","native_id":"SS10","inputs":["QRT:sR-ste"],"target":"QRT:sR-inc","logic":"single","kind":"equiv","kind_native":"equiv","status":"theorem","polarity":"structural","year":2014,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"One-to-one mapping: every steering problem is a joint-measurability problem and vice versa; steering monotones double as incompatibility monotones."},{"uid":"QRT:SS11","branch":"QRT","native_id":"SS11","inputs":["QRT:sF-nlo"],"target":"QRT:F-TENSOR","logic":"single","kind":"violates","kind_native":"violates","status":"derived","polarity":"no_go","year":2012,"year_prov":"cited","phase":"falsify","rule":"R14 close (no-go)","removed":false,"step_first":null,"step_last":null,"text":"QP2: at the level of quantum STATES, the Bell-local set is not closed under tensor products - superactivation makes k copies of a local entangled state nonlocal. The tensor axiom fails for state-level locality; resolution: the proper objects are boxes under LOSR, where closure holds."},{"uid":"QRT:SS12","branch":"QRT","native_id":"SS12","inputs":["QRT:sF-ath"],"target":"QRT:sF-coh","logic":"single","kind":"subset","kind_native":"subset","status":"derived","polarity":"structural","year":2014,"year_prov":"propagated","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"{gamma} is a subset of the incoherent states (energy basis, nondegenerate H): the athermality free set sits inside the coherence free set - any free transformation of coherence theory leaves gamma free."},{"uid":"QRT:SS13","branch":"QRT","native_id":"SS13","inputs":["QRT:sF-mag"],"target":"QRT:sF-ent","logic":"single","kind":"distinct","kind_native":"distinct","status":"derived","polarity":"no_go","year":2014,"year_prov":"propagated","phase":"falsify","rule":"R14 close (no-go)","removed":false,"step_first":null,"step_last":null,"text":"Transversality: STAB is NOT a subset of SEP (Bell state is stabilizer and entangled) and SEP is NOT a subset of STAB (the product state T tensor |0> is separable and magic). Neither theory's free transformations respect the other's free set."},{"uid":"QRT:SS14","branch":"QRT","native_id":"SS14","inputs":["QRT:sF-coh"],"target":"QRT:sF-ima","logic":"single","kind":"subset","kind_native":"subset","status":"derived","polarity":"structural","year":2018,"year_prov":"propagated","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Incoherent states are real in the same basis (diagonal entries are probabilities): INC is a strict subset of the real states, so every free state of coherence is also free for imaginarity - but not conversely (real off-diagonal states)."},{"uid":"QRT:SS15","branch":"QRT","native_id":"SS15","inputs":["QRT:sF-nlo"],"target":"QRT:sF-ctx","logic":"single","kind":"subset","kind_native":"subset","status":"theorem","polarity":"structural","year":2018,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Bell-local behaviors are exactly the noncontextual behaviors of Bell-type scenarios (spacelike contexts): the nonlocality free set embeds in the contextuality free set scenario-by-scenario. Operations caveat: NCW restricted to Bell scenarios differs from LOSR (P6)."},{"uid":"QRT:SS16","branch":"QRT","native_id":"SS16","inputs":["QRT:sF-ent"],"target":"QRT:sF-ste","logic":"single","kind":"subset","kind_native":"subset","status":"theorem","polarity":"structural","year":2007,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"SEP is a strict subset of the unsteerable states: every separable state admits an LHS model by construction; strictness by unsteerable entangled Werner states."},{"uid":"QRT:SS17","branch":"QRT","native_id":"SS17","inputs":["QRT:sF-ste"],"target":"QRT:sF-nlo","logic":"single","kind":"subset","kind_native":"subset","status":"theorem","polarity":"structural","year":2007,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Unsteerable is a strict subset of Bell-local: an LHS model is an LHV model with quantum states on one wing; strictness by steerable yet Bell-local states."},{"uid":"QRT:SS18","branch":"QRT","native_id":"SS18","inputs":["QRT:sF-asy"],"target":"QRT:sF-coh","logic":"single","kind":"equiv","kind_native":"equiv","status":"theorem","polarity":"structural","year":2016,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"State-level identification: U(1)-symmetric = incoherent in the (nondegenerate) energy eigenbasis. The free sets coincide; the MONOTONE sets do not (MM2) - same states, different theories."},{"uid":"QRT:SS19","branch":"QRT","native_id":"SS19","inputs":["QRT:d-ccdis"],"target":"QRT:sR-dis","logic":"single","kind":"member_resource","kind_native":"member_resource","status":"theorem","polarity":"possibility","year":2001,"year_prov":"cited","phase":"restructure","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Discordant separable states: inside the SEP free set of entanglement, yet discord resources - the inputs that the activation protocol (pU-dis) converts into distillable entanglement."},{"uid":"QRT:C1","branch":"QRT","native_id":"C1","inputs":["QRT:sR-coh"],"target":"QRT:sR-ent","logic":"single","kind":"converts_to","kind_native":"converts_to","status":"theorem","polarity":"possibility","year":2015,"year_prov":"cited","phase":"predict","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Faithful conversion: a state can be turned into an entangled one by incoherent operations iff it is coherent; max entanglement generated defines coherence monotones; E_r(output) <= C_r(input), achievable (generalized CNOT)."},{"uid":"QRT:C2","branch":"QRT","native_id":"C2","inputs":["QRT:sR-ent"],"target":"QRT:sR-coh","logic":"single","kind":"converts_to","kind_native":"converts_to","status":"theorem","polarity":"possibility","year":2016,"year_prov":"cited","phase":"predict","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Assisted frameworks: shared entanglement is consumed to create or localize coherence on the incoherent side; entanglement and coherence become interconvertible currencies in the intersection class p-lqicc."},{"uid":"QRT:C3","branch":"QRT","native_id":"C3","inputs":["QRT:sR-pur"],"target":"QRT:sR-coh","logic":"single","kind":"converts_to","kind_native":"converts_to","status":"theorem","polarity":"possibility","year":2018,"year_prov":"cited","phase":"predict","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Purity = maximal coherence achievable by unitaries (distance-based quantifiers coincide exactly); purity also upper-bounds the entanglement and discord producible by global unitaries - the P >= C_max >= E_max cascade (QP4)."},{"uid":"QRT:C5","branch":"QRT","native_id":"C5","inputs":["QRT:sR-coh"],"target":"QRT:sR-ath","logic":"single","kind":"bounds","kind_native":"bounds","status":"theorem","polarity":"structural","year":2015,"year_prov":"cited","phase":"predict","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Energy coherence is an athermality resource not captured by free energy: coherence modes evolve under independent constraints, coherence transfer manifests irreversibility beyond free energy, and work is locked in coherence (pX-ath)."},{"uid":"QRT:C6","branch":"QRT","native_id":"C6","inputs":["QRT:sR-asy"],"target":"QRT:pX-ath","logic":"single","kind":"irreversible","kind_native":"irreversible","status":"theorem","polarity":"no_go","year":2020,"year_prov":"cited","phase":"falsify","rule":"R14 close (no-go)","removed":false,"step_first":null,"step_last":null,"text":"The asymmetry resource feeds the no-go: coherence cost of ANY state under thermal processing = its QFI; distillable coherence = 0 for all full-rank states. The asymmetry sector of thermodynamics is maximally irreversible."},{"uid":"QRT:C7","branch":"QRT","native_id":"C7","inputs":["QRT:sR-dis"],"target":"QRT:sR-ent","logic":"single","kind":"activates","kind_native":"activates","status":"theorem","polarity":"possibility","year":2011,"year_prov":"cited","phase":"predict","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Activation: every nonclassically correlated (discordant) state, including separable ones, generates distillable entanglement with ancillas; relative entropy of quantumness = minimal distillable entanglement so generated."},{"uid":"QRT:C8","branch":"QRT","native_id":"C8","inputs":["QRT:sR-ent"],"target":"QRT:sR-nlo","logic":"single","kind":"converts_to","kind_native":"converts_to","status":"theorem","polarity":"possibility","year":2012,"year_prov":"cited","phase":"predict","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Entanglement is necessary for Bell violation; insufficient per copy (Werner/Barrett local models); but superactivatable: many copies of some Bell-local entangled states violate Bell inequalities. Every entangled state wins some semiquantum game (Buscemi)."},{"uid":"QRT:C9","branch":"QRT","native_id":"C9","inputs":["QRT:sR-ent"],"target":"QRT:sR-ste","logic":"single","kind":"converts_to","kind_native":"converts_to","status":"theorem","polarity":"possibility","year":2007,"year_prov":"cited","phase":"predict","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Strict hierarchy: steerable implies entangled, Bell-nonlocal implies steerable; both converses fail (Werner ranges). Steering requires BOTH entanglement (sR-ent) and incompatibility (sR-inc) jointly."},{"uid":"QRT:C10","branch":"QRT","native_id":"C10","inputs":["QRT:sR-mag"],"target":"QRT:sR-ctx","logic":"single","kind":"converts_to","kind_native":"converts_to","status":"theorem","polarity":"possibility","year":2014,"year_prov":"cited","phase":"predict","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Contextuality is necessary and (for odd prime d) sufficient for magic-state distillability: nonzero mana implies KS-contextuality w.r.t. stabilizer measurements. Multiqubit case obstructed by state-independent contextuality (QG1)."},{"uid":"QRT:C11","branch":"QRT","native_id":"C11","inputs":["QRT:sR-nga"],"target":"QRT:sR-ctx","logic":"single","kind":"equiv","kind_native":"equiv","status":"theorem","polarity":"structural","year":2022,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"CV: Wigner negativity iff contextuality (continuous-variable scenario), closing the CV side of the magic-contextuality correspondence."},{"uid":"QRT:C12","branch":"QRT","native_id":"C12","inputs":["QRT:sR-coh"],"target":"QRT:sR-mag","logic":"single","kind":"bounds","kind_native":"bounds","status":"partial","polarity":"structural","year":2018,"year_prov":"cited","phase":"predict","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Coherence is necessary for magic (every nonstabilizer state is coherent in every stabilizer eigenbasis - a stabilizer-diagonal state is a STAB mixture) but radically insufficient (|+>, SS4). No faithful conversion protocol known - QG5."},{"uid":"QRT:C13","branch":"QRT","native_id":"C13","inputs":["QRT:sR-ima"],"target":"QRT:pU-ima","logic":"single","kind":"enables","kind_native":"enables","status":"theorem","polarity":"possibility","year":2021,"year_prov":"cited","phase":"predict","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Imaginarity powers local discrimination: an ENT-free task (discriminating real orthogonal product states) separates imaginarity-free from imaginarity-resourced agents - a cross-theory witness."},{"uid":"QRT:C14","branch":"QRT","native_id":"C14","inputs":["QRT:sR-ath"],"target":"QRT:pU-ath","logic":"single","kind":"enables","kind_native":"enables","status":"theorem","polarity":"possibility","year":2013,"year_prov":"cited","phase":"predict","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Second laws: the Renyi free energies govern deterministic work extraction and state interconversion for block-diagonal states."},{"uid":"QRT:C15","branch":"QRT","native_id":"C15","inputs":["QRT:sR-ent"],"target":"QRT:pU-ath","logic":"single","kind":"enables","kind_native":"enables","status":"theorem","polarity":"possibility","year":2015,"year_prov":"cited","phase":"predict","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Correlations store work: extractable work from correlated states exceeds that from their marginals; entanglement maximizes the single-shot gain - an entanglement resource spent in the thermodynamic task node."},{"uid":"QRT:C16","branch":"QRT","native_id":"C16","inputs":["QRT:sR-coh"],"target":"QRT:pU-coh","logic":"single","kind":"enables","kind_native":"enables","status":"theorem","polarity":"possibility","year":2016,"year_prov":"cited","phase":"predict","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Every coherent state has distillable coherence C_r > 0 under IO (no bound coherence); cost is C_f >= C_r. The resource is spent faithfully: distillation succeeds for ALL resource states - rare among the 13 theories (QP3)."},{"uid":"QRT:C16b","branch":"QRT","native_id":"C16b","inputs":["QRT:sR-coh"],"target":"QRT:pX-coh","logic":"single","kind":"irreversible","kind_native":"irreversible","status":"theorem","polarity":"no_go","year":2015,"year_prov":"cited","phase":"falsify","rule":"R14 close (no-go)","removed":false,"step_first":null,"step_last":null,"text":"The same resource hits the wall: C_f > C_r generically, so an IO distill-dilute cycle loses coherence; par is restored only under asymptotically-MIO (Stein-lemma regime, MM11)."},{"uid":"QRT:C17","branch":"QRT","native_id":"C17","inputs":["QRT:sR-mag"],"target":"QRT:pX-mag","logic":"single","kind":"irreversible","kind_native":"irreversible","status":"partial","polarity":"no_go","year":2012,"year_prov":"cited","phase":"falsify","rule":"R14 close (no-go)","removed":false,"step_first":null,"step_last":null,"text":"Magic is asymptotically irreversible under stabilizer protocols: maximal-mana state classes exist that do not interconvert at unit rate; Wigner-positive magic cannot be distilled at all."},{"uid":"QRT:C18","branch":"QRT","native_id":"C18","inputs":["QRT:p-cat"],"target":"QRT:pU-ent","logic":"single","kind":"enables","kind_native":"enables","status":"theorem","polarity":"possibility","year":1999,"year_prov":"cited","phase":"predict","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Catalysis changes the pre-order: entanglement catalysis (LOCC + returned catalyst) enables otherwise impossible pure-state conversions; catalytic coherence enables repeated coherence use; a candidate route around pX-ent via entanglement batteries (QG9)."},{"uid":"QRT:C19","branch":"QRT","native_id":"C19","inputs":["QRT:sR-inc"],"target":"QRT:sR-ste","logic":"single","kind":"converts_to","kind_native":"converts_to","status":"theorem","polarity":"possibility","year":2014,"year_prov":"cited","phase":"predict","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Incompatibility converts to steering: measuring an incompatible set on one half of a maximally entangled state produces a steerable assemblage, and every steerable assemblage arises this way (the constructive direction of SS10)."},{"uid":"QRT:P1","branch":"QRT","native_id":"P1","inputs":["QRT:pF-nlo"],"target":"QRT:pF-ste","logic":"single","kind":"subset","kind_native":"subset","status":"theorem","polarity":"structural","year":2015,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Operation ladder, first rung: LOSR is a strict subset of 1W-LOCC (adding one-way communication from the trusted wing)."},{"uid":"QRT:P1b","branch":"QRT","native_id":"P1b","inputs":["QRT:pF-ste"],"target":"QRT:pF-ent","logic":"single","kind":"subset","kind_native":"subset","status":"theorem","polarity":"structural","year":2009,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Operation ladder, second rung: 1W-LOCC is a strict subset of LOCC; above LOCC the ladder continues through SEP-ops, PPT-ops, NE. Each rung changes which states count as equivalent resources."},{"uid":"QRT:P2","branch":"QRT","native_id":"P2","inputs":["QRT:pF-asy"],"target":"QRT:pF-coh","logic":"single","kind":"contains","kind_native":"contains","status":"theorem","polarity":"structural","year":2016,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"TIO (covariant for U(1)) is a strict subset of DIO; SIO < IO, DIO < MIO; IO and DIO incomparable: the coherence free-op lattice, with the symmetry-justified class at the bottom."},{"uid":"QRT:P3","branch":"QRT","native_id":"P3","inputs":["QRT:pF-ath"],"target":"QRT:pF-coh","logic":"single","kind":"contains","kind_native":"contains","status":"theorem","polarity":"structural","year":2015,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"TO are time-translation covariant AND Gibbs-preserving; GPO strictly exceeds TO because a Gibbs-preserving map can create energy coherence while TO (covariant) cannot. Whether TO = GPO intersect TIO exactly is QG2."},{"uid":"QRT:P4","branch":"QRT","native_id":"P4","inputs":["QRT:pF-pur"],"target":"QRT:pF-ath","logic":"single","kind":"specializes","kind_native":"specializes","status":"theorem","polarity":"structural","year":2015,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Noisy operations = thermal operations at trivial Hamiltonian; noisy subset of unital with the same induced state pre-order (majorization)."},{"uid":"QRT:P5","branch":"QRT","native_id":"P5","inputs":["QRT:p-lqicc"],"target":"QRT:pF-ent","logic":"single","kind":"contains","kind_native":"contains","status":"theorem","polarity":"structural","year":2016,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"LQICC/LICC = LOCC with one or both labs restricted to incoherent local processing: the intersection class in which the ENT-COH exchange rates (C1, C2) are formulated."},{"uid":"QRT:P6","branch":"QRT","native_id":"P6","inputs":["QRT:pF-ctx"],"target":"QRT:pF-nlo","logic":"single","kind":"distinct","kind_native":"distinct","status":"theorem","polarity":"no_go","year":2024,"year_prov":"cited","phase":"falsify","rule":"R14 close (no-go)","removed":false,"step_first":null,"step_last":null,"text":"Noncontextual wirings restricted to Bell scenarios are NOT equivalent to LOSR: the two candidate unifications of 'classical operations' disagree, leaving the correct common free-op class open (QG3)."},{"uid":"QRT:P7","branch":"QRT","native_id":"P7","inputs":["QRT:pF-inc"],"target":"QRT:pF-ste","logic":"single","kind":"equiv","kind_native":"equiv","status":"partial","polarity":"structural","year":2015,"year_prov":"cited","phase":"reduce","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Via the steering-incompatibility correspondence, incompatibility-non-increasing pre/post-processing maps onto the 1W-LOCC structure of steering (channel-state duality on assemblages)."},{"uid":"QRT:P8","branch":"QRT","native_id":"P8","inputs":["QRT:p-rng"],"target":"QRT:pX-ent","logic":"single","kind":"bounds","kind_native":"bounds","status":"theorem","polarity":"structural","year":2023,"year_prov":"cited","phase":"predict","rule":"R14 close (structural)","removed":false,"step_first":null,"step_last":null,"text":"Reversibility is class-sensitive: exact NE -> irreversible (pX-ent); asymptotically NE -> reversible at E_r^infinity (MM11). The pair pinpoints the exact/asymptotic frontier as the load-bearing axiom (QG4)."},{"uid":"QRT:W1","branch":"QRT","native_id":"W1","inputs":["QRT:F-CONVEX"],"target":"QRT:w-hahn","logic":"single","kind":"implies","kind_native":"implies","status":"theorem","polarity":"possibility","year":2019,"year_prov":"cited","phase":"predict","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Convexity axiom -> witness layer: every resource state of every convex closed theory is linearly witnessed."},{"uid":"QRT:W2","branch":"QRT","native_id":"W2","inputs":["QRT:w-robust"],"target":"QRT:t-discrim","logic":"single","kind":"witness","kind_native":"witness","status":"theorem","polarity":"possibility","year":2019,"year_prov":"cited","phase":"observe","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Generalized robustness = exact maximal advantage in subchannel discrimination; universal across convex theories (entanglement, coherence, magic explicitly included)."},{"uid":"QRT:W3","branch":"QRT","native_id":"W3","inputs":["QRT:wD-nlo"],"target":"QRT:wQ-nlo","logic":"single","kind":"distinct","kind_native":"distinct","status":"theorem","polarity":"no_go","year":2020,"year_prov":"cited","phase":"falsify","rule":"R14 close (no-go)","removed":false,"step_first":null,"step_last":null,"text":"Witnessing is not quantifying: the degrees of violation of all facet Bell inequalities suffice to DETECT nonclassicality but do not determine the LOSR convertibility pre-order."},{"uid":"QRT:W4","branch":"QRT","native_id":"W4","inputs":["QRT:wD-ste"],"target":"QRT:sR-ste","logic":"single","kind":"witness","kind_native":"witness","status":"theorem","polarity":"possibility","year":2015,"year_prov":"cited","phase":"observe","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"LHS membership is SDP-testable; steering inequalities import one-to-one from joint-measurability criteria (SS10)."},{"uid":"QRT:W5","branch":"QRT","native_id":"W5","inputs":["QRT:wQ-asy"],"target":"QRT:sR-asy","logic":"single","kind":"witness","kind_native":"witness","status":"theorem","polarity":"possibility","year":2016,"year_prov":"cited","phase":"observe","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"QFI witnesses and quantifies asymmetry; quantum speed limits reinterpreted as asymmetry monotone bounds; QFI = thermal coherence cost (operational meaning via pX-ath)."},{"uid":"QRT:W6","branch":"QRT","native_id":"W6","inputs":["QRT:wQ-inc"],"target":"QRT:sR-inc","logic":"single","kind":"witness","kind_native":"witness","status":"theorem","polarity":"possibility","year":2020,"year_prov":"cited","phase":"observe","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"The guessing-game family with post-measurement information is a COMPLETE monotone set: it decides device convertibility, not just detection."},{"uid":"QRT:W7","branch":"QRT","native_id":"W7","inputs":["QRT:wQ-ath"],"target":"QRT:sR-ath","logic":"single","kind":"witness","kind_native":"witness","status":"theorem","polarity":"possibility","year":2015,"year_prov":"cited","phase":"observe","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"The F_alpha family is complete for block-diagonal athermality; the coherent sector needs asymmetry-mode witnesses in addition - the axiom factorization visible at witness level (MM3)."},{"uid":"QRT:W8","branch":"QRT","native_id":"W8","inputs":["QRT:wD-ima"],"target":"QRT:sR-ima","logic":"single","kind":"witness","kind_native":"witness","status":"theorem","polarity":"possibility","year":2021,"year_prov":"cited","phase":"observe","rule":"R14 close (possibility)","removed":false,"step_first":null,"step_last":null,"text":"Th :12,"falsify":5,"calibrate":0,"reduce":2,"total":52},{"decade":2000,"observe":16,"deficit":1,"hypothesize":16,"restructure":20,"predict":19,"falsify":12,"calibrate":0,"reduce":5,"total":89},{"decade":2010,"observe":47,"deficit":7,"hypothesize":55,"restructure":38,"predict":35,"falsify":27,"calibrate":2,"reduce":24,"total":235},{"decade":2020,"observe":12,"deficit":1,"hypothesize":6,"restructure":10,"predict":16,"falsify":9,"calibrate":0,"reduce":6,"total":60}],"hep_rules_by_year":[{"step":3,"id":"anomaly","year":1914,"rules":{"2":"○"}},{"step":1,"id":"qm","year":1925,"rules":{}},{"step":2,"id":"wigner","year":1926,"rules":{"1":"●","8":"●"}},{"step":4,"id":"fock","year":1927,"rules":{"2":"●","3":"●"}},{"step":5,"id":"qed","year":1927,"rules":{"2":"●","4":"●","9":"●"}},{"step":6,"id":"fermi","year":1934,"rules":{"2":"●","4":"●","5":"●","9":"●"}},{"step":7,"id":"muon","year":1937,"rules":{"2":"●","4":"●","5":"●","6":"○","8":"●","9":"●"}},{"step":9,"id":"ew","year":1954,"rules":{"2":"●","4":"●","7":"●","8":"●","9":"●"}},{"step":8,"id":"va","year":1956,"rules":{"2":"●","4":"●","5":"●","6":"●","9":"●"}},{"step":10,"id":"higgs","year":1964,"rules":{"2":"●","4":"●","9":"●"}},{"step":11,"id":"frontier","year":1998,"rules":{"2":"○","4":"●"}},{"step":12,"id":"sm","year":2012,"rules":{"4":"●","9":"●","10":"●"}}],"phases":["observe","deficit","hypothesize","restructure","predict","falsify","calibrate","reduce"],"provenance":{"EM":{"node:paragraph":102,"node:carried":17,"node:section":1,"route:paragraph":88,"route:carried":13,"route:propagated":20,"route:section":1},"HEP":{"node:node-years":76,"node:step":2,"route:step+endpoints":190,"route:endpoints":24},"GPT":{"node:edge":89,"node:project":3,"route:review-dated":4,"route:cited":148,"route:propagated":4},"QRT":{"node:edge":19,"node:node-ref":92,"node:project":5,"route:cited":77,"route:propagated":9}},"dating_rules":"Chronology: a calendar-year time index for every node and route of the EM, HEP, GPT and QRT branches,\nderived from the data (reference years, step years, paragraph texts) by explicit rules.\n\nRules (stated in the thesis, Chapter \"Evolution of the effect and resource networks\"):\n  GPT   edge year  = earliest year among its references (journal year in parentheses, arXiv YYMM id);\n                     refs that cite a review for a standard result are flagged 'review-dated';\n                     definitional / derived / elementary edges with no dated source get\n                     year = max(year of endpoints) once the endpoints are dated, else the project year 2026.\n        node year  = earliest year among its dated incident edges.\n  QRT   edge year  as GPT; node year = min(earliest node-reference year, earliest incident dated edge year).\n  HEP   node year  = first year in the node's 'years' field; fallback: start year of the first step it is drawn in.\n        route year = max(start year of its step, years of its endpoints).\n  EM    paragraph year = first year mentioned in the paragraph text, carried forward inside a section,\n                         fallback: start year of the section; node year = year of its first paragraph;\n                         route year = max(year of its paragraph, years of its inputs and target).\nEvery assignment records its provenance ('cited', 'review-dated', 'node-ref', 'step', 'paragraph', 'section', 'project', 'propagated').\n","counts":{"nodes":406,"routes":578,"concepts_shared":57,"V_collapsed_final":344,"glue_final":62,"project_nodes":8},"te_rules":["TE1 (arrival rule). A new node enters with its arrival routes, dated the same year; the mean degree at arrival is branch-specific (EM 1.45, HEP 3.00, GPT 1.20, QRT 0.75) and is the dominant term of E in the reader and the history (closure fractions 7% and 2%).","TE2 (closure rule). In the effect and resource networks a large share of routes are closures between nodes already present (GPT 44%, QRT 22%), with latencies of median 14 years (GPT) and 4 years (QRT): the census of open cells (R13) is worked off years after the nodes appear.","TE3 (preferential closure). Closure routes attach to nodes whose degree is above the mean degree of the nodes present (endpoint/present degree ratio GPT 2.86, QRT 1.71, EM 1.16; HEP has only 4 closures): the open cells closed first are those adjacent to the best-connected nodes.","TE4 (densification). On the year filtration E grows faster than V: E ∝ V^α with α = 1.40 (EM), 1.62 (HEP), 1.47 (GPT), 1.30 (QRT); routes accumulate super-linearly in the node count.","TE5 (removal rule). Only the history branch removes items: 43 of 78 nodes and 111 of 214 routes of the Standard Model union are removed at some step (absorption into a successor model, R7/R10, or the final clustering); the reader and the effect networks are monotone.","TE6 (transfer rule). A concept shared by two branches appears in the second branch with a lag (median 8 years over the 56 dated shared concepts; GPT precedes QRT in 23 of 40 GPT–QRT concepts, QRT precedes in 8, 9 tie); glue identifications accumulate to 62 by 2026."],"philosophy":[["Popper (falsification)","a no-go or failed route: R12 fail in the reader (6 failed derivations in EM), the no_go polarity of R14 closures in the effect networks (the first incident edge of 17 of the 38 GPT model nodes is a pure no-go, 22 include one), and the anomaly steps of the history (R2 fires on an observable without a model edge)."],["Lakatos (research programmes)","nodes that survive every restructuring versus nodes that are replaced: in HEP the cluster nodes (0 of 6 removed) and the frames (1 of 4 removed) persist, while the fundamental model nodes (7 of 7), the effective and candidate models (3 of 3, 1 of 1) and the UIR state nodes (9 of 9) are absorbed; the effect networks never remove their 14 (GPT) and 6 (QRT) axiom nodes. The data distinguishes absorption by a successor (reduce) from refutation (falsify)."],["Kuhn (paradigm change)","restructuring events in the state layer: R1/R3 partition-extend and backedges (the Hilbert → Fock → UIR re-partition of HEP in 1926–1939; the free/resource partitions of QRT), counted in the restructure phase, rather than the accumulation of routes."],["Duhem–Quine (holism)","AND routes: 113 of 116 EM derivations and 5 of 6 failed EM routes have two or more inputs (model and state jointly), and 28 of 87 HEP state→model routes are AND routes with occupation numbers; a failed AND route cannot by itself locate the faulty input."],["Hempel (explanation)","an M→O route into an effect: the explanation lag measures the years between an effect's first appearance and its first model edge (GPT: 7 of 13 effects have one; mean lag 11.7 y, Bell nonlocality 26 y, Kirkwood–Dirac family 55 y; 4 explained in their first year). HEP predictions are all single M→O routes (44 of 44)."],["Carnap / Reichenbach (reduction; discovery vs justification)","reduce routes (lineage, subset, equiv, specializes, contains) collapse a cluster into its successor; the status field of a route records justification, its year records discovery."]]}</script>

const D = JSON.parse(document.getElementById('data').textContent);

const byUid = {}; D.nodes.forEach(n => byUid[n.uid] = n);

const conceptOf = {}; D.concepts.forEach(c => c.members.forEach(u => conceptOf[u] = c));

let state = {view:'timeline', T: YEARS[YEARS.length-1], sel:null, q:'', zoom:'all', branches:{EM:true,HEP:true,GPT:true,QRT:true}, showRemoved:false, playing:false, glue:true};
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function rich(s){return esc(s).replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/_\{([^}]*)\}/g,'<sub>$1</sub>');}
function present(n, T){ if(!state.branches[n.branch]) return false; if(n.year > T) return false; if(n.removed && n.removal_year < T && !state.showRemoved) return false; return true; } // a removed item is present for year <= T <= removal_year
function presentR(r, T){ if(!state.branches[r.branch]) return false; if(r.year > T) return false; if(r.removed && r.removal_year < T && !state.showRemoved) return false; return true; }
function countsAt(T){
  const c = {V:0,S:0,M:0,O:0,E:0}; FOUR.forEach(b => { c[b]={V:0,S:0,M:0,O:0,E:0}; });
  D.nodes.forEach(n => { if(present(n,T)){ c.V++; c[n.layer]++; c[n.branch].V++; c[n.branch][n.layer]++; } });
  D.routes.forEach(r => { if(presentR(r,T)){ c.E++; c[r.branch].E++; } });
  const pm = {}; D.nodes.forEach(n => { if(n.concept && present(n,T)) pm[n.concept] = (pm[n.concept]||0)+1; });
  c.glue = 0; c.shared = 0; Object.values(pm).forEach(k => { if(k>=2){ c.glue += k-1; c.shared++; } });
  c.Vc = c.V - c.glue; return c;
}
document.getElementById('counts').textContent = `${D.counts.nodes} nodes · ${D.counts.routes} routes · ${D.counts.concepts_shared} shared concepts · ${YEARS[0]}–${YEARS[YEARS.length-1]}`;
function nav(){
  const n = document.getElementById('nav'); n.innerHTML = '';
  const mk = (label, on, fn) => { const b = document.createElement('button'); b.textContent = label; if(on) b.className='on'; b.onclick = fn; n.appendChild(b); return b; };
  [['timeline','Timeline'],['snapshot','Snapshot'],['growth','Growth laws'],['concepts','Shared concepts'],['rules','Update rules'],['method','Method & philosophy'],['about','About']].forEach(([v,l]) => mk(l, state.view===v, () => { state.view=v; render(); }));
  const inp = document.createElement('input'); inp.placeholder = 'search label / id'; inp.value = state.q; inp.style.cssText='border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;min-width:160px;background:var(--chip);color:var(--ink)';
  inp.oninput = e => { state.q = e.target.value.toLowerCase(); render(); }; n.appendChild(inp);
}
let timer = null;
function ctl(){
  const c = document.getElementById('ctl'); c.innerHTML = '';

  h += `<p>Every route of the four branches is attributed to an update rule of the grand network (Part I of the thesis) and to a method phase. Readers (EM): R11 derive / R12 fail. History (HEP): R1–R10 by the route kind (enters → R4 route; predicts → R2; calibrates → R9; backedge → R1/R3 partition-extend; lineage → R7/R10 absorb-cluster; subset → observable family). Effect and resource networks (GPT, QRT): R14 close, split by the polarity of the closing route, and R13 open cell. The tables count firings per decade (route years).</p>`;
  FOUR.forEach(b => { const rd = D.branches[b].rules_by_decade; const decs = Object.keys(rd).sort(); const rules = [...new Set(decs.flatMap(d => Object.keys(rd[d])))].sort();
    h += `<div class="k">${b}</div><div class="tw"><table><tr><th>rule</th>${decs.map(d=>`<th class="v">${d}s</th>`).join('')}<th class="v">total</th></tr>`;
    rules.forEach(rl => { let tot=0; h += `<tr><td>${esc(rl)}</td>${decs.map(d => { const v = rd[d][rl]||0; tot+=v; return `<td class="v">${v||''}</td>`; }).join('')}<td class="v">${tot}</td></tr>`; });
    h += '</table></div>'; });
  h += `<div class="k">Standard Model history: automatically detected rule firings on the year axis</div><div class="tw"><table><tr><th class="v">year</th><th class="v">step</th><th>id</th><th>rules (○ partial)</th></tr>`;
  D.hep_rules_by_year.forEach(r => { h += `<tr><td class="v"><a data-year="${r.year}">${r.year}</a></td><td class="v">${r.step}</td><td>${esc(r.id)}</td><td>${Object.entries(r.rules).sort((a,b)=>+a[0]-+b[0]).map(([k,v]) => 'R'+k+(v==='●'?'':'○')).join(', ')||'—'}</td></tr>`; });
  h += '</table></div>';
  h += `<div class="k">temporal growth rules (TE1–TE6) read off the data</div><ol>` + D.te_rules.map(t => `<li>${esc(t)}</li>`).join('') + '</ol></div>';
  main.innerHTML = h; wireLinks(main);
}
// ---------- method ----------
function renderMethod(){
  const main = document.getElementById('main'); let h = '<div class="view">';
  h += `<p>Method phases are assigned mechanically: a node arrival is an <i>observe</i> (O), <i>hypothesize</i> (M) or <i>restructure</i> (S) event; a route is assigned by its kind (derives, implies, enables, converts_to … → predict; failed, not_implies, forbids, violates … → falsify; enters, backedge, member, satisfies → restructure; frames, candidate, generates → hypothesize; lineage, subset, equiv, specializes, contains → reduce; calibrates → calibrate; witness, pairs → observe; open status → deficit). The table counts items per decade over the four branches.</p>`;
  h += `<div class="tw"><table><tr><th>decade</th>${D.phases.map(p=>`<th class="v">${p}</th>`).join('')}<th class="v">total</th></tr>`;
  D.merged_phases.forEach(r => { if(!r.total) return; h += `<tr><td>${r.decade}s</td>${D.phases.map(p=>`<td class="v">${r[p]||''}</td>`).join('')}<td class="v">${r.total}</td></tr>`; });
  h += '</table></div>';
  h += `<div class="k">philosophy of science, as graph operations</div><ul>` + D.philosophy.map(t => `<li><b>${esc(t[0])}</b> — ${esc(t[1])}</li>`).join('') + '</ul></div>';
  main.innerHTML = h;
}
function renderAbout(){
  let h = `<div class="view"><h3>About</h3><p>This page is generated by <code>gen_engine/page_evo.py</code> from <code>data/gen_evolution_network.json</code> and <code>out/evolution.json</code> (generated ${esc(D.generated)}). It places every node and route of the four branches on a calendar-year axis derived from the released data by explicit rules, and shows the merged four-branch evolutionary network.</p>`;
  h += `<div class="k">dating rules</div><pre style="white-space:pre-wrap;font-size:12px">${esc(D.dating_rules)}</pre>`;
  h += `<div class="k">provenance of the year index</div><div class="tw"><table><tr><th>branch</th><th>node years</th><th>route years</th></tr>`;
  FOUR.forEach(b => { const p = D.provenance[b]; h += `<tr><td>${b}</td><td>${Object.entries(p).filter(([k])=>k.startsWith('node:')).map(([k,v])=>k.slice(5)+' '+v).join(', ')}</td><td>${Object.entries(p).filter(([k])=>k.startsWith('route:')).map(([k,v])=>k.slice(6)+' '+v).join(', ')}</td></tr>`; });
  h += '</table></div>';
  h += `<div class="k">limitations</div><ul><li>Years are the earliest cited source in the data, not historical dates (e.g. Bell nonlocality is dated 1969 by its CHSH citation; Kochen–Specker contextuality 1990; Wigner negativity 1946 by Groenewold). The ordering of events is therefore the ordering of the sources used by the networks' authors.</li><li>${esc(D.counts.project_nodes)} nodes without any dated source are dated 2026 (project year) and flagged; they are excluded from lag statistics.</li><li>The HEP source is a thematic step sequence; years come from the nodes' own year fields; the final view (step 12) is placed at 2012. Removals are placed at the start year of the removing step, never before the item's own year.</li><li>Nothing here is a historical claim beyond the data; the thesis states every rule and every number is computed.</li></ul>`;
  h += `<div class="k">generation</div><p>The data files, the analysis code, the figures and this page were generated with the assistance of an AI model (Claude, Anthropic); the author retains responsibility for the content.</p></div>`;
  document.getElementById('main').innerHTML = h;
}
function render(){ nav(); ctl(); ({timeline:renderTimeline, snapshot:renderSnapshot, growth:renderGrowth, concepts:renderConcepts, rules:renderRules, method:renderMethod, about:renderAbout})[state.view](); const bk = document.getElementById('back'); if(bk) bk.onclick = () => { state.sel=null; render(); }; }
let rt = null; window.addEventListener('resize', () => { if(state.view==='timeline'){ clearTimeout(rt); rt = setTimeout(render, 150); } });
render();
</script>
