tep_last":4,"desc":"In the Poincaré-covariant theory mass is the eigenvalue of the Casimir operator P^{2}; it labels the representation rather than being a dynamical variable.","removal_step":5,"removal_year":1939,"concept_any":"mass"},{"uid":"HEP:o_s","branch":"HEP","native_id":"o_s","label":"Spin s / helicity h (Casimir W^{μ}W_{μ})","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1939,"year_prov":"node-years","concept":null,"removed":true,"step_first":2,"step_last":4,"desc":"The Pauli–Lubański Casimir gives spin for m > 0; for m = 0 the invariant is the helicity. Both are representation labels.","removal_step":5,"removal_year":1939,"concept_any":null},{"uid":"HEP:o_prod","branch":"HEP","native_id":"o_prod","label":"Particle production and decay","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1917,"year_prov":"node-years","concept":null,"removed":true,"step_first":3,"step_last":3,"desc":"(i) Emission and absorption of light, Einstein A and B coefficients (1917). (ii) β decay with a continuous electron spectrum (Chadwick 1914; Ellis & Wooster 1927); the electron is not a nuclear constituent. (iii) e^{+}e^{−} pairs created by γ rays (Anderson 1933; Blackett & Occhialini 1933). In each case the final state has a different number of particles than the initial one, which no node acting","removal_step":4,"removal_year":1927,"concept_any":"particle_decay"},{"uid":"HEP:s_e","branch":"HEP","native_id":"s_e","label":"e^{−}","layer":"S","sublayer":"S.sector","native_layer":"state","year":1897,"year_prov":"node-years","concept":"electron_field","removed":false,"step_first":4,"step_last":12,"desc":"Fock sector built on the electron UIR. The Dirac field ψ_{e} annihilates e^{−} and creates e^{+}, so the N-particle nodes count electrons and positrons together.","concept_any":"electron_field"},{"uid":"HEP:s_p","branch":"HEP","native_id":"s_p","label":"p","layer":"S","sublayer":"S.sector","native_layer":"state","year":1919,"year_prov":"node-years","concept":null,"removed":true,"step_first":4,"step_last":8,"desc":"Proton sector (Rutherford 1919). Treated as elementary in Fermi's theory; replaced by quark sectors at Step 9 (the proton is a bound state of the strong sector, which is outside this graph).","removal_step":9,"removal_year":1954,"concept_any":null},{"uid":"HEP:s_n","branch":"HEP","native_id":"s_n","label":"n","layer":"S","sublayer":"S.sector","native_layer":"state","year":1932,"year_prov":"node-years","concept":null,"removed":true,"step_first":4,"step_last":8,"desc":"Neutron sector (Chadwick 1932). Replaced by quark sectors at Step 9.","removal_step":9,"removal_year":1954,"concept_any":null},{"uid":"HEP:s_nu","branch":"HEP","native_id":"s_nu","label":"ν","layer":"S","sublayer":"S.sector","native_layer":"state","year":1930,"year_prov":"node-years","concept":null,"removed":true,"step_first":4,"step_last":6,"desc":"Neutrino sector as assumed from Pauli (1930) to 1962: a single massless species. Detected by Cowan & Reines (1956). Split into ν_{e} and ν_{μ} at Step 7.","removal_step":7,"removal_year":1937,"concept_any":null},{"uid":"HEP:s_g","branch":"HEP","native_id":"s_g","label":"γ","layer":"S","sublayer":"S.sector","native_layer":"state","year":1927,"year_prov":"node-years","concept":"photon","removed":false,"step_first":4,"step_last":12,"desc":"Photon sector: the quantized radiation field A_{μ} of Dirac (1927). Bosonic ladder: symmetrized N-photon states.","concept_any":"photon"},{"uid":"HEP:m_field","branch":"HEP","native_id":"m_field","label":"Quantum field on Fock space (a, a^{†})","layer":"M","sublayer":"M.frame","native_layer":"model","year":1927,"year_prov":"node-years","concept":"creation_annihilation","removed":false,"step_first":4,"step_last":12,"desc":"The field is the operator that adds or removes one quantum of a given UIR. The Fock space of a species is ⊕_{N} Sym^{N}H_{1} (bosons) or ⊕_{N} Λ^{N}H_{1} (fermions) (Fock 1932); spin–statistics proved by Fierz (1939) and Pauli (1940). The free Lagrangian L_{0} = ψ̄(iγ·∂ − m)ψ − ¼F_{μν}F^{μν} + … reproduces the UIR wave equations. With L_{int} = 0 the S-matrix is 1: no transitions.","concept_any":"creation_annihilation"},{"uid":"HEP:o_G","branch":"HEP","native_id":"o_G","label":"Decay width Γ (lifetime τ = ħ/Γ)","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1927,"year_prov":"node-years","concept":null,"removed":true,"step_first":4,"step_last":4,"desc":"The generic transition-rate observable. Dirac (1927) derived the rate formula later called Fermi's golden rule. Without an interaction term the rate is zero, so this family stays unexplained until Step 5.","removal_step":5,"removal_year":1927,"concept_any":null},{"uid":"HEP:o_sig","branch":"HEP","native_id":"o_sig","label":"Cross section σ, dσ/dΩ","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1937,"year_prov":"node-years","concept":"cross_section","removed":true,"step_first":4,"step_last":4,"desc":"The generic scattering observable, defined through S-matrix elements (Wheeler 1937; Heisenberg 1943; Dyson 1949). S = 1 for the free field.","removal_step":5,"removal_year":1937,"concept_any":"cross_section"},{"uid":"HEP:m_qed","branch":"HEP","native_id":"m_qed","label":"QED vertex −e ψ̄γ^{μ}ψ A_{μ}","layer":"M","sublayer":"M.fund","native_layer":"model","year":1927,"year_prov":"node-years","concept":"qed_interaction","removed":true,"step_first":5,"step_last":11,"desc":"Minimal coupling p → p − eA applied to the quantized fields gives the single interaction term −e ψ̄γ^{μ}ψA_{μ}. One vertex changes N_{γ} by ±1 and N_{e} by 0 (scattering) or ±2 (pair creation/annihilation). Renormalized to all orders by Tomonaga, Schwinger, Feynman and Dyson (1946–49). At Step 9 it is identified as the electromagnetic part of the SU(2)_{L}×U(1)_{Y} gauge interaction with e = g sin","removal_step":12,"removal_year":2012,"concept_any":"qed_interaction"},{"uid":"HEP:o_compton","branch":"HEP","native_id":"o_compton","label":"Compton scattering dσ/dΩ","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1923,"year_prov":"node-years","concept":null,"removed":true,"step_first":5,"step_last":8,"desc":"Compton (1923) measured the wavelength shift and intensity; the Klein–Nishina formula (1929), the first QED cross section from the Dirac equation, reproduces the angular distribution and the high-energy fall-off.","removal_step":9,"removal_year":1954,"concept_any":"compton"},{"uid":"HEP:o_pair","branch":"HEP","native_id":"o_pair","label":"e^{+}e^{−} pair production σ(γ → e^{+}e^{−})","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1932,"year_prov":"node-years","concept":null,"removed":true,"step_first":5,"step_last":5,"desc":"Dirac's hole theory (1930–31) implied an anti-electron; Anderson (1933) and Blackett & Occhialini (1933) observed it. The Bethe–Heitler cross section (1934) in the field of a nucleus follows from the QED vertex at order α^{3}.","removal_step":6,"removal_year":1934,"concept_any":null},{"uid":"HEP:o_ae","branch":"HEP","native_id":"o_ae","label":"Electron anomaly a_{e} = (g−2)/2","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1947,"year_prov":"node-years","concept":"anomalous_moment","removed":false,"step_first":5,"step_last":12,"desc":"Kusch & Foley (1948) found g = 2(1.00119 ± 0.00005). Schwinger (1948) computed the one-loop value α/2π. Today a_{e} is known to ~10^{−13} and agrees with the five-loop QED calculation (PDG).","concept_any":"anomalous_moment"},{"uid":"HEP:o_lamb","branch":"HEP","native_id":"o_lamb","label":"Lamb shift 2S_{1/2} − 2P_{1/2}","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1947,"year_prov":"node-years","concept":"lamb_shift","removed":true,"step_first":5,"step_last":5,"desc":"Lamb & Retherford (1947) measured a splitting of about 1000 MHz that the Dirac equation sets to zero; Bethe (1947) obtained ≈1040 MHz from the electron self-energy with a nonrelativistic cut-off. The modern value is 1057.8 MHz.","removal_step":6,"removal_year":1947,"concept_any":"lamb_shift"},{"uid":"HEP:o_alpha","branch":"HEP","native_id":"o_alpha","label":"Fine-structure constant α ≈ 1/137.036","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1916,"year_prov":"node-years","concept":"fine_structure_constant","removed":false,"step_first":5,"step_last":12,"desc":"The coupling in the QED vertex is not predicted; α is measured (today most precisely from a_{e} and atom-recoil experiments) and fixes e. Calibration edge.","concept_any":"fine_structure_constant"},{"uid":"HEP:o_beta","branch":"HEP","native_id":"o_beta","label":"β-decay rate and spectrum shape","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1914,"year_prov":"node-years","concept":null,"removed":false,"step_first":5,"step_last":12,"desc":"Chadwick (1914) found the β spectrum continuous; Ellis & Wooster (1927) showed the energy is really missing. Fermi's node gives the rate and the shape (Kurie et al. 1936) from phase space × |M|^{2}.","concept_any":null},{"uid":"HEP:m_fermi","branch":"HEP","native_id":"m_fermi","label":"Fermi contact term G_{F}(p̄γ^{μ}n)(ēγ_{μ}ν)","layer":"M","sublayer":"M.eff","native_layer":"model","year":1934,"year_prov":"node-years","concept":null,"removed":true,"step_first":6,"step_last":7,"desc":"Fermi copied the structure of the QED vertex: a nucleon current in place of the electron current and the created pair (e, ν̄) in place of the emitted photon. Gamow & Teller (1936) added axial-vector/tensor terms for ΔJ = 1 transitions. G_{F} ≈ 1.166×10^{−5} GeV^{−2} is dimensionful; the amplitude grows like G_{F}s and partial-wave unitarity fails at √s of order a few hundred GeV (textbook argument","removal_step":8,"removal_year":1956,"concept_any":null},{"uid":"HEP:o_ntau","branch":"HEP","native_id":"o_ntau","label":"Neutron lifetime τ_{n} ≈ 878 s","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1951,"year_prov":"node-years","concept":null,"removed":true,"step_first":6,"step_last":8,"desc":"Free-neutron decay n → p e ν̄ was expected once m_{n} > m_{p} + m_{e} was established (Chadwick & Goldhaber 1935) and first measured by Robson (1951). Current value 878.4 ± 0.5 s (PDG 2024).","removal_step":9,"removal_year":1954,"concept_any":null},{"uid":"HEP:o_GF","branch":"HEP","native_id":"o_GF","label":"Fermi constant G_{F} = 1.1664×10^{−5} GeV^{−2}","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1934,"year_prov":"node-years","concept":null,"removed":false,"step_first":6,"step_last":12,"desc":"The strength of the contact term is an input. From Step 9 on it is a derived combination g^{2}/(4√2 M_{W}^{2}), but still fixed by measurement (τ_{μ}).","concept_any":null},{"uid":"HEP:s_nue","branch":"HEP","native_id":"s_nue","label":"ν_{e}","layer":"S","sublayer":"S.sector","native_layer":"state","year":1962,"year_prov":"node-years","concept":null,"removed":false,"step_first":7,"step_last":12,"desc":"Electron-neutrino sector. In the SM as drawn it is massless and left-handed only (no right-handed state), which is what blocks a mass term at Step 11.","concept_any":null},{"uid":"HEP:s_mu","branch":"HEP","native_id":"s_mu","label":"μ","layer":"S","sublayer":"S.sector","native_layer":"state","year":1937,"year_prov":"node-years","concept":null,"removed":false,"step_first":7,"step_last":12,"desc":"Muon sector (Neddermeyer & Anderson 1937). Shown not to be Yukawa's strongly interacting meson by Conversi, Pancini & Piccioni (1947).","concept_any":null},{"uid":"HEP:s_num","branch":"HEP","native_id":"s_num","label":"ν_{μ}","layer":"S","sublayer":"S.sector","native_layer":"state","year":1962,"year_prov":"node-years","concept":null,"removed":false,"step_first":7,"step_last":12,"desc":"Muon-neutrino sector, distinguished from ν_{e} by Danby et al. (1962): neutrinos from π→μν produce μ, not e.","concept_any":null},{"uid":"HEP:m_mu","branch":"HEP","native_id":"m_mu","label":"Muon-decay contact term (G_{F}/√2)(ν̄_{μ}γ^{μ}μ)(ēγ_{μ}ν_{e})","layer":"M","sublayer":"M.eff","native_layer":"model","year":1947,"year_prov":"node-years","concept":null,"removed":true,"step_first":7,"step_last":7,"desc":"A second four-fermion node for μ → e ν̄_{e} ν_{μ} and for μ capture. The decisive fact is that one constant fits β decay, μ decay and μ capture (Puppi 1948; Klein 1948; Tiomno & Wheeler 1949; Lee, Rosenbluth & Yang 1949). τ_{μ}^{−1} = G_{F}^{2}m_{μ}^{5}/192π^{3} (with small corrections) makes τ_{μ} the most precise source of G_{F}.","removal_step":8,"removal_year":1956,"concept_any":null},{"uid":"HEP:o_mutau","branch":"HEP","native_id":"o_mutau","label":"Muon lifetime τ_{μ} = 2.197 μs","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1940,"year_prov":"node-years","concept":null,"removed":false,"step_first":7,"step_last":12,"desc":"The muon itself was unexpected (1937). Its lifetime, ~2.2 μs, is reproduced by the contact node with the β-decay value of G_{F}: the universality signal.","concept_any":null},{"uid":"HEP:o_michel","branch":"HEP","native_id":"o_michel","label":"Michel spectrum, ρ = ¾","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1950,"year_prov":"node-years","concept":null,"removed":true,"step_first":7,"step_last":8,"desc":"Michel (1950) parametrized the electron spectrum of μ decay by ρ; the measured ρ = 0.7518 ± 0.0026 (PDG) agrees with the V−A value ¾.","removal_step":9,"removal_year":1954,"concept_any":null},{"uid":"HEP:o_twonu","branch":"HEP","native_id":"o_twonu","label":"ν_{μ} ≠ ν_{e}","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1962,"year_prov":"node-years","concept":null,"removed":true,"step_first":7,"step_last":8,"desc":"Pontecorvo (1959) and Schwartz (1960) proposed the test; Danby et al. (1962) found that neutrinos from pion decay produce muons but no electrons. The observable is about the state layer: the ν sector is two sectors with separate currents (lepton-family conservation).","removal_step":9,"removal_year":1962,"concept_any":null},{"uid":"HEP:m_va","branch":"HEP","native_id":"m_va","label":"Universal V−A current–current (G_{F}/√2) J_{μ}J^{μ†}","layer":"M","sublayer":"M.eff","native_layer":"model","year":1958,"year_prov":"node-years","concept":null,"removed":true,"step_first":8,"step_last":8,"desc":"Feynman & Gell-Mann (1958) and Sudarshan & Marshak (1958) replaced the two contact nodes by one current–current term with vector-minus-axial currents. It fixes the Michel parameter ρ = ¾, the neutrino helicity −1 and the parity-violating asymmetries. The hadronic current carries |g_{A}/g_{V}| ≈ 1.27 and, after Cabibbo (1963), cos θ_{C}. Still dimensionful: an effective node.","removal_step":9,"removal_year":1958,"concept_any":null},{"uid":"HEP:o_wu","branch":"HEP","native_id":"o_wu","label":"Parity-violating asymmetries (^{60}Co; μ decay)","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1957,"year_prov":"node-years","concept":null,"removed":false,"step_first":8,"step_last":12,"desc":"Lee & Yang (1956) noted parity was untested in weak processes and proposed experiments. Wu et al. (1957) found the e^{−} emission of polarized ^{60}Co anti-correlated with the nuclear spin; Garwin et al. (1957) found the μ-decay asymmetry. A parity-conserving node cannot produce a pseudoscalar correlation ⟨J⟩·p_{e}.","concept_any":null},{"uid":"HEP:o_hel","branch":"HEP","native_id":"o_hel","label":"Neutrino helicity h(ν) = −1","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1958,"year_prov":"node-years","concept":null,"removed":true,"step_first":8,"step_last":8,"desc":"Measured through the circular polarization of the γ following K capture in ^{152}Eu. The result −1 is the V−A prediction (left-handed neutrino).","removal_step":9,"removal_year":1958,"concept_any":null},{"uid":"HEP:s_u","branch":"HEP","native_id":"s_u","label":"u","layer":"S","sublayer":"S.sector","native_layer":"state","year":1964,"year_prov":"node-years","concept":null,"removed":false,"step_first":9,"step_last":12,"desc":"Up-quark sector (Gell-Mann 1964; Zweig 1964; point-like constituents seen in deep inelastic scattering, SLAC 1969). Colour and the gluon sector are not drawn.","concept_any":null},{"uid":"HEP:s_d","branch":"HEP","native_id":"s_d","label":"d","layer":"S","sublayer":"S.sector","native_layer":"state","year":1964,"year_prov":"node-years","concept":null,"removed":false,"step_first":9,"step_last":12,"desc":"Down-quark sector. In the charged current it enters as the Cabibbo-rotated combination d' = cos θ_{C} d + sin θ_{C} s (Cabibbo 1963).","concept_any":null},{"uid":"HEP:s_W","branch":"HEP","native_id":"s_W","label":"W^{±}","layer":"S","sublayer":"S.sector","native_layer":"state","year":1983,"year_prov":"node-years","concept":null,"removed":false,"step_first":9,"step_last":12,"desc":"Charged weak boson sector, M_{W} ≈ 80.4 GeV. First observed at the CERN SPS collider (UA1, UA2, 1983).","concept_any":null},{"uid":"HEP:s_Z","branch":"HEP","native_id":"s_Z","label":"Z^{0}","layer":"S","sublayer":"S.sector","native_layer":"state","year":1983,"year_prov":"node-years","concept":null,"removed":false,"step_first":9,"step_last":12,"desc":"Neutral weak boson sector, M_{Z} ≈ 91.19 GeV (UA1/UA2 1983; LEP precision 1989–2000).","concept_any":null},{"uid":"HEP:m_cc","branch":"HEP","native_id":"m_cc","label":"Charged-current gauge vertex (g/√2) W^{+}_{μ} J^{μ}_{CC} + h.c.","layer":"M","sublayer":"M.fund","native_layer":"model","year":1961,"year_prov":"node-years","concept":null,"removed":true,"step_first":9,"step_last":11,"desc":"W exchange replaces the contact term. For q^{2} ≪ M_{W}^{2} the propagator reduces to 1/M_{W}^{2} and the V−A node is recovered with G_{F}/√2 = g^{2}/(8M_{W}^{2}): the effective node is the low-energy limit of this one (Weinberg 1979). Renormalizable in the spontaneously broken gauge theory ('t Hooft 1971; 't Hooft & Veltman 1972).","removal_step":12,"removal_year":2012,"concept_any":null},{"uid":"HEP:m_nc","branch":"HEP","native_id":"m_nc","label":"Neutral-current vertex (g/cosθ_{W}) Z_{μ} J^{μ}_{NC}","layer":"M","sublayer":"M.fund","native_layer":"model","year":1961,"year_prov":"node-years","concept":null,"removed":true,"step_first":9,"step_last":11,"desc":"The gauge group contains a neutral generator besides the photon; the Z couples to every fermion with strength fixed by T^{3}, Q and one new parameter sin^{2}θ_{W}. Observed by Gargamelle (1973), ten years after the prediction, and measured precisely at LEP/SLC.","removal_step":12,"removal_year":2012,"concept_any":null},{"uid":"HEP:m_gs","branch":"HEP","native_id":"m_gs","label":"Gauge self-interactions ⊃ WWγ, WWZ, WWWW, WWZZ","layer":"M","sublayer":"M.fund","native_layer":"model","year":1954,"year_prov":"node-years","concept":null,"removed":true,"step_first":9,"step_last":11,"desc":"The field strength of a non-abelian gauge field contains cubic and quartic terms (Yang & Mills 1954). In SU(2)_{L}×U(1)_{Y} they fix the trilinear WWγ and WWZ couplings, tested through e^{+}e^{−} → W^{+}W^{−} at LEP2 (1996–2000).","removal_step":12,"removal_year":2012,"concept_any":null},{"uid":"HEP:o_nc","branch":"HEP","native_id":"o_nc","label":"Neutral-current events, R_{ν} = σ(NC)/σ(CC)","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1973,"year_prov":"node-years","concept":null,"removed":false,"step_first":9,"step_last":12,"desc":"Hasert et al. (1973) observed ν_{μ}N → ν_{μ}X events (no outgoing muon) and one ν̄_{μ}e → ν̄_{μ}e event in the Gargamelle bubble chamber. The NC/CC ratios fix sin^{2}θ_{W}.","concept_any":null},{"uid":"HEP:o_mw","branch":"HEP","native_id":"o_mw","label":"M_{W} = 80.37 GeV","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1983,"year_prov":"node-years","concept":null,"removed":false,"step_first":9,"step_last":12,"desc":"Predicted from G_{F}, α and sin^{2}θ_{W}: M_{W}^{2} = πα/(√2 G_{F} sin^{2}θ_{W}) at tree level (≈78 GeV), ≈80.4 GeV with radiative corrections. Observed at the SPS in 1983. PDG 2024 average 80.369 ± 0.013 GeV (CDF 2022 value excluded from the average).","concept_any":null},{"uid":"HEP:o_mz","branch":"HEP","native_id":"o_mz","label":"M_{Z} = 91.19 GeV","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1983,"year_prov":"node-years","concept":null,"removed":false,"step_first":9,"step_last":12,"desc":"Tree-level relation M_{Z} = M_{W}/cos θ_{W}; observed in 1983 (UA1, UA2) and measured to 2 MeV at LEP.","concept_any":null},{"uid":"HEP:o_sw","branch":"HEP","native_id":"o_sw","label":"Weak mixing angle sin^{2}θ_{W} ≈ 0.23","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1973,"year_prov":"node-years","concept":null,"removed":true,"step_first":9,"step_last":9,"desc":"The one new parameter of the neutral current. Calibration edge: measured, not predicted.","removal_step":10,"removal_year":1973,"concept_any":null},{"uid":"HEP:o_nnu","branch":"HEP","native_id":"o_nnu","label":"Z width → N_{ν} = 2.984 ± 0.008","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1989,"year_prov":"node-years","concept":null,"removed":false,"step_first":9,"step_last":12,"desc":"The Z line shape gives the invisible width, i.e. the number of light neutrino sectors coupling to the Z: 2.9840 ± 0.0082 (LEP EWWG 2006). A model-layer prediction about the number of state-layer sectors.","concept_any":null},{"uid":"HEP:o_tgc","branch":"HEP","native_id":"o_tgc","label":"σ(e^{+}e^{−} → W^{+}W^{−}) and triple-gauge couplings","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1996,"year_prov":"node-years","concept":null,"removed":false,"step_first":9,"step_last":12,"desc":"The cross section involves ν exchange and the WWγ, WWZ vertices; the gauge cancellation between them is required for unitarity and was confirmed at LEP2.","concept_any":null},{"uid":"HEP:s_H","branch":"HEP","native_id":"s_H","label":"H","layer":"S","sublayer":"S.sector","native_layer":"state","year":2012,"year_prov":"node-years","concept":null,"removed":false,"step_first":10,"step_last":12,"desc":"Higgs-boson sector, m_{H} ≈ 125 GeV (ATLAS, CMS 2012). The scalar doublet Φ has one physical excitation after three components are absorbed by W^{±}, Z.","concept_any":null},{"uid":"HEP:m_hg","branch":"HEP","native_id":"m_hg","label":"Higgs–gauge |D_{μ}Φ|^{2} → M_{W} = gv/2, M_{Z} = M_{W}/cosθ_{W}","layer":"M","sublayer":"M.fund","native_layer":"model","year":1964,"year_prov":"node-years","concept":null,"removed":true,"step_first":10,"step_last":11,"desc":"A scalar doublet with vacuum value v breaks SU(2)_{L}×U(1)_{Y} → U(1)_{em}; three components become the longitudinal W^{±}, Z. The gauge-boson masses and the HWW, HZZ couplings follow from the same term, so the W and Z mass edges of Step 9 are now derived here (Englert & Brout 1964; Higgs 1964; Guralnik, Hagen & Kibble 1964; Weinberg 1967).","removal_step":12,"removal_year":2012,"concept_any":null},{"uid":"HEP:m_yuk","branch":"HEP","native_id":"m_yuk","label":"Yukawa couplings −y_{f} Φ f̄_{L}f_{R} + h.c. → m_{f} = y_{f}v/√2","layer":"M","sublayer":"M.fund","native_layer":"model","year":1967,"year_prov":"node-years","concept":null,"removed":true,"step_first":10,"step_last":11,"desc":"Gauge symmetry forbids direct masses for chiral fermions; the Yukawa term gives m_{f} = y_{f}v/√2 and an Hf̄f vertex proportional to m_{f}. The y_{f} are free parameters: the mass edges are calibrations, while the pattern of H → ττ, bb̄ rates relative to the gauge channels is a prediction.","removal_step":12,"removal_year":2012,"concept_any":null},{"uid":"HEP:m_pot","branch":"HEP","native_id":"m_pot","label":"Higgs potential V = −μ^{2}Φ^{†}Φ + λ(Φ^{†}Φ)^{2} → m_{H}^{2} = 2λv^{2}","layer":"M","sublayer":"M.fund","native_layer":"model","year":1964,"year_prov":"node-years","concept":null,"removed":true,"step_first":10,"step_last":11,"desc":"The potential fixes v^{2} = μ^{2}/λ and the physical scalar mass m_{H}^{2} = 2λv^{2}. The measured m_{H} fixes λ ≈ 0.13 (calibration); the trilinear coupling λ_{HHH} is then predicted but not yet measured, only bounded by di-Higgs searches.","removal_step":12,"removal_year":2012,"concept_any":null},{"uid":"HEP:o_mh","branch":"HEP","native_id":"o_mh","label":"Higgs mass m_{H} = 125.2 GeV","layer":"O","sublayer":"O.direct","native_layer":"observable","year":2012,"year_prov":"node-years","concept":null,"removed":false,"step_first":10,"step_last":12,"desc":"Existence predicted in 1964; discovered 2012. The value is an input that fixes λ = m_{H}^{2}/2v^{2} ≈ 0.13 (PDG 2024: 125.20 ± 0.11 GeV).","concept_any":null},{"uid":"HEP:o_hbr","branch":"HEP","native_id":"o_hbr","label":"Higgs rates σ×BR: γγ, ZZ^{*}, WW^{*}, ττ, bb̄","layer":"O","sublayer":"O.direct","native_layer":"observable","year":2012,"year_prov":"node-years","concept":null,"removed":false,"step_first":10,"step_last":12,"desc":"Production (gluon fusion, vector-boson fusion, VH) and decay rates relative to the SM expectation; all measured signal strengths are consistent with 1 within uncertainties (PDG 2024 review).","concept_any":null},{"uid":"HEP:o_mf","branch":"HEP","native_id":"o_mf","label":"Fermion masses m_{e}, m_{μ}, m_{u}, m_{d}","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1964,"year_prov":"step","concept":null,"removed":false,"step_first":10,"step_last":12,"desc":"The SM explains the mechanism of fermion mass but not the values: each mass fixes one Yukawa coupling. Calibration edges.","concept_any":null},{"uid":"HEP:o_lam","branch":"HEP","native_id":"o_lam","label":"Higgs self-coupling λ_{HHH}","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1964,"year_prov":"step","concept":null,"removed":false,"step_first":10,"step_last":12,"desc":"Di-Higgs production has not been observed; current limits constrain λ_{HHH}/λ_{SM} to roughly a window of order unity around the SM value (ATLAS/CMS, Run 2). A prediction awaiting its observable.","concept_any":null},{"uid":"HEP:m_numass","branch":"HEP","native_id":"m_numass","label":"Candidate: ν mass term (LΦ)(LΦ)/Λ or ν_{R} Yukawa","layer":"M","sublayer":"M.cand","native_layer":"model","year":1977,"year_prov":"node-years","concept":null,"removed":true,"step_first":11,"step_last":11,"desc":"Two repairs are available in the literature. (i) The dimension-5 operator (LΦ)(LΦ)/Λ uses only existing sectors and gives Majorana masses m_{ν} ~ v^{2}/Λ (Weinberg 1979). (ii) New right-handed sectors ν_{R} with Dirac Yukawa couplings, possibly with Majorana masses M_{R} (seesaw: Minkowski 1977; Gell-Mann, Ramond & Slansky 1979; Yanagida 1979; Mohapatra & Senjanović 1980). Current data do not deci","removal_step":12,"removal_year":2012,"concept_any":null},{"uid":"HEP:o_osc","branch":"HEP","native_id":"o_osc","label":"ν flavour oscillation: Δm^{2}_{21}, Δm^{2}_{31} ≠ 0","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1998,"year_prov":"node-years","concept":null,"removed":false,"step_first":11,"step_last":12,"desc":"Atmospheric ν_{μ} disappearance (Super-Kamiokande 1998), solar ν flavour change (SNO 2002) and reactor ν̄_{e} disappearance (KamLAND 2003) require non-degenerate neutrino masses. In the graph as built the ν sectors are massless (no right-handed state), so no Yukawa node reaches them: in-degree zero from the model layer.","concept_any":null},{"uid":"HEP:c_gf","branch":"HEP","native_id":"c_gf","label":"Gauge–fermion term Σ f̄ iγ^{μ}D_{μ} f ⊃ EM, CC, NC vertices","layer":"M","sublayer":"M.cluster","native_layer":"model","year":1961,"year_prov":"node-years","concept":null,"removed":false,"step_first":12,"step_last":12,"desc":"One term of the SM Lagrangian, written with the covariant derivative of SU(2)_{L}×U(1)_{Y}. Expanding D_{μ} gives exactly three vertex types: the electromagnetic vertex (Step 5), the charged current (Step 9) and the neutral current (Step 9). The three effective nodes of Steps 6–8 sit inside this cluster because the charged-current member reproduces them at q^{2} ≪ M_{W}^{2}; the matching condition","concept_any":"standard_model"},{"uid":"HEP:c_gg","branch":"HEP","native_id":"c_gg","label":"Gauge kinetic term −¼W^{a}_{μν}W^{aμν} − ¼B_{μν}B^{μν}","layer":"M","sublayer":"M.cluster","native_layer":"model","year":1954,"year_prov":"node-years","concept":null,"removed":false,"step_first":12,"step_last":12,"desc":"The Yang–Mills field strength contains the cubic and quartic self-couplings of the W and Z. No effective node was ever written for these vertices; they were predicted and then tested (LEP2).","concept_any":"standard_model"},{"uid":"HEP:c_hg","branch":"HEP","native_id":"c_hg","label":"Higgs–gauge term |D_{μ}Φ|^{2}","layer":"M","sublayer":"M.cluster","native_layer":"model","year":1964,"year_prov":"node-years","concept":null,"removed":false,"step_first":12,"step_last":12,"desc":"The gauge-covariant kinetic term of the scalar doublet. With ⟨Φ⟩ = v/√2 it produces the W and Z masses and the Higgs–gauge vertices.","concept_any":"standard_model"},{"uid":"HEP:c_yuk","branch":"HEP","native_id":"c_yuk","label":"Yukawa term −y_{f} f̄_{L}Φ f_{R} + h.c.","layer":"M","sublayer":"M.cluster","native_layer":"model","year":1967,"year_prov":"node-years","concept":null,"removed":false,"step_first":12,"step_last":12,"desc":"The only SM term that distinguishes the fermion generations; its couplings are inputs (calibration edges).","concept_any":"standard_model"},{"uid":"HEP:c_pot","branch":"HEP","native_id":"c_pot","label":"Higgs potential −V(Φ), V = −μ^{2}Φ^{†}Φ + λ(Φ^{†}Φ)^{2}","layer":"M","sublayer":"M.cluster","native_layer":"model","year":1964,"year_prov":"node-years","concept":null,"removed":false,"step_first":12,"step_last":12,"desc":"Fixes the vacuum value and the Higgs mass; the self-couplings it predicts are the least tested part of the model.","concept_any":"standard_model"},{"uid":"HEP:c_bsm","branch":"HEP","native_id":"c_bsm","label":"Beyond the SM: candidate ν-mass term","layer":"M","sublayer":"M.cluster","native_laye esource state is separated from F by a hyperplane: witnesses exist, and the generalized robustness R(rho) = min{s : (rho + s sigma)/(1+s) in F} is well defined.","concept_any":null},{"uid":"QRT:F-TENSOR","branch":"QRT","native_id":"F-TENSOR","label":"Tensor / monoidal axiom","layer":"M","sublayer":"M.axiom","native_layer":"model/framework","year":2012,"year_prov":"edge:SS11","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"F closed under tensor products and partial trace (symmetric monoidal structure of Coecke-Fritz-Spekkens). Prerequisite for asymptotic (many-copy) rates.","concept_any":null},{"uid":"QRT:F-STEIN","branch":"QRT","native_id":"F-STEIN","label":"Generalized Stein lemma / second law","layer":"M","sublayer":"M.axiom","native_layer":"model/framework","year":2015,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"For F satisfying the Brandao-Plenio axioms, the Stein exponent of resource testing equals the regularized relative entropy of resource; consequence: asymptotic reversibility under asymptotically resource-non-generating operations, with the regularized relative entropy as the unique 'entropy'. History: claimed 2010, proof gap found 2023 (Berta et al., Quantum 7, 1103 (2023) [verify page]), proven 2","concept_any":null},{"uid":"QRT:F-ADV","branch":"QRT","native_id":"F-ADV","label":"Universal operational advantage","layer":"M","sublayer":"M.axiom","native_layer":"model/framework","year":2019,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"In any convex QRT, every resource state strictly outperforms all free states in some (sub)channel discrimination task, and the generalized robustness is the exact maximal advantage. Extended beyond convexity via multi-copy discrimination.","concept_any":null},{"uid":"QRT:F-TYPE","branch":"QRT","native_id":"F-TYPE","label":"QP1: typology of free operations","layer":"M","sublayer":"M.axiom","native_layer":"model/framework","year":2015,"year_prov":"edge:MM3","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"DERIVED classification. The 12 proper theories split by the physical justification of O: symmetry-type (asymmetry; unspeakable coherence; imaginarity as antiunitary Z2 analogue), subtheory-type (magic, CV non-Gaussianity), partition-type (entanglement, steering, nonlocality, contextuality, incompatibility), constraint-type (purity, athermality). Athermality is the unique two-type intersection, mir","concept_any":null},{"uid":"QRT:p-lqicc","branch":"QRT","native_id":"p-lqicc","label":"LQICC / LICC (ENT x COH)","layer":"M","sublayer":"M.process","native_layer":"process_cptp/framework","year":2016,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Intersection classes (local quantum-incoherent operations and classical communication): the arena in which entanglement and coherence are interconverted and assisted-distilled.","concept_any":null},{"uid":"QRT:p-cat","branch":"QRT","native_id":"p-cat","label":"Catalysis","layer":"M","sublayer":"M.process","native_layer":"process_cptp/framework","year":1999,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Catalysts enlarge the reachable set in many theories: entanglement catalysis (Jonathan-Plenio), catalytic coherence (Aberg), catalytic thermodynamics; a cross-theory phenomenon of the operations layer and a candidate route around exact-RNG irreversibility (entanglement battery, QG9).","concept_any":null},{"uid":"QRT:p-rng","branch":"QRT","native_id":"p-rng","label":"Maximal (RNG) classes","layer":"M","sublayer":"M.process","native_layer":"process_cptp/framework","year":2019,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"NE (entanglement), MIO (coherence), GPO (athermality), CSPO-type (magic), covariant (asymmetry), unital (purity). Reversibility statements live here and are class-sensitive: exact vs asymptotic non-generation is the load-bearing distinction.","concept_any":null},{"uid":"QRT:w-hahn","branch":"QRT","native_id":"w-hahn","label":"Witness existence (Hahn-Banach)","layer":"O","sublayer":"O.witness","native_layer":"witness/framework","year":2019,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Convexity + closedness of F implies every resource state is detected by some linear witness. The convexity axiom translated to the witness layer.","concept_any":null},{"uid":"QRT:w-robust","branch":"QRT","native_id":"w-robust","label":"Robustness = discrimination advantage","layer":"O","sublayer":"O.witness","native_layer":"witness/framework","year":2019,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Generalized robustness is exactly the maximal advantage of a resource state over all free states in a class of subchannel discrimination tasks - one witness/task pair that every convex theory instantiates.","concept_any":null},{"uid":"QRT:t-discrim","branch":"QRT","native_id":"t-discrim","label":"Channel discrimination (universal task)","layer":"O","sublayer":"O.witness","native_layer":"witness/framework","year":2015,"year_prov":"node-ref","concept":"discrimination","removed":false,"step_first":null,"step_last":null,"desc":"The universal task: every resource of every convex theory buys a strict advantage here; steering's version is subchannel discrimination with 1W-LOCC measurements.","concept_any":"discrimination"},{"uid":"QRT:m-pur","branch":"QRT","native_id":"m-pur","label":"Constraint: no purity source","layer":"M","sublayer":"M.model","native_layer":"model/model","year":2015,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Constraint-type model: the only free state is the maximally mixed one; free ops = noisy operations; state pre-order = majorization; equivalent to athermality with trivial Hamiltonian.","concept_any":null},{"uid":"QRT:m-ath","branch":"QRT","native_id":"m-ath","label":"Gibbs constraint x U(1) covariance","layer":"M","sublayer":"M.model","native_layer":"model/model","year":2013,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Constraint x symmetry type: energy conservation (U(1)-covariance of TO) + unique full-rank fixed point gamma (Gibbs preservation). Block-diagonal sector governed by thermomajorization; coherent sector by asymmetry theory. The unique two-axiom intersection of the typology (QP1).","concept_any":null},{"uid":"QRT:m-asy","branch":"QRT","native_id":"m-asy","label":"G-covariance (reference frames)","layer":"M","sublayer":"M.model","native_layer":"model/model","year":2008,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Symmetry-type: group G acts by a unitary representation; free = invariant states; O = covariant channels. Monotone set strictly larger than speakable-coherence monotone set.","concept_any":null},{"uid":"QRT:m-coh","branch":"QRT","native_id":"m-coh","label":"Dephasing-defined (basis-relative)","layer":"M","sublayer":"M.model","native_layer":"model/model","year":2016,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"F = fixed points of the dephasing map Delta. Free-op zoo MIO > {IO, DIO} > SIO reflects the absence of a single physical justification (Marvian-Spekkens critique); TIO < DIO is the symmetry-justified subclass.","concept_any":null},{"uid":"QRT:m-ima","branch":"QRT","native_id":"m-ima","label":"Antiunitary Z2 (conjugation)","layer":"M","sublayer":"M.model","native_layer":"model/model","year":2018,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Z2 analogue of coherence with respect to an ANTIUNITARY (complex conjugation K): free = K-invariant states. Not a G-covariance theory in the usual sense because K is not a channel; free ops defined by real Kraus operators.","concept_any":null},{"uid":"QRT:m-mag","branch":"QRT","native_id":"m-mag","label":"Stabilizer subtheory (Gottesman-Knill)","layer":"M","sublayer":"M.model","native_layer":"model/model","year":2012,"year_prov":"node-ref","concept":"stabilizer_subtheory","removed":false,"step_first":null,"step_last":null,"desc":"Subtheory-type: the stabilizer subtheory is classically simulable; resource = whatever lies outside its convex hull. Odd d: distillation-relevant boundary characterized by discrete-Wigner positivity.","concept_any":"stabilizer_subtheory"},{"uid":"QRT:m-nga","branch":"QRT","native_id":"m-nga","label":"Gaussian subtheory (CV)","layer":"M","sublayer":"M.model","native_layer":"model/model","year":2012,"year_prov":"node-ref","concept":"gaussian_subtheory","removed":false,"step_first":null,"step_last":null,"desc":"Subtheory-type CV twin of magic: Gaussian subtheory simulable; Wigner negativity is the resource for CV quantum-computational advantage (positive Wigner implies efficient classical simulation).","concept_any":"gaussian_subtheory"},{"uid":"QRT:m-ent","branch":"QRT","native_id":"m-ent","label":"LOCC partition (two labs)","layer":"M","sublayer":"M.model","native_layer":"model/model","year":2009,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Partition-type: spatially separated labs; O = LOCC (classical communication allowed). Maximal class NE (non-entangling).","concept_any":null},{"uid":"QRT:m-ste","branch":"QRT","native_id":"m-ste","label":"One-sided trust (1W-LOCC)","layer":"M","sublayer":"M.model","native_layer":"model/model","year":2015,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Partition-type with asymmetric trust: one characterized (trusted) and one uncharacterized wing; O = one-way LOCC from the trusted wing.","concept_any":null},{"uid":"QRT:m-nlo","branch":"QRT","native_id":"m-nlo","label":"Common cause, no communication","layer":"M","sublayer":"M.model","native_layer":"model/model","year":2015,"year_prov":"edge:MM7","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Partition-type with no communication: resources are common-cause boxes; O = the polytope of LOSR wirings; classical/nonclassical defined by the causal model required.","concept_any":null},{"uid":"QRT:m-ctx","branch":"QRT","native_id":"m-ctx","label":"Compatibility structures (NCW)","layer":"M","sublayer":"M.model","native_layer":"model/model","year":2018,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Partition-type over compatibility structures: behaviors on measurement scenarios; O = noncontextual wirings; unifies KS contextuality and Bell nonlocality in one framework.","concept_any":null},{"uid":"QRT:m-inc","branch":"QRT","native_id":"m-inc","label":"Device programmability","layer":"M","sublayer":"M.model","native_layer":"model/model","year":2020,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Resource on measurement DEVICES, not states: incompatibility = quantum programmability of a classical-output device; complete convertibility conditions via discrimination with post-measurement information. Shows the QRT schema extends to dynamical objects.","concept_any":null},{"uid":"QRT:m-dis","branch":"QRT","native_id":"m-dis","label":"Fails convexity + golden rule","layer":"M","sublayer":"M.model","native_layer":"model/model","year":2012,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"FAILS two framework axioms: (i) the classical-state set is non-convex; (ii) local channels can create discord, so no golden-rule free-op class contains even local processing. Discord quantities remain meaningful but discord is not a QRT in the standard sense.","concept_any":null},{"uid":"QRT:sF-pur","branch":"QRT","native_id":"sF-pur","label":"I/d (unique free state)","layer":"S","sublayer":"S.free","native_layer":"state/free_state","year":2015,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The free set is the single state I/d - the smallest free set in the compilation, making purity the bottom currency: every other theory's free set contains it.","concept_any":null},{"uid":"QRT:sR-pur","branch":"QRT","native_id":"sR-pur","label":"Nonuniform states","layer":"S","sublayer":"S.resource","native_layer":"state/resource_state","year":2015,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Any rho != I/d is a resource. Pre-order: majorization (complete); asymptotic rate log d - S(rho); fully reversible with no bound resources - the benchmark reversible theory.","concept_any":null},{"uid":"QRT:sF-ath","branch":"QRT","native_id":"sF-ath","label":"Gibbs state gamma (unique)","layer":"S","sublayer":"S.free","native_layer":"state/free_state","year":2013,"year_prov":"node-ref","concept":"gibbs_state","removed":false,"step_first":null,"step_last":null,"desc":"Unique free state e^{-beta H}/Z: the only state that is both a fixed point of the Gibbs constraint AND U(1)-symmetric - the state-level shadow of the two-axiom intersection (QP1).","concept_any":"gibbs_state"},{"uid":"QRT:sR-ath","branch":"QRT","native_id":"sR-ath","label":"Athermal states","layer":"S","sublayer":"S.resource","native_layer":"state/resource_state","year":2013,"year_prov":"node-ref","concept":"athermal_states","removed":false,"step_first":null,"step_last":null,"desc":"Any rho != gamma. Block-diagonal sector ordered by thermomajorization; coherent sector constrained independently by asymmetry modes (neither family alone complete).","concept_any":"athermal_states"},{"uid":"QRT:sF-asy","branch":"QRT","native_id":"sF-asy","label":"Symmetric (G-invariant) states","layer":"S","sublayer":"S.free","native_layer":"state/free_state","year":2008,"year_prov":"node-ref","concept":"symmetric_states","removed":false,"step_first":null,"step_last":null,"desc":"U_g rho U_g^dag = rho for all g. For U(1) generated by H with nondegenerate spectrum: exactly the energy-incoherent states.","concept_any":"symmetric_states"},{"uid":"QRT:sR-asy","branch":"QRT","native_id":"sR-asy","label":"Asymmetric states (clocks/frames)","layer":"S","sublayer":"S.resource","native_layer":"state/resource_state","year":2016,"year_prov":"node-ref","concept":"asymmetric_states","removed":false,"step_first":null,"step_last":null,"desc":"[rho, H] != 0 for translations: unspeakable coherence. Quantified by the QFI family; pure-state asymmetry not captured by any single entropic measure.","concept_any":"asymmetric_states"},{"uid":"QRT:sF-coh","branch":"QRT","native_id":"sF-coh","label":"Incoherent (diagonal) states","layer":"S","sublayer":"S.free","native_layer":"state/free_state","year":2014,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Diagonal in the fixed reference basis: Delta(rho) = rho.","concept_any":null},{"uid":"QRT:sR-coh","branch":"QRT","native_id":"sR-coh","label":"Coherent states","layer":"S","sublayer":"S.resource","native_layer":"state/resource_state","year":2015,"year_prov":"edge:C1","concept":"coherent_states","removed":false,"step_first":null,"step_last":null,"desc":"Off-diagonal in the fixed basis; golden unit |+_d>. Every coherent state is distillable at rate C_r under IO - no bound coherence exists.","concept_any":"coherent_states"},{"uid":"QRT:sF-ima","branch":"QRT","native_id":"sF-ima","label":"Real states","layer":"S","sublayer":"S.free","native_layer":"state/free_state","year":2018,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Density matrices with real entries in the fixed basis (invariant under conjugation K).","concept_any":null},{"uid":"QRT:sR-ima","branch":"QRT","native_id":"sR-ima","label":"Imaginary states","layer":"S","sublayer":"S.resource","native_layer":"state/resource_state","year":2021,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"States with nonzero imaginary parts; golden unit (|0> + i|1>)/sqrt(2); qubit and pure-state conversion fully solved.","concept_any":null},{"uid":"QRT:sF-mag","branch":"QRT","native_id":"sF-mag","label":"STAB (stabilizer polytope)","layer":"S","sublayer":"S.free","native_layer":"state/free_state","year":2014,"year_prov":"node-ref","concept":"stabilizer_states","removed":false,"step_first":null,"step_last":null,"desc":"Convex hull of stabilizer states; classically simulable (Gottesman-Knill). Contains maximally entangled states (Bell, GHZ): free-of-magic is not free-of-entanglement.","concept_any":"stabilizer_states"},{"uid":"QRT:sR-mag","branch":"QRT","native_id":"sR-mag","label":"Magic (non-stabilizer) states","layer":"S","sublayer":"S.resource","native_layer":"state/resource_state","year":2005,"year_prov":"node-ref","concept":"magic_states","removed":false,"step_first":null,"step_last":null,"desc":"Outside STAB; golden unit T state. Odd d: mana > 0 iff discrete-Wigner-negative; Wigner-positive non-stabilizer states are BOUND magic (undistillable).","concept_any":"magic_states"},{"uid":"QRT:sF-nga","branch":"QRT","native_id":"sF-nga","label":"Wigner-positive states","layer":"S","sublayer":"S.free","native_layer":"state/free_state","year":2012,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Nonnegative CV Wigner function (resp. convex hull of Gaussians); positive-Wigner dynamics is classically simulable.","concept_any":null},{"uid":"QRT:sR-nga","branch":"QRT","native_id":"sR-nga","label":"Wigner-negative states","layer":"S","sublayer":"S.resource","native_layer":"state/resource_state","year":2018,"year_prov":"node-ref","concept":"wigner_negative","removed":false,"step_first":null,"step_last":null,"desc":"Negativity of the CV Wigner function; golden unit Fock |1>; necessary for CV computational advantage and equivalent to CV contextuality.","concept_any":"wigner_negative"},{"uid":"QRT:sF-ent","branch":"QRT","native_id":"sF-ent","label":"SEP (separable states)","layer":"S","sublayer":"S.free","native_layer":"state/free_state","year":2007,"year_prov":"edge:SS16","concept":"separable_states","removed":false,"step_first":null,"step_last":null,"desc":"Convex mixtures of product states. Deciding membership is NP-hard; witnesses complete by Hahn-Banach.","concept_any":"separable_states"},{"uid":"QRT:sR-ent","branch":"QRT","native_id":"sR-ent","label":"Entangled states","layer":"S","sublayer":"S.resource","native_layer":"state/resource_state","year":2007,"year_prov":"edge:C9","concept":"entangled_states","removed":false,"step_first":null,"step_last":null,"desc":"Outside SEP; golden unit ebit |Phi+>. E_D < E_C in general: bound entangled (PPT) states have E_D = 0 < E_C.","concept_any":"entangled_states"},{"uid":"QRT:sF-ste","branch":"QRT","native_id":"sF-ste","label":"LHS (unsteerable) assemblages","layer":"S","sublayer":"S.free","native_layer":"state/free_state","year":2007,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Assemblages admitting local-hidden-state models. Strictly between the neighbors: SEP < unsteerable < Bell-local, both inclusions strict (Werner ranges).","concept_any":null},{"uid":"QRT:sR-ste","branch":"QRT","native_id":"sR-ste","label":"Steerable assemblages","layer":"S","sublayer":"S.resource","native_layer":"state/resource_state","year":2007,"year_prov":"node-ref","concept":"epr_steering","removed":false,"step_first":null,"step_last":null,"desc":"No LHS model. Steering requires BOTH entanglement of the state and incompatibility of the untrusted measurements, jointly.","concept_any":"epr_steering"},{"uid":"QRT:sF-nlo","branch":"QRT","native_id":"sF-nlo","label":"Local (classical-cause) boxes","layer":"S","sublayer":"S.free","native_layer":"state/free_state","year":1989,"year_prov":"edge:SS6","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Common-cause boxes explained by a classical causal model. Caveat QP2: the STATE-level Bell-local set is not tensor-stable (superactivation); boxes under LOSR, not states, are the proper free objects.","concept_any":null},{"uid":"QRT:sR-nlo","branch":"QRT","native_id":"sR-nlo","label":"Nonlocal boxes","layer":"S","sublayer":"S.resource","native_layer":"state/resource_state","year":2012,"year_prov":"edge:C8","concept":"bell_nonlocality","removed":false,"step_first":null,"step_last":null,"desc":"Boxes violating some Bell inequality; every convexly extremal quantumly realizable box is at the top of the quantum LOSR pre-order; the PR box is the beyond-quantum top.","concept_any":"bell_nonlocality"},{"uid":"QRT:sF-ctx","branch":"QRT","native_id":"sF-ctx","label":"Noncontextual behaviors","layer":"S","sublayer":"S.free","native_layer":"state/free_state","year":2018,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Behaviors with noncontextual models on the scenario's compatibility structure. Bell-local behaviors are the special case where contexts are spacelike (SS15).","concept_any":null},{"uid":"QRT:sR-ctx","branch":"QRT","native_id":"sR-ctx","label":"Contextual behaviors","layer":"S","sublayer":"S.resource","native_layer":"state/resource_state","year":2009,"year_prov":"edge:W10","concept":"ks_contextuality","removed":false,"step_first":null,"step_last":null,"desc":"Violate some noncontextuality inequality; maximally contextual boxes ('contextuality bits') exist for broad scenario classes.","concept_any":"ks_contextuality"},{"uid":"QRT:sF-inc","branch":"QRT","native_id":"sF-inc","label":"Jointly measurable sets","layer":"S","sublayer":"S.free","native_layer":"state/free_state","year":2016,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"POVM collections with a parent measurement - equivalently, devices programmable with classical programs.","concept_any":null},{"uid":"QRT:sR-inc","branch":"QRT","native_id":"sR-inc","label":"Incompatible sets","layer":"S","sublayer":"S.resource","native_layer":"state/resource_state","year":2014,"year_prov":"edge:SS10","concept":"measurement_incompatibility","removed":false,"step_first":null,"step_last":null,"desc":"No parent POVM. In one-to-one correspondence with steerable assemblages (SS10); golden unit: mutually unbiased sharp pair.","concept_any":"measurement_incompatibility"},{"uid":"QRT:sF-dis","branch":"QRT","native_id":"sF-dis","label":"Classical-classical states","layer":"S","sublayer":"S.free","native_layer":"state/free_state","year":2001,"year_prov":"node-ref","concept":"zero_discord","removed":false,"step_first":null,"step_last":null,"desc":"Diagonal in a product basis; locally broadcastable. The set is NON-CONVEX: mixing CC states of different bases is discordant - the convexity-axiom violation (MM9).","concept_any":"zero_discord"},{"uid":"QRT:sR-dis","branch":"QRT","native_id":"sR-dis","label":"Discordant states","layer":"S","sublayer":"S.resource","native_layer":"state/resource_state","year":2001,"year_prov":"edge:SS19","concept":"discordant_states","removed":false,"step_first":null,"step_last":null,"desc":"Any state not classical-classical, separable states included. Relative entropy of quantumness = minimal distillable entanglement generated by the activation protocol.","concept_any":"discordant_states"},{"uid":"QRT:d-maxmix","branch":"QRT","native_id":"d-maxmix","label":"I/d - shared bottom","layer":"S","sublayer":"S.dist","native_layer":"state/dist","year":2026,"year_prov":"project","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Member of every free set considered here EXCEPT purity, where it is the unique free state, and athermality, where it is free only at infinite temperature (trivial H). The universal bottom of all pre-orders.","concept_any":null},{"uid":"QRT:d-gibbs","branch":"QRT","native_id":"d-gibbs","label":"Gibbs gamma - thermal magic","layer":"S","sublayer":"S.dist","native_layer":"state/dist","year":2026,"year_prov":"project","concept":"gibbs_state","removed":false,"step_first":null,"step_last":null,"desc":"Unique athermality-free state; incoherent in the energy basis (nondegenerate H); U(1)-symmetric; real in the energy basis; separable for noninteracting local H. But for a generic interacting H, gamma is NOT a stabilizer state: the thermal state of one theory is a magic resource of another (QP5).","concept_any":"gibbs_state"},{"uid":"QRT:d-plus","branch":"QRT","native_id":"d-plus","label":"|+> - coherent yet magic-free","layer":"S","sublayer":"S.dist","native_layer":"state/dist","year":2026,"year_prov":"project","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Stabilizer and real and pure: free in magic and imaginarity, maximal resource in coherence (basis Z), purity, and U(1)-asymmetry (H prop Z). Witnesses that coherence is NOT sufficient for magic.","concept_any":null},{"uid":"QRT:d-tstate","branch":"QRT","native_id":"d-tstate","label":"T state - four-theory resource","layer":"S","sublayer":"S.dist","native_layer":"state/dist","year":2005,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"(|0> + e^{i pi/4}|1>)/sqrt(2): simultaneously a resource of magic, coherence, purity AND imaginarity; injection yields the T gate and universality.","concept_any":null},{"uid":"QRT:d-wpos","branch":"QRT","native_id":"d-wpos","label":"Wigner-positive magic (bound)","layer":"S","sublayer":"S.dist","native_layer":"state/dist","year":2012,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Odd d: states outside STAB yet with mana = 0; useless for magic distillation and classically simulable - the magic analogue of bound entanglement.","concept_any":null},{"uid":"QRT:d-bell","branch":"QRT","native_id":"d-bell","label":"Bell |Phi+> - entangled, magic-free","layer":"S","sublayer":"S.dist","native_layer":"state/dist","year":2009,"year_prov":"edge:SS5b","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Maximally entangled, maximally steering-capable, Bell-violating (with incompatible measurements) - yet a stabilizer state (magic-free) and real (imaginarity-free). Shows STAB is not inside SEP: free sets of different theories cut across each other.","concept_any":null},{"uid":"QRT:d-werner","branch":"QRT","native_id":"d-werner","label":"Werner states - strictness witness","layer":"S","sublayer":"S.dist","native_layer":"state/dist","year":1989,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Entangled for p > 1/3; admit LHV models for projective measurements in a range (Werner) and even for POVMs (Barrett); unsteerable range (WJD). The canonical witness that SEP < unsteerable < Bell-local is strict.","concept_any":null},{"uid":"QRT:d-bound","branch":"QRT","native_id":"d-bound","label":"Bound entangled states","layer":"S","sublayer":"S.dist","native_layer":"state/dist","year":2009,"year_prov":"node-ref","concept":"bound_entangled","removed":false,"step_first":null,"step_last":null,"desc":"PPT entangled: E_D = 0 < E_C. Some bound entangled states violate Bell inequalities (Peres conjecture false): nonlocality without distillability.","concept_any":"bound_entangled"},{"uid":"QRT:d-ccdis","branch":"QRT","native_id":"d-ccdis","label":"Discordant separable states","layer":"S","sublayer":"S.dist","native_layer":"state/dist","year":2001,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Separable (entanglement-free) yet discordant; the input class for discord-to-entanglement activation.","concept_any":null},{"uid":"QRT:pF-pur","branch":"QRT","native_id":"pF-pur","label":"Noisy / unital operations","layer":"M","sublayer":"M.process","native_layer":"process_cptp/free_ops","year":2015,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Noisy operations (unitaries + maximally mixed ancillas + partial trace); unital maps give the same single-system state pre-order (majorization).","concept_any":null},{"uid":"QRT:pU-pur","branch":"QRT","native_id":"pU-pur","label":"Work from purity; coherence prep","layer":"M","sublayer":"M.process","native_layer":"process_cptp/use_ops","year":2018,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Purity as fuel: kT ln2 of work per pure bit (Landauer/Szilard); and via free unitaries it converts into maximal coherence in any chosen basis, which bounds downstream entanglement and discord generation (QP4 cascade).","concept_any":null},{"uid":"QRT:pF-ath","branch":"QRT","native_id":"pF-ath","label":"Thermal operations (TO)","layer":"M","sublayer":"M.process","native_layer":"process_cptp/free_ops","year":2015,"year_prov":"node-ref","concept":"thermal_operations","removed":false,"step_first":null,"step_last":null,"desc":"Energy-conserving unitaries + Gibbs ancillas: Gibbs-preserving AND U(1)-covariant. Strictly inside GPO: a Gibbs-preserving map can create energy coherence while TO cannot. Whether TO = GPO intersect TIO exactly is open here (QG2).","concept_any":"thermal_operations"},{"uid":"QRT:pU-ath","branch":"QRT","native_id":"pU-ath","label":"Work extraction & conversion","layer":"M","sublayer":"M.process","native_layer":"process_cptp/use_ops","year":2013,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Spending athermality: single-shot deterministic work set by min-free-energy; the F_alpha second laws govern which conversions TO can perform; correlations (incl. entanglement) carry extra extractable work beyond the marginals.","concept_any":null},{"uid":"QRT:pX-ath","branch":"QRT","native_id":"pX-ath","label":"No coherence distillation; work locking","layer":"M","sublayer":"M.process","native_layer":"process_cptp/no_ops","year":2015,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Impossible even with resources: coherence distillation machines do not exist - under thermal/covariant processing the distillable coherence of every full-rank state is ZERO even with unlimited work, while the coherence cost equals the QFI; and work stored in coherence is locked - not extractable without an external phase reference.","concept_any":null},{"uid":"QRT:pF-asy","branch":"QRT","native_id":"pF-asy","label":"G-covariant channels","layer":"M","sublayer":"M.process","native_layer":"process_cptp/free_ops","year":2016,"year_prov":"node-ref","concept":"covariant_operations","removed":false,"step_first":null,"step_last":null,"desc":"Channels commuting with the group action. For U(1) time translations: TIO, strictly inside DIO (group averaging implements dephasing covariance).","concept_any":"covariant_operations"},{"uid":"QRT:pU-asy","branch":"QRT","native_id":"pU-asy","label":"Metrology, clocks, catalytic use","layer":"M","sublayer":"M.process","native_layer":"process_cptp/use_ops","year":2014,"year_prov":"node-ref","concept":"metrology","removed":false,"step_first":null,"step_last":null,"desc":"Spending asymmetry: phase-estimation precision = QFI (an asymmetry monotone); clock synchronization and reference-frame alignment consume it; catalytic coherence (Aberg) permits repeated use of one coherent battery.","concept_any":"metrology"},{"uid":"QRT:pF-coh","branch":"QRT","native_id":"pF-coh","label":"Incoherent-op lattice (MIO...SIO)","layer":"M","sublayer":"M.process","native_layer":"process_cptp/free_ops","year":2015,"year_prov":"edge:P3","concept":"incoherent_operations","removed":false,"step_first":null,"step_last":null,"desc":"SIO subset of IO and DIO; IO, DIO subset of MIO; TIO subset of DIO; IO and DIO incomparable. MIO = maximal (RNG) class.","concept_any":"incoherent_operations"},{"uid":"QRT:pU-coh","branch":"QRT","native_id":"pU-coh","label":"Distillation & dilution (IO)","layer":"M","sublayer":"M.process","native_layer":"process_cptp/use_ops","year":2016,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Spending coherence: every coherent state distills |+> at rate C_r under IO; dilution from |+> costs C_f; coherent inputs power what incoherent ones cannot - e.g. entanglement generation via bipartite IO (C1).","concept_any":null},{"uid":"QRT:pX-coh","branch":"QRT","native_id":"pX-coh","label":"No reversible IO cycle (mixed)","layer":"M","sublayer":"M.process","native_layer":"process_cptp/no_ops","year":2015,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Impossible even with resources: under IO, C_f > C_r for generic mixed states, so distill-then-dilute cannot return the input at par. Reversibility holds only under asymptotically resource-non-generating (MIO-type) operations at rate C_r (Stein-lemma regime).","concept_any":null},{"uid":"QRT:pF-ima","branch":"QRT","native_id":"pF-ima","label":"Real operations (real Kraus)","layer":"M","sublayer":"M.process","native_layer":"process_cptp/free_ops","year":2021,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Channels with real Kraus operators; local real ops + classical communication (LRCC) define the distributed theory.","concept_any":null},{"uid":"QRT:pU-ima","branch":"QRT","native_id":"pU-ima","label":"Local discrimination with i","layer":"M","sublayer":"M.process","native_layer":"process_cptp/use_ops","year":2021,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Spending imaginarity: real orthogonal pure-state pairs that LOCC distinguishes perfectly become indistinguishable (no better than guessing in the worst case) when one party is restricted to real operations - the imaginary resource buys the gap.","concept_any":null},{"uid":"QRT:pF-mag","branch":"QRT","native_id":"pF-mag","label":"Stabilizer ops / CSPO","layer":"M","sublayer":"M.process","native_layer":"process_cptp/free_ops","year":2019,"year_prov":"node-ref","concept":"stabilizer_operations","removed":false,"step_first":null,"step_last":null,"desc":"Stabilizer protocols (Clifford unitaries, Pauli measurements, stabilizer ancillas, feed-forward) subset of completely stabilizer-preserving operations (channel-maximal class for simulation bounds).","concept_any":"stabilizer_operations"},{"uid":"QRT:pU-mag","branch":"QRT","native_id":"pU-mag","label":"State injection -> universality","layer":"M","sublayer":"M.process","native_layer":"process_cptp/use_ops","year":2005,"year_prov":"node-ref","concept":"state_injection","removed":false,"step_first":null,"step_last":null,"desc":"Spending magic: T-state injection promotes stabilizer circuits to universal quantum computation; robustness of magic prices the classical-simulation overhead of the spent states.","concept_any":"state_injection"},{"uid":"QRT:pX-mag","branch":"QRT","native_id":"pX-mag","label":"Bound magic; no unit-rate cycle","layer":"M","sublayer":"M.process","native_layer":"process_cptp/no_ops","year":2012,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Impossible even with resources: Wigner-positive magic states cannot be distilled by stabilizer operations (bound magic); and equal-mana state classes exist that do NOT interconvert at unit rate - magic is asymptotically irreversible under STAB ops.","concept_any":null},{"uid":"QRT:pF-nga","branch":"QRT","native_id":"pF-nga","label":"Gaussian protocols","layer":"M","sublayer":"M.process","native_layer":"process_cptp/free_ops","year":2018,"year_prov":"node-ref","concept":"gaussian_operations","removed":false,"step_first":null,"step_last":null,"desc":"Gaussian unitaries, Gaussian measurements, feed-forward; cannot create Wigner negativity.","concept_any":"gaussian_operations"},{"uid":"QRT:pU-nga","branch":"QRT","native_id":"pU-nga","label":"Negativity -> CV advantage","layer":"M","sublayer":"M.process","native_layer":"process_cptp/use_ops","year":1999,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Spending Wigner negativity: injected into Gaussian circuits it lifts them beyond efficient classical simulation - the CV analogue of magic injection.","concept_any":null},{"uid":"QRT:pF-ent","branch":"QRT","native_id":"pF-ent","label":"LOCC (< SEP < PPT < NE)","layer":"M","sublayer":"M.process","native_layer":"process_cptp/free_ops","year":2009,"year_prov":"node-ref","concept":"locc","removed":false,"step_first":null,"step_last":null,"desc":"Local operations + classical communication; the ladder continues upward through separable, PPT-preserving and non-entangling operations, each step changing which states count as equivalent.","concept_any":"locc"},{"uid":"QRT:pU-ent","branch":"QRT","native_id":"pU-ent","label":"Teleportation, dense coding, distillation","layer":"M","sublayer":"M.process","native_layer":"process_cptp/use_ops","year":1999,"year_prov":"edge:C18","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Spending ebits: teleportation and dense coding consume maximal entanglement; distillation protocols concentrate noisy entanglement; every entangled state wins some semiquantum game (Buscemi) - a measurement-device-independent certificate that all entanglement is usable.","concept_any":null},{"uid":"QRT:pX-ent","branch":"QRT","native_id":"pX-ent","label":"No second law (exact NE); bound ENT","layer":"M","sublayer":"M.process","native_layer":"process_cptp/no_ops","year":2009,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Impossible even with resources: under EXACTLY non-entangling operations, entanglement manipulation is asymptotically irreversible - no single measure governs all transformations, so no axiomatic second law; and bound entangled states cannot be distilled by LOCC at all (E_D = 0 < E_C).","concept_any":null},{"uid":"QRT:pF-ste","branch":"QRT","native_id":"pF-ste","label":"One-way LOCC (trusted -> untrusted)","layer":"M","sublayer":"M.process","native_layer":"process_cptp/free_ops","year":2009,"year_prov":"edge:P1b","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Local ops + one-way classical communication from the trusted party: the free operations that cannot create steering.","concept_any":null},{"uid":"QRT:pU-ste","branch":"QRT","native_id":"pU-ste","label":"1sDI QKD; subchannel discrimination","layer":"M","sublayer":"M.process","native_layer":"process_cptp/use_ops","year":2012,"year_prov":"node-ref","concept":"one_sided_di","removed":false,"step_first":null,"step_last":null,"desc":"Spending steering: one-sided device-independent key distribution is secured exactly by steerability; steering = advantage in subchannel discrimination restricted to 1W-LOCC measurements (Piani-Watrous).","concept_any":"one_sided_di"},{"uid":"QRT:pF-nlo","branch":"QRT","native_id":"pF-nlo","label":"LOSR wirings (polytope)","layer":"M","sublayer":"M.process","native_layer":"process_cptp/free_ops","year":2015,"year_prov":"edge:P1","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The free operations on common-cause boxes form a polytope; convertibility between boxes is decidable by linear programming.","concept_any":null},{"uid":"QRT:pU-nlo","branch":"QRT","native_id":"pU-nlo","label":"DI certification; superactivation","layer":"M","sublayer":"M.process","native_layer":"process_cptp/use_ops","year":2012,"year_prov":"node-ref","concept":"di_tasks","removed":false,"step_first":null,"step_last":null,"desc":"Spending nonlocality: Bell violation certifies device-independent keys and randomness; and tensoring + local measurements SUPERACTIVATES hidden nonlocality - k copies of some Bell-local entangled states jointly violate a Bell inequality (Palazuelos).","concept_any":"di_tasks"},{"uid":"QRT:pF-ctx","branch":"QRT","native_id":"pF-ctx","label":"Noncontextual wirings (NCW)","layer":"M","sublayer":"M.process","native_layer":"process_cptp/free_ops","year":2018,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Explicit parametrized class of contextuality-free operations on behaviors; forms a convex set; restricted to Bell scenarios NCW is NOT the same operation set as LOSR (P6).","concept_any":null},{"uid":"QRT:pU-ctx","branch":"QRT","native_id":"pU-ctx","label":"POM / RAC advantage","layer":"M","sublayer":"M.process","native_layer":"process_cptp/use_ops","year":2009,"year_prov":"node-ref","concept":"pom_rac","removed":false,"step_first":null,"step_last":null,"desc":"Spending contextuality: preparation contextuality powers parity-oblivious multiplexing beyond any noncontextual bound; contextual fraction quantifies the advantage.","concept_any":"pom_rac"},{"uid":"QRT:pF-inc","branch":"QRT","native_id":"pF-inc","label":"Pre- + classical post-processing","layer":"M","sublayer":"M.process","native_layer":"process_cptp/free_ops","year":2015,"year_prov":"edge:P7","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Compatibility-non-decreasing maps on devices: quantum pre-processing by a channel + classical post-processing of outcomes.","concept_any":null},{"uid":"QRT:pU-inc","branch":"QRT","native_id":"pU-inc","label":"Discrimination with PMI","layer":"M","sublayer":"M.process","native_layer":"process_cptp/use_ops","year":2019,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Spending incompatibility: every incompatible set strictly beats all compatible ones in some state-discrimination game with post-measurement information; the game family is COMPLETE for the convertibility pre-order.","concept_any":null},{"uid":"QRT:pF-dis","branch":"QRT","native_id":"pF-dis","label":"No free-op class exists","layer":"M","sublayer":"M.process","native_layer":"process_cptp/free_ops","year":2012,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Golden-rule failure: a local channel acting on one share of a classical-classical state can CREATE discord, so no free-operation class containing even local processing exists - the operations-layer pathology that disqualifies discord as a standard QRT.","concept_any":null},{"uid":"QRT:pU-dis","branch":"QRT","native_id":"pU-dis","label":"Activation protocol (CNOT)","layer":"M","sublayer":"M.process","native_layer":"process_cptp/use_ops","year":2011,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Spending discord: local CNOT interactions with ancillas map any discordant state (separable included) to one with distillable system-ancilla entanglement; REQ = the minimal entanglement so generated. Also: discord = minimal entanglement created between system and apparatus in a measurement.","concept_any":null},{"uid":"QRT:wD-pur","branch":"QRT","native_id":"wD-pur","label":"Purity detectors","layer":"O","sublayer":"O.witness","native_layer":"witness/detector","year":2026,"year_prov":"project","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Tr rho^2 > 1/d, or any measurement statistics deviating from uniform - the simplest witness in the compilation.","concept_any":null},{"uid":"QRT:wQ-pur","branch":"QRT","native_id":"wQ-pur","label":"Nonuniformity monotones","layer":"O","sublayer":"O.witness","native_layer":"witness/quantifier","year":2015,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"log d - S(rho) and the Renyi nonuniformity family; majorization is a COMPLETE monotone family - detection and quantification coincide here.","concept_any":null},{"uid":"QRT:wD-ath","branch":"QRT","native_id":"wD-ath","label":"Athermality witnesses","layer":"O","sublayer":"O.witness","native_layer":"witness/detector","year":2013,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Deviation from Gibbs statistics; operationally, any positive extractable work certifies athermality.","concept_any":null},{"uid":"QRT:wQ-ath","branch":"QRT","native_id":"wQ-ath","label":"Second laws F_alpha + modes","layer":"O","sublayer":"O.witness","native_layer":"witness/quantifier","year":2015,"year_prov":"node-ref","concept":"second_law","removed":false,"step_first":null,"step_last":null,"desc":"The Renyi free energies F_alpha (complete on block-diagonal states) PLUS the asymmetry-mode monotones for coherences: two families, jointly complete, separately incomplete - the witness-level image of the two-axiom model (QP1).","concept_any":"second_law"},{"uid":"QRT:wD-asy","branch":"QRT","native_id":"wD-asy","label":"Covariance tests","layer":"O","sublayer":"O.witness","native_layer":"witness/detector","year":2016,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Any noninvariance of outcome statistics under the group action; mode-resolved tomography detects which asymmetry modes are populated.","concept_any":null},{"uid":"QRT:wQ-asy","branch":"QRT","native_id":"wQ-asy","label":"QFI family; speed limits","layer":"O","sublayer":"O.witness","native_layer":"witness/quantifier","year":2016,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Quantum Fisher information is an asymmetry monotone; Mandelstam-Tamm and Margolus-Levitin speed limits are asymmetry bounds; under thermal covariant processing QFI is exactly the coherence COST.","concept_any":null},{"uid":"QRT:wD-coh","branch":"QRT","native_id":"wD-coh","label":"Interferometric witnesses","layer":"O","sublayer":"O.witness","native_layer":"witness/detector","year":2016,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Robustness of coherence is directly measurable via witness-based lower bounds and interferometric visibility.","concept_any":null},{"uid":"QRT:wQ-coh","branch":"QRT","native_id":"wQ-coh","label":"C_r, C_f, l1, robustness","layer":"O","sublayer":"O.witness","native_layer":"witness/quantifier","year":2016,"year_prov":"node-ref","concept":"coherence_monotones","removed":false,"step_first":null,"step_last":null,"desc":"Relative entropy of coherence C_r (= distillable), coherence of formation C_f (= cost), l1-norm, robustness (= discrimination advantage, W2 instance).","concept_any":"coherence_monotones"},{"uid":"QRT:wD-ima","branch":"QRT","native_id":"wD-ima","label":"LOCC vs real-LOCC gap","layer":"O","sublayer":"O.witness","native_layer":"witness/detector","year":2021,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Operational witness: the discrimination gap that appears when one party is restricted to real operations; realized in optical experiments.","concept_any":null},{"uid":"QRT:wQ-ima","branch":"QRT","native_id":"wQ-ima","label":"Imaginarity monotones","layer":"O","sublayer":"O.witness","native_layer":"witness/quantifier","year":2021,"year_prov":"node-ref","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Robustness of imaginarity and geometric imaginarity; pure-state and qubit conversion fully characterized by them.","concept_any":null},{"uid":"QRT:wD-mag","branch":"QRT","native_id":"wD-mag","label":"Magic witnesses","layer":"O","sublayer":"O.witness","native_layer":"witness/detector","year":2014,"year_prov":"node-ref","concept":"magic_witness","removed":false,"step_first":null,"step_last":null,"desc":"Mana > 0 (odd d), robustness > 1, stabilizer-fidelity thresholds: each certifies nonstabilizerness.","concept_any":"magic_witness"},{"uid":"QRT:wQ-mag","branch":"QRT","native_id":"wQ-mag","label":"Mana; robustness of magic","layer":"O","sublayer":"O.witness","native_layer":"witness/quantifier","year":2014,"ye
