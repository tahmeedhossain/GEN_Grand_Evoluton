*{box-sizing:border-box}body{margin:0;font:14px/1.45 "DejaVu Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg)}

.chip.S{border-left-color:var(--s)}.chip.M{border-left-color:var(--m)}.chip.O{border-left-color:var(--o)}

.legend{font-size:12px;color:var(--mute);margin:6px 0}

<script id="data" type="application/json">{"generated":"2026-11-14T01:59:29","nodes":[{"uid":"EM:F","branch":"EM","native_id":"F","label":"Force on a charge","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1687,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Measured from a body's acceleration (F = ma) or by balancing it against a known force. Every force law in the story predicts it, so more and more alternative routes lead here.","concept_any":"force"},{"uid":"EM:r","branch":"EM","native_id":"r","label":"Position","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1687,"year_prov":"paragraph","concept":"position","removed":false,"step_first":null,"step_last":null,"desc":"Where a body sits in Euclidean 3-space, measured with rulers. Separations r = x − x′ enter every force law. A primitive geometric observable.","concept_any":"position"},{"uid":"EM:v","branch":"EM","native_id":"v","label":"Velocity","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1687,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"v = dx/dt from successive position measurements. It becomes essential once magnetic forces turn out to depend on motion.","concept_any":"velocity"},{"uid":"EM:traj","branch":"EM","native_id":"traj","label":"Particle state of motion","layer":"S","sublayer":"S.point","native_layer":"state","year":1687,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Position and velocity together: Newton's description of a body's state.","concept_any":null},{"uid":"EM:vec","branch":"EM","native_id":"vec","label":"Vector addition","layer":"M","sublayer":"M.law","native_layer":"model","year":1687,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"How forces and fields combine. Because order and grouping do not matter, the total force from any number of sources is well defined.","concept_any":"vector_addition"},{"uid":"EM:ddt","branch":"EM","native_id":"ddt","label":"Time derivative","layer":"M","sublayer":"M.law","native_layer":"model","year":1687,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Generates time evolution. Its commuting with spatial derivatives is used when the curl equations are combined into wave equations.","concept_any":"time_derivative"},{"uid":"EM:q","branch":"EM","native_id":"q","label":"Electric charge","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1747,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"A signed scalar property of bodies, inferred from the forces they exert on one another. Experimentally additive and conserved, and (Millikan) quantized in units of e.","concept_any":"electric_charge"},{"uid":"EM:addq","branch":"EM","native_id":"addq","label":"Additivity and conservation of charge","layer":"M","sublayer":"M.law","native_layer":"model","year":1747,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Franklin's principle: charges add with sign, and electrification only moves charge from one body to another. A global statement that the continuity equation later makes local.","concept_any":"charge_conservation"},{"uid":"EM:coul","branch":"EM","native_id":"coul","label":"Coulomb law","layer":"M","sublayer":"M.law","native_layer":"model","year":1785,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"k q₁q₂ r̂/r² with k = 1/4πε₀. Exchange symmetry gives Newton's third law; the inverse-square form is exactly what makes Gauss's law hold.","concept_any":"coulomb_law"},{"uid":"EM:pts","branch":"EM","native_id":"pts","label":"Point-charge configuration","layer":"S","sublayer":"S.point","native_layer":"state","year":1785,"year_prov":"carried","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The simplest state of an electrostatic system: which charges there are and where they sit.","concept_any":"point_charges"},{"uid":"EM:sup","branch":"EM","native_id":"sup","label":"Superposition","layer":"M","sublayer":"M.law","native_layer":"model","year":1785,"year_prov":"carried","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The map from sources to forces and fields is linear: contributions from separate sources simply add. Exact in vacuum Maxwell theory.","concept_any":"superposition"},{"uid":"EM:lap","branch":"EM","native_id":"lap","label":"Poisson's equation","layer":"M","sublayer":"M.law","native_layer":"model","year":1773,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"∇²φ = −ρ/ε₀. Linearity means solutions superpose; uniqueness means sources plus boundary data fully determine the state.","concept_any":null},{"uid":"EM:rho","branch":"EM","native_id":"rho","label":"Charge density","layer":"S","sublayer":"S.field","native_layer":"state","year":1812,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Charge per unit volume. Smooth densities and point charges (via δ functions) are elements of the same space.","concept_any":"charge_density"},{"uid":"EM:delta","branch":"EM","native_id":"delta","label":"Delta function","layer":"M","sublayer":"M.law","native_layer":"model","year":1812,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Lets point charges and smooth densities live in one space: ρ = Σ qᵢ δ³(x − xᵢ). Introduced by Dirac (1927) and made rigorous by Schwartz (1945).","concept_any":null},{"uid":"EM:phi","branch":"EM","native_id":"phi","label":"Potential up to a constant","layer":"S","sublayer":"S.field","native_layer":"state","year":1828,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The electrostatic state written as one scalar function, with its built-in redundancy made explicit.","concept_any":"electric_potential"},{"uid":"EM:bc","branch":"EM","native_id":"bc","label":"Boundary values","layer":"S","sublayer":"S.point","native_layer":"state","year":1828,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The part of the state fixed by conductors and the outside world. Needed to make Poisson's problem well posed.","concept_any":null},{"uid":"EM:grad","branch":"EM","native_id":"grad","label":"Gradient","layer":"M","sublayer":"M.law","native_layer":"model","year":1828,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Because ∇ kills constants, φ and φ + c give the same force. This is the first redundancy (gauge freedom) in the description of the state.","concept_any":null},{"uid":"EM:div","branch":"EM","native_id":"div","label":"Divergence theorem","layer":"M","sublayer":"M.law","native_layer":"model","year":1826,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Converts local statements about sources into statements about flux through surfaces, and back. Also used for any flux integral.","concept_any":null},{"uid":"EM:PhiE","branch":"EM","native_id":"PhiE","label":"Electric flux","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1826,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Φ_E = ∮E·dA through a closed surface. Gauss's law says it equals Q_enc/ε₀ however the enclosed charges are arranged.","concept_any":"electric_flux"},{"uid":"EM:sym","branch":"EM","native_id":"sym","label":"Symmetry arguments","layer":"M","sublayer":"M.law","native_layer":"model","year":1826,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"If a source distribution is unchanged by rotations, translations or reflections, the field it produces must transform the same way. With Gauss's or Ampère's law this fixes fields without integrating.","concept_any":null},{"uid":"EM:E","branch":"EM","native_id":"E","label":"Electric field value","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1826,"year_prov":"carried","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Operationally E = lim F/q for a small test charge at rest: a derived observable built from force and charge measurements.","concept_any":null},{"uid":"EM:Efield","branch":"EM","native_id":"Efield","label":"Electric field","layer":"S","sublayer":"S.field","native_layer":"state","year":1826,"year_prov":"carried","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The whole field as one object, a function on space. A calculating device for Green and Gauss; a physical state for Faraday and Maxwell.","concept_any":"electric_field"},{"uid":"EM:line","branch":"EM","native_id":"line","label":"Line integrals","layer":"M","sublayer":"M.law","native_layer":"model","year":1826,"year_prov":"carried","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Integrals along curves. Path independence holds for curl-free fields on regions without holes; the exception returns with holonomy in the final section.","concept_any":null},{"uid":"EM:U","branch":"EM","native_id":"U","label":"Electrostatic energy","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1826,"year_prov":"carried","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Work needed to assemble a configuration from charges far apart. Measured through work done or heat released on discharge.","concept_any":"electrostatic_energy"},{"uid":"EM:bil","branch":"EM","native_id":"bil","label":"Quadratic energy form","layer":"M","sublayer":"M.law","native_layer":"model","year":1826,"year_prov":"carried","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"U(E₁ + E₂) = U(E₁) + U(E₂) + a cross term. The cross term is why energies do not simply add even though fields do.","concept_any":null},{"uid":"EM:dV","branch":"EM","native_id":"dV","label":"Voltage","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1791,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Volta's tension, a potential difference φ(b) − φ(a): what a voltmeter reads. Invariant under φ → φ + const, which is why it is measurable while φ itself is not.","concept_any":null},{"uid":"EM:C","branch":"EM","native_id":"C","label":"Capacitance","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1791,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"C = Q/ΔV for a conductor or pair of conductors. Depends only on geometry (and the medium) because electrostatics is linear.","concept_any":"capacitance"},{"uid":"EM:I","branch":"EM","native_id":"I","label":"Current","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1827,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"I = dQ/dt through a surface, read by an ammeter. Equal to the flux of the current density.","concept_any":"current"},{"uid":"EM:J","branch":"EM","native_id":"J","label":"Current density","layer":"S","sublayer":"S.field","native_layer":"state","year":1827,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Charge flux per unit area. Together with ρ it specifies all the sources of the field.","concept_any":"current_density"},{"uid":"EM:R","branch":"EM","native_id":"R","label":"Resistance","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1827,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"R = ΔV/I for a conductor. Ohm found it independent of the current for a given wire at fixed temperature.","concept_any":"resistance"},{"uid":"EM:ohm","branch":"EM","native_id":"ohm","label":"Ohm's law","layer":"M","sublayer":"M.law","native_layer":"model","year":1827,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"J = σE inside a conductor, or ΔV = IR for a whole wire. Unlike Maxwell's equations it describes a material, valid for many conductors at moderate fields.","concept_any":"ohm_law"},{"uid":"EM:cont","branch":"EM","native_id":"cont","label":"Continuity equation","layer":"M","sublayer":"M.law","native_layer":"model","year":1845,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Charge cannot vanish in one place and reappear in another: change inside a volume equals flux through its boundary. Later developments derive it rather than assume it.","concept_any":null},{"uid":"EM:B","branch":"EM","native_id":"B","label":"Magnetic field value","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1820,"year_prov":"carried","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The magnetic action at a point, read with a compass or a probe coil, or inferred from the velocity-dependent force on a moving charge.","concept_any":"magnetic_field_value"},{"uid":"EM:bs","branch":"EM","native_id":"bs","label":"Biot–Savart law","layer":"M","sublayer":"M.law","native_layer":"model","year":1820,"year_prov":"carried","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Field of a current element, (μ₀/4π) I dl × r̂/r². The magnetic counterpart of the Coulomb law.","concept_any":"biot_savart"},{"uid":"EM:cross","branch":"EM","native_id":"cross","label":"Cross product","layer":"M","sublayer":"M.law","native_layer":"model","year":1820,"year_prov":"carried","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"a×b = −b×a, and a×(b×c) ≠ (a×b)×c. Its dependence on handedness makes B a pseudovector, and since v×B ⟂ v, magnetic forces do no work.","concept_any":"cross_product"},{"uid":"EM:curl","branch":"EM","native_id":"curl","label":"Curl and Stokes' theorem","layer":"M","sublayer":"M.law","native_layer":"model","year":1820,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Measures circulation. The identity div∘curl = 0 is what later forces the displacement current.","concept_any":null},{"uid":"EM:Bfield","branch":"EM","native_id":"Bfield","label":"Magnetic field","layer":"S","sublayer":"S.field","native_layer":"state","year":1820,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The magnetic field as a single object on space.","concept_any":"magnetic_field"},{"uid":"EM:emf","branch":"EM","native_id":"emf","label":"Electromotive force","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1831,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"ℰ = ∮(E + v×B)·dl around a circuit, measured as the voltage across a small gap in the loop.","concept_any":"emf"},{"uid":"EM:PhiB","branch":"EM","native_id":"PhiB","label":"Magnetic flux","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1831,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Φ_B = ∫B·dA through a surface bounded by a loop: Faraday's count of lines of force threading a circuit.","concept_any":"magnetic_flux"},{"uid":"EM:faraday","branch":"EM","native_id":"faraday","label":"Faraday's law","layer":"M","sublayer":"M.law","native_layer":"model","year":1831,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"A changing magnetic flux induces a circulating electric field; the minus sign makes induced currents oppose the change.","concept_any":"faraday_law"},{"uid":"EM:A","branch":"EM","native_id":"A","label":"Vector potential","layer":"S","sublayer":"S.field","native_layer":"state","year":1845,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Neumann's and Thomson's potential, Maxwell's electromagnetic momentum. Useful for calculation; not observable by itself.","concept_any":null},{"uid":"EM:consts","branch":"EM","native_id":"consts","label":"Couplings ε₀ and μ₀","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1846,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Fix the strength of electric forces between charges and magnetic forces between currents. 1/√(ε₀μ₀) is the speed Weber and Kohlrausch found as a ratio of units. (In the 2019 SI they are fixed through the measured fine-structure constant.)","concept_any":null},{"uid":"EM:c","branch":"EM","native_id":"c","label":"Speed of light","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1849,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Measured astronomically (Rømer 1676, Bradley 1729) and on Earth by Fizeau (1849). After Maxwell it is also predicted from ε₀ and μ₀. Only the prediction is drawn as a route; the measurements are not.","concept_any":"speed_of_light"},{"uid":"EM:maxwell","branch":"EM","native_id":"maxwell","label":"Maxwell's equations","layer":"M","sublayer":"M.law","native_layer":"model","year":1855,"year_prov":"carried","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The complete field law. Gauss's two laws constrain each moment; Faraday's and the Ampère–Maxwell law evolve it.","concept_any":"maxwell_equations"},{"uid":"EM:EB","branch":"EM","native_id":"EB","label":"Dynamical field state","layer":"S","sublayer":"S.field","native_layer":"state","year":1865,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Electric and magnetic fields as one state that evolves in time.","concept_any":"em_field_state"},{"uid":"EM:u","branch":"EM","native_id":"u","label":"Field energy density","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1873,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"u = ½(ε₀|E|² + |B|²/μ₀). Integrates to the total energy stored in the field.","concept_any":null},{"uid":"EM:stress","branch":"EM","native_id":"stress","label":"Maxwell stress tensor","layer":"M","sublayer":"M.law","native_layer":"model","year":1873,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Expresses the force on charges inside a volume as a surface integral over the field around them.","concept_any":null},{"uid":"EM:wave","branch":"EM","native_id":"wave","label":"Wave operator","layer":"M","sublayer":"M.law","native_layer":"model","year":1858,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"□ = c⁻²∂²/∂t² − ∇². Choosing the retarded Green's function means influences travel at c from the past.","concept_any":null},{"uid":"EM:gfix","branch":"EM","native_id":"gfix","label":"Gauge fixing","layer":"M","sublayer":"M.law","native_layer":"model","year":1870,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"A rule that picks one pair (φ, A) from each class, chosen to simplify the equations.","concept_any":null},{"uid":"EM:gauge","branch":"EM","native_id":"gauge","label":"Gauge transformations","layer":"M","sublayer":"M.law","native_layer":"model","year":1870,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"(φ, A) → (φ − ∂χ/∂t, A + ∇χ). Two transformations compose in either order to χ₁ + χ₂: the group is commutative.","concept_any":null},{"uid":"EM:pot","branch":"EM","native_id":"pot","label":"Gauge class of potentials","layer":"S","sublayer":"S.field","native_layer":"state","year":1870,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The physical state in the potential description. Everything observable is a function of these classes.","concept_any":null},{"uid":"EM:poinc","branch":"EM","native_id":"poinc","label":"Poincaré lemma","layer":"M","sublayer":"M.law","native_layer":"model","year":1870,"year_prov":"carried","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"∇·B = 0 ⇒ B = ∇×A, and ∇×(E + ∂A/∂t) = 0 ⇒ E + ∂A/∂t = −∇φ. It can fail on regions with holes, which is where holonomy lives.","concept_any":null},{"uid":"EM:poynt","branch":"EM","native_id":"poynt","label":"Poynting's theorem","layer":"M","sublayer":"M.law","native_layer":"model","year":1884,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"∂u/∂t + ∇·S = −J·E: field energy changes by flowing away or by doing work on charges.","concept_any":"poynting_theorem"},{"uid":"EM:S","branch":"EM","native_id":"S","label":"Poynting vector","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1884,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"S = E×B/μ₀, the energy flux in W/m². Its time average is the intensity a detector measures.","concept_any":"poynting_vector"},{"uid":"EM:wavedat","branch":"EM","native_id":"wavedat","label":"Wave data","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1886,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Wavelength, frequency and polarization, measured with standing waves, interferometers and polarizers. In vacuum ω = c|k| and k ⟂ E ⟂ B.","concept_any":null},{"uid":"EM:vac","branch":"EM","native_id":"vac","label":"Radiation modes","layer":"S","sublayer":"S.field","native_layer":"state","year":1886,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The source-free field described by its modes rather than by its values at points.","concept_any":null},{"uid":"EM:fourier","branch":"EM","native_id":"fourier","label":"Fourier decomposition","layer":"M","sublayer":"M.law","native_layer":"model","year":1886,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Writes any field as a superposition of plane waves e^{i(k·x − ωt)}, in which the field equations become algebraic.","concept_any":null},{"uid":"EM:g","branch":"EM","native_id":"g","label":"Field momentum density","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1900,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"g = S/c². Observed as radiation pressure on mirrors and absorbers.","concept_any":null},{"uid":"EM:P","branch":"EM","native_id":"P","label":"Radiated power","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1897,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Energy per unit time leaving an accelerating charge through a distant sphere.","concept_any":null},{"uid":"EM:lorentz","branch":"EM","native_id":"lorentz","label":"Lorentz group","layer":"M","sublayer":"M.law","native_layer":"model","year":1887,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Two non-parallel boosts compose to a boost plus a rotation (the Wigner rotation). Under boosts, E and B mix.","concept_any":"lorentz_transformation"},{"uid":"EM:Amu","branch":"EM","native_id":"Amu","label":"Four-potential","layer":"S","sublayer":"S.field","native_layer":"state","year":1908,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Scalar and vector potentials as a single spacetime object.","concept_any":null},{"uid":"EM:jmu","branch":"EM","native_id":"jmu","label":"Four-current","layer":"S","sublayer":"S.field","native_layer":"state","year":1908,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Charge and current density as a single spacetime object.","concept_any":null},{"uid":"EM:Fmn","branch":"EM","native_id":"Fmn","label":"Field tensor","layer":"S","sublayer":"S.field","native_layer":"state","year":1908,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Electric and magnetic fields as one observer-independent object.","concept_any":null},{"uid":"EM:inv","branch":"EM","native_id":"inv","label":"Lorentz invariants","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1908,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"E·B and |E|² − c²|B|² take the same value for every inertial observer. If E ⟂ B and |E| < c|B|, some frame sees a purely magnetic field.","concept_any":null},{"uid":"EM:T","branch":"EM","native_id":"T","label":"Energy–momentum tensor","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1908,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"One symmetric tensor whose components, for a given observer, are the energy density, Poynting flux, momentum density and Maxwell stress.","concept_any":null},{"uid":"EM:action","branch":"EM","native_id":"action","label":"Action principle","layer":"M","sublayer":"M.law","native_layer":"model","year":1903,"year_prov":"paragraph","concept":"lagrangian","removed":false,"step_first":null,"step_last":null,"desc":"Under a gauge change L shifts by q dχ/dt, a total time derivative, so the equations of motion are unchanged.","concept_any":"lagrangian"},{"uid":"EM:legendre","branch":"EM","native_id":"legendre","label":"Legendre transform","layer":"M","sublayer":"M.law","native_layer":"model","year":1950,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Moves from the velocity description to the momentum description: p = ∂L/∂v, H = p·v − L.","concept_any":null},{"uid":"EM:phase","branch":"EM","native_id":"phase","label":"Particle phase space","layer":"S","sublayer":"S.point","native_layer":"state","year":1950,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The Hamiltonian state of a charge. Using kinetic momenta as coordinates instead puts the magnetic field into the symplectic form.","concept_any":null},{"uid":"EM:pkin","branch":"EM","native_id":"pkin","label":"Kinetic momentum","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1950,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"π = mv = p − qA. Gauge-invariant and measurable, for example from the curvature of a particle track. The canonical momentum p is not.","concept_any":null},{"uid":"EM:pb","branch":"EM","native_id":"pb","label":"Poisson bracket","layer":"M","sublayer":"M.law","native_layer":"model","year":1950,"year_prov":"paragraph","concept":"poisson_structure","removed":false,"step_first":null,"step_last":null,"desc":"dF/dt = {F, H}. In a magnetic field the kinetic momenta do not commute: a classical non-commutativity that becomes Landau levels in quantum mechanics.","concept_any":"poisson_structure"},{"uid":"EM:fphase","branch":"EM","native_id":"fphase","label":"Field phase space","layer":"S","sublayer":"S.field","native_layer":"state","year":1950,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The field as a constrained Hamiltonian system. Gauss's law generates the gauge transformations.","concept_any":null},{"uid":"EM:noether","branch":"EM","native_id":"noether","label":"Noether's theorem","layer":"M","sublayer":"M.law","native_layer":"model","year":1918,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Every continuous symmetry of the action yields a conservation law.","concept_any":null},{"uid":"EM:cons","branch":"EM","native_id":"cons","label":"Conserved totals","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1918,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Total energy, momentum and angular momentum of matter plus field. Conservation holds only when the field's contributions are included.","concept_any":null},{"uid":"EM:ext","branch":"EM","native_id":"ext","label":"Exterior derivative","layer":"M","sublayer":"M.law","native_layer":"model","year":1899,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Unifies grad, curl and div. d² = 0 contains both curl∘grad = 0 and div∘curl = 0.","concept_any":null},{"uid":"EM:wedge","branch":"EM","native_id":"wedge","label":"Wedge product","layer":"M","sublayer":"M.law","native_layer":"model","year":1899,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"α∧β = (−1)^{pq} β∧α: 1-forms anticommute, 2-forms commute. F∧F is a 4-form proportional to E·B.","concept_any":null},{"uid":"EM:hodge","branch":"EM","native_id":"hodge","label":"Hodge star","layer":"M","sublayer":"M.law","native_layer":"model","year":1899,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Carries all metric (and constitutive) information. In form language it is the only place c and spacetime geometry enter Maxwell's equations.","concept_any":null},{"uid":"EM:bundle","branch":"EM","native_id":"bundle","label":"U(1) bundle","layer":"S","sublayer":"S.field","native_layer":"state","year":1931,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The global geometric state. It can carry information, such as holonomy around holes, that no single local potential captures.","concept_any":null},{"uid":"EM:conn","branch":"EM","native_id":"conn","label":"U(1) connection","layer":"M","sublayer":"M.law","native_layer":"model","year":1931,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"In a non-abelian (Yang–Mills) theory the curvature is dA + A∧A. Electromagnetism's commutative group keeps it linear.","concept_any":null},{"uid":"EM:hol","branch":"EM","native_id":"hol","label":"Holonomy","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1949,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"∮A·dl around a closed loop: gauge-invariant and equal to the enclosed flux. Around a solenoid it is non-zero on loops where B = 0. With ħ, the phase exp(iq∮A·dl/ħ) is the Aharonov–Bohm phase.","concept_any":null},{"uid":"EM:bbspec","branch":"EM","native_id":"bbspec","label":"Blackbody spectrum","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1900,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Energy density of cavity radiation per unit frequency at temperature T, measured with bolometers around 1900. It has a peak and falls at high frequency, which classical physics cannot reproduce.","concept_any":"blackbody"},{"uid":"EM:equip","branch":"EM","native_id":"equip","label":"Equipartition theorem","layer":"M","sublayer":"M.law","native_layer":"model","year":1900,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Classical statistical mechanics gives every oscillator mean energy kT. Applied to infinitely many radiation modes, it gives infinite energy.","concept_any":null},{"uid":"EM:planck","branch":"EM","native_id":"planck","label":"Planck relation","layer":"M","sublayer":"M.law","native_layer":"model","year":1900,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The first quantum rule. It ties a frequency, a wave property, to an energy, a particle property.","concept_any":"planck_relation"},{"uid":"EM:hbar","branch":"EM","native_id":"hbar","label":"Planck's constant","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1900,"year_prov":"paragraph","concept":"planck_constant","removed":false,"step_first":null,"step_last":null,"desc":"h ≈ 6.626 × 10⁻³⁴ J s, with ħ = h/2π. The quantum of action; classical physics is the regime where actions are large compared with ħ. Exact by definition in the 2019 SI.","concept_any":"planck_constant"},{"uid":"EM:photoel","branch":"EM","native_id":"photoel","label":"Photoelectric effect","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1905,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Maximum kinetic energy of electrons ejected by light. It rises linearly with frequency above a threshold and does not depend on intensity.","concept_any":null},{"uid":"EM:photon","branch":"EM","native_id":"photon","label":"Photon","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1905,"year_prov":"paragraph","concept":"photon","removed":false,"step_first":null,"step_last":null,"desc":"A quantum of the electromagnetic field, with energy ħω and momentum ħk. Detected one at a time by photomultipliers and in Compton scattering.","concept_any":"photon"},{"uid":"EM:spectra","branch":"EM","native_id":"spectra","label":"Spectral lines","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1911,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Sharp wavelengths emitted or absorbed by atoms. Hydrogen's lines fit 1/λ = R(1/m² − 1/n²).","concept_any":"spectral_lines"},{"uid":"EM:bohr","branch":"EM","native_id":"bohr","label":"Bohr orbits","layer":"S","sublayer":"S.hilbert","native_layer":"state","year":1911,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The old quantum theory's hybrid state: classical orbits with quantum selection rules. Superseded by quantum mechanics but historically the bridge.","concept_any":"bohr_model"},{"uid":"EM:comm","branch":"EM","native_id":"comm","label":"Canonical commutator","layer":"M","sublayer":"M.law","native_layer":"model","year":1924,"year_prov":"carried","concept":"poisson_to_commutator","removed":false,"step_first":null,"step_last":null,"desc":"Shares every algebraic property of the Poisson bracket, which is why Dirac could map one to the other. Its non-zero value iħ is the quantum.","concept_any":"poisson_to_commutator"},{"uid":"EM:ops","branch":"EM","native_id":"ops","label":"Operator algebra","layer":"M","sublayer":"M.law","native_layer":"model","year":1924,"year_prov":"carried","concept":"observable_postulate","removed":false,"step_first":null,"step_last":null,"desc":"Observables become operators on states. Position and momentum no longer commute, so they cannot both be sharp: Heisenberg's uncertainty relation.","concept_any":"observable_postulate"},{"uid":"EM:schro","branch":"EM","native_id":"schro","label":"Schrödinger equation","layer":"M","sublayer":"M.law","native_layer":"model","year":1926,"year_prov":"paragraph","concept":"schrodinger_evolution","removed":false,"step_first":null,"step_last":null,"desc":"iħ ∂ψ/∂t = Ĥψ. Linearity means quantum states superpose, the quantum descendant of the superposition principle of Part I.","concept_any":"schrodinger_evolution"},{"uid":"EM:hilb","branch":"EM","native_id":"hilb","label":"Hilbert-space state","layer":"S","sublayer":"S.hilbert","native_layer":"state","year":1926,"year_prov":"paragraph","concept":"hilbert_state","removed":false,"step_first":null,"step_last":null,"desc":"Replaces the point in phase space. It assigns amplitudes, not definite values, to every observable.","concept_any":"hilbert_state"},{"uid":"EM:born","branch":"EM","native_id":"born","label":"Born rule","layer":"M","sublayer":"M.law","native_layer":"model","year":1926,"year_prov":"paragraph","concept":"observable_postulate","removed":false,"step_first":null,"step_last":null,"desc":"Connects the abstract state to what detectors record: frequencies of outcomes over many runs.","concept_any":"observable_postulate"},{"uid":"EM:expect","branch":"EM","native_id":"expect","label":"Outcome statistics","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1926,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Probabilities and averages of measurement results over many identically prepared systems.","concept_any":"outcome_statistics"},{"uid":"EM:mincoup","branch":"EM","native_id":"mincoup","label":"Minimal coupling","layer":"M","sublayer":"M.law","native_layer":"model","year":1929,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The quantum version of the classical kinetic momentum. It makes the potentials, not only the fields, act on charged quantum particles.","concept_any":null},{"uid":"EM:landau","branch":"EM","native_id":"landau","label":"Landau levels","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1930,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Discrete energies of a charge in a uniform magnetic field, seen in cyclotron resonance and the quantum Hall effect.","concept_any":null},{"uid":"EM:abphase","branch":"EM","native_id":"abphase","label":"Aharonov–Bohm shift","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1930,"year_prov":"carried","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Shift of an interference pattern by qΦ_B/ħ for electrons passing around a region of magnetic flux they never enter.","concept_any":null},{"uid":"EM:clifford","branch":"EM","native_id":"clifford","label":"Clifford algebra","layer":"M","sublayer":"M.law","native_layer":"model","year":1922,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The algebra needed to take a square root of p² − m²c². Its anticommutation, not commutation, is what produces spin ½.","concept_any":null},{"uid":"EM:dirac","branch":"EM","native_id":"dirac","label":"Dirac equation","layer":"M","sublayer":"M.law","native_layer":"model","year":1922,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The relativistic wave equation of the electron, the matter half of QED.","concept_any":null},{"uid":"EM:spinor","branch":"EM","native_id":"spinor","label":"Dirac spinor","layer":"S","sublayer":"S.hilbert","native_layer":"state","year":1922,"year_prov":"carried","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"A spinor changes sign under a full 360° rotation, something no classical vector field does.","concept_any":null},{"uid":"EM:gfac","branch":"EM","native_id":"gfac","label":"Electron g-factor","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1922,"year_prov":"carried","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Ratio of the electron's magnetic moment to its spin in natural units. Dirac predicted exactly 2.","concept_any":null},{"uid":"EM:positron","branch":"EM","native_id":"positron","label":"Positron","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1931,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The electron's antiparticle, same mass, opposite charge. Electron–positron pairs are created and annihilated.","concept_any":null},{"uid":"EM:ladder","branch":"EM","native_id":"ladder","label":"Creation and annihilation operators","layer":"M","sublayer":"M.law","native_layer":"model","year":1925,"year_prov":"paragraph","concept":"creation_annihilation","removed":false,"step_first":null,"step_last":null,"desc":"Quantizing each field mode as an oscillator. Commutators give bosons (photons); anticommutators give fermions (electrons).","concept_any":"creation_annihilation"},{"uid":"EM:fock","branch":"EM","native_id":"fock","label":"Fock space","layer":"S","sublayer":"S.hilbert","native_layer":"state","year":1927,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The state space of a quantum field, in which particle number can change.","concept_any":null},{"uid":"EM:Aop","branch":"EM","native_id":"Aop","label":"Field operator","layer":"S","sublayer":"S.hilbert","native_layer":"state","year":1932,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The quantized electromagnetic potential. Its expectation values in coherent states are classical fields.","concept_any":null},{"uid":"EM:spont","branch":"EM","native_id":"spont","label":"Spontaneous emission rate","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1927,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Rate at which an excited atom emits a photon with no field present, set by vacuum fluctuations.","concept_any":null},{"uid":"EM:casimir","branch":"EM","native_id":"casimir","label":"Casimir force","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1932,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Attraction between uncharged parallel plates due to the change in zero-point energy of the field modes between them.","concept_any":null},{"uid":"EM:psiop","branch":"EM","native_id":"psiop","label":"Electron–positron field","layer":"S","sublayer":"S.hilbert","native_layer":"state","year":1929,"year_prov":"paragraph","concept":"electron_field","removed":false,"step_first":null,"step_last":null,"desc":"The electron as the quantum of a field. It annihilates electrons and creates positrons.","concept_any":"electron_field"},{"uid":"EM:alpha","branch":"EM","native_id":"alpha","label":"Fine-structure constant","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1916,"year_prov":"paragraph","concept":"fine_structure_constant","removed":false,"step_first":null,"step_last":null,"desc":"α = e²/4πε₀ħc ≈ 1/137.036, the dimensionless strength of electromagnetism. Measured from the electron's g-factor and from atom-recoil experiments.","concept_any":"fine_structure_constant"},{"uid":"EM:pert","branch":"EM","native_id":"pert","label":"Perturbation series","layer":"M","sublayer":"M.law","native_layer":"model","year":1916,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Expands amplitudes in powers of the small coupling α. Each higher order involves more virtual particles.","concept_any":null},{"uid":"EM:lamb","branch":"EM","native_id":"lamb","label":"Lamb shift","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1947,"year_prov":"paragraph","concept":"lamb_shift","removed":false,"step_first":null,"step_last":null,"desc":"Splitting between hydrogen's 2S½ and 2P½ levels: about 1000 MHz in Lamb and Retherford's 1947 measurement, about 1058 MHz in later, more precise measurements.","concept_any":"lamb_shift"},{"uid":"EM:amm","branch":"EM","native_id":"amm","label":"Anomalous magnetic moment","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1947,"year_prov":"paragraph","concept":"anomalous_moment","removed":false,"step_first":null,"step_last":null,"desc":"a_e = (g − 2)/2 ≈ 0.00115965, measured by Kusch and Foley (1947) and today to about a tenth of a part per billion.","concept_any":"anomalous_moment"},{"uid":"EM:renorm","branch":"EM","native_id":"renorm","label":"Renormalization","layer":"M","sublayer":"M.law","native_layer":"model","year":1947,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Expresses predictions in terms of measured quantities, so that infinities cancel. Later understood through the renormalization group.","concept_any":null},{"uid":"EM:pathint","branch":"EM","native_id":"pathint","label":"Path integral","layer":"M","sublayer":"M.law","native_layer":"model","year":1948,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Quantizes using the classical action directly, so the action principle of Part I becomes the core of quantum theory.","concept_any":null},{"uid":"EM:feyn","branch":"EM","native_id":"feyn","label":"Feynman diagrams","layer":"M","sublayer":"M.law","native_layer":"model","year":1948,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Pictorial rules for the terms of the perturbation series.","concept_any":null},{"uid":"EM:smatrix","branch":"EM","native_id":"smatrix","label":"S-matrix","layer":"S","sublayer":"S.hilbert","native_layer":"state","year":1949,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Packages everything that can be measured in a scattering experiment.","concept_any":null},{"uid":"EM:xsec","branch":"EM","native_id":"xsec","label":"Cross sections","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1949,"year_prov":"paragraph","concept":"cross_section","removed":false,"step_first":null,"step_last":null,"desc":"Scattering rates per unit flux, measured in collision experiments (Compton, Møller, Bhabha scattering).","concept_any":"cross_section"},{"uid":"EM:runalpha","branch":"EM","native_id":"runalpha","label":"Running coupling","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1935,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"The effective strength of electromagnetism at momentum transfer Q, measured at colliders: about 1/128 at the Z mass.","concept_any":null},{"uid":"EM:localgauge","branch":"EM","native_id":"localgauge","label":"Local gauge principle","layer":"M","sublayer":"M.law","native_layer":"model","year":1950,"year_prov":"section","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Demanding local phase invariance requires a connection, the electromagnetic potential, and fixes how it couples to charge.","concept_any":null},{"uid":"EM:qedL","branch":"EM","native_id":"qedL","label":"QED Lagrangian","layer":"M","sublayer":"M.law","native_layer":"model","year":1950,"year_prov":"paragraph","concept":"qed_interaction","removed":false,"step_first":null,"step_last":null,"desc":"The complete specification of quantum electrodynamics in one line: Dirac field plus Maxwell field, coupled through the covariant derivative.","concept_any":"qed_interaction"},{"uid":"EM:ward","branch":"EM","native_id":"ward","label":"Ward–Takahashi identities","layer":"M","sublayer":"M.law","native_layer":"model","year":1950,"year_prov":"paragraph","concept":null,"removed":false,"step_first":null,"step_last":null,"desc":"Relations among amplitudes implied by gauge symmetry; they protect the theory's consistency through renormalization.","concept_any":null},{"uid":"HEP:H1","branch":"HEP","native_id":"H1","label":"H_{1} — one-particle Hilbert space","layer":"S","sublayer":"S.hilbert","native_layer":"state","year":1925,"year_prov":"node-years","concept":"hilbert_state","removed":true,"step_first":1,"step_last":1,"desc":"A state is a ray in a separable Hilbert space H_{1}. The space describes exactly one particle: there is no operator in the one-particle framework whose eigenvalue is a particle number.","removal_step":2,"removal_year":1926,"concept_any":"hilbert_state"},{"uid":"HEP:m_L","branch":"HEP","native_id":"m_L","label":"Particle Lagrangian L = ½mẋ^{2} − V(x)","layer":"M","sublayer":"M.frame","native_layer":"model","year":1926,"year_prov":"node-years","concept":"lagrangian","removed":true,"step_first":1,"step_last":3,"desc":"The one-particle Lagrangian fixes the Hamiltonian and therefore both the evolution U(t) and the energy spectrum (e.g. E_{n} = −13.6 eV/n^{2} for hydrogen). Replaced by relativistic wave equations at Step 2 and by the free-field Lagrangian at Step 4.","removal_step":4,"removal_year":1927,"concept_any":"lagrangian"},{"uid":"HEP:m_U","branch":"HEP","native_id":"m_U","label":"Unitary evolution U(t) = e^{−iĤt/ħ}","layer":"M","sublayer":"M.frame","native_layer":"model","year":1926,"year_prov":"node-years","concept":"schrodinger_evolution","removed":false,"step_first":1,"step_last":12,"desc":"Time evolution is a strongly continuous one-parameter unitary group generated by the Hamiltonian (Stone 1932). It maps H_{1} onto H_{1}: the back-edge to the state layer. Particle number is conserved by construction.","concept_any":"schrodinger_evolution"},{"uid":"HEP:m_A","branch":"HEP","native_id":"m_A","label":"Observable postulate: Â = Â^{†}, Born rule","layer":"M","sublayer":"M.frame","native_layer":"model","year":1927,"year_prov":"node-years","concept":"observable_postulate","removed":false,"step_first":1,"step_last":12,"desc":"Every self-adjoint operator on H_{1} is an observable; its spectrum lists the possible outcomes and the Born rule gives their probabilities (von Neumann 1932). This node sends one edge to each Hermitian operator in the observable layer.","concept_any":"observable_postulate"},{"uid":"HEP:o_E","branch":"HEP","native_id":"o_E","label":"Energy levels (spectrum of Ĥ)","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1926,"year_prov":"node-years","concept":null,"removed":true,"step_first":1,"step_last":3,"desc":"The discrete spectra observed since Balmer (1885) are the eigenvalues of Ĥ; Schrödinger (1926) derived the hydrogen levels. Dirac (1928) adds the fine structure. Observed first, explained later: anomaly-driven.","removal_step":4,"removal_year":1927,"concept_any":"hydrogen_levels"},{"uid":"HEP:o_x","branch":"HEP","native_id":"o_x","label":"Position x̂","layer":"O","sublayer":"O.direct","native_layer":"observable","year":1926,"year_prov":"node-years","concept":"position","removed":true,"step_first":1,"step_last":1,"desc":"","removal_step":2,"removal_year":1926,"concept_any":"position"},{"uid":"HEP:o_p
